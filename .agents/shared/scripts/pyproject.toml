[project]
name = "agents-shared"
version = "0.1.0"
description = "Scripts the skills and the worker flow share"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    # serve_isolated_instance registers its servers through forward_port,
    "app-registration",
    # and links a standalone project's venv through venv_links.
    "workspace-scripts",
    # serve_isolated_instance checks a --copy fits against what the disk can still take.
    "disk-headroom",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents_shared"]
