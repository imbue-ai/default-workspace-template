[project]
name = "migrate-workspace-skill"
version = "0.1.0"
description = "Moves a workspace's work onto a fresh template checkout"
requires-python = ">=3.12"
dependencies = [
    "agents-shared",
    # convert-packages runs update-self's user-package migration.
    "update-self-skill",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["migrate_workspace_skill"]
