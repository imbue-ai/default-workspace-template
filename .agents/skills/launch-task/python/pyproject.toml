[project]
name = "launch-task-skill"
version = "0.1.0"
description = "Launches, awaits and tears down worker agents"
requires-python = ">=3.11"
dependencies = [
    # Reads the OOM shed ledger for a worker it is about to revive.
    "oom-priority",
    "pyyaml>=6",
    # Sends the task and the lead's replies through the chat messenger.
    "workspace-scripts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["launch_task_skill"]
