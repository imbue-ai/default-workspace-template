[project]
name = "launch-task-skill"
version = "0.1.0"
description = "Launches, awaits and tears down worker agents"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["launch_task_skill"]
