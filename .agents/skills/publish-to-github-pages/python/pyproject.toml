[project]
name = "publish-to-github-pages-skill"
version = "0.1.0"
description = "Publishes a workspace app as a static site on the user's GitHub Pages"
requires-python = ">=3.12"
dependencies = [
    # check_site.py browse loads each page in a real browser.
    "playwright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["publish_to_github_pages_skill"]
