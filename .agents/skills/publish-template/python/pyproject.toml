[project]
name = "publish-template-skill"
version = "0.1.0"
description = "Builds and validates a publishable template"
requires-python = ">=3.11"
dependencies = [
    # validate_template.py checks a template.toml against env_converge's pydantic schema.
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["publish_template_skill"]
