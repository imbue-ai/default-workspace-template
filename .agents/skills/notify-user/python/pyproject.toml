[project]
name = "notify-user-skill"
version = "0.1.0"
description = "Posts a notification from this chat to the Imbue Studio app"
requires-python = ">=3.11"
dependencies = [
    "workspace-scripts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notify_user_skill"]
