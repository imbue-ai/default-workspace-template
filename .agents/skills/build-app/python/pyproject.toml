[project]
name = "build-app-skill"
version = "0.1.0"
description = "Scaffolds a new Flask app under system/apps/"
requires-python = ">=3.12"
dependencies = [
    "tomlkit>=0.12",
    "workspace-scripts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["build_app_skill"]
