[project]
name = "build-app-skill"
version = "0.1.0"
description = "Scaffolds a new Flask app under system/apps/, and frames it as a mock until it is real"
requires-python = ">=3.12"
dependencies = [
    # mock_frame frames a mock through the shared preview frame.
    "agents-shared",
    "app-manifest",
    "tomlkit>=0.12",
    "workspace-layout",
    "workspace-scripts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["build_app_skill"]
