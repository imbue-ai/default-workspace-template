[project]
name = "use-ai-integration-skill"
version = "0.1.0"
description = "Calls a model through the workspace's signed-in AI accounts"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.88.1",
    "openai>=2",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["use_ai_integration_skill"]
