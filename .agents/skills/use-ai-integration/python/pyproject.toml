[project]
name = "use-ai-integration-skill"
version = "0.1.0"
description = "Calls Claude with the workspace's AI credentials"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["use_ai_integration_skill"]
