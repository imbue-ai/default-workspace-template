[project]
name = "update-app-skill"
version = "0.1.0"
description = "Previews an app's worktree beside the live one"
requires-python = ">=3.11"
dependencies = [
    "app-manifest",
    "workspace-scripts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["update_app_skill"]
