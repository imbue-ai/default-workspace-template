[project]
name = "default-workspace-template"
version = "0.1.0"
description = "Template repo for a persistent Claude agent"
requires-python = ">=3.11"
dependencies = [
    "bootstrap",
    "cloudflare-tunnel",
    "app-watcher",
    "github-sync",
    "env-converge",
    "host-backup",
    "tk-command-parsing",
    "imbue-common",
    "tomlkit>=0.12",
    "playwright==1.58.0",
    "litellm>=1.88.1",
    "browser",
    # eval worker: upload state/transcript to S3 (restic handles /mngr snapshots itself)
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.0",
    "ruff>=0.4",
    "pyright>=1.1",
    "inline-snapshot>=0.31",
    "import-linter>=2.0",
    "tomlkit>=0.12",
    "pyyaml>=6",
    # used by test_mngr_template_stacking.py to verify .mngr/settings.toml
    # composes correctly with system/vendor/mngr's apply_create_template logic
    "imbue-mngr",
    # imbue-mngr-claude isn't imported by any /home/user/workspace/ python -- it's here so
    # `uv sync --all-packages` registers it in /home/user/workspace/.venv. Without it,
    # `uv run mngr ...` (e.g. from the bootstrap window) resolves to
    # /home/user/workspace/.venv/bin/mngr but pluggy can't discover the claude plugin via
    # entry points, so settings.toml fields like `use_env_config_dir`,
    # `auto_allow_permissions`, etc. fail to parse as "Unknown fields".
    # Keeping the venv's mngr in lockstep with the tool-installed mngr
    # (which has --with-editable mngr_claude on the system_interface tool
    # install) avoids a cwd-dependent divergence.
    "imbue-mngr-claude",
    # Shared validator that checks mngr CLI argvs against the live mngr command
    # tree; used by the per-feature contract tests (bootstrap's manager_test,
    # launch-task's create_worker_test).
    "mngr-cli-contract",
]

[tool.uv]
package = false
# browser-use pins openai==2.16.0 but litellm needs openai>=2.20.0. We drive
# browser-use with ChatAnthropic (not the OpenAI path), so its openai pin is
# unused at runtime; override it so the single workspace lock resolves. See system/libs/browser.
override-dependencies = ["openai>=2.20.0"]

[tool.uv.workspace]
# creations/* covers user-built packages (scaffolded web services, adopted
# inspirations) so a new creation joins the workspace without editing this list.
members = ["system/libs/bootstrap", "system/libs/cloudflare_tunnel", "system/libs/app_watcher", "system/libs/github_sync", "system/libs/env_converge", "system/libs/host_backup", "system/libs/mngr_cli_contract", "system/libs/tk_command_parsing", "system/libs/oom_priority", "system/libs/system_interface", "system/libs/browser", "creations/*"]

[tool.uv.sources]
bootstrap = { workspace = true }
cloudflare-tunnel = { workspace = true }
app-watcher = { workspace = true }
github-sync = { workspace = true }
env-converge = { workspace = true }
host-backup = { workspace = true }
mngr-cli-contract = { workspace = true }
tk-command-parsing = { workspace = true }
oom-priority = { workspace = true }
browser = { workspace = true }
imbue-common = { path = "system/vendor/mngr/libs/imbue_common", editable = true }
imbue-mngr = { path = "system/vendor/mngr/libs/mngr", editable = true }
imbue-mngr-claude = { path = "system/vendor/mngr/libs/mngr_claude", editable = true }
resource-guards = { path = "system/vendor/mngr/libs/resource_guards", editable = true }
concurrency-group = { path = "system/vendor/mngr/libs/concurrency_group", editable = true }

[tool.pytest.ini_options]
testpaths = ["."]
# pytest's default norecursedirs excludes all dot-directories (the ".*" pattern),
# which would skip the Python tests under .agents/shared/scripts (e.g.
# test_skill_mngr_references.py). Override it to keep the standard exclusions but
# enumerate the dot-directories to skip explicitly, so .agents is still recursed into.
norecursedirs = [
    "*.egg",
    ".git",
    ".claude",
    ".github",
    ".mngr",
    ".pytest_cache",
    ".reviewer",
    ".ruff_cache",
    ".venv",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
]
timeout_func_only = true
addopts = [
    "--timeout=10",
    "--ignore=system/vendor/mngr",
    "--ignore=system/vendor/tk",
    # system/libs/system_interface has its own pytest config (coverage, slow-test reporting,
    # ratchets) that conflicts with the root config; it is run from inside its own dir.
    "--ignore=system/libs/system_interface",
]

[tool.ruff]
target-version = "py311"
exclude = ["system/vendor/mngr", "system/vendor/tk", "system/libs/system_interface"]

[tool.ruff.lint]
select = ["F", "I", "UP006", "UP007"]

[tool.pyright]
pythonVersion = "3.11"
exclude = ["system/vendor/mngr", "system/vendor/tk", "system/libs/system_interface"]
