[project]
name = "default-workspace-template"
version = "0.1.0"
description = "Template repo for a persistent Claude agent"
requires-python = ">=3.12"
dependencies = [
    # Built-in services and apps whose console scripts supervisord runs must be
    # listed here: a `uv sync` without --all-packages prunes members outside the
    # root closure, deleting their console scripts, and the next spawn fails.
    # A user-built package is absent, and no member either: it is a standalone
    # project whose own program syncs it (`uv sync --locked --project <dir>`).
    "bootstrap",
    "github-sync",
    "env-converge",
    "host-backup",
    "share-gateway",
    "chat",
    "files-app",
    "getting-started",
    "routines-app",
    "screen",
    "style-guide-app",
    "system-interface",
    "system-monitor",
    "terminal-app",
    "tk-command-parsing",
    # The scripts that read the chat's background task markers reach this library through
    # sys.path; the tests of those scripts, run from the root venv, import it directly.
    "chat-background-tasks",
    # Agents run `uv run --no-sync workspace-layout` from the repo root, so its console script
    # must survive a sync of the root closure.
    "workspace-layout",
    # Agents run `uv run --no-sync workspace-themes` from the repo root (the create-theme, make-theme-icon, and build-app
    # skills), so its console script must survive a sync of the root closure too.
    "workspace-themes",
    # The cron tick, the boot migration, the Caretaker's check and the skills run
    # `uv run --no-sync routines ...` from the repo root, so its console script must
    # survive a sync of the root closure too.
    "routines",
    "imbue-common",
    "tomlkit>=0.12",
    "playwright==1.58.0",
    "litellm>=1.88.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.0",
    # Supplies the browser/context/page fixtures that app suites' browser tests
    # build on; the root conftest.py points them at Fortress.
    "pytest-playwright>=0.4",
    "ruff>=0.4",
    "inline-snapshot>=0.31",
    # What imbue_common.ratchet_testing needs (every project's test_ratchets.py imports it).
    "imbue-common[testing]",
    "tomlkit>=0.12",
    "pyyaml>=6",
    # used by test_mngr_template_stacking.py to verify .mngr/settings.toml
    # composes correctly with mngr's apply_create_template logic
    "imbue-mngr",
    # imbue-mngr-claude isn't imported by any /home/user/workspace/ python -- it's here so
    # `uv sync --all-packages` registers it in /home/user/workspace/.venv. Without it,
    # `uv run --no-sync mngr ...` resolves to
    # /home/user/workspace/.venv/bin/mngr but pluggy can't discover the claude plugin via
    # entry points, so settings.toml fields like `isolate_local_config_dir`,
    # `auto_allow_permissions`, etc. fail to parse as "Unknown fields".
    # Keeping the venv's mngr in lockstep with the tool-installed mngr
    # (which gets its plugins from the same pinned commit via system/config/mngr_plugins.toml)
    # avoids a cwd-dependent divergence.
    "imbue-mngr-claude",
    # imbue-mngr-codex: same rationale as imbue-mngr-claude above -- registers the
    # codex plugin in the workspace root .venv so `uv run --no-sync mngr` parses agent_types.codex
    # config fields instead of rejecting them as "Unknown fields".
    "imbue-mngr-codex",
    # imbue-mngr-pi-coding: same rationale -- register the pi-coding plugin in the
    # root .venv so `uv run --no-sync mngr` parses its agent_types fields instead of
    # rejecting them as "Unknown fields".
    "imbue-mngr-pi-coding",
    # imbue-mngr-opencode / imbue-mngr-antigravity: same rationale as the three
    # above -- registering the opencode / antigravity agent types so mngr can parse
    # their `[agent_types.*]` config blocks.
    "imbue-mngr-opencode",
    "imbue-mngr-antigravity",
    "imbue-mngr-autocompact",
    # Shared validator that checks mngr CLI argvs against the live mngr command
    # tree; used by the per-feature contract tests (bootstrap's manager_test,
    # launch-task's create_worker_test).
    "mngr-cli-contract",
    # Keeps tmp_path somewhere a stub executable can run (a workspace container mounts /tmp noexec).
    "pytest-executable-tmp",
    # Fails a test that skips where the environment is meant to be complete
    # (the CI job that runs the suites inside the workspace image).
    "pytest-workspace-env",
    # system/test_no_type_errors.py, pinned to the version every project's ratchet uses.
    "ty==0.0.85",
]

[tool.uv]
package = false

[tool.uv.workspace]
# Every built-in library, service and app, named one by one: these share this one
# lock and venv, reviewed and tested together upstream. A user-built package under
# system/apps, system/services or system/libs is not listed: it is a standalone uv
# project with its own pyproject.toml, uv.lock and .venv, so its dependencies never
# move a built-in's (docs/system/blueprint/app-environments/). Adding a built-in
# package means adding it here; system/test_app_manifests.py fails on one that is
# neither listed nor standalone.
# A skill's Python lives in its own project, .agents/skills/<name>/python/
# (pyproject.toml plus the <skill_name>_skill package), so a skill's dependencies
# join the same lock -- user skills included; its scripts/ dir keeps only entry files
# and shell scripts. uv refuses a glob-matched directory with no pyproject.toml, and
# scripts/ is the standard Agent Skills dir name, so the glob names a dir only this
# layout uses. The shared skill scripts and system/scripts are a project each too.
members = [
    "system/libs/app_manifest",
    "system/libs/app_schema",
    "system/libs/bootstrap",
    "system/libs/chat_background_tasks",
    "system/libs/github_sync",
    "system/libs/mngr_cli_contract",
    "system/libs/pytest_executable_tmp",
    "system/libs/pytest_workspace_env",
    "system/libs/routines",
    "system/libs/tk_command_parsing",
    "system/libs/workspace_layout",
    "system/libs/workspace_themes",
    "system/services/caretaker",
    "system/services/env_converge",
    "system/services/host_backup",
    "system/services/oom_priority",
    "system/services/share_gateway",
    "system/apps/chat",
    "system/apps/files",
    "system/apps/getting_started",
    "system/apps/routines",
    "system/apps/screen",
    "system/apps/style_guide",
    "system/apps/system_interface",
    "system/apps/system_monitor",
    "system/apps/terminal",
    "system/scripts",
    ".agents/shared/scripts",
    ".agents/skills/*/python",
]

[tool.uv.sources]
bootstrap = { workspace = true }
github-sync = { workspace = true }
env-converge = { workspace = true }
host-backup = { workspace = true }
share-gateway = { workspace = true }
mngr-cli-contract = { workspace = true }
pytest-executable-tmp = { workspace = true }
pytest-workspace-env = { workspace = true }
tk-command-parsing = { workspace = true }
chat-background-tasks = { workspace = true }
oom-priority = { workspace = true }
app-manifest = { workspace = true }
workspace-themes = { workspace = true }
app-schema = { workspace = true }
workspace-layout = { workspace = true }
routines = { workspace = true }
# The built-in apps, which the root dependencies name so a root-closure sync keeps them.
chat = { workspace = true }
files-app = { workspace = true }
getting-started = { workspace = true }
routines-app = { workspace = true }
screen = { workspace = true }
style-guide-app = { workspace = true }
system-interface = { workspace = true }
system-monitor = { workspace = true }
terminal-app = { workspace = true }
# The workspace's own scripts, and the skill packages other projects import.
workspace-scripts = { workspace = true }
agents-shared = { workspace = true }
update-self-skill = { workspace = true }
imbue-common = { git = "https://github.com/imbue-ai/mngr", rev = "5712c1a0810f5c3918a31c0ecaf29545a644495e", subdirectory = "libs/imbue_common" }
imbue-mngr = { git = "https://github.com/imbue-ai/mngr", rev = "5712c1a0810f5c3918a31c0ecaf29545a644495e", subdirectory = "libs/mngr" }
imbue-mngr-claude = { git = "https://github.com/imbue-ai/mngr", rev = "5712c1a0810f5c3918a31c0ecaf29545a644495e", subdirectory = "libs/mngr_claude" }
imbue-mngr-codex = { git = "https://github.com/imbue-ai/mngr", rev = "5712c1a0810f5c3918a31c0ecaf29545a644495e", subdirectory = "libs/mngr_codex" }
imbue-mngr-pi-coding = { git = "https://github.com/imbue-ai/mngr", rev = "5712c1a0810f5c3918a31c0ecaf29545a644495e", subdirectory = "libs/mngr_pi_coding" }
imbue-mngr-opencode = { git = "https://github.com/imbue-ai/mngr", rev = "5712c1a0810f5c3918a31c0ecaf29545a644495e", subdirectory = "libs/mngr_opencode" }
imbue-mngr-antigravity = { git = "https://github.com/imbue-ai/mngr", rev = "5712c1a0810f5c3918a31c0ecaf29545a644495e", subdirectory = "libs/mngr_antigravity" }
imbue-mngr-autocompact = { git = "https://github.com/imbue-ai/mngr", rev = "5712c1a0810f5c3918a31c0ecaf29545a644495e", subdirectory = "libs/mngr_autocompact" }
concurrency-group = { git = "https://github.com/imbue-ai/mngr", rev = "5712c1a0810f5c3918a31c0ecaf29545a644495e", subdirectory = "libs/concurrency_group" }
imbue-mngr-ttyd = { git = "https://github.com/imbue-ai/mngr", rev = "5712c1a0810f5c3918a31c0ecaf29545a644495e", subdirectory = "libs/mngr_ttyd" }

[tool.pytest.ini_options]
testpaths = ["."]
# pytest's default norecursedirs excludes all dot-directories (the ".*" pattern),
# which would skip the Python tests under .agents/shared/scripts (e.g.
# test_skill_mngr_references.py). Override it to keep the standard exclusions but
# enumerate the dot-directories to skip explicitly, so .agents is still recursed into.
norecursedirs = [
    "*.egg",
    # Runtime scratch, never part of the suite. Flow-internal state under
    # data/.tasks/ can stage copies of skill test files (update-self stages
    # update_self_test.py under data/.tasks/update-self/skill-at-target/), and
    # collecting one alongside the in-tree copy kills a bare `uv run --no-sync pytest`
    # with an import-file basename collision.
    "data",
    # Test scratch, never part of the suite, and the same collision as above when
    # an interrupted run leaves a clone of the tree here.
    ".test_output",
    ".git",
    ".claude",
    ".github",
    ".mngr",
    ".pytest_cache",
    ".reviewer",
    ".ruff_cache",
    ".venv",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
]
# Without it a test sees the environment of the agent running the suite; the chat and system interface pyprojects,
# the other pytest roots, require it too.
required_plugins = ["pytest-workspace-env"]
timeout_func_only = true
# Delete a passing test's tmp_path as soon as it finishes and keep only the latest
# session's leftovers. /tmp is a tmpfs, and under gVisor every file or directory there
# also holds sandbox memory until it is deleted.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
# Each app's pyproject declares the same markers for its own run.
markers = [
    "acceptance: marks tests as requiring network access, Modal credentials, etc. These are required to pass in CI",
    "browser: marks tests that drive a browser",
    "frontend: marks tests that read an app's frontend source",
    "real_claude: marks tests that run the real claude binary",
    "flaky: marks tests as known-flaky (retried by offload with a separate retry count)",
]
addopts = [
    "--timeout=10",
    "--ignore=system/vendor/tk",
    # system/apps/system_interface and system/apps/chat have their own pytest config (coverage,
    # slow-test reporting, ratchets) that conflicts with the root config; each is run from
    # inside its own dir.
    "--ignore=system/apps/system_interface",
    "--ignore=system/apps/chat",
    # The top-level apps and skills symlinks (discoverability shortcuts to
    # system/apps/ and .agents/skills/) would otherwise make pytest collect
    # every test under them a second time via the symlink path.
    "--ignore=apps",
    "--ignore=skills",
]

# The root project's type check (system/test_no_type_errors.py): the agent skills and
# their shared scripts, system/scripts, and the root-level tests. Every other package
# under system/ is its own ty project with its own test_no_type_errors.
[tool.ty.src]
include = [".agents", "system/scripts", "system/*.py", "conftest.py"]
# A bare skill's test imports its script by name, which only that skill's scripts/ dir
# resolves; system/test_no_type_errors.py checks each one with that dir on the search path.
exclude = [".agents/skills/*/scripts/*_test.py"]

# Workspaces run on Linux; without this ty would judge platform-specific stdlib calls
# (os.waitid, ...) by whichever machine runs the check.
[tool.ty.environment]
python-platform = "linux"

[tool.ruff]
target-version = "py312"
exclude = ["system/vendor/tk", "system/apps/system_interface", "system/apps/chat"]

[tool.ruff.lint]
select = ["F", "I", "UP006", "UP007"]
