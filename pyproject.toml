[project]
name = "default-workspace-template"
version = "0.1.0"
description = "Template repo for a persistent Claude agent"
requires-python = ">=3.11"
dependencies = [
    "bootstrap",
    "app-watcher",
    "github-sync",
    "env-converge",
    "host-backup",
    "share-gateway",
    "tk-command-parsing",
    "imbue-common",
    "tomlkit>=0.12",
    "playwright==1.58.0",
    "litellm>=1.88.1",
    "browser",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.0",
    "ruff>=0.4",
    "pyright>=1.1",
    "inline-snapshot>=0.31",
    "import-linter>=2.0",
    "tomlkit>=0.12",
    "pyyaml>=6",
    # used by test_mngr_template_stacking.py to verify .mngr/settings.toml
    # composes correctly with mngr's apply_create_template logic
    "imbue-mngr",
    # imbue-mngr-claude isn't imported by any /home/user/workspace/ python -- it's here so
    # `uv sync --all-packages` registers it in /home/user/workspace/.venv. Without it,
    # `uv run mngr ...` (e.g. from the bootstrap window) resolves to
    # /home/user/workspace/.venv/bin/mngr but pluggy can't discover the claude plugin via
    # entry points, so settings.toml fields like `isolate_local_config_dir`,
    # `auto_allow_permissions`, etc. fail to parse as "Unknown fields".
    # Keeping the venv's mngr in lockstep with the tool-installed mngr
    # (which has --with-editable mngr_claude on the system_interface tool
    # install) avoids a cwd-dependent divergence.
    "imbue-mngr-claude",
    # imbue-mngr-codex: same rationale as imbue-mngr-claude above -- registers the
    # codex plugin in the workspace root .venv so `uv run mngr` parses agent_types.codex
    # config fields instead of rejecting them as "Unknown fields".
    "imbue-mngr-codex",
    # imbue-mngr-pi-coding: same rationale -- register the pi-coding plugin in the
    # root .venv so `uv run mngr` parses its agent_types fields instead of
    # rejecting them as "Unknown fields".
    "imbue-mngr-pi-coding",
    # imbue-mngr-opencode / imbue-mngr-antigravity: same rationale as the three
    # above -- registering the opencode / antigravity agent types so mngr can parse
    # their `[agent_types.*]` config blocks.
    "imbue-mngr-opencode",
    "imbue-mngr-antigravity",
    # Shared validator that checks mngr CLI argvs against the live mngr command
    # tree; used by the per-feature contract tests (bootstrap's manager_test,
    # launch-task's create_worker_test).
    "mngr-cli-contract",
]

[tool.uv]
package = false

[tool.uv.workspace]
# The globs cover every package in the three-way system/ split -- built-in
# libraries, background services, and apps (built-in and user-built alike) --
# so a newly scaffolded or adopted app joins the workspace without editing
# this list. The terminal app is excluded: it is a shell-script wrapper around
# the vendored mngr_ttyd plugin, not a Python package. The files app likewise:
# it is the pinned dufs binary (see system/scripts/install_dufs.sh) plus its
# registered icon, with no Python of its own.
members = ["system/libs/*", "system/services/*", "system/apps/*"]
exclude = ["system/apps/terminal", "system/apps/files"]

[tool.uv.sources]
bootstrap = { workspace = true }
app-watcher = { workspace = true }
github-sync = { workspace = true }
env-converge = { workspace = true }
host-backup = { workspace = true }
share-gateway = { workspace = true }
mngr-cli-contract = { workspace = true }
tk-command-parsing = { workspace = true }
oom-priority = { workspace = true }
browser = { workspace = true }
imbue-common = { git = "https://github.com/imbue-ai/mngr", rev = "16b8c2eb25cfc3b19fd906dc259b1be915fee94e", subdirectory = "libs/imbue_common" }
imbue-mngr = { git = "https://github.com/imbue-ai/mngr", rev = "16b8c2eb25cfc3b19fd906dc259b1be915fee94e", subdirectory = "libs/mngr" }
imbue-mngr-claude = { git = "https://github.com/imbue-ai/mngr", rev = "16b8c2eb25cfc3b19fd906dc259b1be915fee94e", subdirectory = "libs/mngr_claude" }
imbue-mngr-codex = { git = "https://github.com/imbue-ai/mngr", rev = "16b8c2eb25cfc3b19fd906dc259b1be915fee94e", subdirectory = "libs/mngr_codex" }
imbue-mngr-pi-coding = { git = "https://github.com/imbue-ai/mngr", rev = "16b8c2eb25cfc3b19fd906dc259b1be915fee94e", subdirectory = "libs/mngr_pi_coding" }
imbue-mngr-opencode = { git = "https://github.com/imbue-ai/mngr", rev = "16b8c2eb25cfc3b19fd906dc259b1be915fee94e", subdirectory = "libs/mngr_opencode" }
imbue-mngr-antigravity = { git = "https://github.com/imbue-ai/mngr", rev = "16b8c2eb25cfc3b19fd906dc259b1be915fee94e", subdirectory = "libs/mngr_antigravity" }
resource-guards = { git = "https://github.com/imbue-ai/mngr", rev = "16b8c2eb25cfc3b19fd906dc259b1be915fee94e", subdirectory = "libs/resource_guards" }
concurrency-group = { git = "https://github.com/imbue-ai/mngr", rev = "16b8c2eb25cfc3b19fd906dc259b1be915fee94e", subdirectory = "libs/concurrency_group" }

[tool.pytest.ini_options]
testpaths = ["."]
# pytest's default norecursedirs excludes all dot-directories (the ".*" pattern),
# which would skip the Python tests under .agents/shared/scripts (e.g.
# test_skill_mngr_references.py). Override it to keep the standard exclusions but
# enumerate the dot-directories to skip explicitly, so .agents is still recursed into.
norecursedirs = [
    "*.egg",
    # Runtime scratch, never part of the suite. Flow-internal state under
    # data/.tasks/ can stage copies of skill test files (update-self stages
    # update_self_test.py under data/.tasks/update-self/skill-at-target/), and
    # collecting one alongside the in-tree copy kills a bare `uv run pytest`
    # with an import-file basename collision.
    "data",
    ".git",
    ".claude",
    ".github",
    ".mngr",
    ".pytest_cache",
    ".reviewer",
    ".ruff_cache",
    ".venv",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
]
timeout_func_only = true
addopts = [
    "--timeout=10",
    "--ignore=system/vendor/tk",
    # system/apps/system_interface has its own pytest config (coverage, slow-test reporting,
    # ratchets) that conflicts with the root config; it is run from inside its own dir.
    "--ignore=system/apps/system_interface",
    # The top-level apps and skills symlinks (discoverability shortcuts to
    # system/apps/ and .agents/skills/) would otherwise make pytest collect
    # every test under them a second time via the symlink path.
    "--ignore=apps",
    "--ignore=skills",
]

[tool.ruff]
target-version = "py311"
exclude = ["system/vendor/tk", "system/apps/system_interface"]

[tool.ruff.lint]
select = ["F", "I", "UP006", "UP007"]

[tool.pyright]
pythonVersion = "3.11"
# apps and skills are the top-level discoverability symlinks; excluding them
# keeps pyright from analyzing the same files twice via the symlink paths.
exclude = ["system/vendor/tk", "system/apps/system_interface", "apps", "skills"]
