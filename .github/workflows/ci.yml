name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

jobs:
  # Changelog gate. Diffs the PR branch against its real base branch and fails
  # if any touched project is missing its per-PR changelog entry. Pure stdlib,
  # so no `uv sync`; just enough git history to compute the diff.
  #
  # Opt-in: this job only runs when the repository variable ENFORCE_CHANGELOG is
  # set to 'true' (Settings -> Secrets and variables -> Actions -> Variables).
  # Downstream repos that publish a workspace inherit this workflow but not the
  # variable, so they never see a changelog CI failure. The template repo sets
  # ENFORCE_CHANGELOG=true to enforce the convention on itself.
  check-changelog:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && vars.ENFORCE_CHANGELOG == 'true'
    # Take the base from the event payload, under a NON-reserved name. GitHub
    # reserves the `GITHUB_` prefix, so a job-level `env: GITHUB_BASE_REF:` is
    # echoed in the log but never reaches the shell -- the runner's own value
    # wins, and on a stacked PR that was observed to be `main` rather than the
    # parent branch. The wrong base is not a smaller answer, it is a different
    # one: the diff grows to the whole stack and the gate demands entries for
    # projects the PR never touched.
    env:
      CHANGELOG_BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@v6

      - name: Fetch base branch and deepen HEAD for the changelog diff
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --unshallow origin "$(git rev-parse HEAD)"
          fi
          # Fetch into FETCH_HEAD and place the ref by hand. Passing a
          # `+src:dst` refspec was observed NOT to create the destination on a
          # stacked PR -- the step succeeded, `origin/<base>` did not exist, and
          # the gate quietly diffed against origin/main instead. update-ref
          # either writes the ref or fails.
          git fetch --no-tags origin "refs/heads/${CHANGELOG_BASE_REF}"
          git update-ref "refs/remotes/origin/${CHANGELOG_BASE_REF}" FETCH_HEAD
          git rev-parse --verify "refs/remotes/origin/${CHANGELOG_BASE_REF}" >/dev/null

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check changelog entries
        run: python system/scripts/check_changelog_entries.py

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # 22+, not 20: the frontend tests exercise code that reads the global
          # `navigator` (added to Node in 21), and Node 20 is past end-of-life.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: system/apps/system_interface/frontend/package-lock.json

      # uv sync silently UPDATES a stale lock rather than failing, so without
      # this gate a pyproject change merged without `uv lock` passes CI while
      # shipping a lockfile that breaks every `uv sync --frozen` build path
      # (build_workspace.sh, install_dependencies.sh). That is exactly how the
      # original minds-v0.3.16 tag shipped with the mngr CLI broken at import.
      - name: Check uv.lock matches pyproject
        run: uv lock --check

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Build and test system/apps/system_interface frontend
        working-directory: system/apps/system_interface/frontend
        run: |
          npm ci
          npm run test
          npm run build
          npm test

      - name: Run root tests
        run: PYTEST_MAX_DURATION_SECONDS=300 uv run pytest

      # The harness-contract acceptance tests drive the REAL claude binary, so without
      # it installed they would skip -- and a version bump would get no signal from the
      # tests written to catch exactly that. The version is read from the workspace pin
      # rather than written again here, so this is not another site to bump.
      - name: Install tmux and the pinned Claude Code
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y tmux
          version=$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('.mngr/settings.toml').read_text())['agent_types']['claude']['version'])")
          echo "Installing Claude Code $version"
          curl -fsSL https://claude.ai/install.sh | bash -s "$version"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run system/apps/system_interface tests
        working-directory: system/apps/system_interface
        run: PYTEST_MAX_DURATION_SECONDS=300 uv run pytest
