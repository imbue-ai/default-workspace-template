<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" role="img" aria-label="A miniature grid of unread Slack messages">
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="240" height="160" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <!-- warm off-white background -->
    <rect width="240" height="160" fill="#FBF7F4"/>

    <!-- header bar -->
    <rect x="0" y="0" width="240" height="30" fill="#4A154B"/>
    <rect x="14" y="12" width="7" height="7" rx="2" fill="#ECB22E"/>
    <text x="27" y="19" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#F3E9F0">Unread messages</text>
    <!-- unread count chip -->
    <rect x="196" y="9" width="30" height="13" rx="6.5" fill="#E01E5A"/>
    <text x="211" y="18.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">12</text>

    <!-- column header row -->
    <text x="14" y="43" font-family="Helvetica, Arial, sans-serif" font-size="6.5" font-weight="700" fill="#9B8FA0" letter-spacing="0.4">MESSAGE</text>
    <text x="120" y="43" font-family="Helvetica, Arial, sans-serif" font-size="6.5" font-weight="700" fill="#9B8FA0" letter-spacing="0.4">CHANNEL</text>
    <text x="176" y="43" font-family="Helvetica, Arial, sans-serif" font-size="6.5" font-weight="700" fill="#9B8FA0" letter-spacing="0.4">THREAD</text>
    <line x1="12" y1="48" x2="228" y2="48" stroke="#EADFE4" stroke-width="1"/>

    <!-- Row 1 -->
    <g>
      <circle cx="20" cy="61" r="6" fill="#36C5F0"/>
      <text x="20" y="63.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6" font-weight="700" fill="#FFFFFF">A</text>
      <rect x="32" y="55" width="78" height="4" rx="2" fill="#3B2D3F"/>
      <rect x="32" y="63" width="52" height="4" rx="2" fill="#C9BCC4"/>
      <rect x="118" y="56" width="44" height="12" rx="6" fill="#EFE1F0"/>
      <text x="140" y="64.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" font-weight="600" fill="#7A3E7C"># design</text>
      <rect x="178" y="56.5" width="20" height="11" rx="5.5" fill="#157245"/>
      <text x="188" y="64.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6.5" font-weight="700" fill="#FFFFFF">Yes</text>
      <path d="M212 60 l4 0 M216 60 a3 3 0 0 1 0 4 l-2 0 M216 62 l4 0" fill="none" stroke="#4A154B" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="224" cy="62" r="4.5" fill="none" stroke="#4A154B" stroke-width="1.4"/>
      <path d="M221.6 62 a2.4 2.4 0 0 1 4.8 0" fill="none" stroke="#4A154B" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <line x1="12" y1="76" x2="228" y2="76" stroke="#EADFE4" stroke-width="1"/>

    <!-- Row 2 -->
    <g>
      <circle cx="20" cy="89" r="6" fill="#E8912D"/>
      <text x="20" y="91.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6" font-weight="700" fill="#FFFFFF">M</text>
      <rect x="32" y="83" width="70" height="4" rx="2" fill="#3B2D3F"/>
      <rect x="32" y="91" width="60" height="4" rx="2" fill="#C9BCC4"/>
      <rect x="118" y="84" width="40" height="12" rx="6" fill="#DDEFEA"/>
      <text x="138" y="92.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" font-weight="600" fill="#1B6B4B"># eng</text>
      <rect x="178" y="84.5" width="20" height="11" rx="5.5" fill="#EDE3E9"/>
      <text x="188" y="92.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6.5" font-weight="700" fill="#8A7C86">No</text>
      <circle cx="224" cy="90" r="4.5" fill="none" stroke="#4A154B" stroke-width="1.4"/>
      <path d="M221.6 90 a2.4 2.4 0 0 1 4.8 0" fill="none" stroke="#4A154B" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <line x1="12" y1="104" x2="228" y2="104" stroke="#EADFE4" stroke-width="1"/>

    <!-- Row 3 -->
    <g>
      <circle cx="20" cy="117" r="6" fill="#2EB67D"/>
      <text x="20" y="119.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6" font-weight="700" fill="#FFFFFF">S</text>
      <rect x="32" y="111" width="82" height="4" rx="2" fill="#3B2D3F"/>
      <rect x="32" y="119" width="46" height="4" rx="2" fill="#C9BCC4"/>
      <rect x="118" y="112" width="48" height="12" rx="6" fill="#EFE1F0"/>
      <text x="142" y="120.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" font-weight="600" fill="#7A3E7C"># product</text>
      <rect x="178" y="112.5" width="20" height="11" rx="5.5" fill="#157245"/>
      <text x="188" y="120.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6.5" font-weight="700" fill="#FFFFFF">Yes</text>
      <circle cx="224" cy="118" r="4.5" fill="none" stroke="#4A154B" stroke-width="1.4"/>
      <path d="M221.6 118 a2.4 2.4 0 0 1 4.8 0" fill="none" stroke="#4A154B" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <!-- bottom-right live indicator (no timestamp) -->
    <circle cx="184" cy="147" r="3" fill="#2EB67D"/>
    <text x="191" y="149.5" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#9B8FA0">Updated</text>
  </g>
</svg>
