<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Lego Todo Planner: a To do backlog, a Today plan, and a deadline calendar">
  <!-- Bespoke thumbnail for the Lego Todo Planner inspiration. Mock data only. -->
  <rect width="240" height="160" rx="12" fill="#fbf7f4"/>
  <rect x="0.5" y="0.5" width="239" height="159" rx="11.5" fill="none" stroke="#ecdfe0"/>

  <!-- To do backlog column -->
  <rect x="12" y="16" width="66" height="128" rx="8" fill="#ffffff" stroke="#ecdfe0"/>
  <text x="22" y="33" font-family="Georgia, serif" font-size="10" font-weight="700" fill="#6c5b60">To do</text>
  <rect x="66" y="25" width="8" height="8" rx="4" fill="#f0e4e6"/>
  <rect x="20" y="42" width="50" height="20" rx="5" fill="#faf5f6" stroke="#ecdfe0"/>
  <rect x="25" y="47" width="30" height="3.5" rx="1.75" fill="#9a8a8f"/>
  <rect x="25" y="54" width="40" height="3" rx="1.5" fill="#cfa9b4"/>
  <rect x="20" y="68" width="50" height="20" rx="5" fill="#faf5f6" stroke="#ecdfe0"/>
  <rect x="25" y="73" width="22" height="3.5" rx="1.75" fill="#9a8a8f"/>
  <rect x="25" y="80" width="34" height="3" rx="1.5" fill="#cfa9b4"/>
  <rect x="20" y="94" width="50" height="20" rx="5" fill="#faf5f6" stroke="#ecdfe0"/>
  <rect x="25" y="99" width="34" height="3.5" rx="1.75" fill="#9a8a8f"/>
  <rect x="25" y="106" width="26" height="3" rx="1.5" fill="#cfa9b4"/>

  <!-- Today plan column (accent tinted) -->
  <rect x="86" y="16" width="66" height="128" rx="8" fill="#fbf1f3" stroke="#e3b9c5"/>
  <text x="96" y="33" font-family="Georgia, serif" font-size="10" font-weight="700" fill="#b5657f">Today</text>
  <rect x="140" y="25" width="8" height="8" rx="4" fill="#efc9d4"/>
  <rect x="94" y="42" width="50" height="20" rx="5" fill="#ffffff" stroke="#e3b9c5"/>
  <rect x="99" y="47" width="32" height="3.5" rx="1.75" fill="#7d6b70"/>
  <rect x="99" y="54" width="42" height="3" rx="1.5" fill="#e3b9c5"/>
  <!-- a card mid-drag, lifted with a shadow -->
  <rect x="97" y="70" width="50" height="20" rx="5" fill="#ffffff" stroke="#b5657f" opacity="0.35"/>
  <rect x="99" y="67" width="50" height="20" rx="5" fill="#ffffff" stroke="#b5657f"/>
  <circle cx="105" cy="77" r="2.5" fill="none" stroke="#b5657f" stroke-width="1.2"/>
  <rect x="111" y="72" width="28" height="3.5" rx="1.75" fill="#7d6b70"/>
  <rect x="111" y="79" width="20" height="3" rx="1.5" fill="#b5657f"/>
  <rect x="94" y="96" width="50" height="20" rx="5" fill="#ffffff" stroke="#e3b9c5"/>
  <rect x="99" y="101" width="26" height="3.5" rx="1.75" fill="#7d6b70"/>
  <rect x="99" y="108" width="38" height="3" rx="1.5" fill="#e3b9c5"/>

  <!-- Month deadline calendar -->
  <rect x="160" y="16" width="68" height="128" rx="8" fill="#ffffff" stroke="#ecdfe0"/>
  <text x="170" y="33" font-family="Georgia, serif" font-size="10" font-weight="700" fill="#6c5b60">Deadlines</text>
  <g fill="#ede2e4">
    <rect x="168" y="44" width="10" height="10" rx="2"/>
    <rect x="181" y="44" width="10" height="10" rx="2"/>
    <rect x="194" y="44" width="10" height="10" rx="2"/>
    <rect x="207" y="44" width="10" height="10" rx="2"/>
    <rect x="168" y="57" width="10" height="10" rx="2"/>
    <rect x="181" y="57" width="10" height="10" rx="2"/>
    <rect x="194" y="57" width="10" height="10" rx="2"/>
    <rect x="207" y="57" width="10" height="10" rx="2"/>
    <rect x="168" y="70" width="10" height="10" rx="2"/>
    <rect x="181" y="70" width="10" height="10" rx="2"/>
    <rect x="207" y="70" width="10" height="10" rx="2"/>
    <rect x="168" y="83" width="10" height="10" rx="2"/>
    <rect x="181" y="83" width="10" height="10" rx="2"/>
    <rect x="194" y="83" width="10" height="10" rx="2"/>
    <rect x="207" y="83" width="10" height="10" rx="2"/>
  </g>
  <!-- highlighted deadline day -->
  <rect x="194" y="70" width="10" height="10" rx="2" fill="#b5657f"/>
  <circle cx="199" cy="75" r="1.6" fill="#ffffff"/>

  <!-- Long term goals note strip -->
  <rect x="168" y="103" width="52" height="4" rx="2" fill="#d9c7cc"/>
  <rect x="168" y="112" width="44" height="4" rx="2" fill="#e6dadc"/>
  <rect x="168" y="121" width="48" height="4" rx="2" fill="#e6dadc"/>
</svg>
