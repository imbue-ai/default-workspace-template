<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="datalib -- your personal data, searchable">
  <rect width="240" height="160" rx="12" fill="#0f1b2d"/>
  <!-- source chips (Slack / mail / GitHub / Notion), mock labels only -->
  <g font-family="sans-serif" font-size="9" fill="#cbd5e1">
    <rect x="16" y="24" width="58" height="18" rx="5" fill="#1e2f47"/><text x="26" y="36">slack</text>
    <rect x="16" y="50" width="58" height="18" rx="5" fill="#1e2f47"/><text x="26" y="62">email</text>
    <rect x="16" y="76" width="58" height="18" rx="5" fill="#1e2f47"/><text x="26" y="88">github</text>
    <rect x="16" y="102" width="58" height="18" rx="5" fill="#1e2f47"/><text x="26" y="114">notion</text>
  </g>
  <!-- flows into one store -->
  <g stroke="#3b6ea5" stroke-width="2" fill="none" opacity="0.8">
    <path d="M74 33 C 104 33, 104 72, 128 72"/>
    <path d="M74 59 C 100 59, 104 72, 128 72"/>
    <path d="M74 85 C 100 85, 104 80, 128 80"/>
    <path d="M74 111 C 104 111, 104 80, 128 80"/>
  </g>
  <!-- the unified local store (stacked disks) -->
  <g fill="#2563a8">
    <ellipse cx="160" cy="60" rx="32" ry="10"/>
    <rect x="128" y="60" width="64" height="30" fill="#1d4e86"/>
    <ellipse cx="160" cy="90" rx="32" ry="10" fill="#2563a8"/>
  </g>
  <ellipse cx="160" cy="60" rx="32" ry="10" fill="#3b82d6"/>
  <!-- magnifier over the store -->
  <g stroke="#e2e8f0" stroke-width="4" fill="none">
    <circle cx="176" cy="104" r="16"/>
    <line x1="188" y1="116" x2="202" y2="130" stroke-linecap="round"/>
  </g>
  <text x="16" y="146" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">datalib</text>
</svg>
