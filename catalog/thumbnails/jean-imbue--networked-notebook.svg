<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Networked Notebook: a knowledge graph of linked concept nodes with Slack and Docs sources, beside outliner bullet lines">
  <rect width="240" height="160" rx="12" fill="#20242b"/>

  <!-- knowledge graph: edges drawn first so nodes sit on top -->
  <g stroke="#3a3f4a" stroke-width="1.3">
    <line x1="150" y1="52" x2="188" y2="34"/>
    <line x1="150" y1="52" x2="196" y2="78"/>
    <line x1="150" y1="52" x2="120" y2="86"/>
    <line x1="150" y1="52" x2="176" y2="112"/>
    <line x1="196" y1="78" x2="176" y2="112"/>
    <line x1="120" y1="86" x2="176" y2="112"/>
    <line x1="188" y1="34" x2="196" y2="78"/>
  </g>
  <!-- source edges tinted toward their node color -->
  <line x1="120" y1="86" x2="72" y2="70" stroke="#6b2d74" stroke-width="1.3"/>
  <line x1="176" y1="112" x2="86" y2="128" stroke="#1a73e8" stroke-width="1.3"/>

  <!-- concept nodes (accent violet) -->
  <circle cx="150" cy="52" r="9" fill="#6b5cff"/>
  <circle cx="188" cy="34" r="5.5" fill="#6b5cff"/>
  <circle cx="196" cy="78" r="6.5" fill="#6b5cff"/>
  <circle cx="120" cy="86" r="6" fill="#6b5cff"/>
  <circle cx="176" cy="112" r="7" fill="#6b5cff"/>

  <!-- Slack source node (aubergine) -->
  <circle cx="72" cy="70" r="8" fill="#6b2d74"/>
  <text x="72" y="73.5" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="600" fill="#f4e9f6">S</text>
  <!-- Docs source node (blue) -->
  <circle cx="86" cy="128" r="8" fill="#1a73e8"/>
  <text x="86" y="131.5" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="600" fill="#e8f0fe">D</text>

  <!-- outliner bullet lines -->
  <g>
    <circle cx="24" cy="30" r="2.4" fill="#6b5cff"/>
    <rect x="32" y="27" width="86" height="6" rx="3" fill="#3e4451"/>

    <circle cx="36" cy="46" r="2.4" fill="#8a93a3"/>
    <rect x="44" y="43" width="62" height="5" rx="2.5" fill="#333944"/>

    <circle cx="36" cy="61" r="2.4" fill="#8a93a3"/>
    <rect x="44" y="58.5" width="46" height="5" rx="2.5" fill="#6b5cff" opacity="0.55"/>
  </g>
</svg>
