<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Weekly Lunch Assistant: a Monday-to-Friday plan of plated lunches with an 8am reminder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2a3d"/>
      <stop offset="1" stop-color="#211f30"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5efe4"/>
      <stop offset="1" stop-color="#e4dccb"/>
    </linearGradient>
  </defs>

  <rect width="240" height="160" rx="14" fill="url(#bg)"/>

  <!-- title: fork + knife on a warm badge -->
  <circle cx="24" cy="26" r="9" fill="#ff8a5c"/>
  <path d="M21 21v10M23 21v10M22 21v10" stroke="#3a1f12" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M27 21c-1.4 0-2 1.6-2 3.4 0 1.4.8 2 2 2.2V31" stroke="#3a1f12" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <text x="40" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f5efe4">Weekly Lunch</text>

  <!-- 8am reminder badge -->
  <g transform="translate(196,16)">
    <rect width="30" height="20" rx="10" fill="#3a3852"/>
    <circle cx="10" cy="10" r="6.2" fill="none" stroke="#7ee0c0" stroke-width="1.6"/>
    <path d="M10 6.4v3.6l2.4 1.6" fill="none" stroke="#7ee0c0" stroke-width="1.6" stroke-linecap="round"/>
    <text x="18" y="13.4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="700" fill="#7ee0c0">8a</text>
  </g>

  <!-- weekday strip: Mon-Fri, Wed highlighted as the chosen day -->
  <g transform="translate(16,52)">
    <!-- Mon -->
    <g transform="translate(0,0)">
      <rect width="36" height="88" rx="9" fill="#33314a"/>
      <text x="18" y="16" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#a9a4c4">M</text>
      <circle cx="18" cy="46" r="12.5" fill="url(#plate)"/>
      <circle cx="18" cy="46" r="6.5" fill="#c46b3f"/>
      <rect x="8" y="70" width="20" height="4" rx="2" fill="#4a4766"/>
    </g>
    <!-- Tue -->
    <g transform="translate(44,0)">
      <rect width="36" height="88" rx="9" fill="#33314a"/>
      <text x="18" y="16" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#a9a4c4">T</text>
      <circle cx="18" cy="46" r="12.5" fill="url(#plate)"/>
      <circle cx="18" cy="46" r="6.5" fill="#6fa86b"/>
      <rect x="8" y="70" width="20" height="4" rx="2" fill="#4a4766"/>
    </g>
    <!-- Wed (chosen) -->
    <g transform="translate(88,-6)">
      <rect width="36" height="100" rx="9" fill="#ff8a5c"/>
      <text x="18" y="18" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#3a1f12">W</text>
      <circle cx="18" cy="50" r="13.5" fill="url(#plate)"/>
      <circle cx="18" cy="50" r="7" fill="#d1913b"/>
      <path d="M18 43.5a6.5 6.5 0 0 1 0 13" fill="#e9b45c"/>
      <path d="M9 83l4 4 8-8" fill="none" stroke="#3a1f12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Thu -->
    <g transform="translate(132,0)">
      <rect width="36" height="88" rx="9" fill="#33314a"/>
      <text x="18" y="16" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#a9a4c4">T</text>
      <circle cx="18" cy="46" r="12.5" fill="url(#plate)"/>
      <circle cx="18" cy="46" r="6.5" fill="#c9a24a"/>
      <rect x="8" y="70" width="20" height="4" rx="2" fill="#4a4766"/>
    </g>
    <!-- Fri -->
    <g transform="translate(176,0)">
      <rect width="36" height="88" rx="9" fill="#33314a"/>
      <text x="18" y="16" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#a9a4c4">F</text>
      <circle cx="18" cy="46" r="12.5" fill="url(#plate)"/>
      <circle cx="18" cy="46" r="6.5" fill="#5f97c4"/>
      <rect x="8" y="70" width="20" height="4" rx="2" fill="#4a4766"/>
    </g>
  </g>
</svg>
