<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="A SQL table behind a bearer-token key">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="240" height="160" rx="14" fill="url(#bg)"/>

  <!-- Table / SQL store card -->
  <g transform="translate(24 30)">
    <rect x="0" y="0" width="120" height="100" rx="8" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
    <!-- header row -->
    <rect x="0" y="0" width="120" height="22" rx="8" fill="#38bdf8"/>
    <rect x="0" y="14" width="120" height="8" fill="#38bdf8"/>
    <rect x="12" y="8" width="26" height="6" rx="3" fill="#0b1220" opacity="0.85"/>
    <rect x="48" y="8" width="26" height="6" rx="3" fill="#0b1220" opacity="0.85"/>
    <rect x="84" y="8" width="24" height="6" rx="3" fill="#0b1220" opacity="0.85"/>
    <!-- column separators -->
    <line x1="42" y1="22" x2="42" y2="100" stroke="#334155" stroke-width="1"/>
    <line x1="80" y1="22" x2="80" y2="100" stroke="#334155" stroke-width="1"/>
    <!-- data rows -->
    <g fill="#64748b">
      <rect x="12" y="34" width="20" height="5" rx="2.5"/>
      <rect x="50" y="34" width="22" height="5" rx="2.5"/>
      <rect x="88" y="34" width="16" height="5" rx="2.5"/>

      <rect x="12" y="50" width="20" height="5" rx="2.5"/>
      <rect x="50" y="50" width="18" height="5" rx="2.5"/>
      <rect x="88" y="50" width="20" height="5" rx="2.5"/>

      <rect x="12" y="66" width="20" height="5" rx="2.5"/>
      <rect x="50" y="66" width="24" height="5" rx="2.5" fill="#38bdf8" opacity="0.7"/>
      <rect x="88" y="66" width="14" height="5" rx="2.5"/>

      <rect x="12" y="82" width="20" height="5" rx="2.5"/>
      <rect x="50" y="82" width="20" height="5" rx="2.5"/>
      <rect x="88" y="82" width="18" height="5" rx="2.5"/>
    </g>
  </g>

  <!-- Bearer-token key guarding the table -->
  <g transform="translate(158 58)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="url(#key)" stroke-width="7"/>
    <rect x="18" y="34" width="7" height="40" rx="2" fill="url(#key)"/>
    <rect x="25" y="52" width="14" height="7" rx="2" fill="url(#key)"/>
    <rect x="25" y="64" width="10" height="7" rx="2" fill="url(#key)"/>
    <circle cx="20" cy="20" r="6" fill="#0f172a"/>
  </g>

  <!-- SQL label -->
  <g transform="translate(24 138)" fill="#94a3b8" font-family="monospace" font-size="9">
    <text x="0" y="0">SELECT * FROM data;</text>
  </g>
</svg>
