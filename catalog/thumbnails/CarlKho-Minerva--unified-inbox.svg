<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Unified Inbox">
  <!-- Bespoke thumbnail: a three-pane inbox miniature (source rail + message list +
       reader) with a knowledge-graph accent. Mock data only. -->
  <rect width="240" height="160" rx="12" fill="#f8fafc"/>
  <rect x="0.5" y="0.5" width="239" height="159" rx="11.5" fill="none" stroke="#e2e8f0"/>

  <!-- Top bar: logo dot + segmented view control + search -->
  <rect x="8" y="8" width="224" height="16" rx="5" fill="#eef2f7"/>
  <circle cx="17" cy="16" r="3.2" fill="#2f6bff"/>
  <rect x="26" y="12" width="16" height="8" rx="2" fill="#2f6bff"/>
  <rect x="45" y="12" width="16" height="8" rx="2" fill="#dde5ee"/>
  <rect x="64" y="12" width="16" height="8" rx="2" fill="#dde5ee"/>
  <rect x="150" y="11" width="76" height="10" rx="5" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- Source rail -->
  <rect x="8" y="30" width="24" height="122" rx="6" fill="#ffffff" stroke="#eef2f6"/>
  <circle cx="20" cy="44" r="4" fill="#2f6bff"/>
  <circle cx="20" cy="44" r="6.5" fill="none" stroke="#2f6bff" stroke-opacity="0.35"/>
  <circle cx="20" cy="62" r="3.5" fill="#12a150"/>
  <circle cx="20" cy="80" r="3.5" fill="#c9820a"/>
  <circle cx="20" cy="98" r="3.5" fill="#e0533d"/>
  <circle cx="20" cy="116" r="3.5" fill="#9333ea"/>
  <circle cx="20" cy="134" r="3.5" fill="#5865f2"/>

  <!-- Message list -->
  <rect x="40" y="30" width="96" height="122" rx="6" fill="#ffffff" stroke="#eef2f6"/>
  <!-- selected row -->
  <rect x="43" y="56" width="90" height="20" rx="4" fill="#eff6ff"/>
  <!-- rows: colored tag + subject + snippet -->
  <g>
    <rect x="46" y="37" width="3" height="14" rx="1.5" fill="#12a150"/>
    <rect x="54" y="38" width="58" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="54" y="45" width="42" height="3" rx="1.5" fill="#e2e8f0"/>
    <circle cx="127" cy="40" r="2" fill="#2f6bff"/>
  </g>
  <g>
    <rect x="46" y="59" width="3" height="14" rx="1.5" fill="#2f6bff"/>
    <rect x="54" y="60" width="64" height="4" rx="2" fill="#94a3b8"/>
    <rect x="54" y="67" width="48" height="3" rx="1.5" fill="#cbd5e1"/>
    <circle cx="127" cy="62" r="2" fill="#2f6bff"/>
  </g>
  <g>
    <rect x="46" y="81" width="3" height="14" rx="1.5" fill="#c9820a"/>
    <rect x="54" y="82" width="52" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="54" y="89" width="46" height="3" rx="1.5" fill="#e2e8f0"/>
  </g>
  <g>
    <rect x="46" y="103" width="3" height="14" rx="1.5" fill="#e0533d"/>
    <rect x="54" y="104" width="60" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="54" y="111" width="38" height="3" rx="1.5" fill="#e2e8f0"/>
  </g>
  <g>
    <rect x="46" y="125" width="3" height="14" rx="1.5" fill="#9333ea"/>
    <rect x="54" y="126" width="56" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="54" y="133" width="44" height="3" rx="1.5" fill="#e2e8f0"/>
  </g>

  <!-- Reader pane -->
  <rect x="140" y="30" width="92" height="122" rx="6" fill="#ffffff" stroke="#eef2f6"/>
  <rect x="148" y="39" width="52" height="5" rx="2.5" fill="#94a3b8"/>
  <rect x="148" y="49" width="68" height="4" rx="2" fill="#cbd5e1"/>
  <rect x="148" y="61" width="72" height="3" rx="1.5" fill="#e5eaf0"/>
  <rect x="148" y="69" width="64" height="3" rx="1.5" fill="#e5eaf0"/>
  <rect x="148" y="77" width="70" height="3" rx="1.5" fill="#e5eaf0"/>
  <rect x="148" y="85" width="40" height="3" rx="1.5" fill="#e5eaf0"/>

  <!-- Knowledge-graph accent (Obsidian-style force-directed nodes) -->
  <g stroke="#d5dde7" stroke-width="1.2">
    <line x1="167" y1="118" x2="196" y2="109"/>
    <line x1="167" y1="118" x2="182" y2="139"/>
    <line x1="196" y1="109" x2="215" y2="126"/>
    <line x1="182" y1="139" x2="206" y2="140"/>
    <line x1="215" y1="126" x2="206" y2="140"/>
  </g>
  <circle cx="167" cy="118" r="5" fill="#2f6bff"/>
  <circle cx="196" cy="109" r="3.6" fill="#12a150"/>
  <circle cx="215" cy="126" r="3" fill="#9333ea"/>
  <circle cx="182" cy="139" r="3.6" fill="#e0533d"/>
  <circle cx="206" cy="140" r="2.6" fill="#c9820a"/>
</svg>
