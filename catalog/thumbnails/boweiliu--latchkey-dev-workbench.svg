<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Latchkey Dev Workbench">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16202b"/>
      <stop offset="1" stop-color="#0c121a"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d365"/>
      <stop offset="1" stop-color="#e0a83a"/>
    </linearGradient>
  </defs>

  <rect width="240" height="160" rx="12" fill="url(#bg)"/>

  <!-- suspension bridge spanning agent -> laptop -->
  <path d="M58 49 Q120 12 182 49" fill="none" stroke="#46586a" stroke-width="2.5"/>
  <g stroke="#3a4a5a" stroke-width="1.2">
    <line x1="80" y1="47" x2="80" y2="38"/>
    <line x1="104" y1="47" x2="104" y2="32"/>
    <line x1="136" y1="47" x2="136" y2="32"/>
    <line x1="160" y1="47" x2="160" y2="38"/>
  </g>
  <rect x="56" y="47" width="128" height="4" rx="2" fill="#33414f"/>
  <rect x="55" y="44" width="6" height="15" rx="1" fill="#46586a"/>
  <rect x="179" y="44" width="6" height="15" rx="1" fill="#46586a"/>

  <!-- left: agent node -->
  <rect x="20" y="56" width="40" height="46" rx="6" fill="#1b2734" stroke="#34d0ba" stroke-width="1.5"/>
  <rect x="26" y="64" width="28" height="6" rx="2" fill="#34d0ba" opacity="0.85"/>
  <rect x="26" y="76" width="28" height="6" rx="2" fill="#34d0ba" opacity="0.55"/>
  <rect x="26" y="88" width="28" height="6" rx="2" fill="#34d0ba" opacity="0.55"/>
  <circle cx="50" cy="67" r="1.6" fill="#f2c94c"/>

  <!-- right: laptop (Mac) -->
  <rect x="182" y="54" width="42" height="30" rx="3" fill="#1b2734" stroke="#93a4b8" stroke-width="1.5"/>
  <rect x="188" y="61" width="20" height="3" rx="1.5" fill="#34d0ba" opacity="0.8"/>
  <rect x="188" y="68" width="28" height="3" rx="1.5" fill="#93a4b8" opacity="0.5"/>
  <rect x="188" y="75" width="16" height="3" rx="1.5" fill="#93a4b8" opacity="0.5"/>
  <path d="M176 86 L230 86 L234 94 L172 94 Z" fill="#93a4b8"/>

  <!-- center: workbench medallion with crossed key + wrench -->
  <circle cx="120" cy="82" r="30" fill="#14202c" stroke="#34d0ba" stroke-width="2"/>

  <!-- wrench (steel), crossing behind -->
  <g transform="rotate(34 120 82)">
    <rect x="116" y="80" width="8" height="30" rx="4" fill="#93a4b8"/>
    <polygon points="132,70 126,80.4 114,80.4 108,70 114,59.6 126,59.6" fill="#93a4b8"/>
    <polygon points="113,59.6 127,59.6 120,71" fill="#14202c"/>
  </g>

  <!-- key (gold), crossing in front -->
  <g transform="rotate(-22 120 82)">
    <circle cx="105" cy="82" r="8" fill="url(#key)"/>
    <circle cx="105" cy="82" r="3.5" fill="#14202c"/>
    <rect x="111" y="79" width="27" height="6" rx="2" fill="url(#key)"/>
    <rect x="129" y="85" width="4" height="6" fill="url(#key)"/>
    <rect x="136" y="85" width="4" height="8" fill="url(#key)"/>
  </g>

  <!-- workbench surface + captions -->
  <rect x="16" y="120" width="208" height="2.5" rx="1.25" fill="#26323f"/>
  <g font-family="sans-serif" fill="#7d8b99" text-anchor="middle">
    <text x="40" y="135" font-size="9">agent</text>
    <text x="120" y="135" font-size="9" letter-spacing="1.5">dev workbench</text>
    <text x="203" y="135" font-size="9">Mac</text>
  </g>
</svg>
