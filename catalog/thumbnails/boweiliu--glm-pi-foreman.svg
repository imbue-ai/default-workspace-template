<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="A web UI driving a GLM-5.2 coding agent">
  <rect width="240" height="160" rx="12" fill="#12161c"/>

  <!-- Browser / chat window -->
  <rect x="24" y="20" width="192" height="120" rx="10" fill="#1c232c" stroke="#39424e" stroke-width="1.5"/>

  <!-- Title bar with window dots -->
  <path d="M24 30 a10 10 0 0 1 10 -10 h172 a10 10 0 0 1 10 10 v6 h-192 z" fill="#252e39"/>
  <circle cx="36" cy="28" r="2.6" fill="#5b6673"/>
  <circle cx="46" cy="28" r="2.6" fill="#5b6673"/>
  <circle cx="56" cy="28" r="2.6" fill="#5b6673"/>

  <!-- Chat bubbles -->
  <rect x="38" y="46" width="86" height="14" rx="7" fill="#2f3a46"/>
  <rect x="116" y="66" width="86" height="14" rx="7" fill="#3a4756"/>

  <!-- Terminal panel with prompt and cursor -->
  <rect x="38" y="90" width="164" height="34" rx="6" fill="#0d1116" stroke="#2b333d" stroke-width="1"/>
  <text x="47" y="111" font-family="monospace" font-size="13" fill="#8b97a6">$</text>
  <rect x="58" y="101" width="70" height="4" rx="2" fill="#4b5764"/>
  <rect x="132" y="99" width="7" height="14" rx="1.5" fill="#c3ccd6"/>

  <!-- Pi glyph badge -->
  <circle cx="188" cy="46" r="16" fill="#252e39" stroke="#4b5764" stroke-width="1.5"/>
  <text x="188" y="53" font-family="serif" font-size="20" fill="#e2e8f0" text-anchor="middle">&#960;</text>

  <!-- Model label -->
  <text x="132" y="151" font-family="sans-serif" font-size="10" fill="#7a8695" text-anchor="middle" letter-spacing="1">GLM-5.2</text>
</svg>
