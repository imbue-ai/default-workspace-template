<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Non-Responder: incoming messages each answered with one flat reply">
  <rect width="240" height="160" rx="12" fill="#e3e7ea"/>
  <text x="20" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" letter-spacing="2" fill="#8a949b">STANDING REPLY DESK</text>
  <text x="20" y="44" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="17" fill="#1c2226">Non-Responder</text>

  <!-- message row 1 -->
  <g>
    <rect x="20" y="60" width="200" height="26" rx="6" fill="#ffffff"/>
    <circle cx="33" cy="73" r="6" fill="#3b5566"/>
    <rect x="45" y="66" width="66" height="4" rx="2" fill="#4a555c"/>
    <rect x="45" y="76" width="48" height="3" rx="1.5" fill="#aab3b9"/>
    <rect x="139" y="66" width="72" height="15" rx="7.5" fill="#d7e4ec" stroke="#3b5566" stroke-width="1"/>
    <text x="175" y="76.5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="6.5" fill="#274150">Thanks, noted.</text>
  </g>

  <!-- message row 2 -->
  <g>
    <rect x="20" y="92" width="200" height="26" rx="6" fill="#ffffff"/>
    <circle cx="33" cy="105" r="6" fill="#6b7a83"/>
    <rect x="45" y="98" width="54" height="4" rx="2" fill="#4a555c"/>
    <rect x="45" y="108" width="60" height="3" rx="1.5" fill="#aab3b9"/>
    <rect x="139" y="98" width="72" height="15" rx="7.5" fill="#d7e4ec" stroke="#3b5566" stroke-width="1"/>
    <text x="175" y="108.5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="6.5" fill="#274150">Thanks, noted.</text>
  </g>

  <!-- message row 3 -->
  <g>
    <rect x="20" y="124" width="200" height="26" rx="6" fill="#ffffff"/>
    <circle cx="33" cy="137" r="6" fill="#3b5566"/>
    <rect x="45" y="130" width="72" height="4" rx="2" fill="#4a555c"/>
    <rect x="45" y="140" width="40" height="3" rx="1.5" fill="#aab3b9"/>
    <rect x="139" y="130" width="72" height="15" rx="7.5" fill="#d7e4ec" stroke="#3b5566" stroke-width="1"/>
    <text x="175" y="140.5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="6.5" fill="#274150">Thanks, noted.</text>
  </g>
</svg>
