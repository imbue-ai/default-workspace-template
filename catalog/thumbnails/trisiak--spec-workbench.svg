<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320"><rect width="480" height="320" fill="#E4E7EB"/><rect x="24" y="20" width="290" height="290" fill="#fff" stroke="#D0D4D9"/><rect x="42" y="146" width="168" height="16" fill="#FFE066" opacity=".7"/><rect x="42" y="200" width="212" height="16" fill="#B2F2BB" opacity=".7"/><g font-family="Iowan Old Style, Palatino, Georgia, serif" fill="#1F2328"><text x="44" y="56" font-size="20" font-weight="700">Spec: Offline sync</text><text x="44" y="74" font-size="10" fill="#6E7781">docs/sync.md · main</text><g font-size="12"><text x="44" y="104">Clients queue writes locally and</text><text x="44" y="122">replay them when a connection</text><text x="44" y="140">returns. Conflicts resolve by</text><text x="44" y="158">last-writer-wins per field.</text><text x="44" y="190" font-weight="700" font-size="13">Open questions</text><text x="44" y="212">1. How long do we keep the queue?</text><text x="44" y="230">2. Do deletes beat edits?</text></g></g><g stroke="#1971C2" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="M196 128 l6 -8 6 8"/><path d="M210 154 h122"/><path d="M254 208 h78"/></g><text x="190" y="114" font-family="Bradley Hand, Marker Felt, cursive" font-size="11" fill="#1971C2">always?</text><g font-family="-apple-system, Helvetica Neue, Arial" font-size="10.5"><g transform="translate(332 130)"><rect width="130" height="58" rx="6" fill="#fff" stroke="#FAB005" stroke-width="1.5"/><circle cx="14" cy="15" r="6" fill="#F59F00"/><text x="26" y="19" font-weight="700" fill="#1F2328">you</text><text x="10" y="36" fill="#444">LWW loses edits on</text><text x="10" y="50" fill="#444">lists — CRDT?</text></g><g transform="translate(332 200)"><rect width="130" height="74" rx="6" fill="#fff" stroke="#37B24D" stroke-width="1.5"/><circle cx="14" cy="15" r="6" fill="#7048E8"/><text x="26" y="19" font-weight="700" fill="#1F2328">agent</text><text x="10" y="36" fill="#444">30 days, matching</text><text x="10" y="50" fill="#444">the retention doc.</text><text x="10" y="66" fill="#37B24D" font-weight="700">✓ resolved</text></g></g><text x="332" y="48" font-family="Menlo, monospace" font-size="10" fill="#6E7781">2 threads</text><text x="332" y="64" font-family="Menlo, monospace" font-size="10" fill="#6E7781">stored inline in .md</text></svg>