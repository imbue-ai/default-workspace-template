<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Spec Workbench: a markdown document with margin comment threads">
  <rect width="240" height="160" rx="12" fill="#F4F2EC"/>

  <!-- Document page (left column) -->
  <rect x="14" y="16" width="132" height="128" rx="8" fill="#FFFFFF" stroke="#E7E5DF" stroke-width="1"/>

  <!-- App header with the notify-agent button -->
  <line x1="14" y1="31" x2="146" y2="31" stroke="#EDEBE4" stroke-width="1"/>
  <rect x="24" y="21" width="42" height="6" rx="3" fill="#52606D"/>
  <rect x="108" y="20" width="30" height="8" rx="4" fill="#2F6B8F"/>

  <!-- Prose lines -->
  <rect x="24" y="44" width="104" height="5" rx="2.5" fill="#D9D7D0"/>
  <rect x="24" y="54" width="92" height="5" rx="2.5" fill="#D9D7D0"/>

  <!-- Anchored phrase for the open thread (blue) -->
  <rect x="24" y="63" width="58" height="8" rx="2" fill="#DCE7EE"/>
  <rect x="24" y="72.5" width="58" height="1.6" rx="0.8" fill="#2F6B8F"/>
  <rect x="86" y="64" width="42" height="5" rx="2.5" fill="#D9D7D0"/>
  <circle cx="82" cy="67" r="2.4" fill="#2F6B8F"/>

  <rect x="24" y="82" width="100" height="5" rx="2.5" fill="#D9D7D0"/>
  <rect x="24" y="92" width="74" height="5" rx="2.5" fill="#D9D7D0"/>

  <!-- Anchored phrase for the answered thread (green) -->
  <rect x="24" y="104" width="46" height="8" rx="2" fill="#DCEEE4"/>
  <rect x="24" y="113.5" width="46" height="1.6" rx="0.8" fill="#3F8F6B"/>
  <rect x="74" y="105" width="50" height="5" rx="2.5" fill="#D9D7D0"/>
  <circle cx="70" cy="108" r="2.4" fill="#3F8F6B"/>

  <rect x="24" y="123" width="96" height="5" rx="2.5" fill="#D9D7D0"/>
  <rect x="24" y="133" width="62" height="5" rx="2.5" fill="#D9D7D0"/>

  <!-- Connectors from phrases to their margin threads -->
  <line x1="82" y1="67" x2="156" y2="56" stroke="#2F6B8F" stroke-width="1" opacity="0.45"/>
  <line x1="70" y1="108" x2="156" y2="112" stroke="#3F8F6B" stroke-width="1" opacity="0.45"/>

  <!-- Margin thread 1: an open comment (blue) -->
  <rect x="156" y="38" width="72" height="40" rx="6" fill="#FFFFFF" stroke="#E7E5DF" stroke-width="1"/>
  <rect x="156" y="38" width="3.5" height="40" rx="1.75" fill="#2F6B8F"/>
  <circle cx="168" cy="49" r="4" fill="#2F6B8F"/>
  <rect x="176" y="46.5" width="28" height="4" rx="2" fill="#9AA5B1"/>
  <circle cx="221" cy="48" r="3" fill="none" stroke="#2F6B8F" stroke-width="1.4"/>
  <rect x="164" y="60" width="56" height="4" rx="2" fill="#CBD8E0"/>
  <rect x="164" y="68" width="42" height="4" rx="2" fill="#CBD8E0"/>

  <!-- Margin thread 2: a thread with an agent reply (green) -->
  <rect x="156" y="90" width="72" height="50" rx="6" fill="#FFFFFF" stroke="#E7E5DF" stroke-width="1"/>
  <rect x="156" y="90" width="3.5" height="50" rx="1.75" fill="#3F8F6B"/>
  <circle cx="168" cy="101" r="4" fill="#B26B3F"/>
  <rect x="176" y="98.5" width="24" height="4" rx="2" fill="#9AA5B1"/>
  <rect x="164" y="110" width="54" height="3.6" rx="1.8" fill="#DDD9D1"/>
  <circle cx="168" cy="121" r="4" fill="#3F8F6B"/>
  <rect x="176" y="118.5" width="28" height="4" rx="2" fill="#9AA5B1"/>
  <rect x="164" y="130" width="50" height="3.6" rx="1.8" fill="#CFE4D8"/>
</svg>
