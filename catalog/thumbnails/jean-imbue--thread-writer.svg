<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Thread Writer">
  <!-- Bespoke thumbnail: a composer with voice/format tabs above a connected thread of post cards. Mock data only. -->
  <rect width="240" height="160" rx="12" fill="#f7f5f2"/>

  <!-- controls row: voice pill + format tabs (first tab active) -->
  <rect x="16" y="16" width="46" height="14" rx="7" fill="#fff" stroke="#e8e3db"/>
  <circle cx="24" cy="23" r="3" fill="#c15f3c"/>
  <rect x="31" y="20" width="24" height="6" rx="3" fill="#c9c1b5"/>

  <rect x="150" y="16" width="74" height="16" rx="8" fill="#fff" stroke="#e8e3db"/>
  <rect x="152" y="18" width="24" height="12" rx="6" fill="#c15f3c"/>
  <rect x="157" y="22" width="14" height="4" rx="2" fill="#fff"/>
  <rect x="182" y="22" width="16" height="4" rx="2" fill="#b4ac9f"/>
  <rect x="203" y="22" width="16" height="4" rx="2" fill="#b4ac9f"/>

  <!-- rail: avatars connected by a thread line -->
  <line x1="28" y1="52" x2="28" y2="128" stroke="#e4ded4" stroke-width="2"/>
  <circle cx="28" cy="56" r="10" fill="#c15f3c"/>
  <circle cx="28" cy="100" r="10" fill="#c15f3c"/>

  <!-- card 1 -->
  <rect x="46" y="44" width="178" height="44" rx="10" fill="#fff" stroke="#e8e3db"/>
  <rect x="56" y="52" width="40" height="6" rx="3" fill="#1b1a17"/>
  <rect x="100" y="52" width="26" height="6" rx="3" fill="#b4ac9f"/>
  <rect x="56" y="64" width="158" height="4" rx="2" fill="#d9d2c7"/>
  <rect x="56" y="72" width="132" height="4" rx="2" fill="#d9d2c7"/>
  <rect x="56" y="80" width="30" height="4" rx="2" fill="#c15f3c"/>

  <!-- card 2 -->
  <rect x="46" y="90" width="178" height="44" rx="10" fill="#fff" stroke="#e8e3db"/>
  <rect x="56" y="98" width="40" height="6" rx="3" fill="#1b1a17"/>
  <rect x="100" y="98" width="26" height="6" rx="3" fill="#b4ac9f"/>
  <rect x="56" y="110" width="158" height="4" rx="2" fill="#d9d2c7"/>
  <rect x="56" y="118" width="146" height="4" rx="2" fill="#d9d2c7"/>
  <rect x="56" y="126" width="52" height="4" rx="2" fill="#d9d2c7"/>

  <!-- publish pill -->
  <rect x="150" y="140" width="74" height="14" rx="7" fill="#c15f3c"/>
  <rect x="170" y="145" width="34" height="4" rx="2" fill="#fff"/>
</svg>
