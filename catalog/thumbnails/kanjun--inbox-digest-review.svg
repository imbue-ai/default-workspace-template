<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Inbox Digest &amp; Review">
  <!-- Bespoke thumbnail: a miniature inbox digest — email rows grouped under
       category headers, each row with a one-click action pill. Mock data only. -->
  <rect width="240" height="160" rx="12" fill="#fafaf7"/>
  <rect x="0" y="0" width="240" height="160" rx="12" fill="none" stroke="#e8e6e0" stroke-width="1"/>

  <!-- masthead -->
  <text x="16" y="26" font-family="-apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1c1b1a">Inbox digest</text>
  <text x="224" y="25" text-anchor="end" font-family="ui-monospace, monospace" font-size="8" fill="#918878">Mon 14 Jul</text>
  <line x1="16" y1="34" x2="224" y2="34" stroke="#e8e6e0" stroke-width="1"/>

  <!-- category: Reply needed (accent stripe = action-red) -->
  <rect x="16" y="44" width="3" height="11" fill="#b8431f"/>
  <text x="25" y="53" font-family="-apple-system, Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#1c1b1a">Reply needed</text>
  <text x="98" y="53" font-family="ui-monospace, monospace" font-size="8" fill="#918878">3</text>

  <!-- rows -->
  <g font-family="-apple-system, Segoe UI, sans-serif" font-size="9" fill="#1c1b1a">
    <rect x="16" y="59" width="208" height="15" rx="3" fill="#ffffff" stroke="#f0ede5" stroke-width="1"/>
    <text x="24" y="69">Dana Cole — quick question on the roadmap</text>
    <rect x="181" y="61.5" width="41" height="11" rx="5.5" fill="none" stroke="#2d4a3e" stroke-width="1"/>
    <text x="201.5" y="69.5" text-anchor="middle" font-size="7" fill="#2d4a3e">archive</text>

    <rect x="16" y="76" width="208" height="15" rx="3" fill="#ffffff" stroke="#f0ede5" stroke-width="1"/>
    <text x="24" y="86">Morgan Reyes — re: proposal follow-up</text>
    <rect x="181" y="78.5" width="41" height="11" rx="5.5" fill="none" stroke="#2d4a3e" stroke-width="1"/>
    <text x="201.5" y="86.5" text-anchor="middle" font-size="7" fill="#2d4a3e">archive</text>
  </g>

  <!-- category: Reading / newsletters (accent stripe = calm green) -->
  <rect x="16" y="100" width="3" height="11" fill="#2d4a3e"/>
  <text x="25" y="109" font-family="-apple-system, Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#1c1b1a">Reading</text>
  <text x="72" y="109" font-family="ui-monospace, monospace" font-size="8" fill="#918878">12</text>

  <g font-family="-apple-system, Segoe UI, sans-serif" font-size="9" fill="#5b554c">
    <rect x="16" y="115" width="208" height="15" rx="3" fill="#ffffff" stroke="#f0ede5" stroke-width="1"/>
    <text x="24" y="125">The Bulletin — this week in tech</text>
    <rect x="176" y="117.5" width="46" height="11" rx="5.5" fill="none" stroke="#8a6a2c" stroke-width="1"/>
    <text x="199" y="125.5" text-anchor="middle" font-size="7" fill="#8a6a2c">unsub</text>

    <rect x="16" y="132" width="208" height="15" rx="3" fill="#ffffff" stroke="#f0ede5" stroke-width="1"/>
    <text x="24" y="142">Deals — 50% off this week only</text>
    <rect x="176" y="134.5" width="46" height="11" rx="5.5" fill="none" stroke="#8a6a2c" stroke-width="1"/>
    <text x="199" y="142.5" text-anchor="middle" font-size="7" fill="#8a6a2c">mute</text>
  </g>
</svg>
