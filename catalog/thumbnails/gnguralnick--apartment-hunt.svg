<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Apartment Hunt: a map of ranked rental listings">
  <defs>
    <clipPath id="mapClip"><rect x="8" y="8" width="132" height="144" rx="8"/></clipPath>
  </defs>

  <!-- backdrop -->
  <rect width="240" height="160" fill="#f4f1ea"/>

  <!-- map panel -->
  <g clip-path="url(#mapClip)">
    <rect x="8" y="8" width="132" height="144" fill="#e8e4d8"/>
    <!-- water -->
    <path d="M8 8 L48 8 L30 40 L54 78 L34 120 L52 152 L8 152 Z" fill="#cfe0e2"/>
    <!-- park -->
    <rect x="70" y="96" width="52" height="26" rx="4" fill="#cfe0c4"/>
    <!-- streets -->
    <g stroke="#d8d3c4" stroke-width="3" fill="none">
      <path d="M18 30 H140"/>
      <path d="M14 62 H140"/>
      <path d="M20 96 H140"/>
      <path d="M26 128 H140"/>
      <path d="M52 12 V150"/>
      <path d="M86 12 V150"/>
      <path d="M116 12 V150"/>
    </g>
  </g>
  <rect x="8" y="8" width="132" height="144" rx="8" fill="none" stroke="#d8d3c4" stroke-width="1.5"/>

  <!-- rank pins: green (best) -> amber -> red -->
  <g font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
    <g transform="translate(64,52)">
      <path d="M0 12 C-8 2 -8 -6 0 -6 C8 -6 8 2 0 12 Z" fill="#2e9e6b"/>
      <circle cx="0" cy="-1" r="6.5" fill="#2e9e6b"/>
      <text x="0" y="2.5" fill="#ffffff">1</text>
    </g>
    <g transform="translate(104,74)">
      <path d="M0 12 C-8 2 -8 -6 0 -6 C8 -6 8 2 0 12 Z" fill="#e0a13a"/>
      <circle cx="0" cy="-1" r="6.5" fill="#e0a13a"/>
      <text x="0" y="2.5" fill="#ffffff">2</text>
    </g>
    <g transform="translate(48,112)">
      <path d="M0 12 C-8 2 -8 -6 0 -6 C8 -6 8 2 0 12 Z" fill="#d1685f"/>
      <circle cx="0" cy="-1" r="6.5" fill="#d1685f"/>
      <text x="0" y="2.5" fill="#ffffff">3</text>
    </g>
  </g>

  <!-- listing card -->
  <g transform="translate(150,26)">
    <rect x="0" y="0" width="82" height="108" rx="7" fill="#ffffff" stroke="#e3ded1" stroke-width="1.5"/>
    <!-- rank + score row -->
    <rect x="10" y="11" width="17" height="15" rx="3" fill="#eef1f6"/>
    <text x="18.5" y="21.5" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#3a4658" text-anchor="middle">#1</text>
    <rect x="31" y="11" width="24" height="15" rx="3" fill="#2e9e6b"/>
    <text x="43" y="21.5" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">8.7</text>
    <!-- address + meta lines -->
    <rect x="10" y="34" width="62" height="5" rx="2.5" fill="#c9c3b4"/>
    <rect x="10" y="44" width="44" height="4" rx="2" fill="#ddd8ca"/>
    <text x="10" y="63" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#2f3b2f">$3,500/mo</text>
    <text x="10" y="76" font-family="Inter, system-ui, sans-serif" font-size="7.5" fill="#8a8574">1 bd &#183; 1 ba &#183; 650 sqft</text>
    <!-- travel-time chip -->
    <rect x="10" y="84" width="62" height="13" rx="6.5" fill="#eef4f0"/>
    <circle cx="18" cy="90.5" r="2.5" fill="#2e9e6b"/>
    <text x="24" y="93.5" font-family="Inter, system-ui, sans-serif" font-size="7" fill="#4a7a63">9 min to work</text>
  </g>
</svg>
