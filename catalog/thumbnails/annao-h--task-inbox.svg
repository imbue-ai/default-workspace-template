<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Task Inbox board with task cards from Slack, Gmail, and Granola">
  <!-- Bespoke thumbnail: a stylized miniature of the Task Inbox board. Mock data only. -->
  <rect width="240" height="160" rx="12" fill="#0f172a"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="52" height="160" rx="12" fill="#1e293b"/>
  <rect x="44" y="0" width="8" height="160" fill="#1e293b"/>
  <circle cx="16" cy="20" r="6" fill="#38bdf8"/>
  <rect x="28" y="17" width="16" height="6" rx="3" fill="#475569"/>
  <rect x="10" y="42" width="34" height="8" rx="4" fill="#334155"/>
  <rect x="10" y="42" width="4" height="8" rx="2" fill="#38bdf8"/>
  <rect x="10" y="58" width="34" height="8" rx="4" fill="#28344a"/>
  <rect x="10" y="74" width="34" height="8" rx="4" fill="#28344a"/>
  <rect x="10" y="90" width="34" height="8" rx="4" fill="#28344a"/>
  <rect x="10" y="118" width="26" height="6" rx="3" fill="#28344a"/>

  <!-- Header -->
  <rect x="64" y="14" width="86" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="196" y="15" width="30" height="10" rx="5" fill="#334155"/>

  <!-- Task card 1 - critical (Slack) -->
  <rect x="64" y="34" width="162" height="30" rx="6" fill="#1e293b"/>
  <rect x="64" y="34" width="4" height="30" rx="2" fill="#f43f5e"/>
  <rect x="76" y="41" width="96" height="7" rx="3.5" fill="#cbd5e1"/>
  <rect x="76" y="53" width="34" height="6" rx="3" fill="#f43f5e" fill-opacity="0.85"/>
  <rect x="196" y="43" width="22" height="12" rx="3" fill="#611f69"/>
  <text x="207" y="52" font-family="sans-serif" font-size="8" font-weight="700" fill="#e9d5ff" text-anchor="middle">S</text>

  <!-- Task card 2 - high (Gmail) -->
  <rect x="64" y="70" width="162" height="30" rx="6" fill="#1e293b"/>
  <rect x="64" y="70" width="4" height="30" rx="2" fill="#f59e0b"/>
  <rect x="76" y="77" width="112" height="7" rx="3.5" fill="#cbd5e1"/>
  <rect x="76" y="89" width="30" height="6" rx="3" fill="#f59e0b" fill-opacity="0.85"/>
  <rect x="196" y="79" width="22" height="12" rx="3" fill="#7f1d1d"/>
  <text x="207" y="88" font-family="sans-serif" font-size="8" font-weight="700" fill="#fecaca" text-anchor="middle">G</text>

  <!-- Task card 3 - low (Granola) -->
  <rect x="64" y="106" width="162" height="30" rx="6" fill="#1e293b"/>
  <rect x="64" y="106" width="4" height="30" rx="2" fill="#22c55e"/>
  <rect x="76" y="113" width="80" height="7" rx="3.5" fill="#cbd5e1"/>
  <rect x="76" y="125" width="26" height="6" rx="3" fill="#22c55e" fill-opacity="0.8"/>
  <rect x="196" y="115" width="22" height="12" rx="3" fill="#065f46"/>
  <text x="207" y="124" font-family="sans-serif" font-size="8" font-weight="700" fill="#a7f3d0" text-anchor="middle">Gr</text>

  <!-- Footer label -->
  <text x="64" y="150" font-family="sans-serif" font-size="8" fill="#64748b">Task Inbox</text>
</svg>
