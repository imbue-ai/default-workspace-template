<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="GitHub repositories table view">
  <rect width="240" height="160" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="239" height="159" fill="none" stroke="#e1e4e8"/>

  <!-- table frame -->
  <rect x="20" y="24" width="200" height="112" rx="4" fill="#ffffff" stroke="#d0d7de"/>

  <!-- header row -->
  <rect x="20" y="24" width="200" height="22" rx="4" fill="#f6f8fa"/>
  <rect x="20" y="42" width="200" height="4" fill="#f6f8fa"/>
  <rect x="30" y="32" width="52" height="6" rx="3" fill="#57606a"/>
  <rect x="112" y="32" width="28" height="6" rx="3" fill="#57606a"/>
  <rect x="160" y="32" width="20" height="6" rx="3" fill="#57606a"/>
  <rect x="192" y="32" width="20" height="6" rx="3" fill="#57606a"/>

  <!-- column separators -->
  <line x1="102" y1="24" x2="102" y2="136" stroke="#eaeef2"/>
  <line x1="150" y1="24" x2="150" y2="136" stroke="#eaeef2"/>
  <line x1="184" y1="24" x2="184" y2="136" stroke="#eaeef2"/>

  <!-- row 1 (highlighted inspiration row) -->
  <rect x="20" y="46" width="200" height="22" fill="#ddf4ff"/>
  <circle cx="30" cy="57" r="3" fill="#1f883d"/>
  <rect x="38" y="54" width="52" height="6" rx="3" fill="#24292f"/>
  <rect x="112" y="54" width="30" height="6" rx="3" fill="#6e7781"/>
  <!-- star glyph -->
  <path d="M162 51.6 l1.7 3.5 3.9 0.5 -2.8 2.7 0.7 3.8 -3.5 -1.8 -3.5 1.8 0.7 -3.8 -2.8 -2.7 3.9 -0.5 z" fill="#eac54f" stroke="#d4a72c" stroke-width="0.6"/>
  <rect x="192" y="54" width="18" height="6" rx="3" fill="#6e7781"/>

  <!-- row 2 -->
  <rect x="38" y="76" width="46" height="6" rx="3" fill="#24292f"/>
  <rect x="112" y="76" width="26" height="6" rx="3" fill="#6e7781"/>
  <!-- lock glyph -->
  <rect x="160" y="76" width="8" height="6" rx="1.2" fill="#6e7781"/>
  <path d="M161.4 76 v-1.6 a2.6 2.6 0 0 1 5.2 0 V76" fill="none" stroke="#6e7781" stroke-width="1.2"/>
  <rect x="192" y="76" width="14" height="6" rx="3" fill="#6e7781"/>

  <!-- row 3 -->
  <rect x="38" y="98" width="54" height="6" rx="3" fill="#24292f"/>
  <rect x="112" y="98" width="22" height="6" rx="3" fill="#6e7781"/>
  <!-- fork glyph -->
  <g stroke="#6e7781" stroke-width="1.4" fill="none">
    <circle cx="161" cy="97.5" r="1.8"/>
    <circle cx="169" cy="97.5" r="1.8"/>
    <circle cx="165" cy="105" r="1.8"/>
    <path d="M161 99.3 v1 a2 2 0 0 0 2 2 h4 a2 2 0 0 0 2 -2 v-1"/>
    <path d="M165 100.3 v2.9"/>
  </g>
  <rect x="192" y="98" width="16" height="6" rx="3" fill="#6e7781"/>

  <!-- row 4 -->
  <rect x="38" y="120" width="40" height="6" rx="3" fill="#24292f"/>
  <rect x="112" y="120" width="28" height="6" rx="3" fill="#6e7781"/>
  <circle cx="164" cy="122.5" r="3" fill="#8250df"/>
  <rect x="192" y="120" width="12" height="6" rx="3" fill="#6e7781"/>
</svg>
