<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Daily Digest: a morning briefing of triageable email cards">
  <!-- Bespoke thumbnail for the Daily Digest template. Mock data only. -->
  <rect width="240" height="160" rx="12" fill="#F3EEE0"/>

  <!-- morning motif: a small sun in the top-right corner -->
  <g stroke="#EBB24A" stroke-width="2" stroke-linecap="round">
    <line x1="214" y1="8" x2="214" y2="3"/>
    <line x1="226" y1="12" x2="230" y2="8"/>
    <line x1="230" y1="24" x2="235" y2="24"/>
    <line x1="202" y1="12" x2="198" y2="8"/>
  </g>
  <circle cx="214" cy="24" r="9" fill="#F0B44A"/>

  <!-- header: title bar + a "to go" count pill -->
  <rect x="16" y="18" width="104" height="9" rx="4.5" fill="#2B2A26"/>
  <rect x="16" y="31" width="60" height="6" rx="3" fill="#CDC6B4"/>
  <rect x="150" y="16" width="40" height="16" rx="8" fill="#2F9E8F"/>
  <circle cx="160" cy="24" r="3" fill="#F3EEE0"/>
  <rect x="167" y="21" width="16" height="6" rx="3" fill="#F3EEE0"/>

  <!-- card 1: an ordinary email, already triaged (green check) -->
  <rect x="16" y="46" width="208" height="30" rx="7" fill="#FFFFFF" stroke="#E7E0CE"/>
  <circle cx="30" cy="61" r="6" fill="#2F9E8F"/>
  <rect x="44" y="54" width="118" height="6" rx="3" fill="#D6D0C0"/>
  <rect x="44" y="65" width="78" height="5" rx="2.5" fill="#E6E0D1"/>
  <circle cx="208" cy="61" r="8" fill="#2FA36B"/>
  <path d="M204.5 61 l2.4 2.4 l4.1 -4.6" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- card 2: a pull request, folded into one card (purple accent, CI-failing badge) -->
  <rect x="16" y="80" width="208" height="30" rx="7" fill="#FFFFFF" stroke="#E0D7C3"/>
  <rect x="16" y="80" width="5" height="30" rx="2.5" fill="#7E5BD0"/>
  <circle cx="34" cy="95" r="4.5" fill="#7E5BD0"/>
  <rect x="46" y="88" width="96" height="6" rx="3" fill="#D6D0C0"/>
  <rect x="46" y="99" width="66" height="5" rx="2.5" fill="#E6E0D1"/>
  <rect x="184" y="88" width="30" height="15" rx="7.5" fill="#FBE3E1" stroke="#E7A9A2"/>
  <circle cx="193" cy="95.5" r="3" fill="#E05252"/>
  <rect x="199" y="93" width="10" height="5" rx="2.5" fill="#D98B84"/>

  <!-- card 3: an article, saved for later (bookmark) -->
  <rect x="16" y="114" width="208" height="30" rx="7" fill="#FFFFFF" stroke="#E7E0CE"/>
  <circle cx="30" cy="129" r="6" fill="#E0A03A"/>
  <rect x="44" y="122" width="128" height="6" rx="3" fill="#D6D0C0"/>
  <rect x="44" y="133" width="88" height="5" rx="2.5" fill="#E6E0D1"/>
  <path d="M203 122 h10 v14 l-5 -4 l-5 4 z" fill="#6C63C4"/>
</svg>
