# Lists the Style Guide app at boot without starting it: registers its manifest and port, then exits. The
# app's own program (style-guide.conf) starts only when something asks for its page.
[program:style_guide_register]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user python3 system/scripts/forward_port.py --manifest system/apps/style_guide/app.toml --url http://localhost:8060
directory=/home/user/workspace
autostart=true
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/var/log/supervisor/style_guide_register-stdout.log
stderr_logfile=/var/log/supervisor/style_guide_register-stderr.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB
stdout_logfile_backups=1
stderr_logfile_backups=1
