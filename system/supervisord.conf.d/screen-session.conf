# The Screen's desktop session: XFCE (startxfce4 runs xfce4-session straight on
# the display, since DISPLAY is set) as the workspace user with the workspace home,
# so its settings ride the persistent volume. Logging out from XFCE's own menu
# ends this program, which the ``screen-watch`` listener treats as the group
# ending. One of the ``screen-stack`` group (see screen-xorg.conf).
[program:screen-session]
command=python3 system/services/oom_priority/bin/oom_tag_service.py screen-session startxfce4
directory=/home/user/workspace
environment=DISPLAY=":99",XDG_RUNTIME_DIR="/tmp/screen-runtime",PULSE_SERVER="unix:/tmp/screen-runtime/pulse.sock"
autostart=false
autorestart=false
startsecs=1
startretries=0
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/screen-session-stdout.log
stderr_logfile=/var/log/supervisor/screen-session-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
