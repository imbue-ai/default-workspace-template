# The Onboarding checklist app (system/apps/onboarding_checklist, run from the workspace venv like every
# Python app): the four onboarding items on one page, the done ones checked. It serves its page on 8070 and
# registers its manifest and port via forward_port.py before it starts, so the launcher lists it and the
# desktop's tour can open it from the first boot. Its band sits between Getting Started's and the Style
# Guide's: a shed costs one reload of a page that stores nothing.
[program:onboarding-checklist]
command=python3 system/services/oom_priority/bin/oom_tag_service.py onboarding-checklist bash -c "python3 system/scripts/forward_port.py --manifest system/apps/onboarding_checklist/app.toml --url http://localhost:8070 && exec .venv/bin/onboarding-checklist"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/onboarding-checklist-stdout.log
stderr_logfile=/var/log/supervisor/onboarding-checklist-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
