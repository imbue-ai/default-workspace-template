# The Usage app (system/apps/usage_dashboard, installed as the ``usage-dashboard`` uv tool by
# system/scripts/build_workspace.sh like every Python app with a manifest): the workspace's model usage, read
# from the usage collector. It serves its page on 8060 and registers its manifest and port via forward_port.py
# before it starts. Its band sits with the other small built-in pages: a shed costs one reload of a page that
# stores nothing.
[program:usage-dashboard]
command=python3 system/services/oom_priority/bin/oom_tag_service.py usage-dashboard bash -c "python3 system/scripts/forward_port.py --manifest system/apps/usage_dashboard/app.toml --url http://localhost:8060 && exec usage-dashboard"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/usage-dashboard-stdout.log
stderr_logfile=/var/log/supervisor/usage-dashboard-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
