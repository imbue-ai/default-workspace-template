# The cron daemon, in the foreground so supervisord owns it. Runs the
# /etc/cron.d/ entries: precise / sub-daily schedule lines, plus the
# every-minute job-checker lines (system/libs/automations/run_job.sh) that decide when
# recurring jobs like the Caretaker actually fire (at the due hour when the
# container is up, or the first minute it is back up after a missed window).
[program:cron]
command=/usr/sbin/cron -f
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/cron-stdout.log
stderr_logfile=/var/log/supervisor/cron-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
