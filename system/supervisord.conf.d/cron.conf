# The cron daemon, in the foreground so supervisord owns it. Runs the
# /etc/cron.d/ entries the bootstrap writes at every boot: the update-apply
# recovery guard, the routines tick (`routines tick` through
# system/libs/routines/with_agent_env.sh, once a minute), which starts every
# routine that is due (at its due moment when the container is up, or the
# first minute it is back up after a missed window; see system/libs/routines),
# and whatever `routines migrate-cron` left under data/.state/cron.d.
[program:cron]
command=/usr/sbin/cron -f
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/cron-stdout.log
stderr_logfile=/var/log/supervisor/cron-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
