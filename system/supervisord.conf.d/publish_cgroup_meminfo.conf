# Publishes the container's own memory headroom, read from its cgroup, into the
# file earlyoom reads with --host-meminfo (earlyoom.conf). Under runc the
# container's /proc/meminfo is the host kernel's, so without this earlyoom's
# thresholds would track the whole machine while the cgroup OOM killer acts at
# the workspace's cap. It removes the file while the container is uncapped and
# leaves it alone where it has no answer (no cgroup v2 memory controller, as on
# lima; a counter it cannot read), so earlyoom reads /proc/meminfo alone or
# keeps what the gen-2 slice VM publishes there. Under gVisor it has nothing to
# add (the VM publishes the file from outside), so it exits 0 at once:
# autorestart=unexpected with exitcodes=0 and startsecs=0 make that a clean
# end rather than a restart loop, while any other exit is still restarted. See
# system/services/oom_priority/src/oom_priority/cgroup_meminfo.py. No
# oom_tag_service.py prefix: it is part of the OOM machinery and stays PROTECTED
# (bands._NON_SERVICE_PROGRAM_BANDS), like earlyoom and the backstop listener.
[program:publish_cgroup_meminfo]
command=python3 system/services/oom_priority/bin/publish_cgroup_meminfo.py
directory=/home/user/workspace
autostart=true
autorestart=unexpected
startsecs=0
exitcodes=0
startretries=1000000
stdout_logfile=/var/log/supervisor/publish_cgroup_meminfo-stdout.log
stderr_logfile=/var/log/supervisor/publish_cgroup_meminfo-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
