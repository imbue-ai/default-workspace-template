# One-shot slow-phase environment convergence: re-runs every system/scripts/env.d/
# unit (idempotent, fast satisfied-checks, no markers -- currently Fortress +
# Chromium apt libs and the secret scanners) and installs anything present in
# the environment record (~/.mngr/plugin/env-converge/) but missing from this
# rootfs, at the pinned apt snapshot timestamp. autorestart=false +
# exitcodes=0,3 keep it one-shot per boot (3 = converged with some packages
# unavailable; see system/libs/env_converge). The fast phase (overlay symlinks) runs
# earlier, synchronously inside bootstrap, before supervisord starts.
[program:env-converge]
command=uv run env-converge run --phase slow
directory=/home/user/workspace
autostart=true
autorestart=false
startsecs=0
exitcodes=0,3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/env-converge-stdout.log
stderr_logfile=/var/log/supervisor/env-converge-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
