# The workspace's own setup of its backups (system/libs/workspace_backup_setup): it takes the
# destination a client names through the shell's backup routes, or the workspace's initial data
# names, makes the repository's password, initialises the repository, and installs
# data/.secrets/restic.env, which the host-backup service then runs on. A setup that fails is
# tried again by itself, and one this program was stopped in the middle of is taken up when it
# starts. It is a program of its own because the shell is restarted by an update and stopped by a
# restore, and host-backup is replaced by Imbue Studio backup-service updates.
[program:backup-setup]
command=python3 system/services/oom_priority/bin/oom_tag_service.py backup-setup .venv/bin/backup-setup
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/backup-setup-stdout.log
stderr_logfile=/var/log/supervisor/backup-setup-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
