# OOM-prevention daemon. Watches memory and, before the kernel resorts to its
# own arbitrary OOM kill, sheds the worst process (SIGTERM below 10% available
# memory, SIGKILL below 5%; same thresholds for swap). This is the imbue-ai
# fork of earlyoom (installed by system/scripts/install_earlyoom.sh), which
# ranks processes by the kernel's badness:
#   VmRSS + VmSwap + VmPTE + oom_score_adj * (MemTotal + SwapTotal) / 1000
# computed from each process's oom_score_adj. Upstream earlyoom reads
# /proc/*/oom_score instead, which gVisor serves as 0 for every process, so it
# ignored the bands there. One band point is worth MemTotal/1000 of memory, so
# the startup priority bands (see system/services/oom_priority) steer the
# choice, most-expendable first: the chat app's spare chat agents (started ahead
# of the next new chat, used by no one yet), then Chromium's own processes, then
# agent build/test subprocesses, then an abandoned chat, then worker agents, then a
# chat still in use, then user-created services, then the built-in services in
# their band order (system/services/oom_priority/src/oom_priority/bands.py). A
# large enough memory gap can still reorder adjacent bands, as it can for the
# kernel's own OOM killer. A chat sits on either side of the
# worker band depending on how long it has gone unengaged -- shedding an idle
# chat only costs a slower next message, while shedding a running worker
# destroys in-flight work (see system/services/oom_priority). --avoid
# shields the never-kill infrastructure that has a distinct process name (sshd,
# supervisord, earlyoom itself, tini, tmux) by 300 band points; these keep
# oom_score_adj 0 and are the last resort. share-gateway and ttyd are
# intentionally NOT in --avoid: they carry low service bands so they are shed
# only after everything above, but are not made strictly immortal (both
# auto-restart). -r 0 silences the periodic memory report (kills are still
# logged). -N records every kill to the shed ledger: earlyoom execs the -N
# target directly (not via a shell) and disables it at startup unless its first
# token is an absolute path to an *executable* file, so this points straight at
# the script (which carries a 0755 mode and a python3 shebang) rather than a
# "python3 <script>" command line. --host-meminfo also reads the memory
# headroom a gen-2 slice VM publishes into the workspace's volume: under gVisor
# the sandbox's own /proc/meminfo cannot see the memory the runtime itself is
# charged, so the 10% threshold could arrive only after the container's cgroup
# had killed the whole sandbox. Where no such file is published (local docker,
# lima, other providers) earlyoom logs that once and uses /proc/meminfo alone.
# See system/services/oom_priority/README.md.
[program:earlyoom]
command=/usr/local/bin/earlyoom -m 10,5 -s 10,5 -r 0 -N "/home/user/workspace/system/services/oom_priority/bin/earlyoom_record_shed.py" --avoid "^(sshd|supervisord|earlyoom|tini)$|^tmux" --host-meminfo /mngr-vol/.host-meminfo
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/earlyoom-stdout.log
stderr_logfile=/var/log/supervisor/earlyoom-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
