[program:ai-usage]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/workspace_bare_scripts/venv_links.py ensure-project system/apps/ai_usage && uv sync --locked --project system/apps/ai_usage && python3 system/scripts/forward_port.py --manifest system/apps/ai_usage/app.toml --url http://localhost:8080 && exec system/apps/ai_usage/.venv/bin/ai-usage"
directory=/home/user/workspace
autostart=true
autorestart=true
startsecs=30
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/ai-usage-stdout.log
stderr_logfile=/var/log/supervisor/ai-usage-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
