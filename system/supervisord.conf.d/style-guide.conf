# The Style Guide app (system/apps/style_guide, installed as the ``style-guide-app`` uv tool by
# system/scripts/build_workspace.sh like every Python app with a manifest): one page cataloguing the
# workspace's design system, on port 8060. It does not start at boot: style_guide_register.conf lists it
# then, and the shell holds its port and starts it on the first request (docs/system/specs/stop-when-no-windows.md,
# part B), stopping it again a minute after its last window closes. When it starts it registers its manifest
# and port again via forward_port.py. It is tagged into the user band: a reference page that stores nothing,
# the first thing worth shedding under memory pressure.
[program:style-guide]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/forward_port.py --manifest system/apps/style_guide/app.toml --url http://localhost:8060 && exec style-guide-app"
directory=/home/user/workspace
autostart=false
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/style-guide-stdout.log
stderr_logfile=/var/log/supervisor/style-guide-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
