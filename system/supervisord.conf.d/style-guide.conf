# The Style Guide app (system/apps/style_guide, installed as the ``style-guide-app`` uv tool by
# system/scripts/build_workspace.sh like every Python app with a manifest): one page cataloguing the
# workspace's design system. It serves its page on 8060 and registers its manifest and port via
# forward_port.py before it starts. It is tagged into the user band: a reference page that stores
# nothing, the first thing worth shedding under memory pressure.
[program:style-guide]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/forward_port.py --manifest system/apps/style_guide/app.toml --url http://localhost:8060 && exec style-guide-app"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/style-guide-stdout.log
stderr_logfile=/var/log/supervisor/style-guide-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
