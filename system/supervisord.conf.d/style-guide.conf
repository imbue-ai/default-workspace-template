# The Style Guide app (system/apps/style_guide, run from the workspace venv like every Python app): one
# page cataloguing the workspace's design system, on port 8060. It does not start at boot, so it is listed only once it has been
# started by hand (`supervisorctl start style-guide`), when it registers its manifest and port via
# forward_port.py; from then on the shell holds its port and starts it on the next request
# (docs/system/specs/stop-when-no-windows.md, part B). Its band sits right before System Monitor's: a reference page
# that stores nothing, among the first built-ins worth shedding under memory pressure.
[program:style-guide]
command=python3 system/services/oom_priority/bin/oom_tag_service.py style-guide bash -c "python3 system/scripts/forward_port.py --manifest system/apps/style_guide/app.toml --url http://localhost:8060 && exec .venv/bin/style-guide-app"
directory=/home/user/workspace
autostart=false
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/style-guide-stdout.log
stderr_logfile=/var/log/supervisor/style-guide-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
