# One-shot: register the VM-resident owner-exec ("vm-exec") service in apps.toml
# when this workspace runs on an imbue-cloud slice / VPS outer (probes the
# docker-bridge gateway; a no-op on local docker/lima). autorestart=false so it
# runs once per boot; the app watcher picks up the apps.toml row.
[program:vm-exec-register]
command=bash system/scripts/register_vm_exec.sh
directory=/home/user/workspace
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/var/log/supervisor/vm-exec-register-stdout.log
stderr_logfile=/var/log/supervisor/vm-exec-register-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
