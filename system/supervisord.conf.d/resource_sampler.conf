# Records the workspace's CPU and memory for the System Monitor app: one walk of /proc
# every 5 s into data/.state/system-monitor/ (the last 10 minutes, a day of minute
# averages, and the busy stretches with who caused them). It runs beside the memory
# guard so the graphs outlast the app, which the shell stops between windows. See
# system/services/oom_priority/bin/resource_sampler.py and
# docs/system/specs/system-monitor.md. Its band is its own, one past the app's, so it
# is the first built-in service shed: a shed costs a gap in the graphs until
# supervisord brings it back, and it holds almost no memory.
[program:resource_sampler]
command=python3 system/services/oom_priority/bin/oom_tag_service.py resource_sampler python3 system/services/oom_priority/bin/resource_sampler.py
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/resource_sampler-stdout.log
stderr_logfile=/var/log/supervisor/resource_sampler-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
