# Owner-authenticated in-workspace exec (run/read-file/write-file/grants). The
# hosted minds web client drives the workspace through this instead of SSH;
# every request is Ed25519-signed against ~/.ssh/authorized_keys. Registers its
# own service origin so both the local forward and the share gateway route to it.
#
# owner-exec (like every `uv run <name>` program here) must be a dependency of
# the ROOT project in pyproject.toml, not just a workspace member: a root-scoped
# `uv sync` (the backup restore flow runs one before `supervisorctl restart all`)
# prunes non-root-closure members from the venv, deleting the console script and
# turning the next `uv run owner-exec` into a spawn error.
[program:owner-exec]
command=python3 system/services/oom_priority/bin/oom_tag_service.py owner-exec uv run owner-exec
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/owner-exec-stdout.log
stderr_logfile=/var/log/supervisor/owner-exec-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
