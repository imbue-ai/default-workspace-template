# The Markdown Editor (system/apps/markdown_editor, run from the workspace venv like every Python app): one page that
# reads, comments on and suggests edits to markdown files, on port 8070. It registers its manifest and port via
# forward_port.py before it starts; the shell stops it once no window shows it and starts it on the next request
# (docs/system/specs/stop-when-no-windows.md). Its band sits with Files': a shed costs a reload, and every save is
# already on disk.
[program:markdown-editor]
command=python3 system/services/oom_priority/bin/oom_tag_service.py markdown-editor bash -c "python3 system/scripts/forward_port.py --manifest system/apps/markdown_editor/app.toml --url http://localhost:8070 && exec .venv/bin/markdown-editor-app"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/markdown-editor-stdout.log
stderr_logfile=/var/log/supervisor/markdown-editor-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
