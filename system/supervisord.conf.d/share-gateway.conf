# The self-hosted sharing stack (share-gateway): idles watching
# data/.secrets/share.env; while share materials are present it runs the
# in-workspace TLS terminator (caddy), the relay tunnel (frpc), and the
# grants-enforcing forward_auth gateway as managed children.
[program:share-gateway]
command=python3 system/services/oom_priority/bin/oom_tag_service.py share-gateway uv run share-gateway
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/share-gateway-stdout.log
stderr_logfile=/var/log/supervisor/share-gateway-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
