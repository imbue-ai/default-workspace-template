# The App Store app (system/apps/app_store, run from the workspace venv like every Python app): one-click installs of a curated
# catalog of open-source apps, the apps this workspace has, and the published templates. It serves its page on
# 8060 and registers its manifest and port via forward_port.py from inside its entry point. When it starts it
# re-creates the supervisord drop-ins of the apps it installed (they are gitignored), and it runs one install
# at a time in the background, so it keeps running with no window open. Its band sits with the other built-in
# pages: a shed costs a reload, and an install it was running is marked failed on the restart.
[program:app-store]
command=python3 system/services/oom_priority/bin/oom_tag_service.py app-store .venv/bin/app-store
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/app-store-stdout.log
stderr_logfile=/var/log/supervisor/app-store-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
