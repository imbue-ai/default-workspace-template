# The memories app (system/apps/memories, installed as the ``memories`` uv tool by
# system/scripts/build_workspace.sh like every Python app with a manifest): what the Claude chats
# have written down in data/memories/, and a way to correct or forget a note. It serves its one
# page on 8050 and registers its manifest and port via forward_port.py from inside its entry
# point. It declares stop_when_no_windows, so the shell stops it a minute after its last window
# closes. Its band is the most expendable built-in's: it holds nothing between requests.
[program:memories]
command=python3 system/services/oom_priority/bin/oom_tag_service.py memories memories-app
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/memories-stdout.log
stderr_logfile=/var/log/supervisor/memories-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
