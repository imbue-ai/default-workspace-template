# The terminal app (system/apps/terminal, installed as the ``terminal-app`` uv tool
# by system/scripts/build_workspace.sh like every Python app) serves the wrapper
# pages on 7681 (the terminal origin: ``/?session=<name>`` frames the pty origin,
# ``/new`` allocates a terminal) and registers its manifest and port via
# forward_port.py. ttyd itself is the sibling ``terminal-pty`` program.
[program:terminal]
command=python3 system/services/oom_priority/bin/oom_tag_service.py terminal terminal-app
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/terminal-stdout.log
stderr_logfile=/var/log/supervisor/terminal-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
