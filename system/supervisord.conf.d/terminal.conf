# Terminal-over-web (ttyd). The terminal app (system/apps/terminal, installed as
# the ``terminal-app`` uv tool by system/scripts/build_workspace.sh like every
# Python app) installs the ttyd dispatch scripts, serves the instances API on
# 7682, registers its manifest and port via forward_port.py, and runs ttyd on
# 7681 as its child.
[program:terminal]
command=python3 system/services/oom_priority/bin/oom_tag_service.py terminal terminal-app
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/terminal-stdout.log
stderr_logfile=/var/log/supervisor/terminal-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
