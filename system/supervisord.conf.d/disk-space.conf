[program:disk-space]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/workspace_bare_scripts/venv_links.py ensure-project system/apps/disk_space && uv sync --locked --project system/apps/disk_space && python3 system/scripts/forward_port.py --manifest system/apps/disk_space/app.toml --url http://localhost:8099 && exec system/apps/disk_space/.venv/bin/disk-space"
directory=/home/user/workspace
autostart=true
autorestart=true
startsecs=30
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/disk-space-stdout.log
stderr_logfile=/var/log/supervisor/disk-space-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
