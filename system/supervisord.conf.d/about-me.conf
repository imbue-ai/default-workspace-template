# The What Studio knows about me app (system/apps/about_me, run from the workspace venv like every Python app):
# what the opt-in web lookup remembered about the user, with a Delete per fact and "Forget all of this", on port
# 8070. It starts at boot so it is listed in the launcher, registering its manifest and port via forward_port.py;
# the shell then stops it once no window shows it and starts it again on the next request. Its band sits between
# Getting Started's and the Style Guide's: a page that keeps nothing in memory, so a shed costs one reload.
[program:about-me]
command=python3 system/services/oom_priority/bin/oom_tag_service.py about-me bash -c "python3 system/scripts/forward_port.py --manifest system/apps/about_me/app.toml --url http://localhost:8070 && exec .venv/bin/about-me-app"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/about-me-stdout.log
stderr_logfile=/var/log/supervisor/about-me-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
