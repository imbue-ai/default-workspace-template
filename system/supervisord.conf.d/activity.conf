# The Activity app (system/apps/activity, installed as the ``activity`` uv tool by
# system/scripts/build_workspace.sh like every Python app with a manifest): what is using the
# workspace's memory. It serves its one page on 8040 and registers its manifest and port
# via forward_port.py from inside its entry point. It declares stop_when_no_windows, so the shell
# stops it a minute after its last window closes and starts it on the next request. Starting
# also installs its memory recorder's cron entry (activity/cron_entry.py).
[program:activity]
command=python3 system/services/oom_priority/bin/oom_tag_service.py activity activity-app
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/activity-stdout.log
stderr_logfile=/var/log/supervisor/activity-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
