# The workspace's usage collector: follows every usage event file in the workspace
# (agents' mngr_usage files, and workspace_usage's under data/.apps/usage/events/ for
# apps and claude -p one-shots), indexes their model_call events in SQLite under
# data/.apps/usage/, and serves cost and token totals and a live stream of new calls
# on http://127.0.0.1:8795. Usage data never leaves the workspace.
[program:usage-collector]
command=python3 system/services/oom_priority/bin/oom_tag_service.py usage-collector bash -c "uv sync --all-packages --frozen && exec .venv/bin/usage-collector"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/usage-collector-stdout.log
stderr_logfile=/var/log/supervisor/usage-collector-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
