# The Routines app (system/apps/routines, installed as the ``routines-app`` uv tool by
# system/scripts/build_workspace.sh like every Python app with a manifest): everything that runs on a
# schedule, with its health and history. It serves its pages on 8050 and registers its manifest and port
# via forward_port.py before it starts. Its band sits with the other small built-in pages: a shed costs
# one reload of a page that stores nothing.
[program:routines]
command=python3 system/services/oom_priority/bin/oom_tag_service.py routines bash -c "python3 system/scripts/forward_port.py --manifest system/apps/routines/app.toml --url http://localhost:8050 && exec routines-app"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/routines-stdout.log
stderr_logfile=/var/log/supervisor/routines-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
