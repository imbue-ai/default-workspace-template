# The chat app: the agent harness UI, one page per chat, framed by the shell at the chat's
# own registered origin. Like every Python app it runs from its own uv tool environment
# (``chat-app`` on PATH, installed by system/scripts/build_workspace.sh with the mngr harness
# plugins system/config/mngr_plugins.toml assigns to ``chat``). It registers its manifest
# (system/apps/chat/app.toml) and port 8010 via forward_port.py from inside its entry point,
# runs ``mngr observe`` for the workspace's agents, and serves the instances API the shell
# reads at that port. Its band sits just above the shell's: a shed chat app costs every open
# chat its page until it restarts.
[program:chat]
command=python3 system/services/oom_priority/bin/oom_tag_service.py chat chat-app
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/chat-stdout.log
stderr_logfile=/var/log/supervisor/chat-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
