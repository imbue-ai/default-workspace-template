# The Screen service (system/apps/screen): the workspace's one streamed Linux
# desktop as a window, docs/system/specs/screen/spec.md. Like every Python app it
# runs from its own uv tool environment (``screen-service`` on PATH, installed by
# system/scripts/build_workspace.sh), registers its manifest and port 8090 via
# forward_port.py, and is what the shell parks and wakes. It starts the four
# programs of the ``screen-stack`` group (the drop-ins beside this one) on demand,
# renders their configuration under data/.state/screen/, proxies neko's HTTP and
# WebSocket under /neko/, and owns the control lease.
#
# Stop: the service alone gets SIGTERM (stopasgroup=false) so its shutdown handler
# can stop the group in order first; killasgroup stays on as the backstop.
[program:screen]
command=python3 system/services/oom_priority/bin/oom_tag_service.py screen bash -c "python3 system/scripts/forward_port.py --manifest system/apps/screen/app.toml --url http://localhost:8090 && exec screen-service"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=false
killasgroup=true
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/screen-stdout.log
stderr_logfile=/var/log/supervisor/screen-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

# The stack the service starts on demand and the watcher ends together: every
# member is autostart=false and autorestart=false, so nothing but the service
# brings one up and a member that dies stays down until the next start
# (docs/system/specs/screen/spec.md sections 9.1 to 9.3). Named apart from the
# ``screen`` program because a program outside every group forms a group of its
# own name, and two groups cannot share one.
[group:screen-stack]
programs=screen-xorg,screen-pulse,screen-session,screen-neko
