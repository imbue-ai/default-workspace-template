# The Memory app (system/apps/memory, run from the workspace venv like every Python app): the notes the agent
# remembers about the user, to view and edit, on port 8070. It registers its manifest and port via forward_port.py
# before it starts, so the chat's "Memory changed" cards can link each note to it; from then on the shell stops it
# once no window shows it and starts it on the next request (docs/system/specs/stop-when-no-windows.md, part B). Its
# band sits among the built-in pages: a shed costs one reload, since every edit is saved to the notes as it is made.
[program:memory]
command=python3 system/services/oom_priority/bin/oom_tag_service.py memory bash -c "python3 system/scripts/forward_port.py --manifest system/apps/memory/app.toml --url http://localhost:8070 && exec .venv/bin/memory-app"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/memory-stdout.log
stderr_logfile=/var/log/supervisor/memory-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
