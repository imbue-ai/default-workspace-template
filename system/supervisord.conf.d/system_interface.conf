# The workspace UI: the system interface the user's browser actually loads,
# proxied at its own origin for every other app. Registers its port via
# forward_port.py, then execs the app.
#
# This was the last program declared in system/supervisord.conf itself. It
# stayed there while the minds desktop client's recovery probe read that file
# with configparser, which does not follow supervisord's [include]; the probe
# now expands the config's own [include] globs, so the carve-out is gone and
# supervisord.conf holds only the daemon's own configuration.
[program:system_interface]
command=python3 system/services/oom_priority/bin/oom_tag_service.py system_interface bash -c "python3 system/scripts/forward_port.py --url http://localhost:8000 --name system_interface && system-interface"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/system_interface-stdout.log
stderr_logfile=/var/log/supervisor/system_interface-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

# NOTE: GitHub sync ([program:github-sync]) is opt-in and deliberately NOT
# shipped. The github-sync skill writes its own
# system/supervisord.conf.d/github-sync.conf (and sets up the private repo and
# git wiring) when the user asks for it. See system/libs/github_sync/README.md.
