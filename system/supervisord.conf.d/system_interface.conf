# The workspace UI: the system interface the user's browser actually loads,
# proxied at its own origin for every other app. listen_then_exec.py binds its
# port first, so a request routed to it waits for the app rather than being
# refused; forward_port.py then registers it and, with --announce, puts it on
# the services stream at once (the shell itself announces only once it has
# imported); then the app's entry point is exec'd from the workspace venv.
[program:system_interface]
# No feature flags here. Which harnesses a user can launch is decided by which providers
# they have signed in to (the chat app's provider chooser), not by the host. If a
# flag is ever added back, keep it a SINGLE environment= line: supervisord keeps only the
# last duplicate key, so stacked environment= lines silently drop everything but the last.
command=python3 system/services/oom_priority/bin/oom_tag_service.py system_interface python3 system/scripts/workspace_bare_scripts/listen_then_exec.py 127.0.0.1:8000 bash -c "python3 system/scripts/forward_port.py --manifest system/apps/system_interface/app.toml --url http://localhost:8000 --announce && exec .venv/bin/system-interface"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/system_interface-stdout.log
stderr_logfile=/var/log/supervisor/system_interface-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
