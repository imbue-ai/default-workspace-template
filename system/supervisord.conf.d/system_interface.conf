# The workspace UI: the system interface the user's browser actually loads,
# proxied at its own origin for every other app. Registers its port via
# forward_port.py, then execs the app.
#
# This was the last program declared in system/supervisord.conf itself. It
# stayed there because the minds desktop client's recovery probe reads that file
# with configparser to source the port from the --url flag below, and
# configparser does not follow supervisord's [include].
#
# RELEASE GATE, not yet satisfied at the time of writing: an include-blind probe
# finds no system_interface program here, so it reports no inner port, its
# port-listening and curl checks both degrade to UNKNOWN, and the workspace is
# misdiagnosed as unresponsive. imbue-ai/mngr-internal#171 makes the probe
# expand the config's own [include] globs. Provisioning is tag-pinned and
# update-self is ceilinged to the running app's template ref, so what binds is
# the release cut: this file must not ship in a minds-v<N> template tag until
# the mngr commit tagged minds-v<N> carries the include-aware probe.
# test_supervisord_layout.py asserts that against the vendored copy.
[program:system_interface]
command=python3 system/services/oom_priority/bin/oom_tag_service.py system_interface bash -c "python3 system/scripts/forward_port.py --url http://localhost:8000 --name system_interface && system-interface"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/system_interface-stdout.log
stderr_logfile=/var/log/supervisor/system_interface-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
