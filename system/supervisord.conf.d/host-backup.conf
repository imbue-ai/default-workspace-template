# Continuous restic-based backup of the full host_dir (/home/user/.mngr/) to a remote
# repository. data/.secrets/restic.env is injected by the minds app;
# data/system/backup.toml is optional user settings. This [program] block, the
# root pyproject registration, and the `uv run host-backup` entry point are a
# stable contract relied on by minds backup-service updates -- do not rename.
# See system/libs/host_backup/README.md.
[program:host-backup]
command=python3 system/scripts/oom_tag_service.py host-backup uv run host-backup
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/host-backup-stdout.log
stderr_logfile=/var/log/supervisor/host-backup-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
