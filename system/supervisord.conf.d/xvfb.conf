# Virtual display for the browser fleet. Chromium runs HEADFUL under this Xvfb
# server (see session.py's _HEADLESS) so it has a real X11 clipboard, which xclip
# reads/writes for native copy/paste (images included). Xvfb and xclip are baked
# into the image (setup_system.sh) -- a binary this static config execs at boot
# must exist in the image -- so this starts cleanly on first boot. The high
# startretries remain for rootfses built from pre-bake images, where the env.d
# browser unit still installs Xvfb minutes into first boot. The
# screen is sized to the browser's max render size (see _RENDER_MAX_* in session.py)
# so a maximized viewport never exceeds the display. Shed-safe: tiny (~40MB) and
# rarely an earlyoom target; if it does die, supervisord respawns it.
[program:xvfb]
command=python3 system/services/oom_priority/bin/oom_tag_service.py xvfb Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/xvfb-stdout.log
stderr_logfile=/var/log/supervisor/xvfb-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
