# The terminal's pty: ttyd on its own origin (port 7683), framed by the terminal app's
# wrapper page. The ``terminal-pty`` entry point of system/apps/terminal (the same uv tool
# as ``terminal-app``) installs the ttyd dispatch scripts and the patched web client,
# registers system/apps/terminal_pty/app.toml via forward_port.py, and execs ttyd.
[program:terminal-pty]
command=python3 system/services/oom_priority/bin/oom_tag_service.py terminal terminal-pty
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/terminal-pty-stdout.log
stderr_logfile=/var/log/supervisor/terminal-pty-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
