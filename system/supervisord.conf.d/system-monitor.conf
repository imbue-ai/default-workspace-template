# The System Monitor app (system/apps/system_monitor, installed as the ``system-monitor`` uv tool
# by system/scripts/build_workspace.sh like every Python app with a manifest): how much CPU,
# memory and disk the workspace is using, what is using them, what the memory guard stopped, and
# the state of the backups. It serves its one page (an overview and a view per resource) on 8040
# and registers its manifest and port via forward_port.py before it starts. Its band is the most
# expendable built-in service's but the resource sampler's: a shed costs one reload of a page
# that stores nothing (its graphs come from the sampler's files).
[program:system-monitor]
command=python3 system/services/oom_priority/bin/oom_tag_service.py system-monitor bash -c "python3 system/scripts/forward_port.py --manifest system/apps/system_monitor/app.toml --url http://localhost:8040 && exec system-monitor"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/system-monitor-stdout.log
stderr_logfile=/var/log/supervisor/system-monitor-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
