# The Memory & disk app (system/apps/system_monitor, installed as the ``system-monitor`` uv tool
# by system/scripts/build_workspace.sh like every Python app with a manifest): how much memory
# and disk the workspace is using, what holds the memory, and what the memory guard stopped. It
# serves its one page on 8040 and registers its manifest and port via forward_port.py before it
# starts. Its band is the most expendable built-in service's: a shed costs one reload of a page
# that stores nothing.
[program:system-monitor]
command=python3 system/services/oom_priority/bin/oom_tag_service.py system-monitor bash -c "python3 system/scripts/forward_port.py --manifest system/apps/system_monitor/app.toml --url http://localhost:8040 && exec system-monitor"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/system-monitor-stdout.log
stderr_logfile=/var/log/supervisor/system-monitor-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
