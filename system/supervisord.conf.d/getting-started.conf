# The Getting Started app (system/apps/getting_started, installed as the ``getting-started`` uv
# tool by system/scripts/build_workspace.sh like every Python app with a manifest): the ways
# into the workspace -- the "Start something" intents and the published template catalog --
# each starting a chat through the desktop's launcher. It serves its one page on 8030,
# registers its manifest and port via forward_port.py from inside its entry point, and opens
# its own window once per workspace for the first client to connect. Its band is the most
# expendable built-in service's: a shed costs one reload of a page holding nothing of the user's.
[program:getting-started]
command=python3 system/services/oom_priority/bin/oom_tag_service.py getting-started getting-started
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/getting-started-stdout.log
stderr_logfile=/var/log/supervisor/getting-started-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
