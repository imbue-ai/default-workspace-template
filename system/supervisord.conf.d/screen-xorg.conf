# The Screen's X server: Xorg with the dummy driver on display :99, reading the
# xorg.conf the Screen service renders at each stack start (the modes, the
# virtual size and the video RAM for the 1080p cap). Started by the service,
# never by supervisord's boot (autostart=false), and never restarted on its own
# (autorestart=false): the ``screen-watch`` listener ends the whole group when
# any member leaves RUNNING. Its band is the Screen service's.
[program:screen-xorg]
command=python3 system/services/oom_priority/bin/oom_tag_service.py screen-xorg Xorg :99 -config /home/user/workspace/data/.state/screen/xorg.conf -noreset -nolisten tcp -novtswitch -logfile /var/log/supervisor/screen-xorg.Xorg.log
directory=/home/user/workspace
environment=DISPLAY=":99",XDG_RUNTIME_DIR="/tmp/screen-runtime",PULSE_SERVER="unix:/tmp/screen-runtime/pulse.sock"
autostart=false
autorestart=false
startsecs=1
startretries=0
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/screen-xorg-stdout.log
stderr_logfile=/var/log/supervisor/screen-xorg-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
