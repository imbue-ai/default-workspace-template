# The file viewer: the ``files`` app of the desktop's launcher. The program line
# registers the manifest (system/apps/files/app.toml) and the dufs port 8300 via
# forward_port.py, then runs dufs (installed by system/scripts/install_dufs.sh)
# with the vendored frontend under system/apps/files/assets. dufs serves data/ --
# the workspace's user-facing file tree -- bound to loopback, with all operations
# enabled (browse, preview, upload, rename, delete): the workspace origin is
# what gates access, exactly as for every other registered app.
[program:files]
command=python3 system/services/oom_priority/bin/oom_tag_service.py files bash -c "python3 system/scripts/forward_port.py --manifest system/apps/files/app.toml --url http://localhost:8300 && exec dufs --allow-all --bind 127.0.0.1 --port 8300 --assets system/apps/files/assets data"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/files-stdout.log
stderr_logfile=/var/log/supervisor/files-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
