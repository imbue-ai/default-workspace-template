# The file viewer: the app behind the rail's File Viewer row. The files app
# (system/apps/files, installed as the ``files-app`` uv tool by
# system/scripts/build_workspace.sh like every Python app) serves the instances
# API on 8301, registers its manifest (system/apps/files/app.toml) and the dufs
# port 8300 via forward_port.py, and runs dufs (installed by
# system/scripts/install_dufs.sh) as its child. dufs serves data/ -- the
# workspace's user-facing file tree -- bound to loopback, with all operations
# enabled (browse, preview, upload, rename, delete): the workspace origin is
# what gates access, exactly as for every other registered app.
[program:files]
command=python3 system/services/oom_priority/bin/oom_tag_service.py files files-app
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/files-stdout.log
stderr_logfile=/var/log/supervisor/files-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
