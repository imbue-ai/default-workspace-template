# Files: the ``files`` app of the desktop's launcher, run by its own entry point
# (``files-app``, system/apps/files). It starts dufs (installed by
# system/scripts/install_dufs.sh) on loopback port 8301 with the Files frontend,
# built into system/apps/files/static, as its assets; serves the Files server in
# front of it on port 8300 (the shares from the user's computers, read through
# the latchkey gateway); and registers the manifest. dufs serves the container's
# filesystem root, with all operations enabled: the workspace origin is what
# gates access, exactly as for every other registered app.
[program:files]
command=python3 system/services/oom_priority/bin/oom_tag_service.py files files-app
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/files-stdout.log
stderr_logfile=/var/log/supervisor/files-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
