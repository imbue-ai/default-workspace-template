# Eval worker (one-shot): drives the multi-turn conversation, snapshots the workspace home
# tree (/home/user) to S3 per turn via restic, and uploads the transcript at the end -- so a
# launched run self-completes and results live in S3 (no need to keep the launching machine
# on). Stops the host-backup service for this sandbox so restic only fires on the turns it
# chooses. No-op when system/scripts/test_case_metadata.json is absent (normal workspaces are
# unaffected).
[program:eval-responder]
command=uv run python system/scripts/eval_responder.py
directory=/home/user/workspace
autostart=true
autorestart=false
startsecs=0
exitcodes=0
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/eval-responder-stdout.log
stderr_logfile=/var/log/supervisor/eval-responder-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
