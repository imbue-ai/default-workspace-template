# The Screen's group watcher (docs/system/specs/screen/spec.md section 9.3), the
# shape of oom-tag-backstop: on PROCESS_STATE_EXITED or PROCESS_STATE_FATAL of
# any ``screen-stack`` member it stops the other members, appends a
# ``screen_stopped`` event to data/.state/screen/events/screen/events.jsonl, and
# tells the Screen service over loopback, which broadcasts ``stopped`` to every
# viewer. The ``screen-watch`` console script is the Screen package's
# (system/apps/screen). stdout carries the event-listener protocol, so only
# stderr is logged.
[eventlistener:screen-watch]
command=python3 system/services/oom_priority/bin/oom_tag_service.py screen-watch .venv/bin/screen-watch
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
buffer_size=100
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stderr_logfile=/var/log/supervisor/screen-watch-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
