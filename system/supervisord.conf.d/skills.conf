# The Skills app (system/apps/skills, installed as the ``skills-app`` uv tool by
# system/scripts/build_workspace.sh like every Python app with a manifest): every skill this
# workspace's agents have and where each came from. Its band sits with the other small built-in
# pages: a shed costs one reload of a page that stores nothing.
[program:skills]
command=python3 system/services/oom_priority/bin/oom_tag_service.py skills bash -c "python3 system/scripts/forward_port.py --manifest system/apps/skills/app.toml --url http://localhost:8060 && exec skills-app"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/skills-stdout.log
stderr_logfile=/var/log/supervisor/skills-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
