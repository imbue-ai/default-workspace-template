# Live-browser web service: a headful Chromium (under the Xvfb display the
# sibling xvfb.conf declares) streamed via CDP screencast with CDP input + a
# browser-use agent, registered as the ``browser`` service (served on its own
# origin). DISPLAY=:99 points Chromium (and xclip, for clipboard) at Xvfb.
#
# OOM: shared browsers are the most expendable thing in the workspace, but *this
# program* is only the coordinator -- the daemon that launches and drives
# Chromium, not Chromium itself. So it is tagged like any other service (the most
# expendable one, `browser` in SERVICE_BANDS) and deliberately does NOT sit in the
# shared-browser band. Shedding the coordinator frees almost nothing: it holds
# little memory, Chromium survives its death, and supervisord restarts it straight
# back into the same session -- so a coordinator ranked above the renderers would
# be picked first every time while releasing none of the memory that matters.
#
# The Chromium processes reach the top band on their own: Chromium overwrites its
# inherited oom_score_adj with its own gradation, and the daemon's sweep remaps
# that into [910, 1000] (see system/services/oom_priority and browser.oom_retag),
# putting the memory-heavy renderers at the ceiling where a shed costs one tab and
# still outranks every agent subprocess.
[program:browser]
command=python3 system/services/oom_priority/bin/oom_tag_service.py browser bash -c "python3 system/scripts/forward_port.py --url http://localhost:8081 --name browser && exec nice -n -5 uv run browser-service"
directory=/home/user/workspace
environment=DISPLAY=":99"
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/browser-stdout.log
stderr_logfile=/var/log/supervisor/browser-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
