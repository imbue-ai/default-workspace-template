# The workspace's agent observer: one 'mngr observe' per host dir (it holds the
# single-writer lock for its whole run), writing the agent lifecycle event file
# every chat instance follows (the live chat and any preview chat alike). It runs
# from the primary agent's work dir so it reads the same project-local
# .mngr/settings.toml the chat's own mngr calls do; a work dir that is unset or
# gone falls back to the directory below, since running the observer against this
# tree's config beats not running one at all -- a failed cd would take the && with
# it and leave supervisord respawning a command that never observes anything.
# Restarted on exit like every service; a chat that boots before it, or outlives a
# restart of it, reports the outage on its /api/health and resumes on the
# observer's next snapshot.
[program:agent-observer]
command=python3 system/services/oom_priority/bin/oom_tag_service.py agent-observer bash -c "cd \"$MNGR_AGENT_WORK_DIR\" 2>/dev/null || echo 'agent-observer: MNGR_AGENT_WORK_DIR names no directory; observing from the workspace root instead' >&2; exec mngr observe --quiet"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/agent-observer-stdout.log
stderr_logfile=/var/log/supervisor/agent-observer-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
