# neko (m1k1o/neko v3), the WebRTC streamer of the Screen, serving its HTTP and
# WebSocket on loopback 8091 (reached only through the Screen service's /neko/
# proxy) and its ICE muxes on 59000/udp and 59000/tcp (the workspace's published
# ports), from the neko.yaml the service renders at each stack start with that
# start's passwords and API token. The binary is the pinned release the env.d
# unit system/scripts/env.d/2000-screen.sh installs. One of the ``screen-stack``
# group (see screen-xorg.conf).
[program:screen-neko]
command=python3 system/services/oom_priority/bin/oom_tag_service.py screen-neko /opt/neko/bin/neko serve --config /home/user/workspace/data/.state/screen/neko.yaml
directory=/home/user/workspace
environment=DISPLAY=":99",XDG_RUNTIME_DIR="/tmp/screen-runtime",PULSE_SERVER="unix:/tmp/screen-runtime/pulse.sock"
autostart=false
autorestart=false
startsecs=1
startretries=0
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/screen-neko-stdout.log
stderr_logfile=/var/log/supervisor/screen-neko-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
