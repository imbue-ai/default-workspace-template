# The Screen's PulseAudio, with the null sink neko captures (audio_output.monitor)
# loaded from the script the Screen service renders, listening on the socket the
# other members reach through PULSE_SERVER. One of the ``screen-stack`` group:
# started by the service, ended with the group (see screen-xorg.conf).
[program:screen-pulse]
command=python3 system/services/oom_priority/bin/oom_tag_service.py screen-pulse pulseaudio --daemonize=no --exit-idle-time=-1 --disallow-exit --disallow-module-loading -nF /home/user/workspace/data/.state/screen/pulse.pa
directory=/home/user/workspace
environment=DISPLAY=":99",XDG_RUNTIME_DIR="/tmp/screen-runtime",PULSE_SERVER="unix:/tmp/screen-runtime/pulse.sock"
autostart=false
autorestart=false
startsecs=1
startretries=0
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/screen-pulse-stdout.log
stderr_logfile=/var/log/supervisor/screen-pulse-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
