# The Studio Discord app (system/apps/studio_discord): joins people to the Imbue Studio Discord and lets them
# read its Studio channels inside Studio. Vendored from its own repo (boweiliu/studio-discord) as a git subtree,
# installed as the ``studio-discord`` uv tool by system/scripts/build_workspace.sh like every Python app with a
# manifest. The workspace registers its window from its manifest here, on the program line; the app itself only
# talks to the workspace over HTTP (system/apps/studio_discord/docs/studio-contract.md). Tagged as a user app,
# the first shed under memory pressure: it holds nothing that a reload does not restore.
[program:studio-discord]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/forward_port.py --manifest system/apps/studio_discord/app.toml --url http://localhost:8086 && exec studio-discord"
directory=/home/user/workspace
environment=STUDIO_DISCORD_PORT="8086"
autostart=true
autorestart=true
startsecs=30
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/studio-discord-stdout.log
stderr_logfile=/var/log/supervisor/studio-discord-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
