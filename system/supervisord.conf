# supervisord configuration for default-workspace-template background services.
#
# `uv run bootstrap` runs first-boot setup and then execs `supervisord -n -c
# system/supervisord.conf` from the repo root (/home/user/workspace) in the bootstrap tmux
# window. supervisord then starts and supervises every [program:*] below.
#
# Conventions:
#   - Services inherit the agent environment (MNGR_AGENT_STATE_DIR,
#     CLAUDE_CONFIG_DIR, MNGR_HOST_DIR, MNGR_AGENT_ID, LATCHKEY_*, ...) from
#     the bootstrap shell that exec'd supervisord -- there is no per-service
#     `environment=` enumeration.
#   - All commands run from the repo root (directory=/home/user/workspace).
#   - Commands that chain with `&&` (or set inline env) are wrapped in
#     `bash -c "..."` because supervisord exec's the command directly (no shell).
#   - Logs are container-local under /var/log/supervisor (created by bootstrap),
#     rotated by supervisord, with separate stdout/stderr files per service.
#     They are deliberately NOT under data/ -- they are not backed up.
#
# To add/remove/change a service, edit this file and run
# `supervisorctl reread && supervisorctl update` (see the edit-services skill).

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
# We intentionally run as root (the agent container/VM has no separate service
# user); set user=root so supervisord doesn't emit a CRIT about not dropping privs.
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

# Default knobs shared by every [program:*] section below. supervisord has no
# global program defaults, so each program restates these.
#   autostart=true              start on supervisord boot
#   autorestart=true            restart a long-lived daemon whenever it exits
#   startretries=...            cap crash-loop retries per supervisord run
#   stopasgroup/killasgroup     signal the whole bash -c process group on stop
#   stdout/stderr_logfile       separate, rotated, container-local log files

[program:system_interface]
command=python3 system/scripts/oom_tag_service.py system_interface bash -c "python3 system/scripts/forward_port.py --url http://localhost:8000 --name system_interface && system-interface"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/system_interface-stdout.log
stderr_logfile=/var/log/supervisor/system_interface-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

[program:cloudflared]
command=python3 system/scripts/oom_tag_service.py cloudflared uv run cloudflare-tunnel
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/cloudflared-stdout.log
stderr_logfile=/var/log/supervisor/cloudflared-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

[program:app-watcher]
command=python3 system/scripts/oom_tag_service.py app-watcher uv run app-watcher
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/app-watcher-stdout.log
stderr_logfile=/var/log/supervisor/app-watcher-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

# NOTE: GitHub sync ([program:github-sync]) is opt-in and deliberately NOT in
# this default config. The github-sync skill appends its program block (and
# sets up the private repo and git wiring) when the user
# asks for it. See system/libs/github_sync/README.md.

# Continuous restic-based backup of the full host_dir (/home/user/.mngr/) to a remote
# repository. data/.secrets/restic.env is injected by the minds app;
# data/system/backup.toml is optional user settings. This [program] block, the
# root pyproject registration, and the `uv run host-backup` entry point are a
# stable contract relied on by minds backup-service updates -- do not rename.
# See system/libs/host_backup/README.md.
[program:host-backup]
command=python3 system/scripts/oom_tag_service.py host-backup uv run host-backup
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/host-backup-stdout.log
stderr_logfile=/var/log/supervisor/host-backup-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

# Terminal-over-web (ttyd). Registers its port via forward_port.py, then execs
# ttyd. Previously an extra_window; now a supervised service like the rest.
[program:terminal]
command=python3 system/scripts/oom_tag_service.py terminal bash system/scripts/run_ttyd.sh
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/terminal-stdout.log
stderr_logfile=/var/log/supervisor/terminal-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

# OOM-prevention daemon. Watches memory and, before the kernel resorts to its
# own arbitrary OOM kill, sheds the worst process (SIGTERM below 10% available
# memory, SIGKILL below 5%; same thresholds for swap). It reads
# /proc/*/oom_score to choose -- which already reflects each process's
# oom_score_adj -- so the startup priority bands (see system/libs/oom_priority) steer
# its choice, most-expendable first: shared browsers, then agent build/test
# subprocesses, then worker agents, then user agents, then user-created
# services, then the built-in services in strict order (web, app-watcher,
# host-backup, github-sync, cloudflared, system_interface, terminal). --avoid
# shields the never-kill infrastructure that has a distinct process name (sshd,
# supervisord, earlyoom itself, tini, tmux); these keep oom_score_adj 0 and are
# the last resort. cloudflared and ttyd are intentionally NOT in --avoid: they
# carry low service bands so they are shed only after everything above, but are
# not made strictly immortal (both auto-restart). -r 0 silences the periodic
# memory report (kills are still logged). -N records every kill to the shed
# ledger: earlyoom v1.7 execs the -N target directly (not via a shell) and
# disables it at startup unless its first token is an absolute path to an
# *executable* file, so this points straight at the script (which carries a 0755
# mode and a python3 shebang) rather than a "python3 <script>" command line. See
# system/libs/oom_priority/README.md.
[program:earlyoom]
command=earlyoom -m 10,5 -s 10,5 -r 0 -N "/home/user/workspace/system/scripts/earlyoom_record_shed.py" --avoid "^(sshd|supervisord|earlyoom|tini)$|^tmux"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/earlyoom-stdout.log
stderr_logfile=/var/log/supervisor/earlyoom-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

# Backstop for the OOM band tagging (see system/libs/oom_priority/README.md). On every
# PROCESS_STATE_RUNNING event -- boot and each restart -- it raises the program's
# process (and any children already spawned) up to its expected band, so a
# service whose command omits the oom_tag_service.py prefix lands in the
# user-service band instead of keeping the fully-protected inherited default of
# 0. Raise-only: it never lowers a value, so self-tagged processes (browser) and
# the PROTECTED programs (earlyoom, this listener) are untouched. stdout carries
# the event-listener protocol, so only stderr is logged. buffer_size comfortably
# exceeds the number of programs so a boot-time burst of RUNNING events (queued
# while this listener itself is still starting) can never overflow and drop one.
[eventlistener:oom-tag-backstop]
command=python3 system/scripts/oom_tag_backstop.py
events=PROCESS_STATE_RUNNING
buffer_size=100
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stderr_logfile=/var/log/supervisor/oom-tag-backstop-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

# One-shot slow-phase environment convergence: re-runs every system/scripts/env.d/
# unit (idempotent, fast satisfied-checks, no markers -- currently Fortress +
# Chromium apt libs and the secret scanners) and installs anything present in
# the environment record (~/.mngr/plugin/env-converge/) but missing from this
# rootfs, at the pinned apt snapshot timestamp. autorestart=false +
# exitcodes=0,3 keep it one-shot per boot (3 = converged with some packages
# unavailable; see system/libs/env_converge). The fast phase (overlay symlinks) runs
# earlier, synchronously inside bootstrap, before supervisord starts.
[program:env-converge]
command=uv run env-converge run --phase slow
directory=/home/user/workspace
autostart=true
autorestart=false
startsecs=0
exitcodes=0,3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/env-converge-stdout.log
stderr_logfile=/var/log/supervisor/env-converge-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

# General-purpose virtual display for the workspace (:99). The browser FLEET no
# longer uses this -- each fleet browser spawns its OWN Xvfb (see browser.display),
# so browsers never share an X11 clipboard. This :99 remains for ad-hoc headful
# Playwright / other X tools an agent may run directly (see CLAUDE.md's "Browser is
# available as a tool"). Xvfb + xclip install via env-converge (minutes on first
# boot), so this retries until the binary exists. Shed-safe: tiny (~40MB); if it dies,
# supervisord respawns it.
[program:xvfb]
command=python3 system/scripts/oom_tag_service.py xvfb Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/xvfb-stdout.log
stderr_logfile=/var/log/supervisor/xvfb-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

# Live-browser web service at /service/browser/: each browser is a headful Chromium
# under its OWN per-browser Xvfb (browser.display), the human view is a striped
# H.264/JPEG capture of that display (browser.capture) streamed over WebSocket +
# WebCodecs, and human input is injected at the display level via XTest. BROWSER_HEADLESS=0
# selects this headful, per-browser-display mode (the code defaults to headless for
# tests / bare boxes); a browser-use agent drives over CDP as before.
#
# OOM: shared browsers are the most expendable thing in the workspace, so this is
# the one service that opts OUT of the protected band. It raises its own
# oom_score_adj to 1000 (the ceiling -- SHARED_BROWSER in system/libs/oom_priority, one
# above the agent-subprocess band of 900; the oom-tag-backstop listener re-asserts
# it if this inline write failed), and Chromium inherits oom_score_adj across
# fork/exec, so
# every browser the daemon spawns lands at 1000 too. earlyoom picks the highest
# /proc/*/oom_score (= memory badness 0-1000 + oom_score_adj), so a browser always
# outranks even an agent's build/test subprocess and is shed first. Raising one's
# own oom_score_adj is unprivileged; `|| true` keeps a write failure from wedging
# startup (the service just comes up unprotected). The slim daemon parent shares
# the 1000 but holds the least memory, so it's the last of the group earlyoom would
# pick -- and a shed Chromium is dropped from the fleet manifest, so a daemon
# respawn restores nothing.
# PulseAudio system daemon: gives the browser fleet a sound server so each browser can
# play into its OWN null sink (browser.audio) that we capture and stream. Runs in --system
# mode (the only mode that runs as root, which we are in-container) with anonymous socket
# auth so the browser service, its ffmpeg captures, and Chromium can all connect, and with
# module loading allowed so the service can create a per-browser null sink via pactl. The
# pulseaudio binary is apt-installed by env-converge, so this retries (autorestart)
# until the package lands, like the browser service with its own deferred libs. Best-effort
# for the fleet: if it never comes up, browsers simply have no audio.
[program:pulseaudio]
command=bash -c "mkdir -p /var/run/pulse && exec pulseaudio --system --disallow-exit --disallow-module-loading=false --exit-idle-time=-1 --log-target=stderr -n -L 'module-native-protocol-unix auth-anonymous=1 socket=/var/run/pulse/native' -L 'module-null-sink sink_name=dummy'"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/pulseaudio-stdout.log
stderr_logfile=/var/log/supervisor/pulseaudio-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:browser]
command=bash -c "echo 1000 > /proc/self/oom_score_adj || true && ROOT_PATH=/service/browser python3 system/scripts/forward_port.py --url http://localhost:8081 --name browser && uv run browser-service"
directory=/home/user/workspace
environment=BROWSER_HEADLESS="0",PULSE_SERVER="unix:/var/run/pulse/native"
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/browser-stdout.log
stderr_logfile=/var/log/supervisor/browser-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
