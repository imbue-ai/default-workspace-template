# supervisord configuration for default-workspace-template background services.
#
# `uv run bootstrap` runs first-boot setup and then execs `supervisord -n -c
# system/supervisord.conf` from the repo root (/home/user/workspace) in the bootstrap tmux
# window. supervisord then starts and supervises every [program:*] below.
#
# Conventions:
#   - Services inherit the agent environment (MNGR_AGENT_STATE_DIR,
#     MNGR_HOST_DIR, MNGR_AGENT_ID, LATCHKEY_*, ...) from
#     the bootstrap shell that exec'd supervisord -- there is no per-service
#     `environment=` enumeration. (CLAUDE_CONFIG_DIR is deliberately absent:
#     every claude in the workspace uses claude's own default ~/.claude.)
#   - All commands run from the repo root (directory=/home/user/workspace).
#   - Commands that chain with `&&` (or set inline env) are wrapped in
#     `bash -c "..."` because supervisord exec's the command directly (no shell).
#   - Logs are container-local under /var/log/supervisor (created by bootstrap),
#     rotated by supervisord, with separate stdout/stderr files per service.
#     They are deliberately NOT under data/ -- they are not backed up.
#
# To add/remove/change a service, edit this file and run
# `supervisorctl reread && supervisorctl update` (see the update-app skill).

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
# We intentionally run as root (the agent container/VM has no separate service
# user); set user=root so supervisord doesn't emit a CRIT about not dropping privs.
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

# Default knobs shared by every [program:*] section below. supervisord has no
# global program defaults, so each program restates these.
#   autostart=true              start on supervisord boot
#   autorestart=true            restart a long-lived daemon whenever it exits
#   startretries=...            cap crash-loop retries per supervisord run
#   stopasgroup/killasgroup     signal the whole bash -c process group on stop
#   stdout/stderr_logfile       separate, rotated, container-local log files

[program:system_interface]
# Feature flags are OFF by default. To enable one, add a SINGLE environment= line here
# setting it to "1" (server.py reads it, the frontend gets it as a meta tag), or run
# system/scripts/flip_feature_flags.sh. Keep it a SINGLE environment= line: supervisord
# keeps only the last duplicate key, so stacked environment= lines silently drop flags.
#   FEATURE_FLAG_ENABLE_OTHER_HARNESSES
#       the "New Codex agent" / "New Pi agent" launchers
#   FEATURE_FLAG_ENABLE_INTRODUCTORY_AGENTS_IN_OTHER_HARNESSES
#       the "New introductory <harness> chat" launchers (the `first` create template:
#       fast launch where supported, /welcome, the first=true label)
command=python3 system/services/oom_priority/bin/oom_tag_service.py system_interface bash -c "python3 system/scripts/forward_port.py --url http://localhost:8000 --name system_interface --no-icon && system-interface"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/system_interface-stdout.log
stderr_logfile=/var/log/supervisor/system_interface-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

# The self-hosted sharing stack (share-gateway): idles watching
# data/.secrets/share.env; while share materials are present it runs the
# in-workspace TLS terminator (caddy), the relay tunnel (frpc), and the
# grants-enforcing forward_auth gateway as managed children.
[program:share-gateway]
command=python3 system/services/oom_priority/bin/oom_tag_service.py share-gateway uv run share-gateway
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/share-gateway-stdout.log
stderr_logfile=/var/log/supervisor/share-gateway-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

[program:app-watcher]
command=python3 system/services/oom_priority/bin/oom_tag_service.py app-watcher uv run app-watcher
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/app-watcher-stdout.log
stderr_logfile=/var/log/supervisor/app-watcher-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

# Owner-authenticated in-workspace exec (run/read-file/write-file/grants). The
# hosted minds web client drives the workspace through this instead of SSH;
# every request is signed per the RFC 9421/9530 strict profile against
# ~/.ssh/authorized_keys, and every response is signed with the container's SSH
# host key. This is the pinned Go binary from imbue-ai/owner-exec (installed at
# /usr/local/bin/owner-exec), run in its "inner" role; the launcher writes the
# config and registers the service origin so the forward and share gateway route
# to it.
[program:owner-exec]
command=python3 system/services/oom_priority/bin/oom_tag_service.py owner-exec bash system/scripts/run_owner_exec.sh
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/owner-exec-stdout.log
stderr_logfile=/var/log/supervisor/owner-exec-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

# One-shot: register the VM-resident owner-exec ("vm-exec") service in apps.toml
# when this workspace runs on an imbue-cloud slice / VPS outer (probes the
# docker-bridge gateway; a no-op on local docker/lima). autorestart=false so it
# runs once per boot; the app watcher picks up the apps.toml row.
[program:vm-exec-register]
command=bash system/scripts/register_vm_exec.sh
directory=/home/user/workspace
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/var/log/supervisor/vm-exec-register-stdout.log
stderr_logfile=/var/log/supervisor/vm-exec-register-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

# The cron daemon, in the foreground so supervisord owns it. Runs the
# /etc/cron.d/ entries: precise / sub-daily schedule lines, plus the
# every-minute job-checker lines (system/libs/automations/run_job.sh) that decide when
# recurring jobs like the Caretaker actually fire (at the due hour when the
# container is up, or the first minute it is back up after a missed window).
[program:cron]
command=/usr/sbin/cron -f
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/cron-stdout.log
stderr_logfile=/var/log/supervisor/cron-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

# NOTE: GitHub sync ([program:github-sync]) is opt-in and deliberately NOT in
# this default config. The github-sync skill appends its program block (and
# sets up the private repo and git wiring) when the user
# asks for it. See system/libs/github_sync/README.md.

# Continuous restic-based backup of the full host_dir (/home/user/.mngr/) to a remote
# repository. data/.secrets/restic.env is injected by the minds app;
# data/system/backup.toml is optional user settings. This [program] block, the
# root pyproject registration, and the `uv run host-backup` entry point are a
# stable contract relied on by minds backup-service updates -- do not rename.
# See system/services/host_backup/README.md.
[program:host-backup]
command=python3 system/services/oom_priority/bin/oom_tag_service.py host-backup uv run host-backup
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/host-backup-stdout.log
stderr_logfile=/var/log/supervisor/host-backup-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

# Terminal-over-web (ttyd). Registers its port via forward_port.py, then execs
# ttyd. Previously an extra_window; now a supervised service like the rest.
[program:terminal]
command=python3 system/services/oom_priority/bin/oom_tag_service.py terminal bash system/apps/terminal/run_ttyd.sh
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/terminal-stdout.log
stderr_logfile=/var/log/supervisor/terminal-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

# The file viewer (dufs, installed by system/scripts/install_dufs.sh): the app
# behind the rail's File Viewer row. Serves data/ -- the workspace's
# user-facing file tree -- bound to loopback, with all operations enabled
# (browse, preview, upload, rename, delete): the workspace origin is what
# gates access, exactly as for every other registered app.
[program:files]
command=python3 system/services/oom_priority/bin/oom_tag_service.py files bash -c "python3 system/scripts/forward_port.py --url http://localhost:8300 --name files --icon-file system/apps/files/icon.svg --program files && exec dufs --allow-all --bind 127.0.0.1 --port 8300 --assets system/apps/files/assets data"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/files-stdout.log
stderr_logfile=/var/log/supervisor/files-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

# OOM-prevention daemon. Watches memory and, before the kernel resorts to its
# own arbitrary OOM kill, sheds the worst process (SIGTERM below 10% available
# memory, SIGKILL below 5%; same thresholds for swap). It reads
# /proc/*/oom_score to choose -- which already reflects each process's
# oom_score_adj -- so the startup priority bands (see system/services/oom_priority) steer
# its choice, most-expendable first: Chromium's own processes, then agent
# build/test subprocesses, then an abandoned chat, then worker agents, then a
# chat still in use, then user-created services, then the built-in services in
# strict order (files, browser, xvfb, app-watcher, cron, host-backup,
# github-sync, share-gateway, system_interface, terminal, owner-exec). A chat
# sits on either side of the worker band depending on how long it has gone
# unengaged -- shedding an idle chat only costs a slower next message, while
# shedding a running worker destroys in-flight work (see
# system/services/oom_priority). --avoid
# shields the never-kill infrastructure that has a distinct process name (sshd,
# supervisord, earlyoom itself, tini, tmux); these keep oom_score_adj 0 and are
# the last resort. share-gateway and ttyd are intentionally NOT in --avoid: they
# carry low service bands so they are shed only after everything above, but are
# not made strictly immortal (both auto-restart). -r 0 silences the periodic
# memory report (kills are still logged). -N records every kill to the shed
# ledger: earlyoom v1.7 execs the -N target directly (not via a shell) and
# disables it at startup unless its first token is an absolute path to an
# *executable* file, so this points straight at the script (which carries a 0755
# mode and a python3 shebang) rather than a "python3 <script>" command line. See
# system/services/oom_priority/README.md.
[program:earlyoom]
command=earlyoom -m 10,5 -s 10,5 -r 0 -N "/home/user/workspace/system/services/oom_priority/bin/earlyoom_record_shed.py" --avoid "^(sshd|supervisord|earlyoom|tini)$|^tmux"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/earlyoom-stdout.log
stderr_logfile=/var/log/supervisor/earlyoom-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

# Backstop for the OOM band tagging (see system/services/oom_priority/README.md). On every
# PROCESS_STATE_RUNNING event -- boot and each restart -- it raises the program's
# process (and any children already spawned) up to its expected band, so a
# service whose command omits the oom_tag_service.py prefix lands in the
# user-service band instead of keeping the fully-protected inherited default of
# 0. Raise-only: it never lowers a value, so a process already tagged higher (a
# Chromium process the browser service's sweep remapped into the shared-browser
# band) and the PROTECTED programs (earlyoom, this listener, and the one-shots
# env-converge and eval-worker) are untouched. stdout carries
# the event-listener protocol, so only stderr is logged. buffer_size comfortably
# exceeds the number of programs so a boot-time burst of RUNNING events (queued
# while this listener itself is still starting) can never overflow and drop one.
[eventlistener:oom-tag-backstop]
command=python3 system/services/oom_priority/bin/oom_tag_backstop.py
events=PROCESS_STATE_RUNNING
buffer_size=100
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stderr_logfile=/var/log/supervisor/oom-tag-backstop-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

# One-shot slow-phase environment convergence: re-runs every system/scripts/env.d/
# unit (idempotent, fast satisfied-checks, no markers -- currently Fortress +
# Chromium apt libs and the secret scanners) and installs anything present in
# the environment record (~/.mngr/plugin/env-converge/) but missing from this
# rootfs, at the pinned apt snapshot timestamp. autorestart=false +
# exitcodes=0,3 keep it one-shot per boot (3 = converged with some packages
# unavailable; see system/services/env_converge). The fast phase (overlay symlinks) runs
# earlier, synchronously inside bootstrap, before supervisord starts.
[program:env-converge]
command=uv run env-converge run --phase slow
directory=/home/user/workspace
autostart=true
autorestart=false
startsecs=0
exitcodes=0,3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/env-converge-stdout.log
stderr_logfile=/var/log/supervisor/env-converge-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

# Virtual display for the browser fleet. Chromium runs HEADFUL under this Xvfb
# server (see session.py's _HEADLESS) so it has a real X11 clipboard, which xclip
# reads/writes for native copy/paste (images included). Xvfb and xclip are baked
# into the image (setup_system.sh) -- a binary this static config execs at boot
# must exist in the image -- so this starts cleanly on first boot. The high
# startretries remain for rootfses built from pre-bake images, where the env.d
# browser unit still installs Xvfb minutes into first boot. The
# screen is sized to the browser's max render size (see _RENDER_MAX_* in session.py)
# so a maximized viewport never exceeds the display. Shed-safe: tiny (~40MB) and
# rarely an earlyoom target; if it does die, supervisord respawns it.
[program:xvfb]
command=python3 system/services/oom_priority/bin/oom_tag_service.py xvfb Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/xvfb-stdout.log
stderr_logfile=/var/log/supervisor/xvfb-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

# Live-browser web service: a headful Chromium (under the Xvfb display above)
# streamed via CDP screencast with CDP input + a browser-use agent, registered
# as the ``browser`` service (served on its own origin). DISPLAY=:99 points
# Chromium (and xclip, for clipboard) at Xvfb.
#
# OOM: shared browsers are the most expendable thing in the workspace, but *this
# program* is only the coordinator -- the daemon that launches and drives
# Chromium, not Chromium itself. So it is tagged like any other service (the most
# expendable one, `browser` in SERVICE_BANDS) and deliberately does NOT sit in the
# shared-browser band. Shedding the coordinator frees almost nothing: it holds
# little memory, Chromium survives its death, and supervisord restarts it straight
# back into the same session -- so a coordinator ranked above the renderers would
# be picked first every time while releasing none of the memory that matters.
#
# The Chromium processes reach the top band on their own: Chromium overwrites its
# inherited oom_score_adj with its own gradation, and the daemon's sweep remaps
# that into [910, 1000] (see system/services/oom_priority and browser.oom_retag),
# putting the memory-heavy renderers at the ceiling where a shed costs one tab and
# still outranks every agent subprocess.
[program:browser]
command=python3 system/services/oom_priority/bin/oom_tag_service.py browser bash -c "python3 system/scripts/forward_port.py --url http://localhost:8081 --name browser --no-icon --program browser && exec nice -n -5 uv run browser-service"
directory=/home/user/workspace
environment=DISPLAY=":99"
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/browser-stdout.log
stderr_logfile=/var/log/supervisor/browser-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

# Eval worker (one-shot): drives the multi-turn conversation, snapshots the workspace home
# tree (/home/user) to S3 per turn via restic, and uploads the transcript at the end -- so a
# launched run self-completes and results live in S3 (no need to keep the launching machine
# on). No-op when system/services/eval_worker/test_case_metadata.json is absent (normal
# workspaces are unaffected). See system/services/eval_worker/README.md.
[program:eval-worker]
command=uv run eval-worker
directory=/home/user/workspace
autostart=true
autorestart=false
startsecs=0
exitcodes=0
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/eval-worker-stdout.log
stderr_logfile=/var/log/supervisor/eval-worker-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

[program:versioning]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/forward_port.py --url http://localhost:8082 --name versioning --program versioning --internal --icon-file system/apps/versioning/src/versioning/assets/history-icon.svg && uv run versioning"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/versioning-stdout.log
stderr_logfile=/var/log/supervisor/versioning-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
