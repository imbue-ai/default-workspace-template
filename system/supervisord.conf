# supervisord configuration for default-workspace-template background services.
#
# `uv run bootstrap` runs first-boot setup and then execs `supervisord -n -c
# system/supervisord.conf` from the repo root (/home/user/workspace) in the bootstrap tmux
# window. supervisord then starts and supervises every [program:*] defined here
# and in system/supervisord.conf.d/ (see the [include] section below).
#
# Conventions:
#   - Services inherit the agent environment (MNGR_AGENT_STATE_DIR,
#     CLAUDE_CONFIG_DIR, MNGR_HOST_DIR, MNGR_AGENT_ID, LATCHKEY_*, ...) from
#     the bootstrap shell that exec'd supervisord -- there is no per-service
#     `environment=` enumeration.
#   - All commands run from the repo root (directory=/home/user/workspace).
#   - Commands that chain with `&&` (or set inline env) are wrapped in
#     `bash -c "..."` because supervisord exec's the command directly (no shell).
#   - Logs are container-local under /var/log/supervisor (created by bootstrap),
#     rotated by supervisord, with separate stdout/stderr files per service.
#     They are deliberately NOT under data/ -- they are not backed up.
#
# To add/remove/change a service, add/edit/delete its own file under
# system/supervisord.conf.d/ and run `supervisorctl reread && supervisorctl
# update` (see the update-service skill). One file per service means two agents
# adding services concurrently never touch the same file.

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
# We intentionally run as root (the agent container/VM has no separate service
# user); set user=root so supervisord doesn't emit a CRIT about not dropping privs.
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

# Per-service program files, one per service, named <service-name>.conf. The
# glob is relative to this file's directory, so it resolves to
# system/supervisord.conf.d/*.conf.
#
# Splitting these out does not change startup: supervisord orders programs by
# (priority, name) -- ProcessGroupConfig.__lt__ falls back to the name when
# priorities tie, and every program here uses the default 999 -- so start order
# is alphabetical no matter which file a program is declared in. Set an explicit
# `priority=` if a service ever genuinely needs to start before another.
[include]
files = supervisord.conf.d/*.conf

# Default knobs shared by every [program:*] section, here and in
# supervisord.conf.d/. supervisord has no global program defaults, so each
# program restates these.
#   autostart=true              start on supervisord boot
#   autorestart=true            restart a long-lived daemon whenever it exits
#   startretries=...            cap crash-loop retries per supervisord run
#   stopasgroup/killasgroup     signal the whole bash -c process group on stop
#   stdout/stderr_logfile       separate, rotated, container-local log files

# The workspace UI. This one program stays in the main config rather than
# moving to supervisord.conf.d/ because the minds desktop client's recovery
# probe reads THIS FILE directly with configparser and pulls the inner port out
# of the command's `--url` flag. configparser does not follow supervisord's
# [include] directive, so moving this block would silently break the probe's
# port-listening and curl checks (they would report "could not parse inner port"
# instead of a real yes/no). See recovery_probe_script.txt in the mngr repo.
[program:system_interface]
command=python3 system/scripts/oom_tag_service.py system_interface bash -c "python3 system/scripts/forward_port.py --url http://localhost:8000 --name system_interface && system-interface"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/system_interface-stdout.log
stderr_logfile=/var/log/supervisor/system_interface-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

# NOTE: GitHub sync ([program:github-sync]) is opt-in and deliberately NOT
# shipped. The github-sync skill writes its own
# system/supervisord.conf.d/github-sync.conf (and sets up the private repo and
# git wiring) when the user asks for it. See system/libs/github_sync/README.md.
