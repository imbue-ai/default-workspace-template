[project]
name = "files-app"
version = "0.1.0"
description = "Files: the workspace's file browser, served in front of dufs, with the folders shared from the user's computers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "app-manifest",
    "click>=8.1",
    "flask>=3.0",
    "httpx>=0.27",
    "imbue-common",
    "loguru>=0.7",
    "pydantic>=2.0",
    "werkzeug>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-timeout>=2.3.0",
    "inline-snapshot>=0.13",
    "ruff~=0.12.8",
]

[project.scripts]
files-app = "files_app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/files_app"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP006", "UP007"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = true
case-sensitive = true
order-by-type = false
known-first-party = ["files_app", "imbue", "app_manifest"]
