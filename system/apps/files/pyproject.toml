[project]
name = "files-app"
version = "0.1.0"
description = "Files: the workspace's file browser, with the folders shared from the user's computers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "app-manifest",
    "app-schema",
    "click>=8.1",
    "flask>=3.0",
    "httpx>=0.27",
    "imbue-common",
    # The latchkey gateway's environment and header names, which the relay client builds its requests from.
    "latchkey-access",
    "loguru>=0.7",
    "pydantic>=2.0",
    "werkzeug>=3.0",
    # Serves the workspace's themes from this app's own origin (docs/system/blueprint/workspace-themes/).
    "workspace-themes",
    # Parses the request identity header the keybindings read resolves for.
    "workspace-layout",
    # Resolves account-keyed settings (keybindings) for a request identity.
    "workspace-profile",
]

[dependency-groups]
dev = [
    "app-schema[testing]",
    "pytest>=9.0",
    "pytest-timeout>=2.3.0",
    "inline-snapshot>=0.13",
    "ruff~=0.12.8",
]

[project.scripts]
files-app = "files_app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/files_app"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP006", "UP007"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = true
case-sensitive = true
order-by-type = false
known-first-party = ["files_app", "imbue", "app_manifest", "app_schema"]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward
# (out of this repo entirely when it is checked out nested inside another).
[tool.ty]
