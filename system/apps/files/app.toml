name = "files"
display_name = "File Viewer"
icon = "icon.svg"
instances = true
# The instances API port; dufs serves the file viewer pages on 8300.
instances_url = "http://127.0.0.1:8301"
critical = false
priority = "files"
launcher_rank = 20

[default_shortcut]
action = "new"
launch = "new"
mode = "focus"

[[launch_paths]]
id = "new"
label = "New File Viewer"
path = "/"
params = [{name = "path", label = "Path", required = false}]

[[actions]]
id = "new"
label = "New File Viewer"
params = [{name = "path", label = "Path", required = false}]
