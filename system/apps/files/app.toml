name = "files"
display_name = "Files"
description = "The workspace's file browser: the files here and on the person's connected computers, to open, upload and share."
api_schema_path = "/__files/api/schema"
icon = "icon.svg"
critical = false
# Files holds nothing between windows: the shell stops it once none shows it.
stop_when_no_windows = true
priority = "files"
launcher_rank = 20

[default_shortcut]
launch = "new"
mode = "new"

[[launch_paths]]
id = "new"
label = "Files"
path = "/home/user/workspace/"
params = [{name = "path", label = "Path", required = false}]

# The keystrokes a person may re-bind in the Keyboard shortcuts dialog (the user-profile-state spec in the mngr
# repository, section 10; the keyboard-shortcuts spec there, section 5, for the defaults). `meta` is the Command key
# on a Mac and the Control key elsewhere, so each default is written once: Finder's, which is also Explorer's once
# Command reads as Control. Open keeps Command-Down beside Enter as the pair of Command-Up, and Delete keeps
# Command-Backspace because a Mac laptop has no Delete key; New folder leaves Shift-Command-N to the browsers, which
# keep it for a private window. The selection-movement arrows and the type-ahead jump are navigation primitives
# rather than actions, so they stay fixed.
[[keybindings]]
id = "select-all"
label = "Select everything"
default_chords = ["meta+a"]

[[keybindings]]
id = "go-up"
label = "Go up a folder"
default_chords = ["meta+arrowup"]

[[keybindings]]
id = "back"
label = "Back"
default_chords = ["meta+["]

[[keybindings]]
id = "forward"
label = "Forward"
default_chords = ["meta+]"]

[[keybindings]]
id = "new-folder"
label = "New folder"
default_chords = ["shift+meta+f"]

[[keybindings]]
id = "open"
label = "Open the selected entry"
default_chords = ["enter", "meta+arrowdown"]

[[keybindings]]
id = "rename"
label = "Rename the selected entry"
default_chords = ["f2"]

[[keybindings]]
id = "delete"
label = "Delete the selection"
default_chords = ["delete", "meta+backspace"]

[[keybindings]]
id = "clear-selection"
label = "Clear the selection"
default_chords = ["escape"]

[[keybindings]]
id = "save-file"
label = "Save the open file"
default_chords = ["meta+s"]

# Files' page is built from the shared components and wears the workspace's theme itself.
[theming]
mode = "tokens"

# A link to a file or folder (a chat's absolute-path link) opens on its view page in a Files window: a file's own
# page, or for a folder the folder itself, which Files reads ``?view`` on a folder as. A window already at the file or
# folder, however it got there (moving through Files leaves it at ``/a/b/``), is raised instead.
[[message_handlers]]
type = "open:file"
show = "{path}?view"
showing = ["{path}", "{path}/", "{path}/?view"]
