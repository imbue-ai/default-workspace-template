name = "files"
display_name = "Files"
icon = "icon.svg"
critical = false
# Files holds nothing between windows: the shell stops it once none shows it.
stop_when_no_windows = true
priority = "files"
launcher_rank = 20

[default_shortcut]
launch = "new"
mode = "new"

[[launch_paths]]
id = "new"
label = "Files"
path = "/home/user/workspace/"
params = [{name = "path", label = "Path", required = false}]

# A link to a file or folder (a chat's absolute-path link) opens on its view page in a Files window: a file's own
# page, or for a folder the folder itself, which Files reads ``?view`` on a folder as. A window already at the file or
# folder, however it got there (moving through Files leaves it at ``/a/b/``), is raised instead.
[[message_handlers]]
type = "open:file"
show = "{path}?view"
showing = ["{path}", "{path}/", "{path}/?view"]
