name = "files"
display_name = "File Viewer"
icon = "icon.svg"
critical = false
priority = "files"
launcher_rank = 20

[default_shortcut]
launch = "new"
mode = "new"

[[launch_paths]]
id = "new"
label = "New File Viewer"
path = "/"
params = [{name = "path", label = "Path", required = false}]

# A preview is read-only, rooted at its isolated workspace.
[preview]
command = ["dufs", "--bind", "{host}", "--port", "{port:main}", "--allow-search", "--assets", "system/apps/files/assets", "."]
health_path = "/"
open_path = "/"
