name = "files"
display_name = "Files"
description = "The workspace's file browser: the files here and on the person's connected computers, to open, upload and share."
api_schema_path = "/__files/api/schema"
icon = "icon.svg"
critical = false
# Files holds nothing between windows: the shell stops it once none shows it.
stop_when_no_windows = true
priority = "files"
launcher_rank = 20

[default_shortcut]
launch = "new"
mode = "new"

[[launch_paths]]
id = "new"
label = "Files"
path = "/home/user/workspace/"
params = [{name = "path", label = "Path", required = false}]

# The keystrokes a person may re-bind in the Keyboard shortcuts dialog (the user-profile-state spec in the mngr
# repository, section 10). The Cmd/Ctrl pairs declare both so either platform's habit works out of the box. The
# selection-movement arrows and the type-ahead jump are navigation primitives rather than actions, so they stay fixed.
[[keybindings]]
id = "select-all"
label = "Select everything"
default_chords = ["ctrl+a", "meta+a"]

[[keybindings]]
id = "go-up"
label = "Go up a folder"
default_chords = ["ctrl+arrowup", "meta+arrowup", "alt+arrowup"]

[[keybindings]]
id = "back"
label = "Back"
default_chords = ["ctrl+[", "meta+[", "alt+arrowleft"]

[[keybindings]]
id = "forward"
label = "Forward"
default_chords = ["ctrl+]", "meta+]", "alt+arrowright"]

[[keybindings]]
id = "new-folder"
label = "New folder"
default_chords = ["ctrl+shift+n", "shift+meta+n"]

[[keybindings]]
id = "open"
label = "Open the selected entry"
default_chords = ["enter", "ctrl+arrowdown", "meta+arrowdown", "ctrl+o", "meta+o"]

[[keybindings]]
id = "rename"
label = "Rename the selected entry"
default_chords = ["f2"]

[[keybindings]]
id = "delete"
label = "Delete the selection"
default_chords = ["delete", "ctrl+backspace", "meta+backspace"]

[[keybindings]]
id = "clear-selection"
label = "Clear the selection"
default_chords = ["escape"]

[[keybindings]]
id = "save-file"
label = "Save the open file"
default_chords = ["ctrl+s", "meta+s"]

# Files' page is built from the shared components and wears the workspace's theme itself.
[theming]
mode = "tokens"

# A link to a file or folder (a chat's absolute-path link) opens on its view page in a Files window: a file's own
# page, or for a folder the folder itself, which Files reads ``?view`` on a folder as. A window already at the file or
# folder, however it got there (moving through Files leaves it at ``/a/b/``), is raised instead.
[[message_handlers]]
type = "open:file"
show = "{path}?view"
showing = ["{path}", "{path}/", "{path}/?view"]
