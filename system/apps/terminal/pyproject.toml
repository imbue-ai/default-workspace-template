[project]
name = "terminal-app"
version = "0.1.0"
description = "The terminal app: the wrapper pages over the workspace's tmux sessions (terminal-app), and ttyd on its own origin (terminal-pty)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "app-manifest",
    "click>=8.1",
    "flask>=3.0",
    "imbue-common",
    "loguru>=0.7",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    # The process test polls the app coming up through mngr's poller.
    "imbue-mngr",
    "httpx>=0.27",
]

[project.scripts]
terminal-app = "terminal_app.main:main"
terminal-pty = "terminal_app.pty_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terminal_app"]
