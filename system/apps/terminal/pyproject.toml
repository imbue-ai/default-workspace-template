[project]
name = "terminal-app"
version = "0.1.0"
description = "The terminal app: runs ttyd, serves the instances API over the workspace's tmux sessions, and reports session switches and renames to the shell"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "app-instances",
    "app-manifest",
    "click>=8.1",
    "flask>=3.0",
    "httpx>=0.27",
    "imbue-common",
    "loguru>=0.7",
    "pydantic>=2.0",
]

[project.scripts]
terminal-app = "terminal_app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terminal_app"]
