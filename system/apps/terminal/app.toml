name = "terminal"
display_name = "Terminal"
icon = "icon.svg"
# The terminal program serves the wrapper pages on 7681; ttyd runs on the terminal-pty origin
# (system/apps/terminal_pty/app.toml, port 7683).
critical = true
priority = "terminal"
launcher_rank = 40
# A terminal lives as long as a window shows it: the shell posts every closed window here and
# the app collects what no window shows (docs/system/specs/window-bound-resources.md).
window_closed_path = "/api/window-closed"

[default_shortcut]
launch = "new"
mode = "new"

[[launch_paths]]
id = "new"
label = "Terminal"
path = "/new"
params = [{name = "workdir", label = "Working directory", required = false}]

# A terminal preview serves the wrapper pages on a free port, unregistered, over a copy of
# the terminal's store and a scratch state directory; the sessions it creates are real tmux
# sessions. Its pages frame the pty the registry names, so a preview boots --with terminal-pty
# and reads the registry copy that points that row at the pty's preview.
[preview]
command = [
    "terminal-app", "--no-register",
    "--app-url", "http://127.0.0.1:{port:main}",
    "--store", "{copy:store}/instances.json",
    "--state-dir", "{scratch}/state",
]
env = {MINDS_APPS_FILE = "{registry}"}
copies = {store = "data/.apps/terminal"}
health_path = "/api/health"
