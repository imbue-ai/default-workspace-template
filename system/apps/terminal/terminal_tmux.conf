# Extra tmux settings for the minds in-memory persistent terminals feature.
#
# Sourced from ~/.tmux.conf (written by the template's extra_provision_command
# in .mngr/settings.toml). Kept in its own committed file rather than inlined
# into that printf so the hook lines stay readable instead of drowning in
# nested shell quoting.
#
# Applies to the shared default tmux server -- i.e. every session, both the
# mngr-<agent> agent sessions and the terminal-<N> user terminals the dockview
# "New terminal" button creates.

# Keep a generous in-memory scrollback (tmux default is 2000). This is purely
# per-session memory: it is never written to disk and dies with the tmux server
# on a container restart, so it carries no persistence/security implications.
set -g history-limit 10000

# When one session is attached from more than one client (e.g. the same
# terminal open in two dockview tabs), size to the most-recently-active client
# instead of shrinking every client to the smallest one.
set -g window-size latest

# Live tab-title tracking. When a client switches which session it is attached
# to (tmux switch-client) or a session is renamed, notify the system_interface
# so the owning dockview tab's title follows along. The helper is best-effort:
# it POSTs to the loopback API and never blocks tmux (run-shell -b), and it
# reads session names/ids from tmux itself rather than receiving them as shell
# args, so a session id like "$3" is never re-expanded by the shell. Only the
# client's pty (/dev/pts/N, always shell-safe) is passed in.
set-hook -g client-session-changed 'run-shell -b "python3 /home/user/workspace/system/apps/terminal/notify_terminal_session.py --kind session-changed --client-tty #{client_tty}"'
set-hook -g session-renamed 'run-shell -b "python3 /home/user/workspace/system/apps/terminal/notify_terminal_session.py --kind session-renamed"'

# --- Part 1: no tmux features via the keyboard -------------------------------
# No prefix key at all, so every Ctrl-b command is gone: copy-mode via `[`,
# clock-mode, choose-tree/client/buffer, customize-mode, new window, splits,
# detach. Ctrl-b becomes an ordinary keystroke your shell receives.
set -g prefix  None
set -g prefix2 None
unbind -a -T prefix

# Optional: hide tmux's status bar so the pane looks like a plain terminal.
# set -g status off

# --- Part 2: the mouse stays on, so you keep scrollback ----------------------
# Deliberately NOT doing `unbind -a -T root` or `set -g mouse off`: those are
# what would kill wheel scrolling and drag-to-copy. Wheel-up still enters
# copy-mode -- that IS how scrollback works in tmux.
set -g mouse on

# --- Part 3: tab (window) routes that survive a disabled prefix --------------
# These live in the root table, so `prefix None` does not touch them: clicking
# a tab switches to it, the wheel over the status bar changes tab, and a
# right-click there opens a menu with New Window / Kill / Rename / New Session.
unbind -T root MouseDown1Status
unbind -T root MouseDown3Status
unbind -T root MouseDown3StatusLeft
unbind -T root WheelUpStatus
unbind -T root WheelDownStatus
unbind -T root M-MouseDown3Status
unbind -T root M-MouseDown3StatusLeft

# --- Part 4: mouse routes inside the pane that capture keys ------------------
# Right-clicking the terminal area opens a pane menu (Split / Kill / Respawn /
# Copy ...) which swallows every keystroke until dismissed. Middle-click pastes
# the tmux buffer straight into your shell. Neither is wanted here.
unbind -T root MouseDown3Pane
unbind -T root M-MouseDown3Pane
unbind -T root MouseDown2Pane
unbind -T root MouseDrag1Border

# mngr's Ctrl-q (destroy agent) and Ctrl-t (stop agent) are left alone on
# purpose -- that is mngr behaviour, not tmux's. See the note about Ctrl-S
# flow control below.

# Any printable key leaves copy-mode and is typed into the shell, instead of
# being swallowed as a copy-mode command (`t` -> "(jump to forward)", `f` ->
# "(jump forward)", `/` -> search, most letters -> silently eaten).
#
# Wheel-up puts a pane in copy-mode with no obvious indicator, so this is the
# state you land in by accident just by scrolling. Arrows, PageUp/PageDown,
# Home/End and the wheel are left alone, so scrolling back still works; mouse
# drag-to-copy (and its OSC 52 clipboard write) is untouched.
#
# Cost: keyboard copy-mode selection (v / y / g / G / w / b ...) is gone --
# every printable key now exits instead. Select with the mouse.
#
# Generated for ASCII 0x20-0x7e; regenerate with scripts/gen_copy_mode_passthrough.py
bind -T copy-mode    " " { send -X cancel ; send-keys -l " " }
bind -T copy-mode-vi " " { send -X cancel ; send-keys -l " " }
bind -T copy-mode    "!" { send -X cancel ; send-keys -l "!" }
bind -T copy-mode-vi "!" { send -X cancel ; send-keys -l "!" }
bind -T copy-mode    "\"" { send -X cancel ; send-keys -l "\"" }
bind -T copy-mode-vi "\"" { send -X cancel ; send-keys -l "\"" }
