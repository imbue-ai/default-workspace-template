# Extra tmux settings for the minds in-memory persistent terminals feature.
#
# Sourced from ~/.tmux.conf (written by the template's extra_provision_command
# in .mngr/settings.toml). Kept in its own committed file rather than inlined
# into that printf so the hook lines stay readable instead of drowning in
# nested shell quoting.
#
# Applies to the shared default tmux server -- i.e. every session, both the
# mngr-<agent> agent sessions and the terminal-<N> user terminals the dockview
# "New terminal" button creates.

# Keep a generous in-memory scrollback (tmux default is 2000). This is purely
# per-session memory: it is never written to disk and dies with the tmux server
# on a container restart, so it carries no persistence/security implications.
set -g history-limit 10000

# When one session is attached from more than one client (e.g. the same
# terminal open in two dockview tabs), size to the most-recently-active client
# instead of shrinking every client to the smallest one.
set -g window-size latest

# Live tab-title tracking. When a client switches which session it is attached
# to (tmux switch-client) or a session is renamed, notify the system_interface
# so the owning dockview tab's title follows along. The helper is best-effort:
# it POSTs to the loopback API and never blocks tmux (run-shell -b), and it
# reads session names/ids from tmux itself rather than receiving them as shell
# args, so a session id like "$3" is never re-expanded by the shell. Only the
# client's pty (/dev/pts/N, always shell-safe) is passed in.
set-hook -g client-session-changed 'run-shell -b "python3 /home/user/workspace/system/apps/terminal/notify_terminal_session.py --kind session-changed --client-tty #{client_tty}"'
set-hook -g session-renamed 'run-shell -b "python3 /home/user/workspace/system/apps/terminal/notify_terminal_session.py --kind session-renamed"'

# ============================================================================
# Workspace terminals behave as a plain terminal: scroll and type, nothing
# else. Generated by gen_lockdown.py -- edit that, not this.
# ============================================================================

# --- 1. No tmux features from the keyboard ----------------------------------
# No prefix key at all, so every Ctrl-b command is gone: copy-mode via `[`,
# clock-mode, choose-tree/client/buffer, customize-mode, new window, splits,
# detach, suspend-client, the command prompt. Ctrl-b instead reaches the shell
# as readline's backward-char.
set -g prefix  None
set -g prefix2 None
unbind -a -T prefix

# Uncomment to also hide the status bar. sigwinch_panes.sh already maps
# `status off` to 0 rows, so pane height stays correct either way.
# set -g status off

# --- 2. The mouse stays on, so scrollback still works ------------------------
# Deliberately NOT `set -g mouse off` or `unbind -a -T root`: either kills
# wheel scrolling and drag-to-copy. Per tmux's maintainer, copy-mode is the
# only scrollback viewer there is -- github.com/tmux/tmux/issues/2550 -- so
# wheel-up entering copy-mode is not avoidable. Section 5 makes it harmless.
set -g mouse on

# Not a key binding, so no unbind reaches it: if this were ever set, the
# session would lock on idle and demand a password. Pin it off.
set -g lock-after-time 0

# --- 3. The root table (no-prefix keys), also a whitelist -------------------
# tmux ships 16 root bindings. Wipe them and put back only the five mouse
# routes a plain terminal needs. Dropped by omission: middle-click paste,
# border drag-resize, the four status-bar tab routes (click / wheel / right-
# click menus), and both pane context menus -- the pane menu in particular
# swallows every keystroke until dismissed.
unbind -a -T root
bind -n MouseDown1Pane     { select-pane -t=; send -M }
bind -n WheelUpPane        { if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { copy-mode -e } }
bind -n MouseDrag1Pane     { if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { copy-mode -M } }
bind -n DoubleClick1Pane   { select-pane -t=; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { copy-mode -H; send -X select-word; run -d0.3; send -X copy-pipe-and-cancel } }
bind -n TripleClick1Pane   { select-pane -t=; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { copy-mode -H; send -X select-line; run -d0.3; send -X copy-pipe-and-cancel } }

# mngr's Ctrl-q (destroy agent) and Ctrl-t (stop agent) are left alone on
# purpose -- that is mngr behaviour, not tmux's.

# --- 5. Copy-mode, rebuilt as a whitelist -----------------------------------
# tmux ships 72 copy-mode and 87 copy-mode-vi bindings. Listing the unwanted
# ones is a blacklist: it misses whatever tmux adds next, and it silently
# misses every control and meta key -- C-s opens "(search down)", C-r
# "(search up)", M-1..M-9 a "(repeat)" count prompt. So both tables are wiped
# and only what a scroll-and-read view needs goes back. Precedence:
#   a. the navigation / mouse keys below -- scroll, select, copy
#   b. every printable character -- leaves the mode AND types itself
#   c. Any -- the catch-all: every other key just leaves the mode
# Per tmux(1), "a command bound to the Any key will execute for all keys which
# do not have a more specific binding", so a and b win over c, and anything
# tmux adds upstream lands in c instead of eating input. b needs one binding
# per character because no format exposes the key that triggered a binding.
unbind -a -T copy-mode
unbind -a -T copy-mode-vi

# a. navigation, selection and the OSC 52 copy path (verbatim tmux defaults)
bind -T copy-mode    WheelUpPane        select-pane \; send-keys -X -N 5 scroll-up
bind -T copy-mode    WheelDownPane      select-pane \; send-keys -X -N 5 scroll-down
bind -T copy-mode    Up                 send-keys -X cursor-up
bind -T copy-mode    Down               send-keys -X cursor-down
bind -T copy-mode    PPage              send-keys -X page-up
bind -T copy-mode    NPage              send-keys -X page-down
bind -T copy-mode    MouseDown1Pane     select-pane
bind -T copy-mode    MouseDrag1Pane     select-pane \; send-keys -X begin-selection
bind -T copy-mode    MouseDragEnd1Pane  send-keys -X copy-pipe-and-cancel
bind -T copy-mode    DoubleClick1Pane   select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel
bind -T copy-mode    TripleClick1Pane   select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel
bind -T copy-mode    Escape             send-keys -X cancel

bind -T copy-mode-vi WheelUpPane        select-pane \; send-keys -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane      select-pane \; send-keys -X -N 5 scroll-down
bind -T copy-mode-vi Up                 send-keys -X cursor-up
bind -T copy-mode-vi Down               send-keys -X cursor-down
bind -T copy-mode-vi PPage              send-keys -X page-up
bind -T copy-mode-vi NPage              send-keys -X page-down
bind -T copy-mode-vi MouseDown1Pane     select-pane
bind -T copy-mode-vi MouseDrag1Pane     select-pane \; send-keys -X begin-selection
bind -T copy-mode-vi MouseDragEnd1Pane  send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi DoubleClick1Pane   select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi TripleClick1Pane   select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape             send-keys -X cancel

# b. every printable character leaves copy-mode and is typed into the shell
bind -T copy-mode    " "    { send -X cancel ; send-keys -l " " }
bind -T copy-mode-vi " "    { send -X cancel ; send-keys -l " " }
