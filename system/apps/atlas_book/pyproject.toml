[project]
name = "atlas-book"
version = "0.1.0"
description = "Sidebar viewer for the Atlas project book (projects to feature one-pagers)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
]

[project.scripts]
atlas-book = "atlas_book.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_book"]
