[project]
name = "browser"
version = "0.1.0"
description = "Live Chromium with human-in-the-loop control and a browser-use agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "oom-priority",
    "simple-websocket>=1.0",
    "werkzeug>=3.0",
    "browser-use[core]==0.13.1",
    # Pixel transport for the pixelflux media path (BROWSER_MEDIA=pixelflux, see
    # videopipe.py). Selkies' Rust capture/encode engine; its native module dlopens
    # libva/pixman (baked via setup_system.sh).
    "pixelflux>=2.0.0",
    # On-demand Opus audio for the pixelflux path (see audiopipe.py). pcmflux is
    # pixelflux's audio sibling from the same vendor/wheel family; its native module
    # captures a PulseAudio sink monitor and Opus-encodes, silence-gated.
    "pcmflux>=2.0.0",
    # XTEST input injection + window resize for the pixelflux path (see xinput.py,
    # ported verbatim from Selkies). Also a transitive browser-use dep; pinned here
    # because we import it directly.
    "python-xlib>=0.33",
]

# Entry point is "browser-service", not "browser": browser-use ships its own
# "browser" console script, which would otherwise shadow this one. The fleet CLI
# (agentic-browser-fleet) is what agents call to drive the browsers.
[project.scripts]
browser-service = "browser.runner:main"
agentic-browser-fleet = "browser.fleet:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser"]
