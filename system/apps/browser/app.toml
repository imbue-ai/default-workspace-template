name = "browser"
display_name = "Browser"
icon = "icon.svg"
critical = false
# Chromium stops on the close hint below, but the coordinator stays: agents drive browsers with no
# window at all (the agentic-browser-fleet skill, through the CDP proxy), and stopping the
# coordinator closes every Chromium it runs.
stop_when_no_windows = false
priority = "browser"
launcher_rank = 30
# The one browser lives as long as a window shows it: the shell posts every closed window
# here and the daemon stops a browser no window shows (docs/system/specs/window-bound-resources.md).
window_closed_path = "/api/window-closed"

[default_shortcut]
launch = "new"
mode = "focus"

[[launch_paths]]
id = "new"
label = "Browser"
path = "/new"
method = "POST"
params = [{name = "url", label = "Start page", required = false}]

# Xvfb exists only to give Chromium a display; it is the browser's wiring.
[wiring]
programs = ["xvfb"]

# A link to a local address clicked in the workspace (a chat's ``http://localhost:3000/`` link, or a page's popup
# Imbue Studio hands back) opens as a tab in the one browser, whose window the route then shows.
[[message_handlers]]
type = "open:url"
path = "/api/open-url"
