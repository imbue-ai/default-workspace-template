name = "browser"
display_name = "Browser"
description = "Live Chromium browsers inside the workspace, each driven by one chat or by the person, with pages to watch them."
api_schema_path = "/api/schema"
icon = "icon.svg"
critical = false
# Chromium stops on the close hint below, but the coordinator stays: agents drive browsers with no
# window at all (the agentic-browser-fleet skill, through the CDP proxy), and stopping the
# coordinator closes every Chromium it runs.
stop_when_no_windows = false
priority = "browser"
launcher_rank = 30
# Part of the workspace itself rather than an app built on it, so the Share tab tucks it under its System group
# rather than offering it up front.
system = true
# The one browser lives as long as a window shows it: the shell posts every closed window
# here and the daemon stops a browser no window shows (docs/system/specs/window-bound-resources.md).
window_closed_path = "/api/window-closed"

[default_shortcut]
launch = "new"
mode = "focus"

[[launch_paths]]
id = "new"
label = "Browser"
path = "/new"
method = "POST"
params = [{name = "url", label = "Start page", required = false}]

# A preview runs beside the live browser: ports of its own, a copy of the saved fleet, a profile root of its
# own, since a restore relaunches the profiles under its root and deletes the ones its fleet does not name, and
# audio sinks of its own, since its browsers carry the live ones' names on the one shared pulse daemon.
# It is headful like the live service, each browser on an Xvfb display of its own.
# It still talks to the live shell: its window sweep stops a preview browser that no live browser window shows,
# and its open-url route shows the page in a live browser window, not a preview one.
[preview]
command = ["browser-service"]
ports = ["main", "cdp"]
env = {BROWSER_PORT = "{port:main}", BROWSER_CDP_PROXY_PORT = "{port:cdp}", BROWSER_MANIFEST_PATH = "{copy:data}/instances.json", BROWSER_PROFILE_ROOT = "{scratch}/profiles", BROWSER_PULSE_SINK_PREFIX = "browserpreview{port:main}", BROWSER_HEADLESS = "0"}
copies = {data = "data/.apps/browser"}

# Xvfb exists only to give Chromium a display; it is the browser's wiring.
[wiring]
programs = ["xvfb"]

# A link to a local address no app is registered at, clicked in the workspace (a chat's ``http://localhost:3000/``
# link, or a page's popup Imbue Studio hands back), opens as a tab in the one browser, whose window the route then
# shows.
[[message_handlers]]
type = "open:url"
path = "/api/open-url"
