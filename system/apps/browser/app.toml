name = "browser"
display_name = "Browser"
icon = "icon.svg"
critical = false
priority = "browser"
launcher_rank = 30

[default_shortcut]
launch = "new"
mode = "focus"

[[launch_paths]]
id = "new"
label = "New Browser"
path = "/new"
params = [{name = "url", label = "Start page", required = false}]

# Xvfb exists only to give Chromium a display; it is the browser's wiring.
[wiring]
programs = ["xvfb"]
