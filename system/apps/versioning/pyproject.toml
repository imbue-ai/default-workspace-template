[project]
name = "versioning"
version = "0.1.0"
description = "Browse an app's history as a natural-language timeline and restore any previous version"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
    "imbue-common",
    "loguru>=0.7",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.3.0",
    "coverage",
    "inline-snapshot>=0.13",
    "resource-guards",
    "import-linter>=2.0",
    "ruff~=0.12.8",
]

[project.scripts]
versioning = "versioning.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/versioning"]

[tool.pytest.ini_options]
timeout_func_only = true
junit_family = "xunit1"
testpaths = ["."]
addopts = [
  "--cov=src/versioning",
  "--cov-report=term-missing",
  "--durations=20",
  "--timeout=60",
  "--timeout-method=signal",
]

[tool.coverage.run]
omit = [
  "*_test.py",
  "test_*.py",
  "*/conftest.py",
  "*/claude_p.py",
]

[tool.coverage.report]
fail_under = 70

[tool.inline-snapshot]
default-flags = ["report"]

[[tool.importlinter.contracts]]
name = "Versioning layers contract"
type = "layers"
layers = [
    "versioning.runner",
    "versioning.restore | versioning.summaries | versioning.assistant",
    "versioning.history",
    "versioning.git_repo",
    "versioning.trailers",
    "versioning.interfaces | versioning.locking | versioning.claude_p | versioning.magnitude",
    "versioning.data_types",
]

[tool.importlinter]
root_package = "versioning"
