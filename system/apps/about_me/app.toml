# The "What Studio knows about me" app: one page at ``/`` showing the agent's whole memory (data/memories/), grouped
# by what each memory is about, with the web lookup's memory fact by fact, and controls to add, edit and delete
# memories or forget them. It touches only the memory files and the lookup's sources and never reaches the network.
# It declares no launch path, so the desktop offers the synthesized ``open`` at its root.
name = "about-me"
display_name = "What Studio knows about me"
description = "Everything Studio remembers about you and how you like to work, as its own memory holds it, with controls to add to it, edit or delete any of it, or forget all of it."
api_schema_path = "/api/schema"
icon = "icon.svg"
critical = false
# Only answers requests: the shell stops it once no window shows it and starts it again on the next request.
stop_when_no_windows = true
priority = "about-me"
# Part of the workspace itself (its memory of the user) rather than an app built on it, so the Share tab tucks it
# under its System group rather than offering it up front.
system = true

# Seeds a desktop shortcut, so what Studio remembers about the user is always one click away.
[default_shortcut]
launch = "open"
mode = "focus"

# Built only from the page kit and the design tokens, so every theme styles it with no work of its own
# (docs/system/blueprint/workspace-themes/, section 7).
[theming]
mode = "tokens"

[[references]]
path = ".agents/skills/personalized-ideas"
note = "Writes the profile memory in the fixed line shape this page parses, and links the page"

[[references]]
path = "docs/system/specs/personalized-ideas/spec.md"
note = "Specifies the page (section \"A 'What Studio knows about me' page\")"
