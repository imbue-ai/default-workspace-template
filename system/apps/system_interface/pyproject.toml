[project]
name = "system-interface"
version = "0.1.0"
description = "The workspace's shell: the window manager and app management the other apps render inside"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "app-manifest",
    # The staleness tracker runs git through concurrency_group's subprocess helper.
    "concurrency-group",
    # The avatar designs' validator parses registered SVG with DTDs and entities refused.
    "defusedxml>=0.7",
    # A registration bounds its own request body, a per-request setter Flask 3.1 added.
    "flask>=3.1",
    "flask-sock>=0.7",
    "httpx>=0.27",
    "imbue-common",
    "pydantic-settings>=2.13.1",
    # The home-screen icon rasterizes the avatar's SVG to PNG; its wheels bundle resvg, so no system library.
    "resvg-py>=0.5.0",
    "simple-websocket>=1.0",
    "watchdog>=4.0",
    "werkzeug>=3.0",
]
license = {text = "FCL-1.0-MIT"}
license-files = [
    "LICENSE",
]

[dependency-groups]
dev = [
    "playwright>=1.40",
    "pytest-playwright>=0.4",
    "pytest>=9.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.3.0",
    "coverage",
    "inline-snapshot>=0.13",
    # The live mngr CLI, for the contract test that pins the not-built placeholder's repair
    # command to the CLI it names (test_chat_system.py, the one module that may import the
    # chat package's command builder beside it).
    "mngr-cli-contract",
    # Keeps tmp_path somewhere a stub executable can run (a workspace container mounts /tmp noexec).
    "pytest-executable-tmp",
    # Fails a test that skips where the environment is meant to be complete
    # (the CI job that runs the suites inside the workspace image).
    "pytest-workspace-env",
    # The tests' polling helper (imbue.mngr.utils.polling); the shell's own code imports
    # nothing from mngr (the import ratchet holds that).
    "imbue-mngr",
    # The chat app, for the system tests that boot the shell and the chat together
    # (``test_chat_system.py``); the shell's own code never imports it (the import
    # ratchet holds that).
    "chat",
    "ruff~=0.12.8",
    # Used by check_no_type_errors in test_ratchets.py. Pinned to 0.0.24 because
    # that is the version the source was last verified clean against (mngr's own
    # uv.lock); newer versions surface stricter checks that don't
    # match what this code was reviewed under.
    "ty==0.0.24",
]

[project.scripts]
system-interface = "imbue.system_interface.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
    "imbue/system_interface/static/**",
]

[tool.hatch.build.targets.wheel]
packages = ["imbue"]

[tool.pytest.ini_options]
timeout_func_only = true
markers = [
    "acceptance: marks tests as requiring network access, Modal credentials, etc. These are required to pass in CI",
    "browser: marks tests that drive a browser",
    "frontend: marks tests that read an app's frontend source",
    "real_claude: marks tests that run the real claude binary",
    "flaky: marks tests as known-flaky (retried by offload with a separate retry count)",
]
junit_family = "xunit1"
testpaths = ["."]
addopts = [
  "--cov=imbue.system_interface",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--durations=20",
  "--timeout=10",
  "--timeout-method=signal",
  # The `browser` and `real_claude` tests are skipped by default. A later `-m` on the
  # command line replaces this one: `-m ''` runs everything (as CI does), and `-m browser`
  # runs only the browser tests. A run of only some of the tests needs `--no-cov`, or it
  # fails the coverage floor below.
  "-m", "not browser and not real_claude",
]

[tool.coverage.run]
parallel = true
concurrency = ["multiprocessing", "thread"]
omit = [
  "*_test.py",
  "test_*.py",
  "*/tests/*",
  "*/conftest.py",
]

[tool.inline-snapshot]
default-flags=["report"]
default-flags-tui=["report"]
default-flags-ide=["report"]
format-command="uv run ruff format --force-exclude --config pyproject.toml --stdin-filename {filename}"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
strict = ["**/*.py"]

# Ruff config mirrors mngr's pyproject.toml so that lint/isort behavior
# matches what this code was previously checked under (it was a workspace
# member of system/vendor/mngr before being promoted into system/apps/system_interface).
[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "I",
    "UP006",
    "UP007",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
force-single-line = true
case-sensitive = true
order-by-type = false
known-first-party = [
    "imbue",
    "imbue_common",
    "mngr",
]

[tool.coverage.report]
fail_under = 75

[tool.coverage.paths]
# Coverage data measured inside the workspace image on Modal (the
# test-offload CI job) records the sandbox's paths; map them back so
# the runner can combine the batches and enforce the floor above.
source = [
    ".",
    "/home/user/workspace/system/apps/system_interface/",
]
