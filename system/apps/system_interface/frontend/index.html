<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" />
    <title>System Interface</title>
  </head>
  <body class="app-body">
    <div id="app"></div>
    <script type="module" src="/src/index.ts"></script>
    <script>
      // LIVETEST ONLY (dwt/phone-interface-livetest): reads out the viewport numbers the phone bar sizes from.
      (function () {
        var box = document.createElement("div");
        box.style.cssText =
          "position:fixed;left:4px;top:calc(env(safe-area-inset-top,0px) + 4px);z-index:2147483647;" +
          "background:rgba(0,0,0,.78);color:#0f0;font:11px/1.3 ui-monospace,monospace;padding:4px 6px;" +
          "border-radius:6px;pointer-events:none;white-space:pre";
        var inset = document.createElement("div");
        inset.style.cssText =
          "position:fixed;visibility:hidden;padding-bottom:env(safe-area-inset-bottom,0px);" +
          "padding-top:env(safe-area-inset-top,0px)";
        function px(v) { return Math.round(parseFloat(v) * 10) / 10; }
        function render() {
          var vv = window.visualViewport;
          var bar = document.querySelector("[data-phone-bar]");
          var layout = document.querySelector("[data-phone-layout]");
          var barRect = bar ? bar.getBoundingClientRect() : null;
          var cs = getComputedStyle(inset);
          box.textContent = [
            "standalone " + matchMedia("(display-mode: standalone)").matches + " nav.standalone " + navigator.standalone,
            "inset bottom " + px(cs.paddingBottom) + " top " + px(cs.paddingTop),
            "innerH " + innerHeight + " clientH " + document.documentElement.clientHeight + " screenH " + screen.height,
            "vv h " + (vv ? px(vv.height) : "-") + " top " + (vv ? px(vv.offsetTop) : "-") + " scale " + (vv ? vv.scale : "-"),
            "layout h " + (layout ? px(layout.getBoundingClientRect().height) : "-"),
            "bar top " + (barRect ? px(barRect.top) : "-") + " bottom " + (barRect ? px(barRect.bottom) : "-") +
              " padB " + (bar ? px(getComputedStyle(bar).paddingBottom) : "-"),
          ].join("\n");
        }
        function start() {
          document.body.appendChild(inset);
          document.body.appendChild(box);
          render();
          setInterval(render, 500);
        }
        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
        else start();
      })();
    </script>
  </body>
</html>
