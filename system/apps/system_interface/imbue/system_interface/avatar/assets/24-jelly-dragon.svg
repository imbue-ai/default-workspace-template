<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-labelledby="pet24-title" data-mood="idle">
<title id="pet24-title">24 — Jelly dragon</title>
<defs>
<radialGradient id="pet24-body" cx="35%" cy="23%" r="85%"><stop stop-color="#fff1bc" stop-opacity=".95"/><stop offset=".48" stop-color="#f3c547" stop-opacity=".8"/><stop offset=".82" stop-color="#f3c547" stop-opacity=".92"/><stop offset="1" stop-color="#c58c20" stop-opacity=".96"/></radialGradient>
<linearGradient id="pet24-milk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4ffff" stop-opacity=".92"/><stop offset=".28" stop-color="#bcebf0" stop-opacity=".68"/><stop offset=".56" stop-color="#e4cafa" stop-opacity=".7"/><stop offset=".78" stop-color="#fff0d6" stop-opacity=".8"/><stop offset="1" stop-color="#a6dce5" stop-opacity=".8"/></linearGradient>
</defs><style>
.jelly-body {transform-origin:50px 87px;animation:jelly-breathe 3.6s ease-in-out infinite}
.jelly-eyes {transform-box:fill-box;transform-origin:center;animation:jelly-blink 5.2s infinite}
.jelly-extra {transform-box:fill-box;transform-origin:center bottom;animation:jelly-sway 3.2s ease-in-out infinite}
svg[data-mood="working"] .jelly-body,[data-mood="working"] svg .jelly-body {animation:jelly-work 1.3s ease-in-out infinite}
svg[data-mood="attention"] .jelly-body,[data-mood="attention"] svg .jelly-body {animation:jelly-hop 1.2s ease-in-out infinite}
@keyframes jelly-breathe {50%{transform:scale(1.035,.965)}}
@keyframes jelly-blink {0%,91%,97%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes jelly-sway {50%{transform:rotate(5deg)}}
@keyframes jelly-work {0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) scale(1.02,.98)}}
@keyframes jelly-hop {0%,65%,100%{transform:translateY(0)}18%{transform:translateY(1px) scale(1.07,.93)}38%{transform:translateY(-9px) scale(.96,1.04)}57%{transform:scale(1.06,.94)}}
.jelly-listen {display:none}
svg[data-mood="listening"] .jelly-body,[data-mood="listening"] svg .jelly-body {animation:jelly-listen 4s ease-in-out infinite;transform:translateY(-2px) scale(1.015,1.025)}
svg[data-mood="listening"] .jelly-eyes,[data-mood="listening"] svg .jelly-eyes {animation:none;transform:translateY(-1px) scale(1.12)}
svg[data-mood="listening"] .jelly-listen,[data-mood="listening"] svg .jelly-listen {display:inline}
svg[data-mood="listening"]:has(.jelly-listen) .jelly-eyes,[data-mood="listening"] svg:has(.jelly-listen) .jelly-eyes {display:none}
svg[data-mood="listening"] .jelly-extra,[data-mood="listening"] svg .jelly-extra {animation:none;transform:translateY(-2px) rotate(-3deg)}
@keyframes jelly-listen {0%,100%{transform:translateY(-2px) scale(1.015,1.025)}50%{transform:translateY(-3px) scale(1.02,1.03)}}
@media(prefers-reduced-motion:reduce){.jelly-body,.jelly-eyes,.jelly-extra{animation:none!important}}
</style>
