<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-labelledby="pet20-title" data-mood="idle">
<title id="pet20-title">20 — Heart bubble</title>
<defs>
<radialGradient id="pet20-body" cx="35%" cy="23%" r="85%"><stop stop-color="#ffffff" stop-opacity=".95"/><stop offset=".48" stop-color="#d4defa" stop-opacity=".8"/><stop offset=".82" stop-color="#d4defa" stop-opacity=".92"/><stop offset="1" stop-color="#a6b9e8" stop-opacity=".96"/></radialGradient>
<linearGradient id="pet20-milk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4ffff" stop-opacity=".92"/><stop offset=".28" stop-color="#bcebf0" stop-opacity=".68"/><stop offset=".56" stop-color="#e4cafa" stop-opacity=".7"/><stop offset=".78" stop-color="#fff0d6" stop-opacity=".8"/><stop offset="1" stop-color="#a6dce5" stop-opacity=".8"/></linearGradient>
</defs><style>
.jelly-body {transform-origin:50px 87px;animation:jelly-breathe 3.6s ease-in-out infinite}
.jelly-eyes {transform-box:fill-box;transform-origin:center;animation:jelly-blink 5.2s infinite}
.jelly-extra {transform-box:fill-box;transform-origin:center bottom;animation:jelly-sway 3.2s ease-in-out infinite}
svg[data-mood="working"] .jelly-body,[data-mood="working"] svg .jelly-body {animation:jelly-work 1.3s ease-in-out infinite}
svg[data-mood="attention"] .jelly-body,[data-mood="attention"] svg .jelly-body {animation:jelly-hop 1.2s ease-in-out infinite}
@keyframes jelly-breathe {50%{transform:scale(1.035,.965)}}
@keyframes jelly-blink {0%,91%,97%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes jelly-sway {50%{transform:rotate(5deg)}}
@keyframes jelly-work {0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) scale(1.02,.98)}}
@keyframes jelly-hop {0%,65%,100%{transform:translateY(0)}18%{transform:translateY(1px) scale(1.07,.93)}38%{transform:translateY(-9px) scale(.96,1.04)}57%{transform:scale(1.06,.94)}}
.jelly-listen {display:none}
svg[data-mood="listening"] .jelly-body,[data-mood="listening"] svg .jelly-body {animation:jelly-listen 4s ease-in-out infinite;transform:translateY(-2px) scale(1.015,1.025)}
svg[data-mood="listening"] .jelly-eyes,[data-mood="listening"] svg .jelly-eyes {animation:none;transform:translateY(-1px) scale(1.12)}
svg[data-mood="listening"] .jelly-listen,[data-mood="listening"] svg .jelly-listen {display:inline}
svg[data-mood="listening"]:has(.jelly-listen) .jelly-eyes,[data-mood="listening"] svg:has(.jelly-listen) .jelly-eyes {display:none}
svg[data-mood="listening"] .jelly-extra,[data-mood="listening"] svg .jelly-extra {animation:none;transform:translateY(-2px) rotate(-3deg)}
@keyframes jelly-listen {0%,100%{transform:translateY(-2px) scale(1.015,1.025)}50%{transform:translateY(-3px) scale(1.02,1.03)}}
@media(prefers-reduced-motion:reduce){.jelly-body,.jelly-eyes,.jelly-extra{animation:none!important}}
</style>
<ellipse cx="50" cy="90" rx="29" ry="3" fill="#a6b9e8" opacity=".13"/>
<g class="jelly-body"><circle cx="50" cy="52" r="35" fill="url(#pet20-milk)" stroke="#b6c2ed" stroke-width="1.3"/><path d="M20 61Q23 80 44 83" fill="none" stroke="#fff3d8" stroke-opacity=".9" stroke-width="3" stroke-linecap="round"/><path d="M79 37Q86 57 74 73" fill="none" stroke="#f9c7e5" stroke-opacity=".85" stroke-width="3" stroke-linecap="round"/><g class="jelly-extra"><path d="M50 80C30 68 44 57 50 65C57 56 70 68 50 80Z" fill="#f59fc4" stroke="#ee85b6" stroke-width=".8"/><path d="M43 66q-3 2 0 5" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity=".7"/></g><circle cx="22" cy="52" r="5" fill="white" opacity=".45"/><circle cx="72" cy="69" r="4" fill="white" opacity=".45"/>
<path d="M28 34Q39 22 54 24" fill="none" stroke="white" stroke-opacity=".78" stroke-width="4.2" stroke-linecap="round"/>
<ellipse cx="69" cy="79" rx="5" ry="2.3" fill="white" opacity=".35"/>
<g fill="#382643"><g class="jelly-eyes"><ellipse cx="40" cy="51" rx="2.9" ry="4"/><ellipse cx="60" cy="51" rx="2.9" ry="4"/><g fill="white"><circle cx="39.2" cy="49.7" r=".8"/><circle cx="59.2" cy="49.7" r=".8"/></g></g></g><g fill="#ef7c99" opacity=".5"><ellipse cx="33" cy="57" rx="4.2" ry="2.5"/><ellipse cx="67" cy="57" rx="4.2" ry="2.5"/></g><path d="M47 59q3 4 6 0" fill="none" stroke="#593349" stroke-width="1.8" stroke-linecap="round"/><g class="jelly-listen"><ellipse cx="40" cy="49" rx="4.5" ry="5.3" fill="#f4ffff" stroke="#382643" stroke-width="1.4"/><ellipse cx="40" cy="47.5" rx="2.5" ry="3.2" fill="#382643"/><circle cx="39.2" cy="46.2" r=".9" fill="white"/><ellipse cx="60" cy="49" rx="4.5" ry="5.3" fill="#f4ffff" stroke="#382643" stroke-width="1.4"/><ellipse cx="60" cy="47.5" rx="2.5" ry="3.2" fill="#382643"/><circle cx="59.2" cy="46.2" r=".9" fill="white"/><path d="M35 40q5-3 9 0m12 0q5-3 9 0" fill="none" stroke="#382643" stroke-opacity=".7" stroke-width="1.3" stroke-linecap="round"/></g></g></svg>