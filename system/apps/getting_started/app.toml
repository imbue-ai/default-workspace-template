# The Getting Started app: the ways into the workspace. Its one page holds the "Start something"
# intents and the published template catalog (docs/system/blueprint/launcher-and-getting-started/),
# every one of which starts a chat through the desktop's launcher (``shell:start-with-text``). It
# declares no launch path, so the desktop offers the synthesized ``open`` at its root; its shortcut
# focuses the one window it is for, as the browser's does.
name = "getting-started"
display_name = "Getting Started"
icon = "icon.svg"
critical = false
priority = "getting-started"
launcher_rank = 5

[default_shortcut]
launch = "open"
mode = "focus"
