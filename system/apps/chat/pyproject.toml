[project]
name = "chat"
version = "0.1.0"
description = "The chat app: live conversations with mngr-managed agents, served as an app of the workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "app-manifest",
    "concurrency-group",
    "flask>=3.0",
    "flask-sock>=0.7",
    "httpx>=0.27",
    "imbue-common",
    "imbue-mngr",
    "imbue-mngr-claude",
    "imbue-mngr-codex",
    "imbue-mngr-pi-coding",
    "imbue-mngr-opencode",
    "imbue-mngr-antigravity",
    "imbue-mngr-autocompact",
    "oom-priority",
    "pexpect>=4.9",
    "pydantic-settings>=2.13.1",
    "pyte>=0.8",
    "simple-websocket>=1.0",
    "tk-command-parsing",
    "tomlkit>=0.12",
    "watchdog>=4.0",
    "werkzeug>=3.0",
    "workspace-layout",
]
license = {text = "FCL-1.0-MIT"}

[dependency-groups]
dev = [
    "playwright>=1.40",
    "pytest-playwright>=0.4",
    "pytest>=9.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.3.0",
    "coverage",
    "inline-snapshot>=0.13",
    # Shared mngr CLI argv validator used by the per-feature contract tests
    # (agent_manager_test, claude_auth_test, server_test).
    "mngr-cli-contract",
    # Keeps tmp_path somewhere a stub executable can run (a workspace container mounts /tmp noexec).
    "pytest-executable-tmp",
    # Fails a test that skips where the environment is meant to be complete
    # (the CI job that runs the suites inside the workspace image).
    "pytest-workspace-env",
    # The shell, for the two-process fixture the e2e suite and the system tests boot (the
    # chat is framed by the shell, so a chat page can only be driven through it).
    "system-interface",
    "ruff~=0.12.8",
    # Used by check_no_type_errors in test_ratchets.py. Pinned to the version the source was
    # last verified clean against (see the system interface's pyproject).
    "ty==0.0.85",
]

[project.scripts]
chat-app = "imbue.chat.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
    "imbue/chat/static/**",
]

[tool.hatch.build.targets.wheel]
packages = ["imbue"]

[tool.pytest.ini_options]
timeout_func_only = true
markers = [
    "acceptance: marks tests as requiring network access, Modal credentials, etc. These are required to pass in CI",
    "browser: marks tests that drive a browser",
    "frontend: marks tests that read an app's frontend source",
    "real_claude: marks tests that run the real claude binary",
    "flaky: marks tests as known-flaky (retried by offload with a separate retry count)",
]
junit_family = "xunit1"
testpaths = ["."]
addopts = [
  "--cov=imbue.chat",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--durations=20",
  "--timeout=10",
  "--timeout-method=signal",
  # The `browser` and `real_claude` tests are skipped by default. A later `-m` on the
  # command line replaces this one: `-m ''` runs everything (as CI does), and `-m browser`
  # runs only the browser tests. A run of only some of the tests needs `--no-cov`, or it
  # fails the coverage floor below.
  "-m", "not browser and not real_claude",
]

[tool.coverage.run]
parallel = true
concurrency = ["multiprocessing", "thread"]
omit = [
  "*_test.py",
  "test_*.py",
  "*/tests/*",
  "*/conftest.py",
]

[tool.inline-snapshot]
default-flags=["report"]
default-flags-tui=["report"]
default-flags-ide=["report"]
format-command="uv run --no-sync ruff format --force-exclude --config pyproject.toml --stdin-filename {filename}"

# Makes this directory ty's project (test_no_type_errors runs ty from here). ty
# skips a pyproject.toml with no [tool.ty] table and keeps searching upward, so
# without one, a checkout nested in another project (e.g. a clone under mngr's
# .external_worktrees/) would be checked as part of that project instead.
[tool.ty]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
strict = ["**/*.py"]

# Ruff config mirrors mngr's pyproject.toml, as the system interface's does.
[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "I",
    "UP006",
    "UP007",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
force-single-line = true
case-sensitive = true
order-by-type = false
known-first-party = [
    "imbue",
    "imbue_common",
    "mngr",
]

[tool.coverage.report]
fail_under = 75

[tool.coverage.paths]
# Coverage data measured inside the workspace image on Modal (the
# test-offload CI job) records the sandbox's paths; map them back so
# the runner can combine the batches and enforce the floor above.
source = [
    ".",
    "/home/user/workspace/system/apps/chat/",
]
