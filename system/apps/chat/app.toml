# The chat app: the agent harness UI. Its pages render inside iframes at this origin, served
# by the ``chat`` program at its own port (docs/system/blueprint/workspace-app-model/).
name = "chat"
display_name = "Chat"
icon = "icon.svg"
critical = true
priority = "chat"
launcher_rank = 10

# A desktop shortcut opens the chat list; a chat is created only from inside it (or by the
# launcher's seeded prompts through ``new``).
[default_shortcut]
launch = "root"
mode = "new"

# The chat's pinned taskbar entry (docs/system/blueprint/pinned-taskbar-entries/): one root window on
# every desktop, never closed, showing each viewer their own selected chat.
[pin]
path = "/"
style = "avatar"
scope = "independent"
default_mode = "floating"

# The desktop interface opens a window at a launch path; the params ride as query parameters.
[[launch_paths]]
id = "root"
label = "Chat"
path = "/"
# A draft lands in the composer of the selected chat (else the most recent, else a new one), unsent:
# what the desktop's "Design your own..." hands the pinned chat window.
params = [
    {name = "draft", label = "Draft message", required = false},
]

[[launch_paths]]
id = "new"
label = "New Chat"
path = "/new"
params = [
    {name = "account_id", label = "Provider account", required = false},
    {name = "message", label = "First message", required = false},
]

# A chat preview is a secondary chat: it follows the live observer and reads the
# live accounts, but writes nothing the live chat owns. It opens on the chat list
# with the conversation the user is in selected ({key} is a chat id).
[preview]
command = ["chat-app", "--secondary"]
env = {CHAT_PORT = "{port:main}", CHAT_HOST = "{host}", CHAT_DATA_DIR = "{copy:data}", MINDS_APPS_FILE = "{registry}"}
copies = {data = "data/.apps/chat"}
health_path = "/api/health"
open_path = "/?chat={key}"
open_path_takes_key = true
