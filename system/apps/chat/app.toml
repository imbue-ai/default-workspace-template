# The chat app: the agent harness UI. Its pages render inside iframes at this origin, served
# by the ``chat`` program at its own port (docs/system/blueprint/workspace-app-model/).
name = "chat"
display_name = "Chat"
description = "The chats with the workspace's agents: one page per chat, where messages are sent and an agent's work is followed."
api_schema_path = "/api/schema"
icon = "icon.svg"
critical = true
priority = "chat"
launcher_rank = 10
# Part of the workspace itself rather than an app built on it, so the Share tab tucks it under its System group
# rather than offering it up front.
system = true

# A desktop shortcut opens the chat list; a chat is created only from inside it, or through the
# intake route below.
[default_shortcut]
launch = "root"
mode = "new"

# The chat's pinned taskbar entry (docs/system/blueprint/pinned-taskbar-entries/): one root window on
# every desktop, never closed, showing each viewer their own selected chat.
[pin]
path = "/"
style = "avatar"
scope = "independent"

# The chat list: a pure page, the launcher's "Chat" row (which raises the pinned window) and the shortcut.
[[launch_paths]]
id = "root"
label = "Chat"
path = "/"

# Every text that enters a chat from outside a chat page goes through the intake route
# (docs/system/blueprint/post-launch-paths/): the shell posts the params and the presets and opens a window
# at the path the route answers. ``target`` says which chat receives the text, ``is_draft`` whether it is put
# in the composer unsent.

# The launcher's Enter: a text typed into the desktop goes to the main chat.
[[launch_paths]]
id = "main"
label = "Send to main chat"
path = "/api/chats/intake"
method = "POST"
params = [{name = "message", label = "Message to send", required = false}]
presets = {target = "main_chat"}
text_param = "message"

# The launcher's Ctrl+Enter (its secondary free-text row): what is typed into the desktop's field becomes a new
# chat's first message.
[[launch_paths]]
id = "new"
label = "New Chat"
path = "/api/chats/intake"
method = "POST"
params = [
    {name = "account_id", label = "Provider account", required = false},
    {name = "message", label = "First message", required = false},
]
presets = {target = "new_chat"}
text_param = "message"

# A free-text row bound to no key: the text goes to the one chat there is, or to the chat picked from a picker
# the root opens over them.
[[launch_paths]]
id = "send"
label = "Send to chat..."
path = "/api/chats/intake"
method = "POST"
params = [{name = "message", label = "Message to send", required = false}]
presets = {target = "chat_selector"}
text_param = "message"

# A draft lands in the composer of the chat on screen (else the main chat, else the most recent, else a new one),
# unsent: what the desktop hands the pinned chat window. Its "Design your own..." sends no page, so that draft goes
# to the main chat.
[[launch_paths]]
id = "draft"
label = "Draft into chat"
path = "/api/chats/intake"
method = "POST"
params = [{name = "message", label = "Draft message", required = false}]
presets = {target = "current_chat", is_draft = "true"}
draft_param = "message"

# A click on a person in the desktop's tray (the multiplayer spec, section 7.5): a mention of them is drafted,
# unsent, into the Lounge, the chat so titled of either kind, made as a room when there is none. Never a launcher row.
[[launch_paths]]
id = "lounge"
label = "Mention in the Lounge"
path = "/api/chats/intake"
method = "POST"
params = [{name = "message", label = "Mention", required = false}]
presets = {target = "lounge", is_draft = "true"}
mention_param = "message"

# A window's "Chat about this app" (the multiplayer spec, section 9.2): the chat labelled app_chat with the app's
# registered name, else the one titled "<App> Chat" (by the create's name-conflict rule), made with both on the
# default provider when there is none, opened with the composer asking what to change. Never a launcher row.
[[launch_paths]]
id = "app-chat"
label = "Chat about this app"
path = "/api/chats/intake"
method = "POST"
params = [
    {name = "app", label = "App", required = true},
    {name = "app_display_name", label = "App name", required = true},
]
presets = {target = "app_chat"}
app_params = {name = "app", display_name = "app_display_name"}

# The chat's own look beyond the shared components: themes may style these elements in their apps/chat.css
# (docs/system/blueprint/workspace-themes/, section 7). Renaming one breaks the themes that style it.
[theming]
mode = "parts"
parts = [
    {name = "user-message", description = "A message the user sent, in its bubble"},
    {name = "composer", description = "The box a message is typed in, with its buttons"},
    {name = "tool-call", description = "A block showing a tool the agent called and what came back"},
]

# A chat's launch stacks on the ``chat`` create template the committed mngr settings hold, and the
# chat's create defaults resolve beside that file, so a change to it can break chat creation.
[[references]]
path = ".mngr/settings.toml"
note = "Holds the chat create template every chat launch stacks on"

[[references]]
path = ".agents/skills/connect-external-service"
note = "request_secret.py files secret requests through /api/secret-requests"

[[references]]
path = ".agents/skills/update-self/scripts/update_resume_note.py"
note = "Writes the resume note whose tag and outcomes harnesses/message_display.py shows as a notice"

# The Imbue Studio app's ask to show a chat (its chat notifications): the shell posts it here, and this app asks the
# shell's ``show`` op for the window (desktop-interface contracts.md section 8).
[[message_handlers]]
type = "minds:focus-chat"
path = "/api/focus-chat"

# A chat preview is a secondary chat: it follows the live observer and reads the
# live accounts, but writes nothing the live chat owns. It opens on the chat list
# with the conversation the user is in selected ({key} is a chat id).
[preview]
command = ["chat-app", "--secondary"]
env = {CHAT_PORT = "{port:main}", CHAT_HOST = "{host}", CHAT_DATA_DIR = "{copy:data}"}
copies = {data = "data/.apps/chat"}
health_path = "/api/health"
open_path = "/?chat={key}"
open_path_takes_key = true
