# The chat app: the agent harness UI. Its pages render inside iframes at this origin, served
# by the ``chat`` program at its own port (docs/system/blueprint/workspace-app-model/).
name = "chat"
display_name = "Chat"
icon = "icon.svg"
critical = true
priority = "chat"
launcher_rank = 10

[default_shortcut]
launch = "new"
mode = "new"

# The desktop interface opens a window at a launch path; the params ride as query parameters.
[[launch_paths]]
id = "new"
label = "New Chat"
path = "/new"
params = [
    {name = "account_id", label = "Provider account", required = false},
    {name = "message", label = "First message", required = false},
]
