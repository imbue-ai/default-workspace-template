[project]
name = "geopolitical-dashboard"
version = "0.1.0"
description = "Five-topic geopolitical news dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
]

[project.scripts]
geopolitical-dashboard = "geopolitical_dashboard.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geopolitical_dashboard"]
