<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory</title>
<link rel="stylesheet" href="/_static/workspace_theme.css">
<link rel="stylesheet" href="/assets/app.css">
<script src="/_static/workspace_theme.js"></script>
</head>
<body class="app-body">
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-head">
      <h1>Memory</h1>
      <button id="new-note" data-variant="primary">New note</button>
    </div>
    <input id="search" type="search" placeholder="Search notes">
    <div id="filters" class="filters"></div>
    <nav id="note-list" class="note-list" aria-label="Your memory index"><p class="empty-list">Loading your notes…</p></nav>
    <p class="hint">Changes apply from your next chat.</p>
  </aside>
  <main id="editor" class="editor"><p class="blank">Loading your notes…</p></main>
</div>
<!-- The page's one confirmation: the question and its two answers are filled in each time it opens. -->
<dialog id="confirm-dialog" class="modal" aria-labelledby="confirm-question">
  <p id="confirm-question"></p>
  <div class="row">
    <button id="confirm-cancel"></button>
    <button id="confirm-ok" data-variant="destructive"></button>
  </div>
</dialog>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
