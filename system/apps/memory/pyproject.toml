[project]
name = "memory-app"
version = "0.1.0"
description = "The Memory app: the notes the agent remembers about the user across chats, to view and edit, and every change an agent made to them, with Undo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The notes and the change log: one library with the chat's memory cards and Claude's change-log hook.
    "agent-memory",
    "app-manifest",
    "app-schema",
    "flask>=3.0",
    "imbue-common",
    "loguru>=0.7",
    "pydantic>=2.0",
    "werkzeug>=3.0",
    # Serves the workspace's themes from this app's own origin (docs/system/blueprint/workspace-themes/).
    "workspace-themes",
]

[dependency-groups]
dev = [
    # What runner_test.py asserts the API document with.
    "app-schema[testing]",
    "pytest>=9.0",
    "pytest-timeout>=2.3.0",
    "inline-snapshot>=0.13",
    "ruff~=0.12.8",
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.87",
]

[project.scripts]
memory-app = "memory_app.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
    "src/memory_app/static/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/memory_app"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP006", "UP007"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = true
case-sensitive = true
order-by-type = false
known-first-party = ["memory_app", "agent_memory", "workspace_themes", "imbue", "app_manifest", "app_schema"]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
