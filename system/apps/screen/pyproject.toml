[project]
name = "screen"
version = "0.1.0"
description = "The Screen: the workspace's one streamed Linux desktop (Xorg, XFCE, PulseAudio, neko) as a window, with a control lease shared by the human and the agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "app-manifest",
    "click>=8.1",
    "flask>=3.0",
    "flask-sock>=0.7",
    "httpx>=0.27",
    "imbue-common",
    "loguru>=0.7",
    "oom-priority",
    # The screenshot route converts neko's JPEG to the PNG the agent asks for by default.
    "pillow>=10",
    "pydantic>=2.0",
    "pydantic-settings>=2.13.1",
    # The clipboard monitor's XFixes notifications; xclip does the selection itself.
    "python-xlib>=0.33",
    # neko's configuration file is YAML, the one format that carries its pipeline list.
    "pyyaml>=6",
    "simple-websocket>=1.0",
    # The reverse proxy's upstream WebSocket to neko and the service's own event subscription.
    "websockets>=13",
    "werkzeug>=3.0",
    # The ``screen open`` verb opens the Screen's window through the shell's op route.
    "workspace-layout",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.3.0",
    "coverage",
    "inline-snapshot>=0.13",
    "ruff~=0.12.8",
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.85",
    "types-pyyaml",
]

[project.scripts]
screen-service = "screen.main:main"
screen-watch = "screen.watch:main"
screen = "screen.cli:main"
agentic-browser-fleet = "screen.fleet_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
    "src/screen/static/**",
    "src/screen/extensions/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/screen"]

[tool.pytest.ini_options]
timeout_func_only = true
markers = [
    "acceptance: marks tests as requiring network access, Modal credentials, etc. These are required to pass in CI",
    "browser: marks tests that drive a browser",
    "frontend: marks tests that read an app's frontend source",
    "real_claude: marks tests that run the real claude binary",
    "flaky: marks tests as known-flaky (retried by offload with a separate retry count)",
]
junit_family = "xunit1"
testpaths = ["."]
addopts = [
  "--durations=20",
  "--timeout=60",
  "--timeout-method=signal",
]

[tool.inline-snapshot]
default-flags=["report"]
default-flags-tui=["report"]
default-flags-ide=["report"]
format-command="uv run ruff format --force-exclude --config pyproject.toml --stdin-filename {filename}"

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "I",
    "UP006",
    "UP007",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
force-single-line = true
case-sensitive = true
order-by-type = false
known-first-party = [
    "screen",
    "imbue",
    "app_manifest",
    "oom_priority",
    "workspace_layout",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
