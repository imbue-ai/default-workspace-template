[project]
name = "skills-app"
version = "0.1.0"
description = "The Skills app: every skill this workspace's agents have, where each came from, and its instructions as written"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "app-manifest",
    "app-schema",
    "flask>=3.0",
    # Asks skills.sh's search on the Add a skill page's behalf.
    "httpx>=0.27",
    "imbue-common",
    # Splits a SKILL.md's frontmatter from its body the way the agents' own loaders do.
    "imbue-mngr",
    "loguru>=0.7",
    "markdown-it-py>=4.0",
    "pydantic>=2.0",
    "skills-catalog",
    "werkzeug>=3.0",
]

[dependency-groups]
dev = [
    # What the API-document test validates the served document with.
    "app-schema[testing]",
    "pytest>=9.0",
    "pytest-timeout>=2.3.0",
    "inline-snapshot>=0.13",
    "ruff~=0.12.8",
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.85",
]

[project.scripts]
skills-app = "skills_app.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skills_app"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP006", "UP007"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = true
case-sensitive = true
order-by-type = false
known-first-party = ["skills_app", "skills_catalog", "imbue", "app_manifest", "app_schema"]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
