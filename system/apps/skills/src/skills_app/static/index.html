<!doctype html>
<html lang="en" data-view="list">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skills</title>
<style>
  /* The workspace's design tokens, copied by name and value from
     system/libs/workspace_ui/src/base.css (this page is plain HTML with no build step, so it
     cannot import that file). Keep the two in step; everything below references only these. */
  :root {
    --c-bg: #fafaf8;
    --c-surface: #ffffff;
    --c-surface-secondary: #f3f2ef;
    --c-text-primary: #202020;
    --c-text-secondary: #666666;
    --c-text-faint: #8c8c8c;
    --c-border: #e4e3df;
    --c-border-faint: #efeeeb;
    --c-accent: #2f6b4f;
    --c-accent-light: #e9f2ee;
    --c-danger-hover: #b62d22;
    --c-warning: #b45309;
    --c-stop-button: #64748b;
    --c-fill-hover: rgb(0 0 0 / 0.07);
    --font-size-heading: 18px;
    --font-size-body: 14px;
    --font-size-row: 13px;
    --font-size-helper: 12px;
    --weight-regular: 400;
    --weight-semibold: 600;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-mono: "SF Mono", "Cascadia Code", ui-monospace, monospace;
    --radius-sm: 4px;
    --radius-md: 6px;
    --dur-base: 120ms;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  /* Thin scrollbars on a clear track: the browser's default draws a grey gutter with its own border. */
  .skill-list, .reader, .instructions pre, .instructions table { scrollbar-width: thin; scrollbar-color: var(--c-border) transparent; }
  body { margin: 0; font-family: var(--font-sans); color: var(--c-text-primary); background: var(--c-surface); font-size: var(--font-size-body); line-height: 1.5; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }
  .error { color: var(--c-danger-hover); }

  .layout { display: grid; grid-template-columns: var(--sidebar-width, 300px) minmax(0, 1fr); height: 100%; }
  .sidebar { position: relative; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--c-border); background: var(--c-surface); }
  /* Files' sidebar edge: an invisible strip astride the border that drags the width, a double-click restoring it. */
  .resize-handle { position: absolute; top: 0; bottom: 0; right: -4px; z-index: 1; width: 8px; cursor: col-resize; touch-action: none; }
  .sidebar-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 16px 16px 10px; }
  h1 { font-size: var(--font-size-heading); font-weight: var(--weight-semibold); line-height: 1.3; margin: 0; overflow-wrap: anywhere; }
  /* The workspace's text field (workspace_ui components/Input.ts) with a glyph inside, as Getting Started's search. */
  .search { position: relative; margin: 0 16px 8px; }
  .search svg { position: absolute; top: 50%; left: 12px; width: 14px; height: 14px; transform: translateY(-50%); color: var(--c-text-faint); pointer-events: none; }
  .search input { display: block; width: 100%; -webkit-appearance: none; appearance: none; padding: 8px 12px 8px 36px; border: 1px solid var(--c-border); border-radius: var(--radius-md); background: var(--c-surface); color: var(--c-text-primary); font: inherit; font-size: var(--font-size-body); transition: border-color var(--dur-base), box-shadow var(--dur-base); }
  .search input::placeholder { color: var(--c-text-faint); }
  .search input:focus-visible { border-color: var(--c-accent); }
  .skill-list { flex: 1; overflow-y: auto; padding: 0 8px 16px; }
  .skill-list h2 { margin: 8px 0 2px; font-size: inherit; }
  .group-toggle { display: flex; align-items: center; gap: 4px; width: 100%; padding: 4px 8px 4px 4px; border: none; border-radius: var(--radius-sm); background: none; color: var(--c-text-secondary); font: inherit; font-size: var(--font-size-helper); font-weight: var(--weight-semibold); text-align: left; cursor: pointer; }
  .group-toggle:hover { background: var(--c-fill-hover); color: var(--c-text-primary); }
  .group-toggle svg { flex: none; width: 14px; height: 14px; transition: transform var(--dur-base); }
  .group-toggle[aria-expanded="false"] svg { transform: rotate(-90deg); }
  .group-count { margin-left: auto; font-weight: var(--weight-regular); color: var(--c-text-faint); }
  .skill-list ul { list-style: none; margin: 0; padding: 0; }
  .skill-list li a { display: block; padding: 7px 8px; border-radius: var(--radius-sm); transition: background-color var(--dur-base); }
  .skill-list li a:hover { background: var(--c-fill-hover); }
  .skill-list li a:focus-visible { outline-offset: -2px; }
  .skill-list li a[aria-current="page"] { background: color-mix(in srgb, var(--c-accent) 11%, var(--c-surface)); }
  .row-name { display: block; font-size: var(--font-size-body); font-weight: var(--weight-semibold); line-height: 1.35; color: var(--c-text-primary); overflow-wrap: anywhere; }
  .row-description { display: block; margin-top: 1px; font-size: var(--font-size-helper); line-height: 1.4; color: var(--c-text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: var(--c-text-secondary); padding: 12px 8px; margin: 0; }

  .actions { display: flex; flex: none; gap: 6px; }
  .icon-button { display: none; flex: none; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; border: 1px solid var(--c-border); border-radius: var(--radius-md); background: var(--c-surface); color: var(--c-text-secondary); cursor: pointer; transition: background-color var(--dur-base); }
  .icon-button:hover { background: var(--c-fill-hover); color: var(--c-text-primary); }
  .icon-button svg { width: 16px; height: 16px; }
  .icon-button.primary { border-color: var(--c-accent); color: var(--c-accent); }
  .icon-button.primary:hover { background: var(--c-accent-light); color: var(--c-accent); }
  /* Each button asks the shell for something (a Files window, a chat), so it only shows once a shell frames the page. */
  :root[data-shell] .icon-button { display: inline-flex; }

  .reader { overflow-y: auto; min-height: 0; }
  .reader:focus { outline: none; }
  article, .intro { max-width: 720px; margin: 0 auto; padding: 24px 32px; }
  .intro { color: var(--c-text-secondary); }
  .back { display: none; color: var(--c-text-secondary); font-size: var(--font-size-row); margin-bottom: 12px; }
  .back:hover { color: var(--c-text-primary); }
  .skill-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  /* The workspace's badge (workspace_ui components/Badge.ts): outline chips, one tone per source of a skill. */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { display: inline-flex; align-items: center; padding: 2px 8px; border: 1px solid var(--c-border); border-radius: 8px; background: var(--c-surface); color: var(--c-text-secondary); font-size: var(--font-size-helper); line-height: 1.4; white-space: nowrap; }
  .chip.workspace { border-color: var(--c-accent); color: var(--c-accent); }
  .chip.installed { border-color: var(--c-warning); color: var(--c-warning); }
  .chip.studio { border-color: var(--c-stop-button); color: var(--c-stop-button); }
  .section-heading { display: flex; align-items: baseline; gap: 6px; font-size: var(--font-size-helper); font-weight: var(--weight-semibold); color: var(--c-text-secondary); line-height: 1.3; margin: 0; }
  .section-source { font-weight: var(--weight-regular); color: var(--c-text-faint); }
  .skill-section { margin-top: 20px; max-width: 68ch; font-size: 15px; }
  .skill-section > p { margin: 4px 0 0; }
  .instructions { margin-top: 4px; line-height: 1.6; overflow-wrap: anywhere; }
  .instructions > :first-child { margin-top: 0; }
  /* Collapsed to what fits the window, fading out above the control that shows the rest. */
  .instructions.clamped { overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 56px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 56px), transparent); }
  .expand { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; padding: 4px 8px 4px 4px; border: none; border-radius: var(--radius-sm); background: none; color: var(--c-text-secondary); font: inherit; font-size: var(--font-size-row); cursor: pointer; }
  .expand:hover { background: var(--c-fill-hover); color: var(--c-text-primary); }
  .expand svg { width: 16px; height: 16px; transition: transform var(--dur-base); }
  .expand[aria-expanded="true"] svg { transform: rotate(180deg); }
  .expand[hidden] { display: none; }
  .instructions h1, .instructions h2, .instructions h3, .instructions h4 { font-weight: var(--weight-semibold); line-height: 1.3; margin: 24px 0 8px; }
  .instructions h1 { font-size: 17px; }
  .instructions h2 { font-size: 16px; }
  .instructions h3, .instructions h4 { font-size: 15px; }
  .instructions p, .instructions ul, .instructions ol, .instructions blockquote, .instructions table, .instructions pre { margin: 0 0 12px; }
  .instructions ul, .instructions ol { padding-left: 22px; }
  .instructions li + li { margin-top: 2px; }
  .instructions a { color: var(--c-accent); text-decoration: underline; text-underline-offset: 2px; }
  .instructions code { font-family: var(--font-mono); font-size: 0.88em; padding: 1px 4px; border-radius: var(--radius-sm); background: var(--c-surface-secondary); }
  .instructions pre { padding: 10px 12px; border-radius: var(--radius-md); background: var(--c-surface-secondary); overflow-x: auto; line-height: 1.5; }
  .instructions pre code { padding: 0; background: none; font-size: var(--font-size-helper); overflow-wrap: normal; }
  .instructions blockquote { padding-left: 12px; border-left: 3px solid var(--c-border); color: var(--c-text-secondary); }
  .instructions table { border-collapse: collapse; font-size: var(--font-size-row); display: block; overflow-x: auto; }
  .instructions th, .instructions td { padding: 4px 10px 4px 0; border-bottom: 1px solid var(--c-border-faint); text-align: left; vertical-align: top; }
  .instructions th { font-weight: var(--weight-semibold); border-bottom-color: var(--c-border); }
  .instructions hr { border: none; border-top: 1px solid var(--c-border); margin: 20px 0; }


  /* Too narrow for both panes: the list, or one skill with a way back to it. */
  @media (max-width: 640px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .sidebar { border-right: none; }
    .resize-handle { display: none; }
    :root[data-view="skill"] .sidebar, :root[data-view="list"] .reader { display: none; }
    .back { display: inline-block; }
    article { padding: 16px; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar" aria-label="Skills">
    <div class="sidebar-head">
      <h1>Skills</h1>
      <div class="actions">
        <a class="icon-button" id="skills-folder" title="Open the skills folder in Files" aria-label="Open the skills folder in Files"></a>
        <button type="button" class="icon-button primary" id="new-skill" title="Make a new skill" aria-label="Make a new skill"></button>
      </div>
    </div>
    <div class="search" id="search-field">
      <input type="search" id="search" placeholder="Search skills" aria-label="Search skills">
    </div>
    <div class="skill-list" id="skill-list"><p class="empty">Loading...</p></div>
    <div class="resize-handle" id="resize-handle" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"></div>
  </nav>
  <main class="reader" id="reader" tabindex="-1"></main>
</div>
<script type="module">
  import { connectToShell } from "/_static/app_contract.js";
  import { installElementContextMenu } from "/_static/context_menu.js";

  // A skill's own text is shown through textContent, and its instructions arrive as HTML the server rendered with
  // raw HTML escaped: a skill installed from elsewhere is content this page does not trust.
  const GROUPS = [
    ["Made in this workspace", "WORKSPACE"],
    ["Installed", "INSTALLED"],
    ["Comes with Studio", "STUDIO"],
  ];
  // Glyphs from the workspace's icon set (system/libs/workspace_ui/src/components/icons.ts), on its 24x24 stroke frame.
  const ICON_PATHS = {
    folder: '<path d="M5.34 3.72C7.32 3.67 8.61 3.72 9.46 3.81C10.45 3.91 10.97 4.43 11.54 5.28C12.11 6.13 12.44 6.56 13.34 6.61C15.22 6.7 17.72 6.51 19.66 6.61C21.27 6.7 22.09 7.93 21.99 9.49C21.85 12.04 21.47 15.26 21.04 17.77C20.76 19.38 19.77 20.18 17.97 20.23C13.81 20.32 8.37 20.32 4.72 20.18C2.97 20.09 2.23 19.52 2.11 17.77C1.79 13.39 2.26 9.21 2.5 6.56C2.64 4.71 3.54 3.77 5.34 3.72Z"/>',
    edit: '<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',
    plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
    "chevron-down": '<path d="m6 9 6 6 6-6"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  };
  // Files opens a file's ?edit page for this message (its app.toml); the shell routes it there without naming the app.
  const EDIT_FILE_MESSAGE = "edit:file";
  const NEW_SKILL_TEXT = "Help me make a new skill.";
  const WIDE = window.matchMedia("(min-width: 641px)");
  const root = document.documentElement;
  const listNode = document.getElementById("skill-list");
  const reader = document.getElementById("reader");
  const search = document.getElementById("search");
  const skillsFolderLink = document.getElementById("skills-folder");
  let skills = [];
  let shell;
  let latestLoad = 0;
  let isInstructionsExpanded = false;

  // Per-viewer conveniences kept in this browser: the sidebar's width and which groups are folded. Storage can be
  // missing or refuse (a private window), so every read and write is allowed to fail.
  const SIDEBAR_WIDTH_KEY = "skills-sidebar-width";
  const COLLAPSED_GROUPS_KEY = "skills-collapsed-groups";
  const DEFAULT_SIDEBAR_WIDTH = 300;
  const MIN_SIDEBAR_WIDTH = 220;
  const MAX_SIDEBAR_WIDTH = 480;

  function readStored(key) {
    try {
      return localStorage.getItem(key);
    } catch {
      return null;
    }
  }

  function writeStored(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch {
      // Not kept: the page still works, it just forgets.
    }
  }

  function storedCollapsedGroups() {
    try {
      const parsed = JSON.parse(readStored(COLLAPSED_GROUPS_KEY) ?? "[]");
      return new Set(Array.isArray(parsed) ? parsed : []);
    } catch {
      return new Set();
    }
  }

  const collapsedGroups = storedCollapsedGroups();

  function element(tag, attributes = {}, children = []) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attributes)) {
      if (key === "text") node.textContent = value;
      else node.setAttribute(key, value);
    }
    for (const child of children) node.append(child);
    return node;
  }

  // "Build an app", "build-app" and "Build_App" all name the same skill.
  function isSameName(heading, name) {
    const words = (text) => text.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
    return words(heading) === words(name);
  }

  function iconSvg(name) {
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name]}</svg>`;
  }

  function withIcon(node, name) {
    node.insertAdjacentHTML("afterbegin", iconSvg(name));
    return node;
  }

  function fileUrl(path) {
    return `file://${path.split("/").map(encodeURIComponent).join("/")}`;
  }

  function authorChip(summary) {
    switch (summary.source) {
      case "STUDIO":
        return element("span", { class: "chip studio", text: "Comes with Studio" });
      case "INSTALLED":
        return element("span", { class: "chip installed", text: summary.install_source ? `Installed from ${summary.install_source.source}` : "Installed" });
      default:
        return element("span", { class: "chip workspace", text: summary.author ? `Made by ${summary.author}` : "Made in this workspace" });
    }
  }

  function startOfDay(time) {
    return new Date(time.getFullYear(), time.getMonth(), time.getDate()).getTime();
  }

  // Files' wording for when something changed (apps/files/frontend/src/models/format.ts).
  function formatWhen(iso) {
    const when = new Date(iso);
    const clock = when.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    const dayDelta = Math.round((startOfDay(new Date()) - startOfDay(when)) / 86_400_000);
    if (dayDelta === 0) return `today at ${clock}`;
    if (dayDelta === 1) return `yesterday at ${clock}`;
    return `${when.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" })} at ${clock}`;
  }

  async function fetchJson(path) {
    const response = await fetch(path, { cache: "no-store" });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.detail ?? body.error ?? `The workspace answered ${response.status}.`);
    return body;
  }

  function selectedName() {
    return decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g, ""));
  }

  function reportLocation() {
    shell?.location(location.pathname + location.search, document.title);
  }

  function go(name) {
    const path = name ? `/${encodeURIComponent(name)}` : "/";
    if (path !== location.pathname) history.pushState(null, "", path);
    route();
  }

  function isPlainClick(event) {
    return event.button === 0 && !event.metaKey && !event.ctrlKey && !event.shiftKey && !event.altKey;
  }

  function renderList() {
    const query = search.value.trim().toLowerCase();
    const shown = skills.filter((skill) => !query || `${skill.name} ${skill.title} ${skill.description}`.toLowerCase().includes(query));
    const sections = GROUPS.map(([heading, source]) => [heading, source, shown.filter((skill) => skill.source === source)])
      .filter(([, , members]) => members.length)
      .map(([heading, source, members]) => {
        // A search shows its matches in every group, folded or not.
        const isExpanded = Boolean(query) || !collapsedGroups.has(source);
        const toggle = withIcon(element("button", { type: "button", class: "group-toggle", "aria-expanded": String(isExpanded) }, [
          element("span", { text: heading }),
          element("span", { class: "group-count", text: String(members.length) }),
        ]), "chevron-down");
        toggle.addEventListener("click", () => {
          if (collapsedGroups.has(source)) collapsedGroups.delete(source);
          else collapsedGroups.add(source);
          writeStored(COLLAPSED_GROUPS_KEY, JSON.stringify([...collapsedGroups]));
          renderList();
        });
        const rows = members.map((skill) =>
          element("li", {}, [
            element("a", { href: `/${encodeURIComponent(skill.name)}`, "data-skill": skill.name }, [
              element("span", { class: "row-name", text: skill.title }),
              element("span", { class: "row-description", text: skill.description || "No description." }),
            ]),
          ]),
        );
        return element("section", {}, [element("h2", {}, [toggle]), ...(isExpanded ? [element("ul", {}, rows)] : [])]);
      });
    listNode.replaceChildren(...(sections.length ? sections : [element("p", { class: "empty", text: "No skills match." })]));
    markSelected();
  }

  function markSelected() {
    const name = selectedName();
    for (const link of listNode.querySelectorAll("a[data-skill]")) {
      if (link.dataset.skill === name) link.setAttribute("aria-current", "page");
      else link.removeAttribute("aria-current");
    }
  }

  function showIntro() {
    document.title = "Skills";
    reader.replaceChildren(element("p", { class: "intro", text: "Skills are what your agents know how to do. Pick one to read its instructions." }));
    reportLocation();
  }

  // A refresh of the skill already showing keeps where the reader was: expanded or not, and scrolled to.
  async function showSkill(name, { isRefresh = false } = {}) {
    const load = ++latestLoad;
    const scrolledTo = reader.scrollTop;
    let detail;
    let instructions;
    try {
      [detail, instructions] = await Promise.all([
        fetchJson(`/api/skills/${encodeURIComponent(name)}`),
        fetchJson(`/api/skills/${encodeURIComponent(name)}/instructions`),
      ]);
    } catch (error) {
      if (load !== latestLoad) return;
      reader.replaceChildren(element("article", {}, [element("a", { class: "back", href: "/" , text: "All skills" }), element("p", { class: "error", text: error.message })]));
      return;
    }
    if (load !== latestLoad) return;
    const summary = detail.summary;
    document.title = `${summary.title} - Skills`;
    const body = element("div", { class: "instructions" });
    body.innerHTML = instructions.html;
    // Headings that only repeat what the page already says above them: the skill's name, or the section's own label.
    const repeated = [summary.name, summary.title, "Instructions"];
    while (body.firstElementChild?.matches("h1, h2") && repeated.some((name) => isSameName(body.firstElementChild.textContent, name))) {
      body.firstElementChild.remove();
    }
    const skillFile = `${detail.directory}/SKILL.md`;
    const editButton = withIcon(element("button", { type: "button", class: "icon-button", title: "Edit SKILL.md in Files", "aria-label": "Edit SKILL.md in Files" }), "edit");
    editButton.addEventListener("click", () => shell.sendMessage(EDIT_FILE_MESSAGE, { path: skillFile }));
    const expand = withIcon(element("button", { type: "button", class: "expand", "aria-expanded": "false", hidden: "" }, [element("span", { text: "Show all" })]), "chevron-down");
    expand.addEventListener("click", () => {
      isInstructionsExpanded = !isInstructionsExpanded;
      clampInstructions();
    });
    if (!isRefresh) isInstructionsExpanded = false;
    reader.replaceChildren(
      element("article", {}, [
        element("a", { class: "back", href: "/", text: "All skills" }),
        element("header", { class: "skill-head" }, [
          element("div", {}, [
            element("h1", { text: summary.title }),
            element("div", { class: "chips" }, [authorChip(summary), element("span", { class: "chip", text: `Last updated ${formatWhen(summary.last_updated_at)}` })]),
          ]),
          element("div", { class: "actions" }, [
            withIcon(element("a", { class: "icon-button", href: fileUrl(detail.directory), title: "Open this skill's folder in Files", "aria-label": "Open this skill's folder in Files" }), "folder"),
            editButton,
          ]),
        ]),
        element("section", { class: "skill-section", "aria-labelledby": "description-heading" }, [
          element("h2", { class: "section-heading", id: "description-heading", text: "Description" }),
          element("p", { text: summary.description || "No description." }),
        ]),
        element("section", { class: "skill-section", "aria-labelledby": "instructions-heading" }, [
          element("h2", { class: "section-heading", id: "instructions-heading" }, [
            "Instructions",
            element("span", { class: "section-source", text: "from SKILL.md" }),
          ]),
          body,
          expand,
        ]),
      ]),
    );
    clampInstructions();
    reader.scrollTop = isRefresh ? scrolledTo : 0;
    reportLocation();
  }

  // Collapsed, the instructions take what is left of the window under the header and description, so the page does not
  // scroll until they are shown in full; the control only appears when they would not fit.
  const MIN_CLAMPED_HEIGHT = 120;
  function clampInstructions() {
    const body = reader.querySelector(".instructions");
    const expand = reader.querySelector(".expand");
    if (!body || !expand) return;
    body.classList.remove("clamped");
    body.style.maxHeight = "";
    const article = reader.querySelector("article");
    const bodyTop = body.getBoundingClientRect().top - reader.getBoundingClientRect().top + reader.scrollTop;
    const expandHeight = expand.offsetHeight || 32;
    const bottomPadding = parseFloat(getComputedStyle(article).paddingBottom);
    const room = Math.max(MIN_CLAMPED_HEIGHT, Math.floor(reader.clientHeight - bodyTop - expandHeight - bottomPadding - 4));
    const fits = body.scrollHeight <= room;
    expand.hidden = fits;
    expand.setAttribute("aria-expanded", String(isInstructionsExpanded));
    expand.querySelector("span").textContent = isInstructionsExpanded ? "Show less" : "Show all";
    if (fits || isInstructionsExpanded) return;
    body.classList.add("clamped");
    body.style.maxHeight = `${room}px`;
  }

  function route() {
    const name = selectedName();
    root.dataset.view = name ? "skill" : "list";
    markSelected();
    if (name) showSkill(name);
    else showIntro();
  }

  // A plain click on a page of this app stays in this window; any other click is the shell's to follow.
  document.addEventListener("click", (event) => {
    const link = event.target.closest("a[href]");
    if (!link || !isPlainClick(event)) return;
    const url = new URL(link.href);
    if (url.origin !== location.origin || url.pathname.startsWith("/api/")) return;
    if (url.pathname === location.pathname && url.hash) return;
    event.preventDefault();
    go(decodeURIComponent(url.pathname.replace(/^\/+|\/+$/g, "")));
  });

  // The arrow keys walk the list; with both panes showing, each step opens the skill it lands on.
  listNode.addEventListener("keydown", (event) => {
    if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
    const links = [...listNode.querySelectorAll("a[data-skill]")];
    const next = links[links.indexOf(document.activeElement) + (event.key === "ArrowDown" ? 1 : -1)];
    if (!next) return;
    event.preventDefault();
    next.focus();
    if (WIDE.matches) go(next.dataset.skill);
  });
  search.addEventListener("keydown", (event) => {
    if (event.key !== "ArrowDown") return;
    const first = listNode.querySelector("a[data-skill]");
    if (!first) return;
    event.preventDefault();
    first.focus();
  });
  search.addEventListener("input", renderList);
  search.addEventListener("keydown", (event) => {
    if (event.key !== "Escape" || !search.value) return;
    event.preventDefault();
    search.value = "";
    renderList();
  });
  withIcon(document.getElementById("search-field"), "search");

  function setSidebarWidth(width, persist) {
    const clamped = Math.round(Math.min(MAX_SIDEBAR_WIDTH, Math.max(MIN_SIDEBAR_WIDTH, width)));
    root.style.setProperty("--sidebar-width", `${clamped}px`);
    if (persist) writeStored(SIDEBAR_WIDTH_KEY, String(clamped));
  }

  const storedWidth = Number.parseFloat(readStored(SIDEBAR_WIDTH_KEY) ?? "");
  setSidebarWidth(Number.isFinite(storedWidth) ? storedWidth : DEFAULT_SIDEBAR_WIDTH, false);
  const resizeHandle = document.getElementById("resize-handle");
  resizeHandle.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    resizeHandle.setPointerCapture(event.pointerId);
    const startX = event.clientX;
    const startWidth = document.querySelector(".sidebar").getBoundingClientRect().width;
    const widthAt = (moveEvent) => startWidth + moveEvent.clientX - startX;
    const onMove = (moveEvent) => setSidebarWidth(widthAt(moveEvent), false);
    const onUp = (upEvent) => {
      resizeHandle.removeEventListener("pointermove", onMove);
      resizeHandle.removeEventListener("pointerup", onUp);
      setSidebarWidth(widthAt(upEvent), true);
    };
    resizeHandle.addEventListener("pointermove", onMove);
    resizeHandle.addEventListener("pointerup", onUp);
  });
  resizeHandle.addEventListener("dblclick", () => setSidebarWidth(DEFAULT_SIDEBAR_WIDTH, true));
  window.addEventListener("popstate", route);
  new ResizeObserver(() => {
    if (!isInstructionsExpanded) clampInstructions();
  }).observe(reader);

  // Coming back to the window after editing a skill in Files shows the edit.
  async function refresh() {
    await loadListing();
    if (selectedName()) showSkill(selectedName(), { isRefresh: true });
  }

  async function loadListing() {
    try {
      const listing = await fetchJson("/api/skills");
      skills = listing.skills;
      skillsFolderLink.href = fileUrl(listing.skills_directory);
      renderList();
    } catch (error) {
      listNode.replaceChildren(element("p", { class: "empty error", text: error.message }));
    }
  }

  withIcon(skillsFolderLink, "folder");
  const newSkillButton = withIcon(document.getElementById("new-skill"), "plus");
  newSkillButton.addEventListener("click", () => shell.startWithText(NEW_SKILL_TEXT));

  // Connected before the frame's load event, the only time the shell sends its handshake.
  let handshake = null;
  shell = connectToShell({
    onHandshake: (received) => {
      handshake = received;
      root.dataset.shell = "";
      reportLocation();
    },
    onShown: () => void refresh(),
  });
  installElementContextMenu({ connection: shell, handshake: () => handshake });

  route();
  await loadListing();
  listNode.querySelector('a[aria-current="page"]')?.scrollIntoView({ block: "center" });
</script>
</body>
</html>
