<!doctype html>
<html lang="en" data-view="list">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skills</title>
<style>
  /* The workspace's design tokens, copied by name and value from
     system/libs/workspace_ui/src/base.css (this page is plain HTML with no build step, so it
     cannot import that file). Keep the two in step; everything below references only these. */
  :root {
    --c-bg: #fafaf8;
    --c-surface: #ffffff;
    --c-surface-secondary: #f3f2ef;
    --c-text-primary: #202020;
    --c-text-secondary: #666666;
    --c-text-faint: #8c8c8c;
    --c-border: #e4e3df;
    --c-border-faint: #efeeeb;
    --c-accent: #2f6b4f;
    --c-danger-hover: #b62d22;
    --c-fill-hover: rgb(0 0 0 / 0.07);
    --font-size-heading: 18px;
    --font-size-body: 14px;
    --font-size-row: 13px;
    --font-size-helper: 12px;
    --weight-regular: 400;
    --weight-semibold: 600;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-mono: "SF Mono", "Cascadia Code", ui-monospace, monospace;
    --radius-sm: 4px;
    --radius-md: 6px;
    --dur-base: 120ms;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--font-sans); color: var(--c-text-primary); background: var(--c-bg); font-size: var(--font-size-body); line-height: 1.5; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible, input:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }
  .error { color: var(--c-danger-hover); }

  .layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100%; }
  .sidebar { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--c-border); background: var(--c-surface); }
  .sidebar-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 16px 16px 10px; }
  h1 { font-size: var(--font-size-heading); font-weight: var(--weight-semibold); line-height: 1.3; margin: 0; overflow-wrap: anywhere; }
  input[type="search"] { margin: 0 16px 8px; padding: 6px 10px; border: 1px solid var(--c-border); border-radius: var(--radius-md); background: var(--c-surface); font: inherit; }
  .skill-list { flex: 1; overflow-y: auto; padding: 0 8px 16px; }
  .skill-list h2 { font-size: var(--font-size-helper); font-weight: var(--weight-semibold); color: var(--c-text-secondary); margin: 12px 8px 4px; }
  .skill-list ul { list-style: none; margin: 0; padding: 0; }
  .skill-list li a { display: block; padding: 6px 8px; border-radius: var(--radius-sm); transition: background-color var(--dur-base); }
  .skill-list li a:hover { background: var(--c-fill-hover); }
  .skill-list li a:focus-visible { outline-offset: -2px; }
  .skill-list li a[aria-current="page"] { background: color-mix(in srgb, var(--c-accent) 11%, var(--c-surface)); }
  .row-name { display: block; font-size: var(--font-size-row); font-weight: var(--weight-semibold); overflow-wrap: anywhere; }
  .row-description { display: block; font-size: var(--font-size-helper); color: var(--c-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: var(--c-text-secondary); padding: 12px 8px; margin: 0; }

  .files-link { display: none; flex: none; align-items: center; padding: 3px 10px; border: 1px solid var(--c-border); border-radius: var(--radius-md); background: var(--c-surface); color: var(--c-text-secondary); font-size: var(--font-size-helper); white-space: nowrap; transition: background-color var(--dur-base); }
  .files-link:hover { background: var(--c-fill-hover); color: var(--c-text-primary); }
  /* A file link only goes anywhere through the shell, which opens it in Files. */
  :root[data-shell] .files-link { display: inline-flex; }

  .reader { overflow-y: auto; min-height: 0; }
  .reader:focus { outline: none; }
  article, .intro { max-width: 720px; padding: 24px 32px 48px; }
  .intro { color: var(--c-text-secondary); }
  .back { display: none; color: var(--c-text-secondary); font-size: var(--font-size-row); margin-bottom: 12px; }
  .back:hover { color: var(--c-text-primary); }
  .skill-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .origin { color: var(--c-text-secondary); font-size: var(--font-size-helper); margin: 2px 0 0; }
  .section-heading { font-size: var(--font-size-helper); font-weight: var(--weight-semibold); color: var(--c-text-secondary); line-height: 1.3; margin: 0; }
  .description { margin-top: 20px; }
  .description p { font-size: 15px; margin: 4px 0 0; max-width: 68ch; }

  /* The instructions read as the file they come from: a panel of their own, under a strip that names it. */
  .document { margin-top: 24px; border: 1px solid var(--c-border); border-radius: var(--radius-md); background: var(--c-surface); }
  .document-head { display: flex; align-items: baseline; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--c-border-faint); background: var(--c-surface-secondary); border-radius: var(--radius-md) var(--radius-md) 0 0; }
  .document-file { font-family: var(--font-mono); font-size: var(--font-size-helper); color: var(--c-text-faint); }
  .instructions { padding: 16px 20px 8px; max-width: calc(68ch + 40px); line-height: 1.6; overflow-wrap: anywhere; }
  .instructions > :first-child { margin-top: 0; }
  .instructions h1, .instructions h2, .instructions h3, .instructions h4 { font-weight: var(--weight-semibold); line-height: 1.3; margin: 24px 0 8px; }
  .instructions h1 { font-size: 16px; }
  .instructions h2 { font-size: 15px; }
  .instructions h3, .instructions h4 { font-size: var(--font-size-body); }
  .instructions p, .instructions ul, .instructions ol, .instructions blockquote, .instructions table, .instructions pre { margin: 0 0 12px; }
  .instructions ul, .instructions ol { padding-left: 22px; }
  .instructions li + li { margin-top: 2px; }
  .instructions a { color: var(--c-accent); text-decoration: underline; text-underline-offset: 2px; }
  .instructions code { font-family: var(--font-mono); font-size: 0.88em; padding: 1px 4px; border-radius: var(--radius-sm); background: var(--c-surface-secondary); }
  .instructions pre { padding: 10px 12px; border-radius: var(--radius-md); background: var(--c-surface-secondary); overflow-x: auto; line-height: 1.5; }
  .instructions pre code { padding: 0; background: none; font-size: var(--font-size-helper); overflow-wrap: normal; }
  .instructions blockquote { padding-left: 12px; border-left: 3px solid var(--c-border); color: var(--c-text-secondary); }
  .instructions table { border-collapse: collapse; font-size: var(--font-size-row); display: block; overflow-x: auto; }
  .instructions th, .instructions td { padding: 4px 10px 4px 0; border-bottom: 1px solid var(--c-border-faint); text-align: left; vertical-align: top; }
  .instructions th { font-weight: var(--weight-semibold); border-bottom-color: var(--c-border); }
  .instructions hr { border: none; border-top: 1px solid var(--c-border); margin: 20px 0; }


  /* Too narrow for both panes: the list, or one skill with a way back to it. */
  @media (max-width: 640px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .sidebar { border-right: none; }
    :root[data-view="skill"] .sidebar, :root[data-view="list"] .reader { display: none; }
    .back { display: inline-block; }
    article { padding: 16px 16px 40px; }
    .instructions { padding: 12px 14px 4px; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar" aria-label="Skills">
    <div class="sidebar-head">
      <h1>Skills</h1>
      <a class="files-link" id="skills-folder" title="Open the skills folder in Files">Show in Files</a>
    </div>
    <input type="search" id="search" placeholder="Search skills" aria-label="Search skills">
    <div class="skill-list" id="skill-list"><p class="empty">Loading...</p></div>
  </nav>
  <main class="reader" id="reader" tabindex="-1"></main>
</div>
<script type="module">
  import { connectToShell } from "/_static/app_contract.js";
  import { installElementContextMenu } from "/_static/context_menu.js";

  // A skill's own text is shown through textContent, and its instructions arrive as HTML the server rendered with
  // raw HTML escaped: a skill installed from elsewhere is content this page does not trust.
  const YOURS = new Set(["INSTALLED", "MADE_HERE", "NOT_SAVED"]);
  const GROUPS = [
    ["Yours", (skill) => YOURS.has(skill.origin)],
    ["Built in", (skill) => !YOURS.has(skill.origin)],
  ];
  const WIDE = window.matchMedia("(min-width: 641px)");
  const root = document.documentElement;
  const listNode = document.getElementById("skill-list");
  const reader = document.getElementById("reader");
  const search = document.getElementById("search");
  const skillsFolderLink = document.getElementById("skills-folder");
  let skills = [];
  let shell;
  let latestLoad = 0;

  function element(tag, attributes = {}, children = []) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attributes)) {
      if (key === "text") node.textContent = value;
      else node.setAttribute(key, value);
    }
    for (const child of children) node.append(child);
    return node;
  }

  // "Build an app", "build-app" and "Build_App" all name the same skill.
  function isSameName(heading, name) {
    const words = (text) => text.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
    return words(heading) === words(name);
  }

  function fileUrl(path) {
    return `file://${path.split("/").map(encodeURIComponent).join("/")}`;
  }

  function originText(summary) {
    switch (summary.origin) {
      case "BUILT_IN":
        return "Built in";
      case "CHANGED_HERE":
        return "Built in, changed in this workspace";
      case "INSTALLED":
        return summary.install_source ? `Installed from ${summary.install_source.source}` : "Installed";
      default:
        return "Made in this workspace";
    }
  }

  async function fetchJson(path) {
    const response = await fetch(path, { cache: "no-store" });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.detail ?? body.error ?? `The workspace answered ${response.status}.`);
    return body;
  }

  function selectedName() {
    return decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g, ""));
  }

  function reportLocation() {
    shell?.location(location.pathname + location.search, document.title);
  }

  function go(name) {
    const path = name ? `/${encodeURIComponent(name)}` : "/";
    if (path !== location.pathname) history.pushState(null, "", path);
    route();
  }

  function isPlainClick(event) {
    return event.button === 0 && !event.metaKey && !event.ctrlKey && !event.shiftKey && !event.altKey;
  }

  function renderList() {
    const query = search.value.trim().toLowerCase();
    const shown = skills.filter((skill) => !query || `${skill.name} ${skill.title} ${skill.description}`.toLowerCase().includes(query));
    const sections = GROUPS.map(([heading, belongs]) => [heading, shown.filter(belongs)])
      .filter(([, members]) => members.length)
      .map(([heading, members]) =>
        element("section", {}, [
          element("h2", { text: heading }),
          element("ul", {}, members.map((skill) =>
            element("li", {}, [
              element("a", { href: `/${encodeURIComponent(skill.name)}`, "data-skill": skill.name }, [
                element("span", { class: "row-name", text: skill.title }),
                element("span", { class: "row-description", text: skill.description || "No description." }),
              ]),
            ]),
          )),
        ]),
      );
    listNode.replaceChildren(...(sections.length ? sections : [element("p", { class: "empty", text: "No skills match." })]));
    markSelected();
  }

  function markSelected() {
    const name = selectedName();
    for (const link of listNode.querySelectorAll("a[data-skill]")) {
      if (link.dataset.skill === name) link.setAttribute("aria-current", "page");
      else link.removeAttribute("aria-current");
    }
  }

  function showIntro() {
    document.title = "Skills";
    reader.replaceChildren(element("p", { class: "intro", text: "Skills are what your agents know how to do. Pick one to read its instructions." }));
    reportLocation();
  }

  async function showSkill(name) {
    const load = ++latestLoad;
    let detail;
    let instructions;
    try {
      [detail, instructions] = await Promise.all([
        fetchJson(`/api/skills/${encodeURIComponent(name)}`),
        fetchJson(`/api/skills/${encodeURIComponent(name)}/instructions`),
      ]);
    } catch (error) {
      if (load !== latestLoad) return;
      reader.replaceChildren(element("article", {}, [element("a", { class: "back", href: "/" , text: "All skills" }), element("p", { class: "error", text: error.message })]));
      return;
    }
    if (load !== latestLoad) return;
    const summary = detail.summary;
    document.title = `${summary.title} - Skills`;
    const body = element("div", { class: "instructions" });
    body.innerHTML = instructions.html;
    // Headings that only repeat what the page already says above them: the skill's name, or the section's own label.
    const repeated = [summary.name, summary.title, "Instructions"];
    while (body.firstElementChild?.matches("h1, h2") && repeated.some((name) => isSameName(body.firstElementChild.textContent, name))) {
      body.firstElementChild.remove();
    }
    reader.replaceChildren(
      element("article", {}, [
        element("a", { class: "back", href: "/", text: "All skills" }),
        element("header", { class: "skill-head" }, [
          element("div", {}, [element("h1", { text: summary.title }), element("p", { class: "origin", text: originText(summary) })]),
          element("a", { class: "files-link", href: fileUrl(detail.directory), title: "Open this skill's folder in Files", text: "Show in Files" }),
        ]),
        element("section", { class: "description", "aria-labelledby": "description-heading" }, [
          element("h2", { class: "section-heading", id: "description-heading", text: "Description" }),
          element("p", { text: summary.description || "No description." }),
        ]),
        element("section", { class: "document", "aria-labelledby": "instructions-heading" }, [
          element("div", { class: "document-head" }, [
            element("h2", { class: "section-heading", id: "instructions-heading", text: "Instructions" }),
            element("span", { class: "document-file", text: "SKILL.md" }),
          ]),
          body,
        ]),
      ]),
    );
    reader.scrollTop = 0;
    reportLocation();
  }

  function route() {
    const name = selectedName();
    root.dataset.view = name ? "skill" : "list";
    markSelected();
    if (name) showSkill(name);
    else showIntro();
  }

  // A plain click on a page of this app stays in this window; any other click is the shell's to follow.
  document.addEventListener("click", (event) => {
    const link = event.target.closest("a[href]");
    if (!link || !isPlainClick(event)) return;
    const url = new URL(link.href);
    if (url.origin !== location.origin || url.pathname.startsWith("/api/")) return;
    if (url.pathname === location.pathname && url.hash) return;
    event.preventDefault();
    go(decodeURIComponent(url.pathname.replace(/^\/+|\/+$/g, "")));
  });

  // The arrow keys walk the list; with both panes showing, each step opens the skill it lands on.
  listNode.addEventListener("keydown", (event) => {
    if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
    const links = [...listNode.querySelectorAll("a[data-skill]")];
    const next = links[links.indexOf(document.activeElement) + (event.key === "ArrowDown" ? 1 : -1)];
    if (!next) return;
    event.preventDefault();
    next.focus();
    if (WIDE.matches) go(next.dataset.skill);
  });
  search.addEventListener("keydown", (event) => {
    if (event.key !== "ArrowDown") return;
    const first = listNode.querySelector("a[data-skill]");
    if (!first) return;
    event.preventDefault();
    first.focus();
  });
  search.addEventListener("input", renderList);
  window.addEventListener("popstate", route);

  // Connected before the frame's load event, the only time the shell sends its handshake.
  let handshake = null;
  shell = connectToShell({
    onHandshake: (received) => {
      handshake = received;
      root.dataset.shell = "";
      reportLocation();
    },
  });
  installElementContextMenu({ connection: shell, handshake: () => handshake });

  route();
  try {
    const listing = await fetchJson("/api/skills");
    skills = listing.skills;
    skillsFolderLink.href = fileUrl(listing.skills_directory);
    renderList();
    listNode.querySelector('a[aria-current="page"]')?.scrollIntoView({ block: "center" });
  } catch (error) {
    listNode.replaceChildren(element("p", { class: "empty error", text: error.message }));
  }
</script>
</body>
</html>
