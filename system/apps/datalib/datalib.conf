# The Datalib app's supervisord program: datalib's web UI (datalib-http) over
# the store the datalib skill writes. system/apps/datalib/launch_datalib_http.py
# (standard library only, like forward_port.py) registers the app's manifest
# with the API token on its launch path and the datalib-http port 8731 via
# forward_port.py, then execs ~/.local/bin/datalib-http.
#
# datalib is not announced to users yet, so this file is not in
# system/supervisord.conf.d/ and supervisord does not know the program. The
# datalib skill's scripts/install_datalib.sh copies it there the first time
# datalib is used, after the binaries are installed, and loads it with
# `supervisorctl reread` and `supervisorctl update`. From then on it is an
# ordinary program in that workspace: it starts at boot and comes back after a
# restore. The installed copy is gitignored, so it never shows as a change in
# the workspace's repository.
#
# Started in the `user` band, the floor the OOM backstop holds it to; the
# launcher then raises itself to the agent-subprocess band (900) before it
# execs datalib-http, so datalib and its sync steps are shed before any agent
# or service.
[program:datalib]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user python3 system/apps/datalib/launch_datalib_http.py
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/datalib-stdout.log
stderr_logfile=/var/log/supervisor/datalib-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
