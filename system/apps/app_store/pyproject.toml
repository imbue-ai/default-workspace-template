[project]
name = "app-store"
version = "0.1.0"
description = "The App Store app: one-click installs of curated open-source apps, and the published templates to adopt"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "app-manifest",
    "app-schema",
    "click>=8.1",
    "flask>=3.0",
    "httpx>=0.27",
    "imbue-common",
    "loguru>=0.7",
    "pydantic>=2.0",
    "pydantic-settings>=2.13.1",
    "werkzeug>=3.0",
    # The template catalog (fetch, cache, last good copy) and the page-serving helpers, shared rather than copied.
    "getting-started",
    # read_meminfo: available memory as the memory guard reads it.
    "oom-priority",
    # Python versions and wheel tags, for checking and estimating packages a user adds.
    "packaging>=24",
    # Serves the workspace's themes from this app's own origin (docs/system/blueprint/workspace-themes/).
    "workspace-themes",
    # The shell's address and desktop routes, for taking an uninstalled app's shortcuts off the desktops.
    "workspace-layout",
]

[dependency-groups]
dev = [
    "app-schema[testing]",
    "pytest>=9.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.3.0",
    "coverage",
    "inline-snapshot>=0.13",
    "ruff~=0.12.8",
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.87",
]

[project.scripts]
app-store = "app_store.main:main"
# What every store-installed app's supervisord program runs: registers the app, then execs its launch command.
app-store-launch = "app_store.launch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
    "src/app_store/static/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app_store"]

[tool.pytest.ini_options]
timeout_func_only = true
# Same tmp_path retention as the root config, which says why.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
markers = [
    "acceptance: marks tests as requiring network access, Modal credentials, etc. These are required to pass in CI",
    "browser: marks tests that drive a browser",
    "frontend: marks tests that read an app's frontend source",
    "real_claude: marks tests that run the real claude binary",
    "flaky: marks tests as known-flaky (retried by offload with a separate retry count)",
]
junit_family = "xunit1"
testpaths = ["."]
addopts = [
  "--cov=app_store",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--durations=20",
  "--timeout=10",
  "--timeout-method=signal",
]

[tool.coverage.run]
parallel = true
concurrency = ["multiprocessing", "thread"]
omit = [
  "*_test.py",
  "test_*.py",
  "*/conftest.py",
]

[tool.coverage.report]
fail_under = 80

[tool.inline-snapshot]
default-flags=["report"]
default-flags-tui=["report"]
default-flags-ide=["report"]
format-command="uv run ruff format --force-exclude --config pyproject.toml --stdin-filename {filename}"

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "I",
    "UP006",
    "UP007",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
force-single-line = true
case-sensitive = true
order-by-type = false
known-first-party = [
    "app_store",
    "getting_started",
    "imbue",
    "oom_priority",
    "app_manifest",
    "app_schema",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
