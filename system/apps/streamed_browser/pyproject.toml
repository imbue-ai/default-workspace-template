[project]
name = "streamed-browser"
version = "0.1.0"
description = "A full Chromium streamed as pixels: pixelflux H.264 out, display-level input in"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "simple-websocket>=1.0",
    "werkzeug>=3.0",
    "loguru>=0.7",
    # Capture+encode engine (Selkies' Rust core). Ships manylinux wheels; its
    # native module needs libva at import (baked via setup_system.sh).
    "pixelflux>=2.0.0",
    # XTEST input injection (see xinput.py, ported from Selkies).
    "python-xlib>=0.33",
    # On-demand Opus audio (see audiopipe.py). pcmflux is pixelflux's audio
    # sibling from the same vendor; needs a PulseAudio daemon at runtime.
    "pcmflux>=2.0.0",
]

[project.scripts]
streamed-browser-service = "streamed_browser.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streamed_browser"]

[tool.pytest.ini_options]
testpaths = ["."]
timeout = 10
timeout_func_only = true

[tool.coverage.run]
source = ["src/streamed_browser"]
