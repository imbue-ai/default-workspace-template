<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Streamed Browser</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #screen { flex: 1; min-height: 0; width: 100%; object-fit: contain; outline: none; cursor: default; }
  #status {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    background: rgba(20,20,20,.85); color: #ccc; font: 12px system-ui, sans-serif;
    padding: 4px 10px; border-radius: 6px; pointer-events: none; transition: opacity .3s;
  }
  #status.hidden { opacity: 0; }
  #clipchip {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    background: rgba(20,20,20,.9); color: #ddd; font: 12px system-ui, sans-serif;
    padding: 4px 12px; border-radius: 14px; pointer-events: none;
    transition: opacity .2s; opacity: 0;
  }
  #clipchip.show { opacity: 1; }
  #clipchip.err { background: #7a1f1f; color: #fff; }
  #clipchip.ok { background: #1f5c33; color: #fff; }
</style>
</head>
<body>
<div id="wrap">
  <div id="status">connecting…</div>
  <canvas id="screen" tabindex="0"></canvas>
  <div id="clipchip"></div>
</div>
<script>
"use strict";
// Viewer for the streamed-browser service, stripe mode (the Selkies client's
// design): each horizontal stripe row is an independent H.264 stream with its
// own VideoDecoder, keyed by the wire header's y-start, composited onto one
// canvas at its y-offset. Binary messages are pixelflux packets (10-byte
// header + Annex B); text messages carry cursor shapes
// ("cursor,<hotX>,<hotY>,<png base64>" -- applied as the CSS cursor, so the
// pointer is drawn locally and its motion costs the server nothing).
// Upstream we send Selkies-grammar input (kd/ku/kr/kh/m) and per-stripe
// credit acks ("ack,<frameId>,<yStart>") AS THE STRIPE EXITS ITS DECODER --
// the server holds at most two unacked stripes per row, which is what bounds
// delivery lag across the tunnel wherever congestion lives.
const HEADER_LEN = 10;
const FRAME_TYPE_IDR = 1;
const status = document.getElementById("status");
const canvas = document.getElementById("screen");
const context = canvas.getContext("2d", { desynchronized: true });
let socket = null;
let retryDelay = 500;

// --- keysym mapping (client side of the Selkies kd/ku grammar) --------------
const NAMED_KEYSYMS = {
  Backspace: 0xff08, Tab: 0xff09, Enter: 0xff0d, Escape: 0xff1b, Delete: 0xffff,
  Home: 0xff50, End: 0xff57, PageUp: 0xff55, PageDown: 0xff56,
  ArrowLeft: 0xff51, ArrowUp: 0xff52, ArrowRight: 0xff53, ArrowDown: 0xff54,
  Insert: 0xff63, Menu: 0xff67, Pause: 0xff13, ScrollLock: 0xff14, PrintScreen: 0xff61,
  CapsLock: 0xffe5, NumLock: 0xff7f,
  Shift: 0xffe1, Control: 0xffe3, Alt: 0xffe9, AltGraph: 0xfe03, Meta: 0xffe7,
  F1: 0xffbe, F2: 0xffbf, F3: 0xffc0, F4: 0xffc1, F5: 0xffc2, F6: 0xffc3,
  F7: 0xffc4, F8: 0xffc5, F9: 0xffc6, F10: 0xffc7, F11: 0xffc8, F12: 0xffc9,
};
const RIGHT_SIDE_KEYSYMS = { Shift: 0xffe2, Control: 0xffe4, Alt: 0xffea, Meta: 0xffe8 };

function keysymFor(event) {
  const key = event.key;
  if (key.length === 1) {
    const cp = key.codePointAt(0);
    return cp <= 0xff ? cp : 0x01000000 | cp;
  }
  if (event.location === 2 && key in RIGHT_SIDE_KEYSYMS) return RIGHT_SIDE_KEYSYMS[key];
  return NAMED_KEYSYMS[key] ?? null;
}

// --- connection --------------------------------------------------------------
function connect() {
  const url = new URL("stream", document.baseURI);
  url.protocol = (url.protocol === "https:") ? "wss:" : "ws:";
  // Tell the server our pane size up front, IN the connect URL, so the first
  // frame is already pane-sized (no 1280x800 flash, no resize round-trip). The
  // size is knowable now -- the DOM is laid out -- but a post-connect `r,`
  // message would race the socket's open and get dropped; carrying it on the
  // URL can't. Fall back to the window box if the canvas isn't measured yet.
  const rect = canvas.getBoundingClientRect();
  const initW = Math.max(320, (Math.round(rect.width) || window.innerWidth) & ~1);
  const initH = Math.max(240, (Math.round(rect.height) || window.innerHeight) & ~1);
  url.searchParams.set("w", initW);
  url.searchParams.set("h", initH);
  lastSentSize = initW + "," + initH;  // the observer's first fire is now a no-op, not a re-resize
  socket = new WebSocket(url);
  socket.binaryType = "arraybuffer";

  // Per-stripe-row decode state, keyed by y-start (the Selkies
  // vncStripeDecoders shape): each row is its own H.264 chain.
  const rows = {};
  let drawnAny = false;

  // Freeze attributor (console-only diagnostics, no UI). The server sends a
  // heartbeat every 250ms while connected, so: total socket silence >600ms is
  // a TRANSPORT stall; video packets newer than the last paint with >500ms
  // since that paint is a DECODE/SERVER stall. An idle screen (heartbeats
  // flowing, no video because nothing changed) is neither and stays quiet --
  // heartbeats must never count as "a paint is expected".
  let lastPaint = 0, lastVideo = 0, lastAnything = 0;
  let stallLoggedAt = 0;
  setInterval(() => {
    if (!drawnAny || document.hidden) return;
    const now = performance.now();
    let line = null;
    if (now - lastAnything > 600) {
      line = `transport stall ${((now - lastAnything) / 1000).toFixed(1)}s (socket silent)`;
    } else if (lastVideo > lastPaint && now - lastPaint > 500) {
      line = `decode/server stall ${((now - lastPaint) / 1000).toFixed(1)}s (video arriving, not painting)`;
    }
    if (line !== null && now - stallLoggedAt > 1000) {
      stallLoggedAt = now;
      console.warn("[streamed-browser] " + line);
    }
  }, 250);

  function rowFor(yStart) {
    let row = rows[yStart];
    if (row === undefined) row = rows[yStart] = { decoder: null, needKey: true, seq: 0, pendingAcks: [] };
    return row;
  }

  function makeDecoder(yStart) {
    const row = rows[yStart];
    const created = new VideoDecoder({
      output: (frame) => {
        // Grow the canvas to cover every row seen (stripe width = display
        // width; total height = max yStart + stripe height).
        const needW = frame.displayWidth;
        const needH = yStart + frame.displayHeight;
        if (canvas.width < needW || canvas.height < needH) {
          canvas.width = Math.max(canvas.width, needW);
          canvas.height = Math.max(canvas.height, needH);
        }
        context.drawImage(frame, 0, yStart);
        frame.close();
        lastPaint = performance.now();
        if (!drawnAny) { drawnAny = true; status.classList.add("hidden"); }
        const frameId = row.pendingAcks.shift();  // no B-frames: decode order = submit order
        if (frameId !== undefined && socket.readyState === WebSocket.OPEN) {
          socket.send(`ack,${frameId},${yStart}`);
        }
      },
      error: (error) => {
        status.textContent = "resyncing: " + error.message;
        status.classList.remove("hidden");
        row.needKey = true;
        row.pendingAcks.length = 0;
        row.decoder = null;
      },
    });
    // prefer-software: at stripe resolution software decode is 1-3ms and
    // strictly 1-in-1-out; hardware decoders may buffer frames after a
    // keyframe despite optimizeForLatency (w3c/webcodecs#732), and with acks
    // fired on decoder OUTPUT any buffering throttles the credit loop.
    created.configure({ codec: "avc1.42C028", optimizeForLatency: true, hardwareAcceleration: "prefer-software" });
    return created;
  }

  socket.onopen = () => { retryDelay = 500; status.textContent = "starting browser…"; };
  socket.onmessage = (event) => {
    lastAnything = performance.now();
    if (typeof event.data === "string") {
      if (event.data.startsWith("res,")) {
        // Realized capture size. Stripe y-offsets move when the height changes,
        // so every per-row decoder is stale: close them all and hard-set the
        // canvas to the new size (the forced keyframe repaints immediately).
        const [, w, h] = event.data.split(",");
        for (const y in rows) { try { rows[y].decoder?.close(); } catch (_) {} }
        for (const y in rows) delete rows[y];
        canvas.width = parseInt(w, 10);
        canvas.height = parseInt(h, 10);
        return;
      }
      if (event.data.startsWith("cursor,")) {
        const [, hotX, hotY, png] = event.data.split(",");
        canvas.style.cursor = `url(data:image/png;base64,${png}) ${hotX} ${hotY}, default`;
      } else if (event.data.startsWith("clip,txt,")) {
        const bytes = Uint8Array.from(atob(event.data.slice(9)), (c) => c.charCodeAt(0));
        writeLocalText(new TextDecoder().decode(bytes));
      } else if (event.data.startsWith("clip,out,")) {
        const [, , mime] = event.data.split(",");  // fetch the bytes over HTTP (may be >1MiB)
        fetch(new URL("clipboard/out", document.baseURI))
          .then((r) => r.blob()).then((blob) => writeLocalImage(blob, mime))
          .catch(() => showChip("Copy failed", "err"));
      }
      return;
    }
    const packet = new Uint8Array(event.data);
    if (packet[0] === 0x01) { playAudio(packet.subarray(1)); return; }  // Opus chunk
    if (packet.byteLength <= HEADER_LEN || packet[0] !== 0x04) return;
    lastVideo = performance.now();
    const view = new DataView(event.data);
    const isKey = view.getUint8(1) === FRAME_TYPE_IDR;
    const frameId = view.getUint16(2);   // big-endian
    const yStart = view.getUint16(4);
    const row = rowFor(yStart);
    if (row.needKey && !isKey) return;
    row.needKey = false;
    if (row.decoder === null) row.decoder = makeDecoder(yStart);
    row.pendingAcks.push(frameId);
    row.decoder.decode(new EncodedVideoChunk({
      type: isKey ? "key" : "delta",
      timestamp: row.seq++ * 16667,
      data: packet.subarray(HEADER_LEN),
    }));
  };
  socket.onclose = () => {
    status.textContent = "reconnecting…";
    status.classList.remove("hidden");
    setTimeout(connect, retryDelay);
    retryDelay = Math.min(retryDelay * 2, 5000);
  };
}

// --- audio playback (Opus over WebCodecs -> AudioWorklet) --------------------
// Server sends mono Opus chunks (magic byte 0x01) interleaved on the SAME
// socket, only while the tab actually makes sound (pcmflux's sample-level
// silence gate), so this stays idle otherwise. WebCodecs AudioDecoder outputs
// f32-planar; we duplicate mono to L/R and hand it to a tiny worklet with a
// bounded drop-oldest jitter buffer that absorbs decode/network jitter.
let audioCtx = null, audioNode = null, audioDecoder = null, audioReady = false, audioTs = 0;
// Interleaved-stereo sample ring buffer. Incoming Opus frames are 960 samples
// (20ms) but process() runs on 128-sample quanta, so we MUST buffer samples and
// drain exactly what each quantum needs -- shifting a whole frame per quantum
// (the previous bug) discarded ~7/8 of every frame and cackled. Pre-buffer a
// little before draining so decode/network jitter doesn't underrun; on overflow
// drop oldest (bounded latency), on underrun output silence.
const AUDIO_WORKLET = `
class PB extends AudioWorkletProcessor {
  constructor() {
    super();
    this.cap = 48000 * 2 * 2;          // ~2s stereo
    this.ring = new Float32Array(this.cap);
    this.read = 0; this.write = 0; this.size = 0;
    this.priming = true;
    this.PRIME = 48000 * 2 * 0.06;      // ~60ms before playback starts
    this.port.onmessage = (e) => {
      const f = e.data;
      for (let i = 0; i < f.length; i++) { this.ring[this.write] = f[i]; this.write = (this.write + 1) % this.cap; }
      this.size += f.length;
      if (this.size > this.cap) { const drop = this.size - this.cap; this.read = (this.read + drop) % this.cap; this.size = this.cap; }
      if (this.priming && this.size >= this.PRIME) this.priming = false;
    };
  }
  process(_inputs, outputs) {
    const o = outputs[0], n = o[0].length;
    for (let i = 0; i < n; i++) {
      if (!this.priming && this.size >= 2) {
        o[0][i] = this.ring[this.read]; this.read = (this.read + 1) % this.cap;
        o[1][i] = this.ring[this.read]; this.read = (this.read + 1) % this.cap;
        this.size -= 2;
      } else {
        o[0][i] = 0; o[1][i] = 0;
        if (this.size < 2) this.priming = true;  // ran dry -> re-prime before resuming
      }
    }
    return true;
  }
}
registerProcessor('pb', PB);`;
async function ensureAudio() {
  if (audioCtx) return;
  audioCtx = new AudioContext({ sampleRate: 48000, latencyHint: "interactive" });
  const url = URL.createObjectURL(new Blob([AUDIO_WORKLET], { type: "application/javascript" }));
  await audioCtx.audioWorklet.addModule(url);
  audioNode = new AudioWorkletNode(audioCtx, "pb", { outputChannelCount: [2] });
  audioNode.connect(audioCtx.destination);
  audioDecoder = new AudioDecoder({
    output: (data) => {
      const frames = data.numberOfFrames, out = new Float32Array(frames * 2), plane = new Float32Array(frames);
      data.copyTo(plane, { planeIndex: 0, format: "f32-planar" });
      for (let i = 0; i < frames; i++) out[2 * i] = plane[i];
      if (data.numberOfChannels > 1) data.copyTo(plane, { planeIndex: 1, format: "f32-planar" });
      for (let i = 0; i < frames; i++) out[2 * i + 1] = plane[i];  // mono -> duplicate to both channels
      data.close();
      audioNode.port.postMessage(out, [out.buffer]);
    },
    error: () => {},
  });
  audioDecoder.configure({ codec: "opus", sampleRate: 48000, numberOfChannels: 1 });
  audioReady = true;
}
function playAudio(opus) {
  if (!("AudioDecoder" in window)) return;
  if (!audioReady) { ensureAudio(); return; }  // first chunk primes it; a few ms of audio dropped is fine
  if (audioCtx.state === "suspended") return;   // waiting for the gesture unlock
  if (audioDecoder.decodeQueueSize > 12) return;  // link stalled -> drop, don't queue latency
  audioDecoder.decode(new EncodedAudioChunk({ type: "key", timestamp: audioTs, data: opus }));
  audioTs += 20000;  // 20ms frames
}
// Browsers suspend AudioContext until a gesture; the pane is click-driven.
window.addEventListener("pointerdown", () => { audioCtx?.resume?.(); }, true);

// --- input capture -----------------------------------------------------------
let buttonMask = 0;
const heldKeysyms = new Set();

function captureCoords(event) {
  if (!canvas.width || !canvas.height) return null;
  const rect = canvas.getBoundingClientRect();
  const scale = Math.min(rect.width / canvas.width, rect.height / canvas.height);
  const drawnW = canvas.width * scale, drawnH = canvas.height * scale;
  const offX = rect.left + (rect.width - drawnW) / 2;
  const offY = rect.top + (rect.height - drawnH) / 2;
  const x = Math.round((event.clientX - offX) / scale);
  const y = Math.round((event.clientY - offY) / scale);
  if (x < 0 || y < 0 || x >= canvas.width || y >= canvas.height) return null;
  return { x, y };
}

function sendInput(message) {
  if (socket && socket.readyState === WebSocket.OPEN) socket.send(message);
}

function sendPointer(event, mask, scrollMagnitude) {
  const pos = captureCoords(event);
  if (pos === null) return;
  sendInput(`m,${pos.x},${pos.y},${mask},${scrollMagnitude || 0}`);
}

// Coalesce pointer moves to one per animation frame: every raw move would
// otherwise cost an XTest inject + Chromium hit-test on the loaded server.
let pendingMove = null;
canvas.addEventListener("pointermove", (e) => {
  if (pendingMove === null) {
    requestAnimationFrame(() => {
      if (pendingMove !== null) sendPointer(pendingMove, buttonMask, 0);
      pendingMove = null;
    });
  }
  pendingMove = e;
});
canvas.addEventListener("pointerdown", (e) => {
  canvas.focus();
  canvas.setPointerCapture(e.pointerId);
  const bit = e.button === 1 ? 2 : e.button === 2 ? 4 : 1;  // left/middle/right -> mask bits 0/1/2
  buttonMask |= bit;
  sendPointer(e, buttonMask, 0);
});
canvas.addEventListener("pointerup", (e) => {
  const bit = e.button === 1 ? 2 : e.button === 2 ? 4 : 1;
  buttonMask &= ~bit;
  sendPointer(e, buttonMask, 0);
});
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const clicks = Math.max(1, Math.min(8, Math.round(Math.abs(e.deltaY) / 100)));
  const bit = e.deltaY < 0 ? 8 : 16;  // mask bits 3 (up) / 4 (down), edge-triggered
  sendPointer(e, buttonMask | bit, clicks);
  sendPointer(e, buttonMask, 0);
}, { passive: false });
canvas.addEventListener("contextmenu", (e) => e.preventDefault());

canvas.addEventListener("keydown", (e) => {
  // Clipboard shortcuts are intercepted, not forwarded: paste reads the LOCAL
  // clipboard and pushes it to the remote; copy/cut trigger a remote copy and
  // let the copy-out monitor deliver the result to the local clipboard. This
  // makes Cmd (Mac) and Ctrl both work regardless of the remote being Linux.
  const mod = e.metaKey || e.ctrlKey;
  const k = e.key.toLowerCase();
  if (mod && k === "v") { e.preventDefault(); pasteIntoRemote(); return; }
  if (mod && (k === "c" || k === "x")) {
    e.preventDefault();
    remoteCtrlCombo(k === "c" ? 0x0063 : 0x0078);  // c / x
    showChip(k === "c" ? "Copying…" : "Cutting…", "");
    return;
  }
  // Other Cmd-combos stay LOCAL (Mac muscle memory, Minds shortcuts).
  if (e.metaKey) return;
  const keysym = keysymFor(e);
  if (keysym === null) return;
  e.preventDefault();
  heldKeysyms.add(keysym);
  sendInput("kd," + keysym);
});
canvas.addEventListener("keyup", (e) => {
  if (e.metaKey || e.key === "Meta") return;
  const keysym = keysymFor(e);
  if (keysym === null) return;
  e.preventDefault();
  heldKeysyms.delete(keysym);
  sendInput("ku," + keysym);
});
canvas.addEventListener("blur", () => { buttonMask = 0; heldKeysyms.clear(); sendInput("kr"); });
window.addEventListener("pagehide", () => sendInput("kr"));
document.addEventListener("visibilitychange", () => { if (document.hidden) { buttonMask = 0; heldKeysyms.clear(); sendInput("kr"); } });
// Held-key heartbeat (Selkies kh): report the full held set so the server can
// release anything whose keyup got lost in transit.
setInterval(() => sendInput("kh" + [...heldKeysyms].map((k) => "," + k).join("")), 2000);

// --- clipboard (paste in / copy out, text + images, with a chip) -------------
const CLIP_MAX_BYTES = 10 * 1024 * 1024;
const clipchip = document.getElementById("clipchip");
let chipTimer = null;
function showChip(text, kind) {
  clipchip.textContent = text;
  clipchip.className = "show" + (kind ? " " + kind : "");
  clearTimeout(chipTimer);
  if (kind === "ok" || kind === "err") chipTimer = setTimeout(() => { clipchip.className = ""; }, 2200);
}
function remoteCtrlCombo(keysym) {
  sendInput("kd,65507"); sendInput("kd," + keysym); sendInput("ku," + keysym); sendInput("ku,65507");
}

async function pasteIntoRemote() {
  showChip("Pasting…", "");
  try {
    // Prefer read() (covers images); fall back to readText().
    let blob = null, mime = "text/plain";
    try {
      for (const item of await navigator.clipboard.read()) {
        const imgType = item.types.find((t) => t.startsWith("image/"));
        if (imgType) { blob = await item.getType(imgType); mime = "image/png"; break; }
        if (item.types.includes("text/plain")) { blob = await item.getType("text/plain"); mime = "text/plain"; }
      }
    } catch (_) { /* read() unsupported/denied -> text path */ }
    if (blob === null) {
      const text = await navigator.clipboard.readText();
      if (!text) { clipchip.className = ""; return; }
      blob = new Blob([text], { type: "text/plain" });
    }
    if (blob.size > CLIP_MAX_BYTES) { showChip("Paste payload too large", "err"); return; }
    const resp = await fetch(new URL("clipboard/paste", document.baseURI),
      { method: "POST", headers: { "Content-Type": mime }, body: blob });
    if (resp.status === 413) { showChip("Paste payload too large", "err"); return; }
    showChip(resp.ok ? "Pasted" : "Paste failed", resp.ok ? "ok" : "err");
  } catch (_) { showChip("Paste failed", "err"); }
}

// Local clipboard WRITE with a deferred retry: programmatic writes need the
// document focused, and a server-pushed copy can arrive while the user is
// elsewhere -- queue it and flush on the next focus.
let pendingWrite = null;
function flushPendingWrite() { if (pendingWrite) { const w = pendingWrite; pendingWrite = null; w(); } }
window.addEventListener("focus", flushPendingWrite);
function writeLocalText(text) {
  const doWrite = () => navigator.clipboard.writeText(text)
    .then(() => showChip("Copied from remote", "ok"))
    .catch(() => { pendingWrite = doWrite; });
  doWrite();
}
async function writeLocalImage(blob, mime) {
  // Chromium's clipboard only writes image/png; transcode anything else.
  let png = blob;
  if (mime !== "image/png") {
    try {
      const bmp = await createImageBitmap(blob);
      const c = document.createElement("canvas");
      c.width = bmp.width; c.height = bmp.height;
      c.getContext("2d").drawImage(bmp, 0, 0);
      png = await new Promise((res) => c.toBlob(res, "image/png"));
    } catch (_) { showChip("Copy failed", "err"); return; }
  }
  const doWrite = () => navigator.clipboard.write([new ClipboardItem({ "image/png": png })])
    .then(() => showChip("Image copied from remote", "ok"))
    .catch(() => { pendingWrite = doWrite; });
  doWrite();
}

// --- resize: make the remote browser fill the pane, on settle ----------------
// The pane IS the monitor: send its exact pixel size (even-aligned for H.264),
// debounced so one resize fires per gesture, not per drag-frame. The server
// resizes the window + capture region and echoes the realized size via `res,`,
// which resets our canvas and decoders. During the drag, object-fit:contain
// scales the last frame -- no mid-drag churn.
let resizeTimer = null;
let lastSentSize = "";
function sendPaneSize() {
  // Only commit lastSentSize once the send can actually go out; a resize that
  // arrives while the socket is between connections is left uncommitted so the
  // next observer fire retries it instead of being silently swallowed.
  if (!socket || socket.readyState !== WebSocket.OPEN) return;
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(320, Math.round(rect.width) & ~1);
  const h = Math.max(240, Math.round(rect.height) & ~1);
  const key = w + "," + h;
  if (key === lastSentSize) return;
  lastSentSize = key;
  sendInput("r," + key);
}
new ResizeObserver(() => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(sendPaneSize, 150);
}).observe(document.documentElement);

if (!("VideoDecoder" in window)) {
  status.textContent = "WebCodecs is not available in this browser";
} else {
  connect();
}
</script>
</body>
</html>
