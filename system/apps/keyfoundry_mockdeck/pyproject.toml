[project]
name = "keyfoundry-mockdeck"
version = "0.1.0"
description = "Review deck: mock screens for the KeyFoundry passkey-setup guided flow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
]

[project.scripts]
keyfoundry-mockdeck = "keyfoundry_mockdeck.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keyfoundry_mockdeck"]
