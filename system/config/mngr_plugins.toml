# The mngr plugins this workspace registers, and which tool environment each
# one goes into. Read at image build by system/scripts/build_workspace.sh and
# again by the update-self apply after a merge, so a release that ships a new
# plugin registers it in the workspace being updated rather than only in
# freshly built images. Paths are relative to the workspace root.

[[plugins]]
path = "system/vendor/mngr/libs/mngr_claude"
tools = ["mngr", "system-interface"]

[[plugins]]
path = "system/vendor/mngr/libs/mngr_codex"
tools = ["mngr", "system-interface"]

[[plugins]]
path = "system/vendor/mngr/libs/mngr_pi_coding"
tools = ["mngr", "system-interface"]

[[plugins]]
path = "system/vendor/mngr/libs/mngr_opencode"
tools = ["mngr", "system-interface"]

[[plugins]]
path = "system/vendor/mngr/libs/mngr_antigravity"
tools = ["mngr", "system-interface"]

# The wait plugin only adds a CLI command, so the system interface has no use for it.
[[plugins]]
path = "system/vendor/mngr/libs/mngr_wait"
tools = ["mngr"]
