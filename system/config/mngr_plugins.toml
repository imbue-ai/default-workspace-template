# The mngr plugins this workspace registers, and which tool environment each
# one goes into: ``mngr`` is the mngr CLI's tool; any other entry is an app's
# manifest name (``system/apps/<package>/app.toml``), whose own tool environment
# gets the plugin as an extra. Read at image build by
# system/scripts/build_workspace.sh and again by the update-self apply after a
# merge, so a release that ships a new plugin registers it in the workspace
# being updated rather than only in freshly built images.
#
# Every plugin is installed from the public mngr repo at the one commit
# pyproject.toml's [tool.uv.sources] pins imbue-mngr to; system/test_mngr_pin.py holds
# every source and every locked package to that commit. Each entry names the package and
# its subdirectory in the mngr repo. mngr_modal is intentionally not registered
# (providers.modal.is_enabled=false).

[[plugins]]
package = "imbue-mngr-claude"
subdirectory = "libs/mngr_claude"
tools = ["mngr", "chat"]

[[plugins]]
package = "imbue-mngr-codex"
subdirectory = "libs/mngr_codex"
tools = ["mngr", "chat"]

[[plugins]]
package = "imbue-mngr-pi-coding"
subdirectory = "libs/mngr_pi_coding"
tools = ["mngr", "chat"]

[[plugins]]
package = "imbue-mngr-opencode"
subdirectory = "libs/mngr_opencode"
tools = ["mngr", "chat"]

[[plugins]]
package = "imbue-mngr-antigravity"
subdirectory = "libs/mngr_antigravity"
tools = ["mngr", "chat"]

# The wait plugin only adds a CLI command, so no app's tool has a use for it.
[[plugins]]
package = "imbue-mngr-wait"
subdirectory = "libs/mngr_wait"
tools = ["mngr"]

[[plugins]]
package = "imbue-mngr-autocompact"
subdirectory = "libs/mngr_autocompact"
tools = ["mngr", "chat"]


# `mngr usage`: per-agent cost and rate-limit windows for the mngr CLI. Only a CLI
# command, so no app's tool needs it.
[[plugins]]
package = "imbue-mngr-usage"
subdirectory = "libs/mngr_usage"
tools = ["mngr"]

# The harness usage writers: each provisions its agent type's writer, which appends one
# model_call event per model call to the agent's usage events file (followed by the
# usage collector). Only provisioning, which the mngr CLI runs, needs them.
[[plugins]]
package = "imbue-mngr-claude-usage"
subdirectory = "libs/mngr_claude_usage"
tools = ["mngr"]

[[plugins]]
package = "imbue-mngr-codex-usage"
subdirectory = "libs/mngr_codex_usage"
tools = ["mngr"]

[[plugins]]
package = "imbue-mngr-opencode-usage"
subdirectory = "libs/mngr_opencode_usage"
tools = ["mngr"]

[[plugins]]
package = "imbue-mngr-pi-coding-usage"
subdirectory = "libs/mngr_pi_coding_usage"
tools = ["mngr"]
