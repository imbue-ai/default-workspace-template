[project]
name = "imbue"
version = "0.1.0"
description = "Monorepo for Imbue projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest-xdist>=3.8.0",
    "ty>=0.0.39",
    "click>=8.0.0",
]

[tool.uv]
# Supply-chain cooldown: uv ignores any package uploaded after this timestamp
# when resolving, so we only adopt releases public long enough for malware to
# surface. scripts/release.py advances it to 2 weeks before each release, but
# only ever forward -- pushing it back would re-exclude a deliberately-pinned
# fresh dep and break resolution. This only buys a detection delay;
# it can't catch a compromise that stays undetected past the window.
exclude-newer = "2026-07-20T00:00:00Z"
# modal 1.5.4 (2026-08-12) is the first release carrying the MODAL_SANDBOX_V2
# opt-in for Modal's V2 Sandbox backend, so it postdates the global cutoff -- but
# it has been public well past the 2-week cooldown window. Override just this
# package rather than advancing the global cutoff, which would adopt every dep's
# newer releases at once.
exclude-newer-package = { modal = "2026-08-13T00:00:00Z" }

[tool.uv.sources]
imbue-common = { workspace = true }
overlay = { workspace = true }

[tool.uv.workspace]
members = ["libs/*", "apps/*"]
# apps/minds_evals is a standalone uv project with its own pyproject.toml and
# uv.lock, not a workspace member. It depends on harbor, whose rich>=14.1.0
# floor cannot co-resolve with this workspace's litellm[proxy] (rich<14) -- uv
# enforces one version per package across a workspace, so the only way harbor
# gets its declared dependencies is a separate lock. It is built, tested, and
# type-checked by the `test-minds-evals` CI job (see justfile's test-minds-evals);
# nothing here installs or collects it.
exclude = ["apps/minds_evals"]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "ruff~=0.12.8",
    "pytest>=9.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-split>=0.9.0",
    # really just for debugging slow tests
    "pytest-profiling",
    "line-profiler",
    "import-linter>=2.0",
    "semver>=3.0",
    "tomlkit>=0.12.0",
    "imbue-common[dev]",
    "shellcheck-py>=0.10.0",
    "pyyaml>=6.0",
    # In-memory AWS service mocks for unit tests (S3 state-bucket round-trips).
    "moto[s3]>=5.0",
    # Validates the generated /api/schema OpenAPI document in minds tests.
    "openapi-spec-validator>=0.7",
]

# Shared pytest settings (markers, filterwarnings, coverage report config)
# are centralized in:
#   libs/imbue_common/imbue/imbue_common/conftest_hooks.py
# The settings below remain here because they are read from pyproject.toml
# before any hooks run: addopts, coverage.run, inline-snapshot, timeout_func_only.
[tool.pytest.ini_options]
# Only timeout the test function itself, not fixtures. This is required because
# --timeout-method=signal sends SIGALRM which kills the entire xdist worker process
# if it fires during fixture setup/teardown (especially the session-scoped cleanup).
timeout_func_only = true
# Use xunit1 format to enable record_xml_attribute fixture for consistent classnames
junit_family = "xunit1"
pythonpath = [
  "apps/*",
  "libs/*",
]
testpaths = [
  "test_meta_ratchets.py",
  "apps/*",
  "libs/*",
  "scripts",
]
addopts = [
  "--cov=imbue.mngr",
  "--cov=imbue.imbue_common",
  "--cov=imbue.resource_guards",
  "--cov=imbue.overlay",
  "--cov=imbue.mngr_claude",
  "--cov=imbue.mngr_claude_subagent_proxy",
  "--cov=imbue.mngr_opencode",
  "--cov=imbue.mngr_antigravity",
  "--cov=imbue.mngr_codex",
  "--cov=imbue.mngr_pi_coding",
  "--cov=imbue.mngr_pair",
  "--cov=imbue.mngr_schedule",
  "--cov=imbue.mngr_ttyd",
  "--cov=imbue.mngr_tutor",
  "--cov=imbue.mngr_kanpan",
  "--cov=imbue.mngr_usage",
  "--cov=imbue.mngr_claude_usage",
  "--cov=imbue.mngr_opencode_usage",
  "--cov=imbue.mngr_pi_coding_usage",
  "--cov=imbue.mngr_codex_usage",
  "--cov=imbue.mngr_recursive",
  "--cov=imbue.mngr_latchkey",
  "--cov=imbue.mngr_notifications",
  "--cov=imbue.mngr_file",
  "--cov=imbue.mngr_forward",
  "--cov=imbue.mngr_imbue_cloud",
  "--cov=imbue.mngr_lima",
  "--cov=imbue.mngr_tmr",
  "--cov=imbue.mngr_mapreduce",
  "--cov=imbue.mngr_behaviors",
  "--cov=imbue.skitwright",
  "--cov=imbue.minds",
  "--cov=imbue.minds_admin",
  "--cov=imbue.slack_exporter",
  "--cov=imbue.remote_service_connector",
  "--cov=imbue.oauth_redirector",
  "--cov=imbue.apt_mirror",
  "--cov=imbue.share_relay",
  "--cov=imbue.observability",
  "--cov=imbue.concurrency_group",
  "--cov=imbue.modal_proxy",
  "--cov=imbue.modal_app_kit",
  "--cov=imbue.mngr_wait",
  "--cov=imbue.mngr_robinhood",
  "--cov=imbue.mngr_vps",
  "--cov=imbue.mngr_vultr",
  "--cov=imbue.mngr_aws",
  "--cov=imbue.mngr_ovh",
  "--cov=imbue.mngr_gcp",
  "--cov=imbue.mngr_azure",
  "--cov=imbue.mngr_minds_eval",
  "--cov=imbue.analytics",
  # NOTE: apps/minds_evals is deliberately absent from this list -- it is a
  # standalone project (see [tool.uv.workspace].exclude) and is excluded from
  # collection by collect_ignore_glob in the root conftest.py, not from here.
  # NOTE: no --cov-report/--coverage-to-file here. Per-run coverage reports
  # are expensive to generate (they walk every measured file) and are only
  # useful interactively, so the local recipes that want them
  # (just test-unit / test-integration) pass those flags explicitly. Keeping
  # them out of addopts lets offload CI batches disable them entirely with
  # `--cov-report=` (pytest-cov only treats the empty value as "clear all
  # reports" when it is the sole --cov-report given) while still writing the
  # raw .coverage data file that CI combines for the coverage gates.
  "--durations=20",
  "--timeout=10",
  "--timeout-method=signal",
  "--slow-tests-to-file",
]

[tool.ruff]
line-length = 119
exclude = [
    "**/__snapshots__/**",
    "scripts/style_guide.py",
    "frpc_test",
    # Vendored upstream bugsink settings template (star-import style is
    # upstream's; kept byte-similar for the re-diff-on-bump workflow).
    "apps/observability/imbue/observability/deploy_assets/bugsink_conf.py",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "I",
    "UP006",
    "UP007",
#    "T",
#    "SIM",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
force-single-line = true
case-sensitive = true
order-by-type = false
known-first-party = [
    "imbue",
    "imbue_common",
    "mngr",
    "sculptor_desktop",
]

[tool.inline-snapshot]
default-flags=["report"]
default-flags-tui=["report"]
default-flags-ide=["report"]
format-command="uv run ruff format --force-exclude --config pyproject.toml --stdin-filename {filename}"

[tool.ty.src]
# apps/minds/hatch_build.py imports hatchling, which exists only inside
# hatchling's isolated build environment, never in the dev venv.
# apps/minds_evals is a standalone uv project (see [tool.uv.workspace].exclude),
# so harbor and the project's own package are absent from this venv and its
# modules are type-checked against their own environment by `test-minds-evals`.
# The exception is imbue/minds_evals/resources/, which is deliberately NOT
# excluded here: those files are shipped as source into the eval box and run
# against the monorepo venv, so this workspace is the environment they actually
# execute in, and the standalone project (which has no mngr_forward) cannot
# resolve them. Do NOT collapse the entries below into a plain
# "apps/minds_evals/": that excludes resources/ too, and since the standalone
# project excludes it as well, it leaves those files type-checked nowhere
# (test_meta_ratchets.py probes ty for exactly that). The cost of naming the
# package's own modules instead is that a new subpackage importing harbor fails
# here until it is added -- loudly, which is the point.
exclude = [
    "scripts/style_guide.py",
    "contrib/",
    "apps/minds/scripts/",
    "apps/minds/hatch_build.py",
    "apps/minds_evals/*.py",
    "apps/minds_evals/imbue/minds_evals/*.py",
    # templates/ run in the verifier container, where rewardkit arrives via uvx;
    # unresolvable in this venv. The standalone minds_evals project checks them
    # instead -- it installs harbor-rewardkit as a dev dependency for exactly that.
    "apps/minds_evals/imbue/minds_evals/templates/",
    # Vendored upstream bugsink settings template; the bugsink package is
    # installed only on the error-tracker VPS (never in the dev venv), so its
    # imports are unresolvable here.
    "apps/observability/imbue/observability/deploy_assets/bugsink_conf.py",
]

[tool.ty.environment]
extra-paths = ["scripts"]

[tool.coverage.run]
source = ["imbue"]
parallel = true
concurrency = ["multiprocessing", "thread"]
# sys.monitoring (PEP 669) is ~3x lower overhead than the default C tracer on
# Python 3.12, which matters for import-heavy workloads (pytest collection
# and short-lived batch processes are dominated by module imports). Requires
# Python >= 3.12 and is incompatible with branch coverage, dynamic contexts,
# and greenlet/eventlet/gevent concurrency -- none of which we use. On older
# Pythons coverage warns and falls back to the default core.
core = "sysmon"
omit = [
    "*_test.py",
    "test_*.py",
    "*/tests/*",
    "*/conftest.py",
    # Vendored upstream bugsink settings template (a deploy asset shipped to
    # the error-tracker VPS); never importable in the test process.
    "*/bugsink_conf.py",
    # Test utility modules contain helpers only used by tests
    "*/testing.py",
    "*/utils/plugin_testing.py",
    "*/conftest_hooks.py",
    "*/ratchet_testing/*",
    # Shared Sentry error-reporting machinery is mostly runtime integration glue
    # (live sentry_sdk wiring, the custom HTTP transport's network paths, the
    # threaded S3 uploader); its pure logic is unit-tested and the whole thing is
    # exercised end-to-end by the processes that call setup_sentry.
    "*/imbue_common/sentry/*",
    # Modal provider plugin requires network access for testing
    "libs/mngr_modal/imbue/mngr_modal/*",
    # Manual frp verification harness (real frps binaries, live sockets); run
    # by hand on frp version bumps, never in CI
    "apps/share_relay/imbue/share_relay/frp_verification.py",
    # Docker provider requires a Docker daemon for testing
    "libs/mngr/imbue/mngr/providers/docker/instance.py",
    "libs/mngr/imbue/mngr/providers/docker/volume.py",
    # Lima provider requires Lima/QEMU for full integration testing
    "libs/mngr_lima/imbue/mngr_lima/instance.py",
    "libs/mngr_lima/imbue/mngr_lima/limactl.py",
    # Mind deploy modules run on Modal and require infrastructure to test
    "apps/minds/imbue/minds/deploy/cron_runner.py",
    "apps/minds/imbue/minds/deploy/remote_runner.py",
    "apps/minds/imbue/minds/deploy/verification.py",
    # Minds telegram/supertokens integrations require external services to test
    "apps/minds/imbue/minds/telegram/credential_extractor.py",
    "apps/minds/imbue/minds/telegram/bot_creator.py",
    "apps/minds/imbue/minds/telegram/injector.py",
    "apps/minds/imbue/minds/desktop_client/supertokens_routes.py",
    "apps/minds/imbue/minds/desktop_client/tunnel_token_injection.py",
    # Minds Docker state-container teardown shells out to the `docker` CLI and
    # needs a real daemon -- exercised via a docker-marked test, not offload.
    "apps/minds/imbue/minds/envs/docker_cleanup.py",
    # Minds deployment_tests importable helpers are exercised only by the
    # minds_deployment / minds_services pytest suites against real cloud,
    # which are excluded from `just test-offload`. No path through the
    # standard test run reaches these files.
    "apps/minds/imbue/minds/deployment_tests/*",
    # mngr_claude keychain sync requires a real macOS keychain to test
    "libs/mngr_claude/imbue/mngr_claude/resources/sync_keychain_credentials.py",
    # Schedule plugin cron runner and verification run on Modal and require infrastructure to test
    "libs/mngr_schedule/imbue/mngr_schedule/implementations/modal/cron_runner.py",
    "libs/mngr_schedule/imbue/mngr_schedule/implementations/modal/verification.py",
    # don't bother with anything in scripts
    "scripts/*",
]

[tool.coverage.paths]
# Map sandbox paths back to local paths so coverage data collected on
# offload Modal sandboxes (rooted at /code/mngr/) can be combined locally.
source = [
    ".",
    "/code/mngr/",
]

[tool.importlinter]
root_packages = [
    "imbue.mngr",
    "imbue.minds",
    "imbue.minds_admin",
    "imbue.mngr_imbue_cloud",
    "imbue.apt_mirror",
    "imbue.remote_service_connector",
]
include_external_packages = true

# The minds bootstrap layer must be importable before mngr: mngr reads
# MNGR_HOST_DIR/MNGR_PREFIX and the profile settings.toml during its own
# module-level initialization, so minds.bootstrap and minds.mngr_settings run
# first (see imbue/minds/main.py) and must never pull mngr in themselves.
[[tool.importlinter.contracts]]
name = "minds bootstrap layer stays mngr-free and import-cheap"
type = "forbidden"
source_modules = ["imbue.minds.bootstrap"]
forbidden_modules = [
    "imbue.mngr",
    "imbue.mngr_imbue_cloud",
    "pydantic",
    "click",
]

[[tool.importlinter.contracts]]
name = "minds mngr_settings stays mngr-free"
type = "forbidden"
source_modules = ["imbue.minds.mngr_settings"]
forbidden_modules = [
    "imbue.mngr",
    "imbue.mngr_imbue_cloud",
    "click",
]

[[tool.importlinter.contracts]]
name = "mngr layers contract"
type = "layers"
layers = [
    "imbue.mngr.main",
    "imbue.mngr.cli",
    "imbue.mngr.api",
    "imbue.mngr.agents",
    "imbue.mngr.providers",
    "imbue.mngr.hosts",
    "imbue.mngr.plugins",
    "imbue.mngr.interfaces",
    "imbue.mngr.config",
    "imbue.mngr.utils",
    "imbue.mngr.errors",
    "imbue.mngr.primitives",
    "imbue.mngr.resources",
]

[[tool.importlinter.contracts]]
name = "minds layers contract"
type = "layers"
layers = [
    "imbue.minds.desktop_client",
    "imbue.minds.cli",
    "imbue.minds.core",
    "imbue.minds.interfaces",
    "imbue.minds.config",
    "imbue.minds.errors",
    "imbue.minds.utils",
    "imbue.minds.primitives",
]

[[tool.importlinter.contracts]]
name = "apt_mirror layers contract"
type = "layers"
layers = [
    "imbue.apt_mirror.cli",
    "imbue.apt_mirror.service",
    "imbue.apt_mirror.storage",
    "imbue.apt_mirror.fetcher",
    "imbue.apt_mirror.interfaces",
    "imbue.apt_mirror.parsing",
    "imbue.apt_mirror.package_lists",
    "imbue.apt_mirror.data_types",
    "imbue.apt_mirror.errors",
]

[[tool.importlinter.contracts]]
name = "mngr_imbue_cloud layers contract"
type = "layers"
layers = [
    "imbue.mngr_imbue_cloud.plugin",
    "imbue.mngr_imbue_cloud.cli",
    "imbue.mngr_imbue_cloud.providers",
    "imbue.mngr_imbue_cloud.hosts",
    "imbue.mngr_imbue_cloud.slices",
    "imbue.mngr_imbue_cloud.connector",
    "imbue.mngr_imbue_cloud.config",
    "imbue.mngr_imbue_cloud.interfaces",
    "imbue.mngr_imbue_cloud.data_types",
    "imbue.mngr_imbue_cloud.errors",
    "imbue.mngr_imbue_cloud.primitives",
]

[[tool.importlinter.contracts]]
name = "minds_admin layers contract"
type = "layers"
layers = [
    "imbue.minds_admin.main",
    "imbue.minds_admin.cli",
    "imbue.minds_admin.envs",
    "imbue.minds_admin.bake",
    "imbue.minds_admin.slices",
]

# The connector's shipped modules form a DAG: the Modal entrypoint (app) on
# top of the FastAPI assembly (web), feature routers above the auth /
# entitlements foundation, everything above errors. app.py itself is
# excluded from the container's source mount, so nothing below it may import
# it (also enforced by test_project_ratchets.py).
[[tool.importlinter.contracts]]
name = "remote_service_connector layers contract"
type = "layers"
exhaustive = false
layers = [
    "imbue.remote_service_connector.app",
    "imbue.remote_service_connector.web",
    "imbue.remote_service_connector.retention",
    "imbue.remote_service_connector.accounts",
    "imbue.remote_service_connector.llm_keys | imbue.remote_service_connector.r2.grants | imbue.remote_service_connector.share_certs | imbue.remote_service_connector.share_broker",
    "imbue.remote_service_connector.accounts_web",
    "imbue.remote_service_connector.r2.sweep",
    "imbue.remote_service_connector.r2.buckets",
    "imbue.remote_service_connector.hosts | imbue.remote_service_connector.sync | imbue.remote_service_connector.auth_proxy | imbue.remote_service_connector.shares | imbue.remote_service_connector.r2.stores | imbue.remote_service_connector.r2.naming",
    "imbue.remote_service_connector.entitlements | imbue.remote_service_connector.litellm_client",
    "imbue.remote_service_connector.auth",
    "imbue.remote_service_connector.cloudflare | imbue.remote_service_connector.db | imbue.remote_service_connector.http_api",
    "imbue.remote_service_connector.errors",
]
