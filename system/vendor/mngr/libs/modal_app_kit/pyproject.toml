[project]
name = "modal-app-kit"
version = "0.1.0"
description = "Shared deploy-time conventions for our Modal apps (remote_service_connector, modal_litellm): env/deploy-id readers, stamped secret names, source-mount rules"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "imbue-common",
    "modal>=1.4.3",
    # 2.63.0+ required: earlier FastAPI integrations re-wrap dependant.call on
    # every request under FastAPI's lazy router inclusion, dying with
    # RecursionError after ~990 requests to a sync endpoint (mngr-internal#493).
    "sentry-sdk>=2.63.0",
]
license = {text = "FCL-1.0-MIT"}
license-files = [
    "LICENSE",
]

[tool.uv.sources]
imbue-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imbue"]
exclude = ["*_test.py", "test_*.py", "**/conftest.py", "**/testing.py"]

[tool.pytest.ini_options]
timeout_func_only = true
junit_family = "xunit1"
testpaths = ["."]
addopts = [
  "--cov=imbue.modal_app_kit",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--durations=20",
  "--timeout=10",
  "--timeout-method=signal",
  "--slow-tests-to-file",
  "--coverage-to-file",
]

[tool.coverage.run]
parallel = true
concurrency = ["multiprocessing"]
omit = [
  "*_test.py",
  "test_*.py",
  "*/tests/*",
  "*/conftest.py",
]

[tool.coverage.report]
fail_under = 75
omit = [
  "*_test.py",
  "test_*.py",
  "*/tests/*",
  "*/conftest.py",
]

[tool.inline-snapshot]
default-flags=["report"]
default-flags-tui=["report"]
default-flags-ide=["report"]
format-command="uv run ruff format --force-exclude --config pyproject.toml --stdin-filename {filename}"

[tool.pyright]
venvPath = "../.."
venv = ".venv"
pythonVersion = "3.11"
strict = ["**/*.py"]
