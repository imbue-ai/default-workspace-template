<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="640" fill="#ffffff"/>

  <!-- Stage 1 -->
  <rect x="280" y="25" width="340" height="48" rx="6" fill="#f5f7fa" stroke="#93a1b0" stroke-width="1.5"/>
  <text x="450" y="46" text-anchor="middle" font-size="15" font-weight="600" fill="#1a202c">343 mapper agents</text>
  <text x="450" y="64" text-anchor="middle" font-size="12.5" fill="#4a5568">one agent per collected test</text>

  <line x1="450" y1="73" x2="450" y2="118" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="466" y="100" font-size="12.5" fill="#4a5568">305 of the 343 agents (89%) raise at least one</text>

  <!-- Stage 2 -->
  <rect x="250" y="122" width="400" height="52" rx="6" fill="#f5f7fa" stroke="#93a1b0" stroke-width="1.5"/>
  <text x="450" y="143" text-anchor="middle" font-size="15" font-weight="600" fill="#1a202c">429 mapper escalations</text>
  <text x="450" y="162" text-anchor="middle" font-size="12.5" fill="#4a5568">136,000 words, averaging 317 words each</text>

  <line x1="450" y1="174" x2="450" y2="246" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="466" y="215" font-size="12.5" fill="#4a5568">the integrator adds 16 of its own</text>

  <!-- Stage 3 -->
  <rect x="315" y="250" width="270" height="42" rx="6" fill="#f5f7fa" stroke="#93a1b0" stroke-width="1.5"/>
  <text x="450" y="277" text-anchor="middle" font-size="15" font-weight="600" fill="#1a202c">445 escalations</text>

  <!-- Fan-out arrows -->
  <line x1="450" y1="292" x2="160" y2="372" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="292" x2="450" y2="372" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="292" x2="740" y2="372" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output A: HTML report -->
  <rect x="20" y="378" width="270" height="150" rx="6" fill="#fdf2f2" stroke="#d64545" stroke-width="1.8"/>
  <text x="155" y="402" text-anchor="middle" font-size="15" font-weight="600" fill="#1a202c">HTML report</text>
  <text x="38" y="426" font-size="12.5" fill="#2d3748">
    <tspan x="38" dy="0">445 items in one flat list,</tspan>
    <tspan x="38" dy="18">sorted by kind and nothing else</tspan>
    <tspan x="38" dy="22">1.26 MB of markup, filling the</tspan>
    <tspan x="38" dy="18">first 25% of the page, above</tspan>
    <tspan x="38" dy="18">every test result</tspan>
  </text>

  <!-- Output B: PR body table -->
  <rect x="315" y="378" width="270" height="150" rx="6" fill="#fdf2f2" stroke="#d64545" stroke-width="1.8"/>
  <text x="450" y="402" text-anchor="middle" font-size="15" font-weight="600" fill="#1a202c">PR body table</text>
  <text x="333" y="426" font-size="12.5" fill="#2d3748">
    <tspan x="333" dy="0">one row per escalation, cut to</tspan>
    <tspan x="333" dy="18">the first line of its detail</tspan>
    <tspan x="333" dy="22">226 KB against GitHub's 65 KB</tspan>
    <tspan x="333" dy="18">body limit, so it was left out</tspan>
    <tspan x="333" dy="18">of the pull request entirely</tspan>
  </text>

  <!-- Output C: prose digest -->
  <rect x="610" y="378" width="270" height="150" rx="6" fill="#f0f9f2" stroke="#2f855a" stroke-width="1.8"/>
  <text x="745" y="402" text-anchor="middle" font-size="15" font-weight="600" fill="#1a202c">PR body prose digest</text>
  <text x="628" y="426" font-size="12.5" fill="#2d3748">
    <tspan x="628" dy="0">the 21 underlying problems all</tspan>
    <tspan x="628" dy="18">429 mapper escalations describe</tspan>
    <tspan x="628" dy="22">grouped by hand by the integrator</tspan>
    <tspan x="628" dy="18">and stored only as prose, so no</tspan>
    <tspan x="628" dy="18">tool downstream can read it</tspan>
  </text>

  <!-- Legend -->
  <rect x="20" y="558" width="16" height="16" rx="3" fill="#fdf2f2" stroke="#d64545" stroke-width="1.8"/>
  <text x="44" y="571" font-size="12.5" fill="#2d3748">Reaches the reviewer at a volume they cannot act on</text>

  <rect x="450" y="558" width="16" height="16" rx="3" fill="#f0f9f2" stroke="#2f855a" stroke-width="1.8"/>
  <text x="474" y="571" font-size="12.5" fill="#2d3748">Names the real problems, in a form nothing can reuse</text>

  <text x="20" y="605" font-size="12" fill="#718096">Run 20260730085947 (pull request imbue-ai/mngr-internal#211), 343 tests in the tmr-mngr variant.</text>
</svg>
