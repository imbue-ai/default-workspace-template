# Local-dev litellm proxy config (consumed directly by the `litellm` CLI via
# litellm_proxy/start.sh). The model_list MUST stay in sync with
# apps/modal_litellm/app.py's LITELLM_CONFIG -- apps/modal_litellm/config_drift_test.py
# enforces this.
#
# One pattern entry routes every Claude model: a bare client model name
# (`claude-opus-5`) matches `claude-*` and is forwarded as `anthropic/claude-<rest>`.
# Scoped to `claude-*` rather than `*` because this proxy holds only an Anthropic
# credential, so a non-Claude name should 404 here rather than be forwarded. Pricing
# comes from litellm's remotely-fetched model-cost map rather than being pinned
# inline, so new models are routable and priced without a config change, and the
# map's fast-mode, regional, and 1-hour-cache-write rates all apply.
model_list:
  - model_name: "claude-*"
    litellm_params:
      model: anthropic/claude-*
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  database_url: os.environ/LITELLM_DB_DIRECT
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  num_retries: 0
