#cloud-config
# Base image for a self-hosted sharing relay (OVH Public Cloud instance).
#
# A relay runs frps in SNI-passthrough mode: it reads the ClientHello SNI of
# each inbound TLS connection and splices the raw byte stream into the matching
# workspace tunnel, never terminating TLS. It holds no per-share state; every
# tunnel Login / NewProxy is authorized by a callback to the connector.
#
# This file provisions the host and its systemd units but neither the
# binaries nor the config: `share-relay deploy` installs the pinned,
# checksummed frps release, the standalone healthcheck script, and the
# rendered frps.toml / nftables.conf / port80.Caddyfile, then enables and
# restarts the units. Re-render + redeploy to change anything -- never
# hand-edit on the host.

# Refresh the apt cache first: base images commonly ship with a stale/empty
# cache, and a failed package install would only surface later when `deploy`
# tries to restart the missing services.
package_update: true

packages:
  - nftables
  - caddy

write_files:
  # The frps binary is installed by `share-relay deploy` (pinned + sha256
  # verified there), so a version bump never needs a reimage.
  - path: /etc/systemd/system/frps.service
    content: |
      [Unit]
      Description=frps SNI-passthrough relay
      After=network-online.target
      Wants=network-online.target
      [Service]
      ExecStart=/usr/local/bin/frps -c /etc/frp/frps.toml
      Restart=always
      RestartSec=2
      [Install]
      WantedBy=multi-user.target
  - path: /etc/systemd/system/share-relay-healthcheck.service
    content: |
      [Unit]
      Description=share-relay liveness endpoint
      After=frps.service
      [Service]
      ExecStart=/usr/bin/python3 /usr/local/bin/share-relay-healthcheck.py
      Restart=always
      RestartSec=5
      [Install]
      WantedBy=multi-user.target

runcmd:
  # Every service (nftables, caddy, frps, the healthcheck) is enabled and
  # started by `share-relay deploy` once its binary/config is in place --
  # enabling them here would just start them against missing config.
  - systemctl daemon-reload
