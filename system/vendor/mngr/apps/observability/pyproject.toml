[project]
name = "imbue-observability"
version = "0.1.0"
description = "Per-tier observability instances: operator CLI that provisions and configures OpenObserve on an OVH VPS plus the fleet's OpenTelemetry Collectors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "concurrency-group",
    "httpx>=0.27",
    "imbue-common",
    "loguru>=0.7",
    "pydantic>=2.0",
    "share-relay",
    "tenacity>=8.0",
]
license = {text = "MIT"}

[project.scripts]
observability = "imbue.observability.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imbue"]
exclude = ["*_test.py", "test_*.py", "**/conftest.py", "**/testing.py"]

[tool.uv.sources]
imbue-common = { workspace = true }
concurrency-group = { workspace = true }
share-relay = { workspace = true }

[[tool.importlinter.contracts]]
name = "observability layers contract"
type = "layers"
layers = [
    "imbue.observability.cli",
    "imbue.observability.dashboards",
    "imbue.observability.bugsink_api",
    "imbue.observability.bugsink_remote_install",
    "imbue.observability.remote_install",
    "imbue.observability.openobserve_api | imbue.observability.dns_records | imbue.observability.bugsink_render",
    "imbue.observability.collector_install",
    "imbue.observability.config_render",
    "imbue.observability.data_types",
    "imbue.observability.primitives",
    "imbue.observability.errors",
]

# Shared pytest settings (markers, filterwarnings, coverage report config)
# are centralized in:
#   libs/imbue_common/imbue/imbue_common/conftest_hooks.py
# The settings below remain here because they are read from pyproject.toml
# before any hooks run: addopts, coverage.run, inline-snapshot, timeout_func_only.
[tool.pytest.ini_options]
timeout_func_only = true
junit_family = "xunit1"
testpaths = ["."]
addopts = [
  "--cov=imbue.observability",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--durations=20",
  "--timeout=10",
  "--timeout-method=signal",
  "--slow-tests-to-file",
  "--coverage-to-file",
]

[tool.coverage.run]
parallel = true
concurrency = ["multiprocessing", "thread"]
omit = [
  "*_test.py",
  "test_*.py",
  "*/tests/*",
  "*/conftest.py",
]

[tool.inline-snapshot]
default-flags=["report"]
default-flags-tui=["report"]
default-flags-ide=["report"]
format-command="uv run ruff format --force-exclude --config pyproject.toml --stdin-filename {filename}"

[tool.pyright]
venvPath = "../.."
venv = ".venv"
pythonVersion = "3.11"
strict = ["**/*.py"]

[tool.coverage.report]
fail_under = 80
omit = [
  "*_test.py",
  "test_*.py",
  "*/tests/*",
  "*/conftest.py",
]
