#cloud-config
# Base image for one tier's observability instance (OVH Public Cloud VPS).
#
# The instance runs a single-writer OpenObserve behind a caddy ingest gate:
# caddy terminates TLS with the tier's Cloudflare origin certificate and
# exposes ONLY the OTLP ingest routes + /healthz; the UI is reachable only
# over an SSH tunnel to loopback. Parquet data lives in the tier's R2 bucket
# and metadata in Neon Postgres, so this host is disposable.
#
# This file provisions the host and the openobserve systemd unit but neither
# the binaries nor the config: `observability deploy` installs the pinned,
# checksummed OpenObserve release, the rendered openobserve.env / Caddyfile /
# nftables.conf, the origin TLS material, and the self-monitoring
# otelcol-contrib, then enables and restarts the units. Re-render + redeploy
# to change anything -- never hand-edit on the host.

# Refresh the apt cache first: base images commonly ship with a stale/empty
# cache, and a failed package install would only surface later when `deploy`
# tries to restart the missing services.
package_update: true

packages:
  - nftables
  - caddy
  - curl
  - unattended-upgrades

write_files:
  # The openobserve binary and its EnvironmentFile are installed by
  # `observability deploy` (pinned + sha256 verified there), so a version bump
  # never needs a reimage -- replacement instances are the upgrade path anyway.
  - path: /etc/systemd/system/openobserve.service
    content: |
      [Unit]
      Description=OpenObserve single-node observability store
      After=network-online.target
      Wants=network-online.target
      [Service]
      User=openobserve
      Group=openobserve
      EnvironmentFile=/etc/openobserve/openobserve.env
      WorkingDirectory=/var/lib/openobserve
      ExecStart=/usr/local/bin/openobserve
      Restart=always
      RestartSec=2
      LimitNOFILE=65536
      [Install]
      WantedBy=multi-user.target

runcmd:
  # Every service (nftables, caddy, openobserve, otelcol-contrib) is enabled
  # and started by `observability deploy` once its binary/config is in place --
  # enabling them here would just start them against missing config.
  - systemctl daemon-reload
