#cloud-config
# Base image for one tier's Bugsink error-tracker instance (OVH Public Cloud
# VPS).
#
# The instance runs a single-writer Bugsink (Django + gunicorn, one worker)
# behind a caddy ingest gate: caddy terminates TLS with the tier's Cloudflare
# origin certificate and exposes ONLY the Sentry-protocol DSN ingest routes;
# the login page, UI, and REST API are reachable only over an SSH tunnel to
# loopback. All state lives in the tier's Neon Postgres, so this host is
# disposable.
#
# This file provisions the host and the bugsink systemd unit but neither the
# packages' payload nor the config: `observability bugsink deploy` installs
# the hash-locked pip set into /opt/bugsink/venv, the vendored bugsink_conf.py
# settings module, and the rendered bugsink.env / Caddyfile / nftables.conf +
# origin TLS material, then enables and restarts the units. Re-render +
# redeploy to change anything -- never hand-edit on the host.

# Refresh the apt cache first: base images commonly ship with a stale/empty
# cache, and a failed package install would only surface later when `deploy`
# tries to restart the missing services.
package_update: true

packages:
  - nftables
  - caddy
  - curl
  - unattended-upgrades
  - python3-venv

write_files:
  # The venv payload and its EnvironmentFile are installed by `observability
  # bugsink deploy` (hash-locked pip set), so a version bump never needs a
  # reimage -- replacement instances are the upgrade path anyway. The
  # ExecStartPre steps run Bugsink's own idempotent migrations and the
  # first-boot superuser creation (prestart consumes CREATE_SUPERUSER only
  # while no user exists yet); gunicorn runs ONE worker because Bugsink's
  # digestion is a single-writer design (request concurrency comes from
  # threads, keeping every digest in one process). bugsink-manage and
  # gunicorn resolve the vendored bugsink_conf settings module from the
  # working directory, exactly like the validated prototype did. The start
  # timeout is sized for a first boot on a fresh database, which runs all of
  # Bugsink's migrations against Neon inside ExecStartPre (~1-2 minutes
  # cross-region; steady-state boots are seconds).
  - path: /etc/systemd/system/bugsink.service
    content: |
      [Unit]
      Description=Bugsink single-writer error tracker
      After=network-online.target
      Wants=network-online.target
      [Service]
      User=bugsink
      Group=bugsink
      EnvironmentFile=/etc/bugsink/bugsink.env
      WorkingDirectory=/opt/bugsink
      TimeoutStartSec=600
      ExecStartPre=/opt/bugsink/venv/bin/bugsink-manage migrate
      ExecStartPre=/opt/bugsink/venv/bin/bugsink-manage prestart
      ExecStart=/opt/bugsink/venv/bin/gunicorn --bind=127.0.0.1:8300 --workers=1 --threads=8 --access-logfile=- --error-logfile=- bugsink.wsgi
      Restart=always
      RestartSec=2
      [Install]
      WantedBy=multi-user.target

runcmd:
  # Every service (nftables, caddy, bugsink) is enabled and started by
  # `observability bugsink deploy` once its payload/config is in place --
  # enabling them here would just start them against missing config.
  - systemctl daemon-reload
