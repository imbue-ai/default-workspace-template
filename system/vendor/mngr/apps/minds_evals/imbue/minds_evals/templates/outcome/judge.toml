# The outcome judge: one likert criterion over the recorded evidence, rendered per case so the
# file list can grow with the evidence a case produces.
#
# weight balances this judge against the programmatic criteria in the same directory. rewardkit
# aggregates a dimension in two levels: every .py criterion is averaged into ONE programmatic
# reward of weight 1.0, and each judge toml is a second reward carrying this weight. So weight = 1.0
# is what makes the judge exactly half the outcome dimension, whatever number of programmatic
# criteria the case happens to declare.
[judge]
judge = "anthropic/claude-opus-4-8"
files = $judge_files
prompt_template = "prompt.md"
weight = $judge_weight

[[criterion]]
name = "works_as_expected"
description = "Given this evidence, how fully does the delivered artifact meet the stated expectations? 10 = everything commissioned is there and demonstrably working, with the evidence to show it. 1 = nothing was delivered, or what was delivered does not do what was asked."
type = "likert"
points = 10
