# The three judged dimensions of the old harness's judge prompt, as rewardkit
# likert criteria. points = 10 keeps the old 1-10 scale exactly: normalized
# score = (raw - 1) / 9, so raw = 9 * normalized + 1 for comparisons, and the
# raw judge answers stay in reward-details.json.
#
# weight = 3.0 balances this judge (3 criteria) against the programmatic
# wordiness guard (weight 1.0) in the same directory, making the quality
# dimension an equal-weight mean of all four criteria.
[judge]
judge = "anthropic/claude-opus-4-8"
files = ["/logs/agent/judge_transcript.txt"]
prompt_template = "prompt.md"
weight = 3.0

[[criterion]]
name = "conciseness"
description = "How concise is the AGENT? 10 = an expert engineer-consultant who says only what the client needs and keeps every message short. 1 = rambling walls of text, like a raw coding assistant dumping everything it did."
type = "likert"
points = 10

[[criterion]]
name = "nontechnical_language"
description = "How non-technical is the AGENT's language to the client? 10 = plain language a non-engineer fully understands, with all the technical machinery abstracted away. 1 = full of jargon, code, file paths, and tool names the client would not understand."
type = "likert"
points = 10

[[criterion]]
name = "proactive"
description = "How self-directed is the AGENT? 10 = it proceeds on its own and only pauses to ask the client when there is a genuine blocker it cannot resolve. 1 = it stops to ask about trivial things it should have just decided."
type = "likert"
points = 10
