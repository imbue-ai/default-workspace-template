schema_version = "1.4"

# The driver keeps these current in the box after every turn, so a timed-out
# trial still hands the verifier a gradeable partial transcript. conversation
# is the clean per-turn record the verifier grades; full_transcript is the raw
# event stream kept for debugging.
#
# verification/ is the evidence bundle the driver collects while the workspace
# is still alive (registry, services, file inventory, HTTP probes, the
# deliverable bundle). It is declared as a DIRECTORY: harbor's artifact source
# is an exact path -- a file or a directory, never a glob -- and every artifact
# re-materializes at its original absolute path in the verifier. The driver
# creates the directory at setup, before anything can fail, because harbor
# records a missing declared path as a failed artifact and then refuses to
# regrade the trial. So the directory is always there and its presence says
# nothing; a trial that never reached collection leaves it empty, and the
# verifier reads the absent manifest.json as absent evidence.
artifacts = [
    "/logs/agent/conversation.jsonl",
    "/logs/agent/full_transcript.jsonl",
    "/logs/agent/state.json",
    "/logs/agent/verification",
]

[task]
name = "minds-evals/$case_id"
version = "1.0.0"
description = "Minds persona eval case $case_id: a multi-turn client conversation against a real Minds workspace"
keywords = ["minds", "persona", "eval"]

[metadata]
case_id = "$case_id"
mngr_branch = "$mngr_branch"
mngr_sha = "$mngr_sha"
dwt_repo = "$dwt_repo"
dwt_branch = "$dwt_branch"
dwt_sha = "$dwt_sha"

[agent]
# The case budget, plus the evidence-collection budget, plus grace: the driver's
# own conversation deadline (timeout_seconds) fires first and marks the trial
# timed_out, collection then runs against its own deadline, and the grace covers
# the final snapshot and the workspace destroy sweep before harbor cancels run().
timeout_sec = $agent_timeout_sec

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[verifier.env]
ANTHROPIC_API_KEY = "$${ANTHROPIC_API_KEY}"

# The verifier is a slim rewardkit container making one judge call, so it needs
# far less than the box's 6 CPU / 16 GB. Without this block harbor copies the
# top-level [environment] sizing wholesale. The image still builds from tests/
# (separate mode); this only sets resources.
[verifier.environment]
cpus = 2
memory_mb = 4096

[environment]
cpus = 6
memory_mb = 16384
workdir = "/work/mngr"
