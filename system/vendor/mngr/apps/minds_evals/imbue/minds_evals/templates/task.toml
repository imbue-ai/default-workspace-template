schema_version = "1.4"
# Empty for a single-step case. A stepped case sets the reward strategy here, above every table, so
# that it stays a top-level key rather than becoming a member of whichever table precedes it.
$reward_strategy_toml
# The driver keeps trajectory.json and state.json current in the box after
# every turn, so a timed-out trial still hands the verifier a gradeable partial
# record. trajectory.json is the ATIF trajectory every grade-time reader takes
# the conversation from: the driver's hand-built turn summary while the trial
# runs, replaced by the workspace agent's own document once the evidence phase
# captures it. Across a stepped case it is cumulative, so every step's copy
# describes the whole conversation up to that step. state.json carries the turn
# and timeout state the gates check.
#
# verification/ is the evidence bundle the driver collects while the workspace
# is still alive (registry, services, file inventory, HTTP probes, the
# deliverable bundle, the captured common transcript). It is declared as a
# DIRECTORY: harbor's artifact source is an exact path -- a file or a
# directory, never a glob -- and every artifact re-materializes at its original
# absolute path in the verifier. The driver creates the directory at setup,
# before anything can fail, because harbor records a missing declared path as a
# failed artifact and then refuses to regrade the trial. So the directory is
# always there and its presence says nothing; a trial that never reached
# collection leaves it empty, and the verifier reads the absent manifest.json
# as absent evidence.
artifacts = [
    "/logs/agent/trajectory.json",
    "/logs/agent/state.json",
    "/logs/agent/verification",
]

[task]
name = "minds-evals/$case_id"
version = "1.0.0"
description = "Minds persona eval case $case_id: a multi-turn client conversation against a real Minds workspace"
keywords = ["minds", "persona", "eval"]

[metadata]
case_id = "$case_id"
mngr_branch = "$mngr_branch"
mngr_sha = "$mngr_sha"
dwt_repo = "$dwt_repo"
dwt_branch = "$dwt_branch"
dwt_sha = "$dwt_sha"

[agent]
# The case budget, plus the evidence-collection budget, plus grace: the driver's
# own conversation deadline (timeout_seconds) fires first and marks the trial
# timed_out, collection then runs against its own deadline, and the grace covers
# the final snapshot and the workspace destroy sweep before harbor cancels run().
timeout_sec = $agent_timeout_sec

[verifier]
timeout_sec = $verifier_timeout_sec
environment_mode = "separate"

[verifier.env]
ANTHROPIC_API_KEY = "$${ANTHROPIC_API_KEY}"

# The verifier is a slim rewardkit container making one judge call, so it needs
# far less than the box's 6 CPU / 16 GB. Without this block harbor copies the
# top-level [environment] sizing wholesale. The image still builds from the
# tests directory (separate mode) -- the task's, or a step's own where there are
# steps; this only sets resources.
[verifier.environment]
cpus = 2
memory_mb = 4096

[environment]
cpus = 6
memory_mb = 16384
workdir = "/work/mngr"

# Empty for a single-step case. A stepped case renders its [[steps]] array here. Steps inherit the
# separate verifier mode and the sizing from the [verifier] block above. Each step restates its
# verifier timeout so that the figure a reader of a step sees is the one that step gets, rather than
# one it silently inherits from a block that also configures the task-level verifier a stepped task
# never runs. Each step ships its own steps/<name>/tests/ and builds its verifier image from THAT
# directory rather than from tests/ -- harbor replaces the build context, it does not overlay it.
$steps_toml
