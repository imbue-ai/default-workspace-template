[project]
name = "minds-evals"
version = "0.1.0"
description = "Harbor-based Minds persona evals: generate task datasets from eval configs and drive multi-turn persona conversations against real Minds workspaces on Modal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The design pins harbor 0.21.0 with its modal extra. Two workspace-level
    # conflicts force the shape of this dependency:
    #   - PyPI harbor 0.21.0 was published inside the supply-chain cooldown
    #     window (root exclude-newer), so harbor comes from the upstream git
    #     tag instead (same code, pinned in [tool.uv.sources] below).
    #   - The [modal] extra is exactly {modal, dockerfile-parse}, but its modal
    #     floor (>=1.5.1) conflicts with the workspace-wide modal==1.4.3 pin
    #     (imbue-mngr-modal), so we depend on bare harbor and supply the
    #     extra's packages ourselves: modal from the workspace pin,
    #     dockerfile-parse explicitly.
    "harbor==0.21.0",
    "modal",
    "dockerfile-parse>=2.0.1",
    "anthropic>=0.40",
    "click>=8.0.0",
    "loguru>=0.7",
    "pydantic>=2.11",
    "imbue-common",
    # Token -> USD pricing for the workspace agent's transcript usage. Reusing
    # this table rather than copying it keeps the eval's cost numbers bound to
    # the same prices the LiteLLM proxy bills at (enforced by
    # apps/modal_litellm/mngr_usage_pricing_drift_test.py).
    "imbue-mngr-usage",
]

[project.scripts]
minds-evals-harbor = "imbue.minds_evals.generate:main"

[tool.uv.sources]
# PyPI harbor 0.21.0 postdates the workspace's supply-chain cooldown cutoff;
# the upstream git tag is the same release without the registry timestamp.
harbor = { git = "https://github.com/harbor-framework/harbor", tag = "v0.21.0" }
imbue-mngr-usage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imbue"]
exclude = ["*_test.py", "test_*.py", "**/conftest.py", "**/testing.py"]

[tool.pytest.ini_options]
timeout_func_only = true
junit_family = "xunit1"
testpaths = ["."]
addopts = [
  "--cov=imbue.minds_evals",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--durations=20",
  "--timeout=10",
  "--timeout-method=signal",
  "--slow-tests-to-file",
  "--coverage-to-file",
]

[tool.coverage.run]
parallel = true
concurrency = ["multiprocessing", "thread"]
# templates/ files run inside eval containers, not the dev process.
omit = ["*_test.py", "test_*.py", "*/tests/*", "*/conftest.py", "*/templates/*"]

[tool.inline-snapshot]
default-flags=["report"]
default-flags-tui=["report"]
default-flags-ide=["report"]
format-command="uv run ruff format --force-exclude --config pyproject.toml --stdin-filename {filename}"
