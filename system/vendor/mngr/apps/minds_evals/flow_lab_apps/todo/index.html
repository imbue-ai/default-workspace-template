<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Todo</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 30rem; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0; }
  /* The row's text is a label, or a span when unnamed=1 strips the association, and a completed
     row reads as struck through either way: the knob takes away the accessible name and nothing
     else. */
  li.done label, li.done span { text-decoration: line-through; }
  footer { margin-top: 1rem; color: #555; font-size: 0.9rem; }
  /* arm_delete: the only acknowledgement of a first click is this highlight,
     so a reader who sees only the accessibility tree cannot tell it is armed. */
  button.armed { background: #d9d9d9; border-radius: 8px; }
</style>
</head>
<body>
<h1>Todo</h1>

<div>
  <label for="new-task">New task</label>
  <input id="new-task" type="text">
  <button id="add">Add</button>
</div>

<ul id="list"></ul>

<button id="refresh">Refresh</button>
<span id="clock" aria-label="clock" hidden></span>
<p id="status" role="status"></p>

<footer id="count"></footer>
<!-- A real navigation: the link reopens the page with no query, so it leaves the document. -->
<p><a id="start-over" href="./">Start over</a></p>

<script>
"use strict";

// Fixture knobs, read once at load so a test dials in one behaviour per page load.
const params = new URLSearchParams(location.search);
// latency: milliseconds between the user action and the DOM update. 0 means the
// handler mutates and renders synchronously, so "nothing happened yet" is impossible.
const LATENCY_MS = parseInt(params.get("latency") || "0", 10) || 0;
// arm_delete: delete needs two clicks on the same button, the first one only arming it.
const ARM_DELETE = params.get("arm_delete") === "1";
// dedupe=ci: an add whose text matches an existing task case-insensitively is dropped
// silently, so the input clears but the list is unchanged.
const DEDUPE_CI = params.get("dedupe") === "ci";
// ticker=1: a clock repaints every 100 ms, so the DOM never reaches a quiet state.
const TICKER = params.get("ticker") === "1";
// pending=<ms>: every change first shows a "Saving..." status, and only that many milliseconds
// later applies and clears the status. The shape of an app that talks to a backend: the page
// reacts at once, but with a pending state rather than the result. Leaving the page works the same
// way, so a navigation lands after the page has already been seen to react rather than instead of
// reacting.
const PENDING_MS = parseInt(params.get("pending") || "0", 10) || 0;
// unnamed=1: a task's checkbox gets no label association, so it has no accessible name and the
// tree lists it as a bare `checkbox`. The shape of an app whose author skipped accessibility.
const UNNAMED = params.get("unnamed") === "1";

const STORAGE_KEY = "todo.tasks";
const listEl = document.getElementById("list");
const inputEl = document.getElementById("new-task");
const countEl = document.getElementById("count");
const clockEl = document.getElementById("clock");
const statusEl = document.getElementById("status");

function loadTasks() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw === null) {
    return [
      { text: "Buy milk", done: false },
      { text: "Learn React", done: true },
    ];
  }
  const parsed = JSON.parse(raw);
  return parsed.map((task) => ({ text: String(task.text), done: Boolean(task.done) }));
}

let tasks = loadTasks();

// Which delete button is armed, identified by task text; null when nothing is armed.
let armedDelete = null;

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
}

// Applies a state change either now or after LATENCY_MS, so add, toggle and delete
// all share one timing path. With PENDING_MS the change is announced first and
// applied later, so the page has an intermediate state a reader can see.
function commit(change) {
  if (PENDING_MS > 0) {
    statusEl.textContent = "Saving...";
    setTimeout(() => {
      change();
      save();
      statusEl.textContent = "";
      render();
    }, PENDING_MS);
  } else if (LATENCY_MS === 0) {
    change();
    save();
    render();
  } else {
    setTimeout(() => {
      change();
      save();
      render();
    }, LATENCY_MS);
  }
}

function addTask() {
  const text = inputEl.value.trim();
  if (text === "") return;
  commit(() => {
    const isDuplicate = DEDUPE_CI && tasks.some((t) => t.text.toLowerCase() === text.toLowerCase());
    if (!isDuplicate) {
      tasks.push({ text: text, done: false });
    }
    // Clearing happens with the render, so a delayed add leaves the typed text visible.
    inputEl.value = "";
  });
}

function toggleTask(index) {
  commit(() => {
    tasks[index].done = !tasks[index].done;
  });
}

function deleteTask(index) {
  commit(() => {
    tasks.splice(index, 1);
  });
}

function render() {
  listEl.textContent = "";
  tasks.forEach((task, index) => {
    const row = document.createElement("li");
    if (task.done) row.className = "done";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = task.done;
    checkbox.id = "task-" + index;
    checkbox.addEventListener("change", () => {
      // Re-render from state so the checkbox reflects the model, not the click,
      // until the (possibly delayed) commit lands.
      checkbox.checked = task.done;
      toggleTask(index);
    });

    const taskText = document.createElement(UNNAMED ? "span" : "label");
    if (!UNNAMED) taskText.htmlFor = checkbox.id;
    taskText.textContent = task.text;

    const del = document.createElement("button");
    del.textContent = 'Delete "' + task.text + '"';
    if (ARM_DELETE && armedDelete === task.text) del.className = "armed";
    del.addEventListener("click", (event) => {
      event.stopPropagation();
      if (ARM_DELETE && armedDelete !== task.text) {
        disarm();
        armedDelete = task.text;
        del.className = "armed";
        return;
      }
      disarm();
      deleteTask(index);
    });

    row.appendChild(checkbox);
    row.appendChild(taskText);
    row.appendChild(del);
    listEl.appendChild(row);
  });

  const doneCount = tasks.filter((t) => t.done).length;
  countEl.textContent = tasks.length + (tasks.length === 1 ? " task, " : " tasks, ") + doneCount + " completed";
}

function disarm() {
  armedDelete = null;
  listEl.querySelectorAll("button.armed").forEach((el) => el.removeAttribute("class"));
}

document.getElementById("add").addEventListener("click", addTask);
inputEl.addEventListener("keydown", (event) => {
  if (event.key === "Enter") addTask();
});

// Refresh is deliberately dead: it exists so a test can check that a plausible
// control produces no observable change at all.
document.getElementById("refresh").addEventListener("click", () => {});

// With PENDING_MS the link acknowledges the click and leaves the document only afterwards, which is
// how an app that saves and then redirects behaves. Left as a plain link otherwise.
document.getElementById("start-over").addEventListener("click", (event) => {
  if (PENDING_MS === 0) return;
  event.preventDefault();
  statusEl.textContent = "Saving...";
  setTimeout(() => {
    location.href = "./";
  }, PENDING_MS);
});

document.addEventListener("click", () => {
  if (ARM_DELETE) disarm();
});

if (TICKER) {
  clockEl.hidden = false;
  const startedAt = Date.now();
  setInterval(() => {
    clockEl.textContent = String(Date.now() - startedAt) + " ms";
  }, 100);
}

render();
</script>
</body>
</html>
