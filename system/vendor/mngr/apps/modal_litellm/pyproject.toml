[project]
name = "modal-litellm"
version = "0.1.0"
description = "LiteLLM proxy deployed as a Modal serverless function for cost-tracked Claude API access"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Plain litellm (no [proxy] extra), ==-pinned to the image group's version
    # so the venv the tests run in agrees with the image by construction (the
    # drift test asserts it). The [proxy] extra stays image-group-only: its
    # gunicorn<24 cap must not constrain the workspace outside the litellm
    # image fork (the bugsink image fork needs gunicorn 26 -- see the
    # `conflicts` declaration in the root pyproject).
    "litellm==1.93.0",
    "modal>=1.4.3",
    "modal-app-kit",
    "prisma>=0.15",
    "pyyaml>=6.0",
    "tenacity>=8.0",
]
license = {text = "MIT"}

# The exact pip set the deployed Modal image installs, ==-pinned so the
# container is a pure function of this file + uv.lock. Resolved as part of the
# workspace lock (so unit tests exercise the same versions the image ships)
# and exported with hashes to image_requirements.txt via
# `just export-image-requirements`; drift tests keep the export current.
#
# litellm is pinned deliberately: the proxy's auth/budget behavior (user-level
# budgets enforce the per-account monthly LLM spend quota) must not drift
# under us on a redeploy. Bump only on purpose, re-verifying budget
# enforcement + the price map for the models in LITELLM_CONFIG (app.py).
[dependency-groups]
image = [
    "litellm[proxy]==1.93.0",
    "prisma==0.15.0",
    "pyyaml==6.0.3",
    "sentry-sdk==2.66.0",
    "tenacity==9.1.4",
]

[tool.uv.sources]
modal-app-kit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["app.py"]

[tool.pytest.ini_options]
timeout_func_only = true
junit_family = "xunit1"
testpaths = ["."]
addopts = [
  "--cov=app",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--durations=20",
  "--timeout=10",
  "--timeout-method=signal",
]

[tool.coverage.run]
parallel = true
concurrency = ["multiprocessing", "thread"]
omit = [
  "*_test.py",
  "test_*.py",
  "*/tests/*",
  "*/conftest.py",
]
