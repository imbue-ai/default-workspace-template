[project]
name = "imbue-minds-admin"
version = "0.1.0"
description = "Private operator CLI for the minds stack: env lifecycle, bare-metal pool provisioning, and connector admin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "click>=8.0",
    "concurrency-group",
    "httpx>=0.27.0",
    "imbue-common",
    "imbue-mngr",
    "imbue-mngr-imbue-cloud",
    "imbue-mngr-lima",
    "imbue-mngr-ovh",
    "imbue-mngr-vps",
    "imbue-observability",
    "minds",
    "loguru",
    "modal>=1.4.3",
    "psutil",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "tabulate",
    "tomlkit>=0.12.0",
]

[project.scripts]
minds-admin = "imbue.minds_admin.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imbue"]
exclude = ["*_test.py", "test_*.py", "**/conftest.py", "**/testing.py"]

[tool.uv.sources]
concurrency-group = { workspace = true }
imbue-common = { workspace = true }
imbue-mngr = { workspace = true }
imbue-mngr-imbue-cloud = { workspace = true }
imbue-mngr-lima = { workspace = true }
imbue-mngr-ovh = { workspace = true }
imbue-mngr-vps = { workspace = true }
imbue-observability = { workspace = true }
minds = { workspace = true }

# Shared pytest settings (markers, filterwarnings, coverage report config)
# are centralized in:
#   libs/imbue_common/imbue/imbue_common/conftest_hooks.py
# The settings below remain here because they are read from pyproject.toml
# before any hooks run: addopts, coverage.run, inline-snapshot, timeout_func_only.
[tool.pytest.ini_options]
timeout_func_only = true
junit_family = "xunit1"
testpaths = ["."]
addopts = [
  "--cov=imbue.minds_admin",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--durations=20",
  "--timeout=10",
  "--timeout-method=signal",
  "--slow-tests-to-file",
  "--coverage-to-file",
]

[tool.coverage.run]
parallel = true
concurrency = ["multiprocessing", "thread"]
omit = [
  "*_test.py",
  "test_*.py",
  "*/tests/*",
  "*/conftest.py",
]

[tool.inline-snapshot]
default-flags=["report"]
default-flags-tui=["report"]
default-flags-ide=["report"]
format-command="uv run ruff format --force-exclude --config pyproject.toml --stdin-filename {filename}"

[tool.coverage.report]
# Pinned to the coverage the relocated operator modules arrive with (they were
# tested at roughly this level in their source projects). Bring this up as the
# cloud-touching CLI paths gain unit tests.
fail_under = 50
omit = [
  "*_test.py",
  "test_*.py",
  "*/tests/*",
  "*/conftest.py",
]

[tool.pyright]
venvPath = "../.."
venv = ".venv"
pythonVersion = "3.12"
strict = ["**/*.py"]
