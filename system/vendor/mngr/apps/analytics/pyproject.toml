[project]
name = "analytics"
version = "0.1.0"
description = "Minds analytics: DuckLake lakehouse aggregation of server-side product data and (later) explorer-workspace collection, deployed as a cron-only Modal app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # click, imbue-common, and loguru are used only by the operator-run
    # dashboards extract script (dashboards/extract_box_metrics.py); the
    # Modal image installs only the image dependency group and never
    # imports it.
    "click>=8.1",
    "duckdb>=1.4",
    "imbue-common",
    "loguru>=0.7",
    "modal>=1.4.3",
    "modal-app-kit",
    "paramiko>=3.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    # Used only by the injected collection script (imbue/analytics/injected/),
    # which runs inside workspaces under its own PEP 723 environment. Listed
    # here so the dev venv and the type checker see the same modules; the
    # Modal image installs only the image dependency group and never imports
    # the script.
    "presidio-analyzer>=2.2",
]
license = {text = "FCL-1.0-MIT"}
license-files = [
    "LICENSE",
]

# The exact pip set the deployed Modal image installs, ==-pinned so the
# container is a pure function of this file + uv.lock. Resolved as part of the
# workspace lock (so unit tests exercise the same versions the image ships)
# and exported with hashes to image_requirements.txt via
# `just export-image-requirements`; drift tests keep the export current and
# aligned with THIRD_PARTY_IMPORT_ROOTS in deploy_constants.py.
[dependency-groups]
image = [
    "duckdb==1.5.4",
    "paramiko==3.5.1",
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imbue"]
exclude = ["*_test.py", "test_*.py", "**/conftest.py", "**/testing.py"]

[tool.uv.sources]
imbue-common = { workspace = true }
modal-app-kit = { workspace = true }

# Shared pytest settings (markers, filterwarnings, coverage report config)
# are centralized in:
#   libs/imbue_common/imbue/imbue_common/conftest_hooks.py
# The settings below remain here because they are read from pyproject.toml
# before any hooks run: addopts, coverage.run, inline-snapshot, timeout_func_only.
[tool.pytest.ini_options]
timeout_func_only = true
junit_family = "xunit1"
testpaths = ["."]
addopts = [
  "--cov=imbue.analytics",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--durations=20",
  "--timeout=10",
  "--timeout-method=signal",
  "--slow-tests-to-file",
  "--coverage-to-file",
]

[tool.coverage.run]
parallel = true
concurrency = ["multiprocessing", "thread"]
omit = [
  "*_test.py",
  "test_*.py",
  "*/tests/*",
  "*/conftest.py",
]

[tool.inline-snapshot]
default-flags=["report"]
default-flags-tui=["report"]
default-flags-ide=["report"]
format-command="uv run ruff format --force-exclude --config pyproject.toml --stdin-filename {filename}"

[tool.pyright]
venvPath = "../.."
venv = ".venv"
pythonVersion = "3.11"
strict = ["**/*.py"]

[tool.coverage.report]
fail_under = 80
