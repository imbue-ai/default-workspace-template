[project]
name = "remote-service-connector"
version = "0.1.0"
description = "Modal-deployed connector for managing remote services (SuperTokens auth, pool-host leasing, R2 buckets, self-hosted workspace sharing) via authenticated HTTP endpoints"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "acme>=2.11",
    "boto3>=1.34",
    "cachetools>=7.0",
    "click>=8.0",
    "cryptography>=42",
    "fastapi[standard]>=0.115.0",
    "httpx>=0.27.0",
    "imbue-common",
    "josepy>=1.14",
    "loguru>=0.7",
    "modal>=1.4.3",
    "modal-app-kit",
    "paramiko>=3.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "pyjwt>=2.8",
    "pyyaml>=6.0",
    "supertokens-python>=0.31.3",
    "tenacity>=8.0",
]
license = {text = "FCL-1.0-MIT"}
license-files = [
    "LICENSE",
]

# The exact pip set the deployed Modal image installs, ==-pinned so the
# container is a pure function of this file + uv.lock. Resolved as part of the
# workspace lock (so unit tests exercise the same versions the image ships)
# and exported with hashes to image_requirements.txt via
# `just export-image-requirements`; drift tests keep the export current and
# aligned with THIRD_PARTY_IMPORT_ROOTS in deploy_constants.py.
[dependency-groups]
# Test-only: the box-script tests drive the rendered bash for real.
dev = [
    "concurrency-group",
]
image = [
    "acme==5.6.0",
    "boto3==1.43.6",
    "cachetools==7.1.4",
    "cryptography==48.0.1",
    "fastapi[standard]==0.139.2",
    "httpx==0.28.1",
    "josepy==2.2.0",
    "paramiko==3.5.1",
    "psycopg2-binary==2.9.12",
    "pyjwt==2.13.0",
    "pyyaml==6.0.3",
    "sentry-sdk==2.66.0",
    "supertokens-python==0.31.3",
    "tenacity==9.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imbue"]
exclude = ["*_test.py", "test_*.py", "**/conftest.py", "**/testing.py"]

[tool.uv.sources]
concurrency-group = { workspace = true }
imbue-common = { workspace = true }
modal-app-kit = { workspace = true }

# Shared pytest settings (markers, filterwarnings, coverage report config)
# are centralized in:
#   libs/imbue_common/imbue/imbue_common/conftest_hooks.py
# The settings below remain here because they are read from pyproject.toml
# before any hooks run: addopts, coverage.run, inline-snapshot, timeout_func_only.
[tool.pytest.ini_options]
timeout_func_only = true
junit_family = "xunit1"
testpaths = ["."]
addopts = [
  "--cov=imbue.remote_service_connector",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--durations=20",
  "--timeout=10",
  "--timeout-method=signal",
  "--slow-tests-to-file",
  "--coverage-to-file",
]

[tool.coverage.run]
parallel = true
concurrency = ["multiprocessing", "thread"]
omit = [
  "*_test.py",
  "test_*.py",
  "*/tests/*",
  "*/conftest.py",
]

[tool.inline-snapshot]
default-flags=["report"]
default-flags-tui=["report"]
default-flags-ide=["report"]
format-command="uv run ruff format --force-exclude --config pyproject.toml --stdin-filename {filename}"

[tool.pyright]
venvPath = "../.."
venv = ".venv"
pythonVersion = "3.11"
strict = ["**/*.py"]

[tool.coverage.report]
fail_under = 80
