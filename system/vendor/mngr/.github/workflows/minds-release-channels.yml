# Publishes the minds release channels declared in apps/minds/release-channels.toml,
# which is the desired state this makes true.
#
# Two jobs, split by trust:
#
#   validate  runs on the PR with NO credentials. Every gate reads a public URL
#             -- ToDesktop's build manifest, the Lima image manifest, the
#             channel's current state -- so it reports what would publish
#             without a secret being reachable from PR-authored code.
#
#   publish   runs only from main, behind the `minds-release` environment, which
#             gates the Vault role that can read the R2 credential.

name: minds release channels

# Everything that can change the published bytes: the declared channels, the
# code that renders a manifest, the R2 layer it reaches the bucket through, and
# the files resolve_tier.sh reads to decide where the manifests go. Both
# triggers watch the identical set.
on:
  pull_request:
    paths:
      - 'apps/minds/release-channels.toml'
      - 'apps/minds/todesktop.js'
      - 'apps/minds/imbue/minds/config/envs/production/client.toml'
      - 'scripts/release_channel/**'
      - 'scripts/r2/**'
  push:
    branches: [main]
    paths:
      - 'apps/minds/release-channels.toml'
      - 'apps/minds/todesktop.js'
      - 'apps/minds/imbue/minds/config/envs/production/client.toml'
      - 'scripts/release_channel/**'
      - 'scripts/r2/**'
  workflow_dispatch:

concurrency:
  # One publisher at a time: two runs racing would leave whichever finished
  # last in charge, regardless of which commit was newer.
  group: minds-release-channels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No id-token: this job runs PR-authored code, and every gate it runs reads
    # a public URL. Granting it would hand that code the credential the publish
    # job trades to Vault.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'

      - name: Resolve the tier's feed from its client.toml
        id: tier
        run: bash scripts/release_channel/resolve_tier.sh production

      - name: Dry-run every gate
        if: steps.tier.outputs.feed_base_url != ''
        # Through env rather than `${{ }}` in the script body: these are read out
        # of the checked-out tree, which on a pull_request is PR-authored, and
        # `${{ }}` is expanded into the script text before bash parses it.
        env:
          APP_ID: ${{ steps.tier.outputs.app_id }}
          BUCKET: ${{ steps.tier.outputs.bucket }}
          FEED_BASE_URL: ${{ steps.tier.outputs.feed_base_url }}
          LIMA_BASE_URL: ${{ steps.tier.outputs.lima_base_url }}
        run: |
          set -euo pipefail
          # An array, so a config value carrying a space stays one argument
          # rather than splitting into extra flags.
          LIMA_ARGS=()
          if [ -n "$LIMA_BASE_URL" ]; then
            LIMA_ARGS=(--lima-image-base-url "$LIMA_BASE_URL")
          fi
          uv run python -m scripts.release_channel.publish \
            --app-id "$APP_ID" \
            --bucket "$BUCKET" \
            --feed-base-url "$FEED_BASE_URL" \
            "${LIMA_ARGS[@]}" \
            --dry-run

      - name: Report when the tier has no feed yet
        if: steps.tier.outputs.feed_base_url == ''
        run: |
          echo "::notice::production sets no update_feed_base_url, so no channel manifest is published yet."
          echo "No gate ran here: the step above is skipped by the same condition. release-channels.toml is"
          echo "parsed by the normal test suite; publishing turns on when the tier configures a feed."

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: minds-release
    # id-token lets use-vault-secrets mint the OIDC token it trades for the R2
    # credential.
    permissions:
      contents: read
      id-token: write
    steps:
      # `push` is main-only (see `on:`), but a workflow_dispatch names its own
      # ref, and an unmerged branch would publish a manifest no pull request
      # reviewed. Refused before checkout, so PR-authored code never runs in
      # this job's context.
      - name: Refuse to publish from anything but main
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::This job publishes the production channel manifests and runs only from main; got $REF."
          exit 1

      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'

      - name: Resolve the tier's feed from its client.toml
        id: tier
        run: bash scripts/release_channel/resolve_tier.sh production

      # Scoped to the one bucket that serves the channel manifests. Behind the
      # minds-release environment, same gate as the ToDesktop publish credentials.
      - name: Fetch the R2 publish credential from Vault
        if: steps.tier.outputs.feed_base_url != ''
        uses: imbue-ai/use-vault-secrets@main
        with:
          role: minds_release_gh
          secrets: |
            minds/release/R2_UPDATE_FEED_ACCOUNT_ID
            minds/release/R2_UPDATE_FEED_ACCESS_KEY_ID
            minds/release/R2_UPDATE_FEED_SECRET_ACCESS_KEY

      - name: Publish the declared channels
        if: steps.tier.outputs.feed_base_url != ''
        env:
          APP_ID: ${{ steps.tier.outputs.app_id }}
          BUCKET: ${{ steps.tier.outputs.bucket }}
          FEED_BASE_URL: ${{ steps.tier.outputs.feed_base_url }}
          LIMA_BASE_URL: ${{ steps.tier.outputs.lima_base_url }}
        run: |
          # pipefail so `| tee` reports the publish's status, not tee's. Piped
          # rather than appended afterwards: `bash -e` would abort first, and a
          # run that published stable then failed on alpha has already written
          # to R2, so its per-channel output has to survive.
          set -euo pipefail
          # The Vault entries are prefixed so a second bucket's credential can
          # live beside them; the tool reads the unprefixed names.
          export R2_ACCOUNT_ID="$R2_UPDATE_FEED_ACCOUNT_ID"
          export R2_ACCESS_KEY_ID="$R2_UPDATE_FEED_ACCESS_KEY_ID"
          export R2_SECRET_ACCESS_KEY="$R2_UPDATE_FEED_SECRET_ACCESS_KEY"
          # An array, so a config value carrying a space stays one argument
          # rather than splitting into extra flags on the credentialed command.
          LIMA_ARGS=()
          if [ -n "$LIMA_BASE_URL" ]; then
            LIMA_ARGS=(--lima-image-base-url "$LIMA_BASE_URL")
          fi
          uv run python -m scripts.release_channel.publish \
            --app-id "$APP_ID" \
            --bucket "$BUCKET" \
            --feed-base-url "$FEED_BASE_URL" \
            "${LIMA_ARGS[@]}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report when the tier has no feed yet
        if: steps.tier.outputs.feed_base_url == ''
        run: echo "::notice::production sets no update_feed_base_url; nothing to publish."
