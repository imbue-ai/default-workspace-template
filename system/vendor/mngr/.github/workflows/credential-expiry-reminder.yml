name: credential expiry reminder

# Weekly sweep of .github/credential-expiries.toml: any registered credential
# within 30 days of its expires_on date gets one GitHub issue filed here
# (idempotent -- an open issue with the credential's exact title suppresses a
# duplicate). Registry schema and the mechanism's docs live in the registry
# file's header; the logic is scripts/credential_expiry_reminder.py.

on:
  schedule:
    - cron: '0 14 * * 1'  # Mondays 14:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: File issues for credentials nearing expiry
        env:
          GH_TOKEN: ${{ github.token }}
        # System python suffices: the script is stdlib-only (tomllib) plus
        # the runner's preinstalled gh CLI.
        run: python3 -m scripts.credential_expiry_reminder
