name: TMR host cleanup

# Destroys the hosts left behind by past TMR runs, keeping each variant's most
# recent run so its mappers stay available to re-attach to for debugging.
#
# TMR never destroys its own hosts, so without this their records pile up on the
# provider's shared state volume, and every host creation reads all of them to
# check name uniqueness -- which is how a scheduled run ends up with a fraction
# of the hosts it asked for and its mappers packed onto the survivors.
#
# Runs before both scheduled variants (tmr-mngr at 08:00 UTC, tmr-minds at
# 09:00 UTC) so each starts against a small state volume.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be destroyed without destroying anything"
        type: boolean
        required: false
        default: false
      keep_runs:
        description: "How many recent runs of each variant to keep"
        type: string
        required: false
        default: "1"

permissions:
  contents: read
  # Lets the use-vault-secrets step below mint a GitHub OIDC token for Vault.
  id-token: write

# A sweep can take a while on a backlog of runs; never let two overlap.
concurrency:
  group: tmr-cleanup
  cancel-in-progress: false

jobs:
  prune-hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      # The namespace TMR's CI runs create their hosts in (see tmr.yml). The
      # sweep only sees those hosts when it shares it.
      MNGR_USER_ID: tmr-ci

    steps:
      - uses: actions/checkout@v6

      # Deliberately not ./.github/actions/tmr-setup: the sweep runs no agents,
      # so it needs neither the Claude CLI nor the trust seeding that setup does
      # (and must not fail on them).
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: Fetch credentials from Vault
        uses: imbue-ai/use-vault-secrets@main
        with:
          role: mngr_ci_gh
          secrets: |
            mngr/ci/MODAL_TOKEN_ID
            mngr/ci/MODAL_TOKEN_SECRET

      - name: Prune the hosts of past runs
        run: |
          dry_run_args=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            dry_run_args+=(--dry-run)
          fi
          uv run --project libs/mngr_tmr python libs/mngr_tmr/scripts/prune_tmr_hosts.py \
            --provider modal \
            --keep-runs "${{ inputs.keep_runs || '1' }}" \
            "${dry_run_args[@]}"
