# Re-points minds-v* release tags onto the public mirror (imbue-ai/mngr).
# The mirror push exports commits only; a minds-v* tag names an older main SHA
# that no per-change tag_name can express, so scripts/mirror_tag.py maps the
# private SHA to its public counterpart through the GitOrigin-RevId trailer
# (via the main first-parent commit that carries the tag: the tagged commit or
# the merge that landed it) and pushes the annotated tag with the sync App
# credential. Runs on every minds-v* tag push whose tagged commit contains
# this file (a tag push runs the workflow at the tagged commit, so tags on
# older commits trigger nothing); manual dispatch re-points one tag or
# backfills every missing one. Requires the same vars/secrets as
# mirror-push.yml.
name: Mirror tags

on:
  push:
    tags: ["minds-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to re-point (leave empty to backfill every minds-v* tag the mirror lacks)
        required: false
        default: ""
      force:
        description: Re-point a tag the mirror already has on a different commit
        type: boolean
        default: false
      dry_run:
        description: Plan and report only; push nothing
        type: boolean
        default: false

concurrency:
  group: mirror-tags
  cancel-in-progress: false

jobs:
  repoint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          # The script walks first-parent history from the tag back to an
          # exported commit and checks the tag is reachable from main; a
          # shallow clone has neither.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Mint sync-app token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.MIRROR_SYNC_APP_ID }}
          private-key: ${{ secrets.MIRROR_SYNC_APP_PRIVATE_KEY }}
          owner: imbue-ai
          repositories: mngr
      - name: Re-point the tag(s)
        env:
          MIRROR_PUSH_TOKEN: ${{ steps.app.outputs.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            args+=(--tag "${GITHUB_REF_NAME}")
          elif [ -n "${INPUT_TAG}" ]; then
            args+=(--tag "${INPUT_TAG}")
          else
            args+=(--all-missing)
          fi
          if [ "${INPUT_FORCE}" = "true" ]; then args+=(--force); fi
          if [ "${INPUT_DRY_RUN}" = "true" ]; then args+=(--dry-run); fi
          # --package imbue-common syncs only the script's own dependencies
          # (pydantic via FrozenModel, and tenacity), not the whole workspace.
          uv run --package imbue-common python scripts/mirror_tag.py "${args[@]}"
