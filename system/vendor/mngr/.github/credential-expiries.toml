# Registry of expiring credentials, checked weekly by
# .github/workflows/credential-expiry-reminder.yml (which runs
# scripts/credential_expiry_reminder.py): any entry within 30 days of its
# expires_on date gets a GitHub issue filed on this repo. Idempotent -- at
# most one open issue per credential, matched by the exact title
# "credential expiring: <name>".
#
# When you mint a credential that dies silently at expiry (a token stored
# inside a third-party service, a TLS certificate, ...), add an entry here
# instead of inventing an ad-hoc reminder:
#
#   [[credentials]]
#   name = "<unique-slug>"
#   expires_on = 2027-08-24   # a TOML local date
#   rotation = "<one line: how to rotate it>"
#
# Known candidates to add once their dates are recorded: the tiers'
# OpenObserve origin TLS certificates.

[[credentials]]
name = "mngr-openobserve-alerts"
expires_on = 2027-08-24
rotation = "Mint a replacement fine-grained GitHub PAT (Issues read/write on imbue-ai/mngr-internal only), update secrets/minds/<tier>/observability/OBSERVABILITY_ALERTS_GITHUB_TOKEN in EVERY tier's Vault entry, and re-run `observability provision-alerts` against every ARMED tier's instance (the token is stored inside each tier's OpenObserve issue-webhook destination)."
