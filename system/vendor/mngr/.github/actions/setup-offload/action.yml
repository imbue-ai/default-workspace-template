name: Set up offload
description: >-
  Install the pinned offload CLI (Rust toolchain + cargo cache + cargo install),
  shared by every offload test job so the version is pinned in one place.
inputs:
  version:
    description: >-
      offload version to install. Keep in lockstep with OFFLOAD_VERSION in
      libs/mngr/imbue/mngr/resources/Dockerfile.
    required: false
    default: "0.9.12"
runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache offload binary
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin/offload
        key: cargo-offload-${{ inputs.version }}-${{ runner.os }}

    - name: Install offload
      shell: bash
      run: |
        if ! command -v offload &> /dev/null || ! offload --version | grep -q '${{ inputs.version }}'; then
          cargo install offload@${{ inputs.version }} --force
        fi
