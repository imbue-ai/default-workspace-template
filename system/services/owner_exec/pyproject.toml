[project]
name = "owner-exec"
version = "0.1.0"
description = "Owner-authenticated in-workspace command/file exec for the hosted minds web client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "cryptography>=42.0.0",
    "werkzeug>=3.0.0",
]

[project.scripts]
owner-exec = "owner_exec.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owner_exec"]
