[project]
name = "caretaker"
version = "0.1.0"
description = "The weekly Caretaker's deterministic check: wakes the Caretaker automation agent only when it finds something worth telling the user about"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# No build-system: this is a bash-script package (a virtual uv workspace
# member). caretaker_check.sh is the command of the ``caretaker`` routine
# (system/routines/caretaker.toml), which the routines runner runs.

[dependency-groups]
dev = [
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.85",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
