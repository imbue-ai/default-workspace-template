[project]
name = "env-converge"
version = "0.1.0"
description = "Environment record + boot-time convergence: capture installed packages (apt/npm/uv/binaries) into ~/.mngr/plugin/env-converge and converge the rootfs back to the record at the pinned apt snapshot timestamp"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.0",
    "imbue-common",
    "click>=8.1",
]

[project.scripts]
env-converge = "env_converge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/env_converge"]

[dependency-groups]
dev = [
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.24",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
