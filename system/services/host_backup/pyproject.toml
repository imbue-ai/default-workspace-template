[project]
name = "host-backup"
version = "0.1.0"
description = "Continuous restic-based backup of the agent's host_dir (/home/user/.mngr/) to a remote repository (R2 by default)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.0",
    "imbue-common",
    "click>=8.1",
]

[project.scripts]
host-backup = "host_backup.runner:main"
host-backup-now = "host_backup.cli:backup_now_main"
host-backup-heavy-dirs = "host_backup.heavy_dirs:heavy_dirs_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/host_backup"]

[dependency-groups]
dev = [
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.85",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
