[project]
name = "pytest-executable-tmp"
version = "0.1.0"
description = "Test-only pytest plugin that keeps temporary files on a filesystem that can run them"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "imbue-common",
    "pydantic>=2.0",
    "pytest>=8.0",
]

[project.entry-points.pytest11]
executable_tmp = "pytest_executable_tmp.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_executable_tmp"]

[dependency-groups]
dev = [
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.24",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
