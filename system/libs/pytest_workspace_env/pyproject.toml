[project]
name = "pytest-workspace-env"
version = "0.1.0"
description = "Test-only pytest plugin that fails, rather than skips, any test where the environment is meant to be complete"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
]

[project.entry-points.pytest11]
workspace_env = "pytest_workspace_env.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_workspace_env"]
