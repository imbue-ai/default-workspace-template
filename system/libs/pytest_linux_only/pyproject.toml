[project]
name = "pytest-linux-only"
version = "0.1.0"
description = "Test-only pytest plugin that stops a run on macOS, where the workspace's suites cannot run faithfully"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "imbue-common",
    "pytest>=8.0",
]

[project.entry-points.pytest11]
linux_only = "pytest_linux_only.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_linux_only"]
