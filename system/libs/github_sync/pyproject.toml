[project]
name = "github-sync"
version = "0.1.0"
description = "Opt-in service that syncs every branch (via a post-commit hook) and each user app's own history to private GitHub repos through the latchkey gateway"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The app records: which user apps the workspace has, and the dev repository of each.
    "app-manifest",
    "click>=8.0",
    "imbue-common",
    "loguru>=0.7.0",
    "pydantic>=2.0",
]

[project.scripts]
github-sync = "github_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/github_sync"]

[dependency-groups]
dev = [
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.87",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
