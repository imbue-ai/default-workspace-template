[project]
name = "event-streams"
version = "0.1.0"
description = "The archive rule for an append-only events.jsonl stream a workspace program writes: a stream past its size threshold is moved aside and gzipped, so the file never grows without bound. Shared by the shell and the share gateway. Stdlib-only."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_streams"]

[dependency-groups]
dev = [
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.85",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
