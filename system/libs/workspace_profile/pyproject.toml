[project]
name = "workspace-profile"
version = "0.1.0"
description = "Reads the workspace profile snapshot a client writes and resolves account-keyed settings for a request identity"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "imbue-common",
    "loguru>=0.7",
    "pydantic>=2.0",
    # The request identity (the X-Imbue-Identity header) the resolution keys overrides on.
    "workspace-layout",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workspace_profile"]

[dependency-groups]
dev = [
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.85",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
