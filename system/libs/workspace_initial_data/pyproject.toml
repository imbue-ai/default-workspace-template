[project]
name = "workspace-initial-data"
version = "0.1.0"
description = "The document a workspace is handed when it is created, applied when its services start: the profile snapshot, the timezone, the update settings and the backup destination"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imbue-common",
    "loguru>=0.7",
    "pydantic>=2.0",
    # The backup part is handed to the workspace's own backup setup.
    "workspace-backup-setup",
    # The writers of the profile snapshot and the timezone.
    "workspace-profile",
    # The writer of the update settings.
    "workspace-update-control",
]

[project.scripts]
# The boot sequence runs this once the workspace's Python packages are in place (bootstrap.manager).
apply-initial-data = "workspace_initial_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workspace_initial_data"]

[dependency-groups]
dev = [
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.87",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
