[project]
name = "automations"
version = "0.1.0"
description = "The machinery that runs automations (skills on a schedule): the durable recurring-job runner, the cron agent-env wrapper, and the singleton automation-agent waker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

