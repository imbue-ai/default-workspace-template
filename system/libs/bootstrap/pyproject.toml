[project]
name = "bootstrap"
version = "0.1.0"
description = "First-boot setup + supervisord launcher for default-workspace-template"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.0",
    "tenacity>=8.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
bootstrap = "bootstrap.manager:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bootstrap"]

[dependency-groups]
dev = [
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.85",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
