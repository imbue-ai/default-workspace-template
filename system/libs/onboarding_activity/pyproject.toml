[project]
name = "onboarding-activity"
version = "0.1.0"
description = "One-way marker files recording what a workspace's owner has already done, and the onboarding items the chat's new-chat suggestions and the onboarding checklist show from them. Stdlib-only so a skill's script can import it without the app stack."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onboarding_activity"]

[dependency-groups]
dev = [
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.87",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
