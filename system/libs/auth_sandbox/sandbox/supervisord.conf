# supervisord configuration for an auth sandbox (the web latchkey auth sandbox spec, section 5.1):
# the Screen service with its stack group and watcher, the share gateway, and owner-exec, and nothing
# else -- no chat, no agents, no env-converge. The programs are the workspace's own drop-ins, named
# here one by one rather than globbed, so a drop-in added to the workspace never starts in a sandbox
# by accident. /opt/auth-sandbox/boot.sh runs this daemon from the workspace root with the environment
# the programs expect (MNGR_HOST_DIR for owner-exec's audience, the sandbox's latchkey variables).
#
# Installed at /opt/auth-sandbox/supervisord.conf by system/scripts/build_auth_sandbox_image.py.

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[include]
files = /home/user/workspace/system/supervisord.conf.d/screen.conf
        /home/user/workspace/system/supervisord.conf.d/screen-xorg.conf
        /home/user/workspace/system/supervisord.conf.d/screen-pulse.conf
        /home/user/workspace/system/supervisord.conf.d/screen-session.conf
        /home/user/workspace/system/supervisord.conf.d/screen-neko.conf
        /home/user/workspace/system/supervisord.conf.d/screen-watch.conf
        /home/user/workspace/system/supervisord.conf.d/share-gateway.conf
        /home/user/workspace/system/supervisord.conf.d/owner-exec.conf
