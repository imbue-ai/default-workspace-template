[project]
name = "auth-sandbox"
version = "0.1.0"
description = "The web latchkey auth sandbox's commands: the session's preparation, the browser sign-in and typed-credential entry the Imbue Studio web chrome drives over owner-exec, the claim watcher the boot script runs, plus the sandbox image's build steps."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "imbue-common",
    "imbue-mngr-latchkey",
    "loguru>=0.7",
    "pydantic>=2.0",
]

[project.scripts]
auth-sandbox-prepare = "auth_sandbox.cli:prepare_command"
auth-sandbox-sign-in = "auth_sandbox.cli:sign_in_command"
auth-sandbox-set-credentials = "auth_sandbox.cli:set_credentials_command"
auth-sandbox-await-claim = "auth_sandbox.cli:await_claim_command"
auth-sandbox-render-config = "auth_sandbox.cli:render_config_command"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth_sandbox"]

[dependency-groups]
dev = [
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.85",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]

[tool.ty.src]
# The image build's Modal driver runs only from a developer's machine with `--with modal`; the
# workspace never installs modal, so ty cannot resolve it here. Its steps (image_build) are checked.
exclude = ["src/auth_sandbox/modal_image_build.py"]
