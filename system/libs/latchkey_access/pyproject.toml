[project]
name = "latchkey-access"
version = "0.1.0"
description = "The latchkey gateway as a workspace program reaches it: the address and credentials mngr injects, and the request headers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imbue-common",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latchkey_access"]

[dependency-groups]
dev = [
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.85",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
