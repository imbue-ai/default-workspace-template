[project]
name = "workspace-backup-setup"
version = "0.1.0"
description = "A workspace's own setup of its backups: the destination a client names, the backup-setup program that initialises the repository and installs restic.env, and the verification flag"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The parser of restic.env and the restic wrapper the backup service itself uses.
    "host-backup",
    "imbue-common",
    "loguru>=0.7.0",
    "pydantic>=2.0",
    # The backup lease (workspace_bare_scripts.backup_lease), which the Imbue Studio desktop runs with no venv.
    "workspace-scripts",
]

[project.scripts]
backup-setup = "workspace_backup_setup.program:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workspace_backup_setup"]

[dependency-groups]
dev = [
    # Keeps tmp_path somewhere the stub restic the tests write can run (a workspace container mounts /tmp noexec).
    "pytest-executable-tmp",
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.87",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
