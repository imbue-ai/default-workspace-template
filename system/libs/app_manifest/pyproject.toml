[project]
name = "app-manifest"
version = "0.1.0"
description = "The app manifest (app.toml) and app registry (data/.state/apps.toml) models every workspace app is described by"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "imbue-common",
    "loguru>=0.7",
    "pydantic>=2.0",
]

[project.scripts]
app-manifest = "app_manifest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_manifest"]
