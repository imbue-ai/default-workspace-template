[project]
name = "app-schema"
version = "0.1.0"
description = "The names of the app SDK (imbue-app-sdk) under their old package, for apps written before it"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Everything this package offers is the SDK's.
    "imbue-app-sdk",
    # CLEANUP: drop the three below with this package. An app written before the SDK reaches them through this
    # package: it imports workspace_layout.identity, and its own imbue-common and app-manifest requirements
    # resolve to the workspace's pin through this package's sources.
    "app-manifest",
    "imbue-common",
    "workspace-layout",
]

[project.optional-dependencies]
# What assert_api_schema_describes_app validates a served document with; an app's test suite
# depends on app-schema[testing], its runtime on app-schema alone.
testing = ["imbue-app-sdk[testing]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_schema"]

[dependency-groups]
dev = [
    # The library's own tests validate the documents they build.
    "app-schema[testing]",
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.87",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
