[project]
name = "history-sweep"
version = "0.1.0"
description = "Removes what deleted chats leave on disk: their claude session files at once, their preserved transcripts after 30 days. Never anything a listed chat can open."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "imbue-common",
    # Finds the preserved archives of destroyed agents and reads their manifests.
    "imbue-mngr",
    "pydantic>=2.0",
]

[project.scripts]
history-sweep = "history_sweep.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/history_sweep"]

[dependency-groups]
dev = [
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.87",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
