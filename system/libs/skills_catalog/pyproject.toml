[project]
name = "skills-catalog"
version = "0.1.0"
description = "The skills catalog: every skill the workspace's agents have under .agents/skills, with where each came from"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "imbue-common",
    # Parses SKILL.md the way the agents' own loaders do (imbue.mngr.utils.agent_skills).
    "imbue-mngr",
    "loguru>=0.7",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skills_catalog"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3.0",
    "inline-snapshot>=0.13",
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.85",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP006", "UP007"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = true
case-sensitive = true
order-by-type = false
known-first-party = ["skills_catalog", "imbue"]
