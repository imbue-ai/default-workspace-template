[project]
name = "disk-headroom"
version = "0.1.0"
description = "How much the workspace can still write to its disk: the filesystem's free space, or the cloud machine's disk quota when that runs out first."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
]

[project.scripts]
disk-headroom = "disk_headroom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/disk_headroom"]

[dependency-groups]
dev = [
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.87",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
