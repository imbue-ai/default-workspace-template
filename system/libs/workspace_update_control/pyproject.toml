[project]
name = "workspace-update-control"
version = "0.1.0"
description = "A workspace's updates as a client asks for them (start one, schedule one, skip a version, read it all), and the dispatcher cron runs every minute. Stdlib-only, so the tick runs with no venv."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workspace_update_control"]

[dependency-groups]
dev = [
    # Keeps tmp_path somewhere the stub programs the tests write can run (a workspace container mounts /tmp noexec).
    "pytest-executable-tmp",
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.87",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
