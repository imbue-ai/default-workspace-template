[project]
name = "chat-background-tasks"
version = "0.1.0"
description = "The marker files recording the background tasks each chat waits on, and their readers. Stdlib-only so the hooks and the skills' bare python3 can import it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_background_tasks"]

[dependency-groups]
dev = [
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.85",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
