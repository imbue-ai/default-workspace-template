# Template for imbue_cloud-leased pool hosts. minds invokes this as
# `--template main --template imbue_cloud` (mirroring how the other modes
# use `--template main --template <provider>`), so the imbue_cloud-specific
# knobs that used to be inlined in `_build_mngr_create_command` live here
# instead. The actual provider name on the address is per-account
# (`imbue_cloud_<account-slug>`), so it's not declared here -- the
# `<name>@<host>.imbue_cloud_<slug>` address tells mngr where to land.
[create_templates.imbue_cloud]
# Leased pool hosts must never auto-shutdown -- the host is borrowed for a
# whole user session, not a one-shot job.
idle_mode = "disabled"
# The agent workspace lives on the persistent volume at /home/user/workspace/. The fast
# (adopt) path ignores this -- it reuses the pre-baked agent's recorded
# work_dir -- but the slow (rebuild) path rebuilds the container from scratch
# and needs the standard target_path so the DEFAULT_WORKSPACE_TEMPLATE workspace lands in the right
# place, exactly like the vultr/ovh templates.
target_path = "/home/user/workspace/"
# Docker build args forwarded verbatim to the delegated vps_docker build that
# the imbue_cloud SLOW path runs (it tears down the leased pool host's baked
# container and rebuilds it from this Dockerfile). The FAST path adopts the
# pre-baked image and ignores these (the imbue_cloud provider treats them as
# pass-through and only the slow path consumes them). Mirrors the ovh template.
build_arg__extend = ["--file=system/Dockerfile", "."]
# `--restart=unless-stopped` on the inner agent container so a slow-path rebuild
# (which recreates the container) comes back after a pool-VM reboot, matching the
# baked container from the pool_host template. The fast (adopt) path reuses the
# pre-baked container, which already carries this policy.
start_arg__extend = ["--restart=unless-stopped"]
# Forward the minds-side MNGR_PREFIX from minds' subprocess env onto the
# host's ``/home/user/.mngr/env``, so the in-container mngr sees the same prefix the
# desktop client used. Anthropic credentials are deliberately NOT forwarded
# anywhere: workspace Claude auth lives in the env block of the shared
# ~/.claude/settings.json, written by the in-UI sign-in modal.
pass_host_env__extend = ["MNGR_PREFIX"]
# Seed /home/user/workspace from the baked image on first boot (idempotent warm-boot
# fast path). Runs after create_host for both paths; on the fast path the
# code is already present so default-workspace-template-seed is a no-op. Same as the vultr/ovh
# templates.
post_host_create_command__extend = ["/usr/local/bin/default-workspace-template-seed"]

## and these templates are for sub-agents created within the sandbox

# Chat template: minimal agent for additional chat sessions in the same work directory
[create_templates.chat]
type = "chat"

# Caretaker template: the weekly maintenance agent (the "Caretaker") -- the
# tailored example of the generic `automation` template below. Like `chat`,
# it is a plain `claude` agent sharing the workspace's ~/.claude config dir,
# but it is oriented by an appended system prompt
# to run the `caretaker` skill. It is spawned (and re-woken) by the caretaker
# job (the /etc/cron.d/minds-caretaker entry the enable-caretaker skill
# creates -- absent until then, weekly and findings-gated via
# system/services/caretaker/caretaker_check.sh once enabled) via
# system/libs/automations/run_automation.sh, and is labelled automation=caretaker
# so it can be found as a singleton (the agent surfaces its own chat tab via
# system/scripts/layout.py after its first message).
[create_templates.caretaker]
type = "claude"
env = ["MNGR_AGENT_ROLE=caretaker"]
agent_args = [
    "--append-system-prompt",
    "You are the Caretaker: a maintenance agent for this workspace, woken about once a week when a scheduled check finds something worth reporting. When you are messaged to run, follow the `caretaker` skill (.agents/skills/caretaker/SKILL.md) exactly. Always speak to the user in plain, non-technical, user-experience terms. Apart from one look-only scan on your very first run -- which you always do to introduce yourself, and which never changes anything -- never scan logs or apply fixes without the permission recorded in data/.state/caretaker/permissions.md, and never apply a fix on that first run.",
]

# Automation template: the reusable base for any skill run on a cadence
# (the Caretaker above is a tailored instance). system/libs/automations/
# run_automation.sh <skill> spawns one of these per skill, labels it
# automation=<skill>, and messages it `/<skill>` on every run -- so a new
# automation (e.g. a morning news digest) needs only a skill plus a cron
# entry, no new template. It is a plain `claude` agent oriented, by an
# appended system prompt, to run whatever skill the slash-command it
# receives names.
[create_templates.automation]
type = "claude"
env = ["MNGR_AGENT_ROLE=automation"]
agent_args = [
    "--append-system-prompt",
    "You are an automation agent for this workspace. You are woken on a schedule and sent a slash-command naming the skill to run; follow that skill's instructions in .agents/skills/<name>/SKILL.md exactly. Right after sending your first chat message of each run (never before it, so the tab does not pop up empty), silently surface your own chat tab by running: for L in desktop mobile; do python3 system/scripts/layout.py open --layout \"$L\" \"chat:$MNGR_AGENT_NAME\"; done (--layout is required; the layout the user is not on fails fast and harmlessly; best-effort -- continue if both fail). Speak to the user in plain, non-technical, user-experience terms, and do your work via tool calls rather than narrating it.",
]

# Worktree template: agent in a new git worktree, no services by default --
# creates its own as needed. Uses the plain `claude` type (not `main`), so
# worktree agents run a real claude binary and share the workspace's ~/.claude
# config dir.
[create_templates.worktree]
type = "claude"

# Worker template: general purpose sub agent for doing tasks reliably (and ensuring that they are verified)
[create_templates.worker]
type = "worker"
extra_window = ["reviewer_settings='system/scripts/create_reviewer_settings.sh $REVIEWER_AUTOFIX_ENABLE $REVIEWER_CI_ENABLE $REVIEWER_VERIFY_CONVERSATION_ENABLE $REVIEWER_AUTOFIX_MINOR $REVIEWER_VERIFY_ARCHITECTURE_ENABLE $REVIEWER_STOP_HOOK_ENABLE'"]
# The stop hook stays enabled (REVIEWER_STOP_HOOK_ENABLE=1) for a single
# purpose: its uncommitted-changes gate, which keeps a worker from ending a
# turn with uncommitted work (that work is silently lost when the branch is
# merged back). The review gates are turned OFF -- REVIEWER_AUTOFIX_ENABLE=0
# and REVIEWER_VERIFY_ARCHITECTURE_ENABLE=0 -- because the worker skills already
# prompt for /autofix and the architecture gate at the single right moment (the
# hardening pass), and having the hook re-demand them on every commit fought
# that. Clearing the flags only stops the hook from gating on them; the worker
# still runs both commands by hand (the autofix / verify-architecture skills
# don't read these flags -- only the stop hook's gate checker does).
# REVIEWER_CI_ENABLE=0: repos created from this template are isolated units --
# the stop hook must never auto-create PRs or push to origin (the repo-level
# .reviewer/settings.json likewise disables ci + stop_hook.fetch_and_merge).
env = ["REVIEWER_AUTOFIX_ENABLE=0", "REVIEWER_CI_ENABLE=0", "REVIEWER_VERIFY_CONVERSATION_ENABLE=0", "REVIEWER_AUTOFIX_MINOR=0", "REVIEWER_VERIFY_ARCHITECTURE_ENABLE=0", "REVIEWER_STOP_HOOK_ENABLE=1", "MNGR_AGENT_ROLE=worker"]
agent_args = [
    "--dangerously-skip-permissions",
    "--append-system-prompt",
    "You were launched by another agent. List any questions at the end of your final response, along with the assumptions you made.",
]

# Subskill-worker template: sub-agent for any flow that hands its worker the
# generic harden worker -- the crystallize-creation / update-creation /
# heal-creation lifecycle (across skills, apps, services, and the system
# interface).
# Inherits from `worker`, adds:
#  - MNGR_AGENT_ROLE=worker so the harden Stop hook skips in-worker.
#  - A pre-provision step that installs the single generic worker sub-skill from
#    .agents/shared/worker/ into the worker's .agents/skills/ tree as
#    `harden-worker`. The worker reads the operation + type from its task
#    file and composes the matching references.
[create_templates.subskill-worker]
type = "worker"
extra_window = ["reviewer_settings='system/scripts/create_reviewer_settings.sh $REVIEWER_AUTOFIX_ENABLE $REVIEWER_CI_ENABLE $REVIEWER_VERIFY_CONVERSATION_ENABLE $REVIEWER_AUTOFIX_MINOR $REVIEWER_VERIFY_ARCHITECTURE_ENABLE $REVIEWER_STOP_HOOK_ENABLE'"]
# Same rationale as the worker template: stop hook on for commit enforcement
# only, autofix + architecture gates off (handled by skill prompting), CI off.
env = ["REVIEWER_AUTOFIX_ENABLE=0", "REVIEWER_CI_ENABLE=0", "REVIEWER_VERIFY_CONVERSATION_ENABLE=0", "REVIEWER_AUTOFIX_MINOR=0", "REVIEWER_VERIFY_ARCHITECTURE_ENABLE=0", "REVIEWER_STOP_HOOK_ENABLE=1", "MNGR_AGENT_ROLE=worker"]
extra_provision_command = [
    "bash .agents/shared/scripts/install_worker_skills.sh .agents/skills",
]
agent_args = [
    "--dangerously-skip-permissions",
]
