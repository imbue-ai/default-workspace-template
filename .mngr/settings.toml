# previous installer (a no-op on fresh VMs), revive units a past boot may have
# left dead of a start-rate limit (re-running this installer is the fleet
# backfill path), then enable + start the watcher. Starting the path unit
# alone does NOT fire the service when it is already active -- the previous
# installer's boot-time oneshot swallowed its own failures and exited 0, and
# RemainAfterExit=yes then latches the unit active, which is exactly the
# state of a VM recovered from a wedge -- so explicitly restart the service
# to run the start NOW. --no-block keeps this installer fast (the service
# body may legitimately wait minutes for the data-volume mount), and the run
# is safe on a healthy workspace (`docker start` and `mngr start` are
# no-ops).
rm -f /etc/systemd/system/multi-user.target.wants/minds-autostart.service
systemctl daemon-reload
systemctl reset-failed minds-autostart.path minds-autostart.service 2>/dev/null || true
systemctl enable minds-autostart.path
systemctl start minds-autostart.path
systemctl restart --no-block minds-autostart.service
""",
]

# template for Azure Virtual Machines VPS provider (azure mode). Mirrors the
# aws template above: minds addresses the create as
# `system-services@<host>.byo-azure-<slug>` (a bring-your-own account block
# minds writes on account setup), so no `provider` is declared here. Region /
# VM size come from that provider block (`default_region` / `default_vm_size`)
# plus the matching `-b --azure-region=` / `-b --azure-vm-size=` minds passes.
[create_templates.azure]
target_path = "/home/user/workspace/"
build_arg__extend = ["--file=system/Dockerfile", "."]
# Disable idle detection entirely -- the host should never auto-shutdown; the
# machine is up for the whole user session (see the aws template's comment).
idle_mode = "disabled"
# Same container-hardening `docker run` args as the aws template. They are
# runtime-agnostic (harmless under plain runc; required under gVisor's runsc if
# the provider block opts into it): see the aws template for the rationale.
start_arg__extend = ["--security-opt=no-new-privileges", "--workdir=/", "--restart=unless-stopped"]
# Same forwarding as the docker template; see comment there.
pass_host_env__extend = ["ANTHROPIC_API_KEY", "ANTHROPIC_BASE_URL", "GH_TOKEN"]
# Same first-boot seed as the docker template; see comment there.
post_host_create_command__extend = ["/usr/local/bin/default-workspace-template-seed"]
# Install the outer-VM boot unit so the agent recovers after a VM reboot even
# without the desktop app; identical to the aws template's unit.
post_host_create_outer_command__extend = [
    """
set -eu
cat > /usr/local/sbin/minds-outer-autostart.sh <<'BOOT'
#!/bin/sh
# Start every mngr-managed agent container and relaunch the system-services
# agent inside it (in its full host+agent env, via the shared in-container
# start script). Containers are found by the fixed mngr label, so this
# survives container rebuilds. Triggered by minds-autostart.path once the
# /mngr-btrfs data volume is ready (mngr-internal#266); the wait below makes
# a premature trigger park until the mount actually exists instead of
# failing repeatedly (root-fs debris shadowed under the unmounted mountpoint
# once satisfied the old glob trigger early -- see the field report on
# default-workspace-template#381). Any step that still fails makes the unit
# fail, so breakage is visible in systemd instead of being swallowed.
# `mngr start` is idempotent + flock-serialized, so racing the desktop
# client is safe.
set -u

# Wait for the data volume to actually be mounted: generous hard bound, plus
# a warning when it took suspiciously long. The trigger normally fires only
# after the mount, so any wait at all here is unusual; on slices lima can
# take many minutes to mount the disk on boot. Type=oneshot has no start
# timeout, so systemd will not kill this wait.
WAITED=0
until mountpoint -q "$(readlink -f /mngr-btrfs)"; do
    if [ "$WAITED" -ge 1800 ]; then
        echo "timed out after ${WAITED}s waiting for /mngr-btrfs to be mounted" >&2
        exit 1
    fi
    sleep 5
    WAITED=$((WAITED + 5))
done
if [ "$WAITED" -gt 60 ]; then
    echo "warning: waited ${WAITED}s for /mngr-btrfs to be mounted" >&2
fi

FAILED=0
for cid in $(docker ps -aq --filter "label=com.imbue.mngr.host-id"); do
    docker start "$cid" >/dev/null
    if [ "$(docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null)" != "true" ]; then
        echo "agent container $cid did not reach running" >&2
        FAILED=1
        continue
    fi
    # Run the in-container start script from whichever location this
    # container's generation carries. A container older than the script
    # itself has none: for those, make sure sshd is up (its entrypoint is a
    # bare keep-alive) and succeed with a journal notice -- a permanently
    # missing script must not fail the unit, because the path unit
    # retriggers a failing oneshot with no rate limit (the unit sets
    # StartLimitIntervalSec=0 for transient failures), which would hot-loop
    # forever on a condition that can never clear.
    # CLEANUP: drop the /mngr/code candidate and the sshd fallback once no
    # leased workspace container predates minds-v0.3.2 (the first version
    # that ships minds_start_services_agent.sh).
    if ! docker exec --workdir / "$cid" bash -lc 'for s in /home/user/workspace/system/scripts/minds_start_services_agent.sh /mngr/code/scripts/minds_start_services_agent.sh; do if test -x "$s"; then exec "$s"; fi; done; mkdir -p /run/sshd; grep -lxs sshd /proc/[0-9]*/comm >/dev/null 2>&1 || /usr/sbin/sshd -o MaxSessions=100 -o MaxStartups=100:30:200 || echo "warning: could not start sshd in this container" >&2; echo "no minds_start_services_agent.sh in this container generation; started container and sshd only" >&2'; then
        echo "relaunching the services agent in container $cid failed" >&2
        FAILED=1
    fi
done
exit "$FAILED"
BOOT
chmod +x /usr/local/sbin/minds-outer-autostart.sh
cat > /etc/systemd/system/minds-autostart.service <<'UNIT'
[Unit]
Description=Start the minds system-services agent once the data volume is up
After=docker.service
Requires=docker.service
# Never rate-limit starts: while the trigger condition holds, a failing
# service re-triggers immediately, and hitting the default start limit
# propagates unit-start-limit-hit to minds-autostart.path -- permanently
# disabling the watcher (observed on a staging box reboot; see the field
# report on default-workspace-template#381).
StartLimitIntervalSec=0

[Service]
Type=oneshot
RemainAfterExit=yes
ExecStart=/usr/local/sbin/minds-outer-autostart.sh
UNIT
cat > /etc/systemd/system/minds-autostart.path <<'UNIT'
[Unit]
Description=Watch for the mngr data volume and start the minds workspace

[Path]
# The marker file is created exclusively by this installer, behind a hard
# mountpoint check, so it can only ever exist on the mounted data volume.
# The bare /mngr-btrfs symlink persists (dangling) across reboots, and even
# entries under it cannot be trusted: root-fs debris shadowed beneath the
# unmounted mountpoint (a stale snapshot-helper request once mkdir'd
# /mngr-btrfs/snapshots pre-mount) defeated the previous
# PathExistsGlob=/mngr-btrfs/* condition and fired the service before the
# volume existed. The wake-up event is the symlink recreation the provision
# script performs right after mounting on each boot.
PathExists=/mngr-btrfs/.minds-volume-ready
Unit=minds-autostart.service

[Install]
WantedBy=multi-user.target
UNIT
# The readiness marker the path unit watches may only ever be created here,
# behind a hard mount check, so it can never appear on the unmounted root fs
# (the way shadow debris under the mountpoint defeated the old glob trigger).
if ! mountpoint -q "$(readlink -f /mngr-btrfs)"; then
    echo "refusing to install minds-autostart: /mngr-btrfs is not a mounted volume" >&2
    exit 1
fi
touch /mngr-btrfs/.minds-volume-ready
# The service is only ever triggered by the path unit, so it cannot run before
# the data volume exists. Remove any direct boot enablement left by the
# previous installer (a no-op on fresh VMs), revive units a past boot may have
# left dead of a start-rate limit (re-running this installer is the fleet
# backfill path), then enable + start the watcher. Starting the path unit
# alone does NOT fire the service when it is already active -- the previous
# installer's boot-time oneshot swallowed its own failures and exited 0, and
# RemainAfterExit=yes then latches the unit active, which is exactly the
# state of a VM recovered from a wedge -- so explicitly restart the service
# to run the start NOW. --no-block keeps this installer fast (the service
# body may legitimately wait minutes for the data-volume mount), and the run
# is safe on a healthy workspace (`docker start` and `mngr start` are
# no-ops).
rm -f /etc/systemd/system/multi-user.target.wants/minds-autostart.service
systemctl daemon-reload
systemctl reset-failed minds-autostart.path minds-autostart.service 2>/dev/null || true
systemctl enable minds-autostart.path
systemctl start minds-autostart.path
systemctl restart --no-block minds-autostart.service
""",
]

# Template for imbue_cloud-leased pool hosts. minds invokes this as
# `--template main --template imbue_cloud` (mirroring how the other modes
# use `--template main --template <provider>`), so the imbue_cloud-specific
# knobs that used to be inlined in `_build_mngr_create_command` live here
# instead. The actual provider name on the address is per-account
# (`imbue_cloud_<account-slug>`), so it's not declared here -- the
# `<name>@<host>.imbue_cloud_<slug>` address tells mngr where to land.
[create_templates.imbue_cloud]
# Leased pool hosts must never auto-shutdown -- the host is borrowed for a
# whole user session, not a one-shot job.
idle_mode = "disabled"
# The agent workspace lives on the persistent volume at /home/user/workspace/. The fast
# (adopt) path ignores this -- it reuses the pre-baked agent's recorded
# work_dir -- but the slow (rebuild) path rebuilds the container from scratch
# and needs the standard target_path so the DEFAULT_WORKSPACE_TEMPLATE workspace lands in the right
# place, exactly like the vultr/ovh templates.
target_path = "/home/user/workspace/"
# Docker build args forwarded verbatim to the delegated vps_docker build that
# the imbue_cloud SLOW path runs (it tears down the leased pool host's baked
# container and rebuilds it from this Dockerfile). The FAST path adopts the
# pre-baked image and ignores these (the imbue_cloud provider treats them as
# pass-through and only the slow path consumes them). Mirrors the ovh template.
build_arg__extend = ["--file=system/Dockerfile", "."]
# `--restart=unless-stopped` on the inner agent container so a slow-path rebuild
# (which recreates the container) comes back after a pool-VM reboot, matching the
# baked container from the pool_host template. The fast (adopt) path reuses the
# pre-baked container, which already carries this policy.
start_arg__extend = ["--restart=unless-stopped"]
# Forward the minds-side MNGR_PREFIX from minds' subprocess env onto the
# host's ``/home/user/.mngr/env``, so the in-container mngr sees the same prefix the
# desktop client used. Anthropic credentials are deliberately NOT forwarded
# anywhere: workspace Claude auth lives in the env block of the shared
# ~/.claude/settings.json, written by the in-UI sign-in modal.
pass_host_env__extend = ["MNGR_PREFIX"]
# Seed /home/user/workspace from the baked image on first boot (idempotent warm-boot
# fast path). Runs after create_host for both paths; on the fast path the
# code is already present so default-workspace-template-seed is a no-op. Same as the vultr/ovh
# templates.
post_host_create_command__extend = ["/usr/local/bin/default-workspace-template-seed"]
## and these templates are for sub-agents created within the sandbox.
##
## The harness (which agent binary runs) is chosen at create time with
## `--type <harness>`, which resolves the matching `[agent_types.<harness>]` block
## directly -- there is no per-harness create template. A ROLE template says what the
## agent is *for* (where it works, what it is told, what its environment holds) and
## never sets `type`, so the same role runs under any harness:
##
##   mngr create <name> --type <harness> -t <role>
##
## Keeping the harness on `--type` and the purpose in a role template is what stops
## the template list from growing as the product of harnesses and roles: adding a
## harness costs one `[agent_types.<harness>]` block, not one template per role.
##
## Aggregate keys in a role use `__extend`, never a bare assign: templates stack,
## and a bare assign over a key an earlier template in the stack contributed to is
## rejected by the settings narrowing guard.

## --- roles ---

# Chat: a user-facing conversational agent, sharing the workspace's work
# directory (`transfer = none`) rather than taking a worktree of its own -- one
# workspace, one work_dir, all chats in it.
#
# The output style is what makes chat agents talk like a subordinate while
# workers and automations stay unstyled. `output_style` names the `name:`
# frontmatter of a file in .agents/output-styles/ (mngr validates it at create
# and fails loudly on a miss). It is harness-neutral: claude takes it as its
# native `outputStyle` setting, codex -- which has no output-style concept --
# gets the same file's body as developer instructions.
[create_templates.chat]
transfer = "none"
output_style = "Engineering Subordinate"

# First chat: the one agent per workspace that greets the user (/welcome) and
# opens in fast mode so the first conversation feels responsive. Stacked on top
# of `chat` (`-t first -t chat --type <harness>`) by the bootstrap and by the
# flag-gated "New first ..." launchers. The `first=true` label is what scopes
# the fast-mode grace-period prompt to this agent.
#
# The two fast settings are deliberately asymmetric: claude's
# `settings_overrides` is a SettingsPatchField (deep-merge marker on the
# field), so a bare dotted path merges into the [agent_types.claude] block.
# codex's `config_overrides` is a PLAIN dict -- a bare dotted assignment trips
# the settings-narrowing guard (it would drop the features/tools blocks), so
# the codex entry needs __extend markers at BOTH dict levels. Do not "fix" the
# inconsistency in either direction. Settings for whichever harness is not
# resolved are inert, so this template is safe to stack with any --type.
[create_templates.first]
message = "/welcome"
label__extend = ["first=true"]
setting__extend = [
    "agent_types.claude.settings_overrides.fastMode=true",
    'agent_types.codex.config_overrides__extend={"service_tier":"fast","features__extend":{"fast_mode":true}}',
]

# Caretaker: the weekly maintenance agent -- the tailored instance of the
# generic `automation` role below. Spawned (and re-woken) by the caretaker job
# (the /etc/cron.d/minds-caretaker entry the enable-caretaker skill creates --
# absent until then, weekly and findings-gated via
# system/services/caretaker/caretaker_check.sh once enabled) via
# system/libs/automations/run_automation.sh, and labelled automation=caretaker
# so it can be found as a singleton (the agent surfaces its own chat tab via
# system/scripts/layout.py after its first message).
[create_templates.caretaker]
transfer = "none"
env__extend = ["MNGR_AGENT_ROLE=caretaker"]
append_system_prompt__extend = ["You are the Caretaker: a maintenance agent for this workspace, woken about once a week when a scheduled check finds something worth reporting. When you are messaged to run, follow the `caretaker` skill (.agents/skills/caretaker/SKILL.md) exactly. Always speak to the user in plain, non-technical, user-experience terms. Apart from one look-only scan on your very first run -- which you always do to introduce yourself, and which never changes anything -- never scan logs or apply fixes without the permission recorded in data/.state/caretaker/permissions.md, and never apply a fix on that first run."]

# Automation: the reusable base for any skill run on a cadence (the Caretaker
# above is a tailored instance). system/libs/automations/run_automation.sh
# <skill> spawns one per skill, labels it automation=<skill>, and messages it
# `/<skill>` on every run -- so a new automation (e.g. a morning news digest)
# needs only a skill plus a cron entry, no new template.
[create_templates.automation]
transfer = "none"
env__extend = ["MNGR_AGENT_ROLE=automation"]
append_system_prompt__extend = ["You are an automation agent for this workspace. You are woken on a schedule and sent a slash-command naming the skill to run; follow that skill's instructions in .agents/skills/<name>/SKILL.md exactly. Right after sending your first chat message of each run (never before it, so the tab does not pop up empty), silently surface your own chat tab by running: python3 system/scripts/layout.py open \"chat:$MNGR_AGENT_NAME\" (with no --view it lands in the view the user is looking at; best-effort -- continue if it fails). Speak to the user in plain, non-technical, user-experience terms, and do your work via tool calls rather than narrating it."]

# Worker: general purpose sub-agent for doing tasks reliably (and ensuring they
# are verified), landing in its own git worktree so its work is isolated from
# the workspace checkout until merged back.
#
# The stop hook stays enabled (REVIEWER_STOP_HOOK_ENABLE=1) for a single
# purpose: its uncommitted-changes gate, which keeps a worker from ending a
# turn with uncommitted work (that work is silently lost when the branch is
# merged back). The review gates are turned OFF -- REVIEWER_AUTOFIX_ENABLE=0
# and REVIEWER_VERIFY_ARCHITECTURE_ENABLE=0 -- because the worker skills already
# prompt for /autofix and the architecture gate at the single right moment (the
# hardening pass), and having the hook re-demand them on every commit fought
# that. Clearing the flags only stops the hook from gating on them; the worker
# still runs both commands by hand (the autofix / verify-architecture skills
# don't read these flags -- only the stop hook's gate checker does).
# REVIEWER_CI_ENABLE=0: repos created from this template are isolated units --
# the stop hook must never auto-create PRs or push to origin (the repo-level
# .reviewer/settings.json likewise disables ci + stop_hook.fetch_and_merge).
#
# install_worker_skills.sh installs the single generic worker sub-skill from
# .agents/shared/worker/ into the worker's .agents/skills/ tree as
# `harden-worker`, which the crystallize / update / heal creation lifecycle
# relies on. (The venv converge that used to sit here now runs for every agent
# from [commands.create], and lands before this.)
[create_templates.worker]
transfer = "git-worktree"
extra_window__extend = ["reviewer_settings='system/scripts/create_reviewer_settings.sh $REVIEWER_AUTOFIX_ENABLE $REVIEWER_CI_ENABLE $REVIEWER_VERIFY_CONVERSATION_ENABLE $REVIEWER_AUTOFIX_MINOR $REVIEWER_VERIFY_ARCHITECTURE_ENABLE $REVIEWER_STOP_HOOK_ENABLE'"]
env__extend = ["REVIEWER_AUTOFIX_ENABLE=0", "REVIEWER_CI_ENABLE=0", "REVIEWER_VERIFY_CONVERSATION_ENABLE=0", "REVIEWER_AUTOFIX_MINOR=0", "REVIEWER_VERIFY_ARCHITECTURE_ENABLE=0", "REVIEWER_STOP_HOOK_ENABLE=1", "MNGR_AGENT_ROLE=worker"]
# Converge the venv for worker agents, ahead of the skill install so deps are ready
# first. A fresh git worktree (transfer = "git-worktree" above) carries no .venv
# (gitignored), so a worker's first `uv run` would otherwise cold-build one mid-task --
# lazily, with root-closure scope rather than --all-packages, racing whatever the agent
# is doing (intermittent ModuleNotFoundError, e.g. imbue_common). Scoped to the worker
# role: a `-t worker` create resolves to type `claude` and applies THIS template, so the
# sync belongs here, not on the `[agent_types.worker]` legacy shim (which only re-resolves
# agents whose persisted type is already worker). Chat/main agents share the services
# agent's boot-time converge. uv's warm cache makes this hardlink-fast when up to date.
extra_provision_command__extend = ["uv sync --all-packages", "bash .agents/shared/scripts/install_worker_skills.sh .agents/skills"]
append_system_prompt__extend = ["You were launched by another agent. List any questions at the end of your final response, along with the assumptions you made."]

# Shims for agents created before roles moved to create templates: their persisted
# `type` is re-resolved from this file on every load, so dropping these sections
# would fall them back to BaseAgent on upgrade. Delete once no live workspace has them.
[agent_types.chat]
parent_type = "claude"

[agent_types.worker]
parent_type = "claude"
