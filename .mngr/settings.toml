# --- Command defaults ---

# Default create command settings -- apply to all mngr create from this repo
[commands.create]
type = "claude"
connect = false
ensure_clean = false
pass_env__extend = ["REMOTE_SERVICE_CONNECTOR_URL", "LATCHKEY_GATEWAY"]
host_env__extend = [
    "IS_SANDBOX=1",
    "IS_AUTONOMOUS=1",
    # Fast mode is enabled for all agents (settings_overrides fastMode=true on
    # agent_types.claude below); this gates the Opus fast-mode capability on.
    "CLAUDE_CODE_ENABLE_OPUS_4_7_FAST_MODE=1",
    # Skip Claude Code's org-level fast-mode eligibility check. Agents sign in
    # with a Claude Max subscription that supports fast mode, but the session
    # resolves under an organization whose org check otherwise reports fast
    # mode as "currently unavailable" -- so without this, /fast is refused in
    # the container even though the same account gets fast mode on the laptop.
    "CLAUDE_CODE_SKIP_FAST_MODE_ORG_CHECK=1",
    # Lock Claude Code to the version pinned in agent_types.claude.version and the
    # Dockerfile's CLAUDE_CODE_VERSION; disable the auto-updater + background
    # feedback pings so the installed binary cannot silently drift. Tracks the
    # FIXME on ClaudeAgentConfig.version in libs/mngr_claude/.../plugin.py.
    "DISABLE_AUTOUPDATER=1",
    "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1",
    "CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY=1",
    # Disable claude.ai account MCP connector sync -- it's an OAuth side
    # channel to third-party services that bypasses the latchkey gateway.
    "ENABLE_CLAUDEAI_MCP_SERVERS=false",
    # Tickets live inside runtime/ so they are covered by the opt-in GitHub
    # sync (github-sync skill) when the user enables it.
    # tk reads TICKETS_DIR if set; absolute path so it works from worktree
    # subdirs too. /home/user/workspace/ is the container WORKDIR (set by the Dockerfile).
    "TICKETS_DIR=/home/user/workspace/data/.tickets",
    # The OOM shed ledger + agent-pid registry live under runtime/ (so they ride
    # the runtime-backup branch). The container-level earlyoom kill hook runs
    # with work dir /home/user/workspace, but each agent's SessionStart hooks resolve paths
    # relative to THEIR agent's MNGR_AGENT_WORK_DIR -- which for a worker is its
    # own worktree, not /home/user/workspace. Pinning the absolute path here (same
    # rationale as TICKETS_DIR above) makes the kill hook and every agent's hook
    # resolve one shared ledger and registry, regardless of work dir.
    "OOM_PRIORITY_RUNTIME_DIR=/home/user/workspace/data/.state/oom_priority",
    # Keep regenerable caches off the persistent /home/user volume (and out of
    # backups): XDG-aware tools (uv, pip, playwright) follow XDG_CACHE_HOME,
    # npm follows npm_config_cache, and the seed script's ~/.cache symlink
    # catches stragglers that hardcode ~/.cache.
    "XDG_CACHE_HOME=/var/cache/user",
    "npm_config_cache=/var/cache/user/npm",
    # Workaround for an Apple M5 lima-VZ guest CPU mismatch: the Debian 12
    # guest kernel advertises SVE / SVE2 in /proc/cpuinfo, but lima-VZ on M5
    # traps the `cntb` SVE instruction emitted by OpenSSL's
    # `_armv8_sve_get_vl_bytes` during CPU-cap init -- so cryptography>=47's
    # Rust openssl binding SIGILLs on import (rc=132), taking down any tool
    # that transitively imports paramiko (mngr CLI, system-interface, etc.).
    # OPENSSL_armcap=0 disables OpenSSL's CPU-cap detection so it falls back
    # to NEON-only paths; runs cleanly on both real M-series silicon and
    # lima-VZ. Performance impact is negligible for this workload (TLS / SSH
    # session setup only). Drop when lima-VZ on M5 correctly virtualizes SVE
    # or when upstream OpenSSL guards `cntb` behind hwcap2. Empirically
    # bisected to `_armv8_sve_get_vl_bytes+0: cntb x0` via gdb on a fresh
    # Debian 12 lima VM on the launch-to-msg M5 runner; Ubuntu 24.04 lima
    # guests don't advertise SVE so they don't hit this.
    "OPENSSL_armcap=0",
]
worktree_base_folder = "/home/user/worktrees/"
# claude_subagent_proxy is upstream mngr's experimental Claude-Code-Task ->
# mngr-managed-subagent proxy. It is not used here. Without this disable, when
# the proxy plugin is present in the system-tool mngr install it gets the
# on_after_provisioning hook fired, which installs a PreToolUse:Agent hook
# (spawn.py) into each new agent's .claude/settings.local.json -- and that
# hook then wedges parent agents in a Haiku retry loop whenever it hits a
# permanent error (e.g. the proxy package isn't in /home/user/workspace/.venv, or
# `mngr-proxy-child` isn't a registered agent type in the resolved mngr).
# The disable is non-strict (commands.create.disable_plugin path), so this is
# safe even on installs that don't include the proxy plugin at all.
disable_plugin__extend = ["recursive", "ttyd", "claude_subagent_proxy"]
yes = true

# --- Agent types ---

# Agent type defaults -- apply to all claude agents created from this repo
[agent_types.claude]
auto_dismiss_dialogs = true
auto_allow_permissions = true
auto_disable_questions = true
cli_args = """--dangerously-skip-permissions --disallowed-tools ExitPlanMode,TodoWrite,TaskCreate,TaskList,TaskUpdate"""
# skipDangerousModePermissionPrompt suppresses Claude Code's bypass-permissions
# warning dialog (every agent here launches with --dangerously-skip-permissions).
# It must ride the mngr-managed --settings overlay because nothing provisions the
# shared ~/.claude/settings.json: in shared config-dir mode mngr writes nothing
# into the shared dir, and claude itself only creates it lazily.
settings_overrides__extend = {model = "opus[1m]", fastMode = true, skipDangerousModePermissionPrompt = true}
# Launch every claude agent through the OOM band wrapper instead of `claude`
# directly. The wrapper (system/services/oom_priority/bin/claude_oom_launch.py) sets its own
# oom_score_adj to the user- or worker-agent band, records its pid in the
# agent-pid registry, then execs the real claude with the args mngr appends
# (assemble_command splices --settings / --resume / --session-id after this
# base). Because it execs in place, the band-tagged process IS the claude
# process and its subprocesses inherit the band -- so earlyoom sheds an agent's
# subprocesses, then worker agents, then user agents, before any protected
# service. Tagging the band at launch sets the score before any subprocess is
# spawned. ${MNGR_AGENT_WORK_DIR:-.} mirrors
# the OOM Claude hooks' path form; the "main" type overrides command below so
# its sleeping window-0 is unaffected.
command = "python3 ${MNGR_AGENT_WORK_DIR:-.}/system/services/oom_priority/bin/claude_oom_launch.py"
# Pin Claude Code to a specific version; the provisioning-time version check
# refuses to start the agent if the installed binary diverges. Bump this in
# sync with CLAUDE_CODE_VERSION in the Dockerfile.
version = "2.1.207"
# Do not provision a per-agent Claude config dir: every claude in the workspace
# shares one config dir so auth, plugins, marketplaces, and sessions are
# configured exactly once. CLAUDE_CONFIG_DIR is deliberately left UNSET
# everywhere (no agent env, no host env), so every claude -- mngr-launched
# agents and a bare `claude` in a workspace terminal alike -- resolves claude's
# own default: ~/.claude for the config dir and ~/.claude.json for the global
# config beside it.
isolate_local_config_dir = false

# User-facing chat agents run this type -- the initial /welcome agent and every
# "New Agent" chat both launch with `--template chat` (system/libs/bootstrap's
# manager.py and system/libs/system_interface/.../agent_manager.py). parent_type = "claude" inherits
# all launch config (the oom wrapper command, cli_args, pinned version,
# model/fastMode); we only add the Engineering Subordinate output style on top.
# Scoping it here rather than on `claude` keeps worktree/worker/main agents
# unstyled -- only user-facing chat should talk like a subordinate. The style
# file lives at .claude/output-styles/engineering-subordinate.md; its `name:`
# frontmatter must match the outputStyle value below exactly.
[agent_types.chat]
parent_type = "claude"
settings_overrides__extend = { outputStyle = "Engineering Subordinate" }

# The "main" (services) agent type -- a plain `command` agent, NOT a claude
# agent. No claude ever runs as this agent: window 0 only sleeps while the
# bootstrap window (extra_window) runs supervisord, which owns every background
# service, and the real chat agents are spun up separately by the bootstrap.
# Making window 0 a live claude would be unsafe: the user could close it,
# tearing down the tmux session (and supervisord with it).
#
# Because it is not a claude agent, mngr does no claude provisioning for it --
# in particular it gets no per-agent CLAUDE_CONFIG_DIR in its env, so
# supervisord services (and any `mngr create` they run) inherit an environment
# with the var unset and every claude in the workspace lands on the shared
# ~/.claude (see [agent_types.claude] above). Nothing from the invoking user's
# ~/.claude/ or ~/.mngr/ leaks into the workspace: the repo at the requested
# git ref is the canonical workspace definition, and command agents sync no
# user-local claude state at all.
[agent_types.main]
parent_type = "command"
command = "sleep infinity"

# the "worker" agent type -- the default for delegated tasks
[agent_types.worker]
parent_type = "claude"
# Repeat the wrapper command here, not just on [agent_types.claude]: an mngr
# config-load bug means a child type does not inherit the parent's non-default
# `command`, so without this a worker launches plain claude and never gets its
# band. (load_config's final model_validate re-marks every field as set, so the
# parent_type merge sees the worker's defaulted command and clobbers the inherited
# one; verified live.)
command = "python3 ${MNGR_AGENT_WORK_DIR:-.}/system/services/oom_priority/bin/claude_oom_launch.py"

# --- Provider configurations ---

# all disabled for now, since we don't want the agents to be able to launch mngr agents anywhere except within their own containers

[providers.modal]
is_enabled = false

[providers.docker]
is_enabled = false
isolate_host_volumes = true
# The user-data layout: the per-host volume mounts at /home/user (the ONE
# persistent tree) with mngr's data dir hidden inside it, and mngr's
# plain-text service logs go to /var/log/mngr (regenerable diagnostics,
# never backed up).
host_dir = "/home/user/.mngr"
volume_mount_path = "/home/user"
host_log_dir = "/var/log/mngr"
# No `docker_runtime` is set here, so containers use Docker's default runtime
# (runc), which is available everywhere -- notably macOS, where gVisor's `runsc`
# is not. The gVisor-hardened runtime is selected per-create by stacking the
# `docker_runsc` template overlay below (the minds desktop app does this by
# default on Linux, where `runsc` is installed). A direct CLI user can opt in
# with `--template docker --template docker_runsc`, or override either way with
# MNGR__PROVIDERS__DOCKER__DOCKER_RUNTIME=<runc|runsc>.
# Mount /run as a tmpfs so supervisord can install its control socket. When runsc
# is registered with --overlay2=none (required so the container rootfs -- and
# mngr's SSH provisioning written to it -- survives a restart), /run lives on
# gVisor's gofer-backed filesystem, which returns EOPNOTSUPP for os.link() of a
# socket inode. supervisord installs its control socket via a hard link, so on a
# gofer-backed /run it wedges ("Unlinking stale socket") and never starts
# system_interface -- the workspace then sits on the "Loading workspace" loader
# forever. A tmpfs /run makes the hard link work. Mirrors the tmpfs /run that the
# aws-<region> provider start args and the ovh/vultr/imbue_cloud host setup apply.
# /tmp is tmpfs for the same reason as /run: nothing in an ephemeral dir may
# persist or ride a backup.
default_start_args = ["--tmpfs", "/run", "--tmpfs", "/tmp"]

[providers.lima]
# is_enabled=false (mirrors [providers.docker]) is load-bearing: the lima backend
# is a plugin (imbue-mngr-lima) that is NOT installed in the agent container, so a
# *parsed* lima block would crash the in-container mngr with "unknown backend
# 'lima'". With is_enabled=false the config loader skips the whole block wherever
# the lima plugin is absent (the container), while the host-side mngr (which has
# the plugin) still parses it. The lima create still works because `@<name>.lima`
# resolves the provider by name regardless of is_enabled (same as @<name>.docker).
is_enabled = false
# Run the minds workspace directly in the Lima VM as root (uid 0) -- no nested
# Docker container. is_run_as_root gives the agent the same "no sudo, install
# anything" posture it has inside a docker/vps_docker container (the VM is the
# isolation boundary). Root cannot traverse the 9p bind mount, so is_run_as_root
# requires the in-VM btrfs additional-disk layout: is_host_data_volume_exposed
# must be false. These live on the provider block (not the lima template's
# setting__extend) because template `--setting` entries don't reach provider
# config (imbue-ai/mngr#1914).
is_host_data_volume_exposed = false
is_run_as_root = true
# The user-data layout (matching the docker provider): /home/user symlinks to
# the btrfs data disk with mngr's data dir inside it; plain-text mngr service
# logs go to /var/log/mngr.
host_dir = "/home/user/.mngr"
volume_home_path = "/home/user"
host_log_dir = "/var/log/mngr"
# Pin the Lima guest to the same Debian release the docker image uses (trixie),
# so setup_system.sh provisions an identical toolchain everywhere. Set here
# (dwt-side) rather than bumping mngr_lima's bookworm default, which outside
# mngr users keep.
default_image_url_aarch64 = "https://cloud.debian.org/images/cloud/trixie/20260722-2547/debian-13-genericcloud-arm64-20260722-2547.qcow2"
default_image_url_x86_64 = "https://cloud.debian.org/images/cloud/trixie/20260722-2547/debian-13-genericcloud-amd64-20260722-2547.qcow2"

# vultr VPS provider (cloud mode). is_enabled=false mirrors the lima/docker blocks:
# the vps_docker backend plugin is not installed in the agent container, so a parsed
# block would crash the in-container mngr; with is_enabled=false the loader skips the
# block where the plugin is absent, while the host-side mngr (which runs the bake)
# still parses it. The vultr create still works because `@<name>.vultr` resolves the
# provider by name regardless of is_enabled. runsc is installed+registered at
# provisioning time and selected for the agent container; the matching `--workdir=/`
# and `--security-opt=no-new-privileges` run args are added in the vultr template's
# start_arg (which, unlike lima, reaches the inner `docker run`).
[providers.vultr]
is_enabled = false
install_gvisor_runtime = true
docker_runtime = "runsc"
# The user-data layout (matching the docker provider): /home/user symlinks
# onto the unified volume's home/ subdir with mngr's data dir inside it;
# plain-text mngr service logs go to /var/log/mngr.
host_dir = "/home/user/.mngr"
volume_home_path = "/home/user"
host_log_dir = "/var/log/mngr"

# OVH VPS provider (the imbue-cloud pool-bake's default). Same rationale as the
# vultr block above; the `--workdir=/` / `--security-opt=no-new-privileges` run args
# are added in the ovh template's start_arg.
[providers.ovh]
is_enabled = false
install_gvisor_runtime = true
docker_runtime = "runsc"
# The user-data layout (matching the docker provider): /home/user symlinks
# onto the unified volume's home/ subdir with mngr's data dir inside it;
# plain-text mngr service logs go to /var/log/mngr.
host_dir = "/home/user/.mngr"
volume_home_path = "/home/user"
host_log_dir = "/var/log/mngr"

# imbue-cloud bare-metal slice provider (the lima-VM analog of the ovh pool
# path; the slice bake selects it by create address and passes carve sizing via
# `-S providers.imbue_cloud_slice.*`). It needs the same user-data-layout knobs
# as the ovh/vultr blocks: the pool bake creates the services agent with
# MNGR_HOST_DIR=/home/user/.mngr, so without these the outer provider writes
# agent state at the legacy /mngr while the workspace (and the bake's finalize
# `mngr stop`) look in /home/user/.mngr.
#
# `is_enabled = false` (like ovh/vultr) is what lets the IN-WORKSPACE mngr --
# which has only the core plugins installed -- skip this block instead of
# failing on the unknown backend; the bake's create address still selects the
# provider on the operator side, where mngr_imbue_cloud is installed.
[providers.imbue_cloud_slice]
is_enabled = false
host_dir = "/home/user/.mngr"
volume_home_path = "/home/user"
host_log_dir = "/var/log/mngr"

# --- Create templates ---

## these are all for launching the original agent (from outside the sandbox, in the first place)

# the template that is shared across all agent types
[create_templates.main]
type = "main"
# `/welcome` is still NOT set here: the services agent's window 0 sleeps forever
# (see `[agent_types.main] command`) and never reaches claude. The bootstrap
# creates a separate chat agent on first boot and passes `--message /welcome`
# to it instead.
#
# bootstrap is the only extra_window now. It runs first-boot setup (git config,
# initial chat agent) and then launches
# supervisord, which runs every background service (system_interface, web,
# cloudflared, app-watcher, host-backup, terminal, and the one-shot
# deferred-install -- see system/supervisord.conf; the opt-in github-sync service is
# added by its skill). The old git_auth_setup window is gone (the git config
# it performed now runs inside bootstrap), and terminal is a supervisord
# service rather than its own window.
extra_window = ["bootstrap='uv run bootstrap'"]
# Write a sane default tmux config on every minds host. tuple-typed
# `extra_provision_command` stacks across templates (see
# `apply_create_template` in system/vendor/mngr/.../common_opts.py), so the
# mode-specific templates (docker/lima/...) keep their own commands.
#
# `mouse on` keeps wheel scroll and in-app mouse working in the browser
# terminal. The clipboard lines make a plain mouse-drag copy reach the system
# clipboard via OSC 52: `set-clipboard on` tells tmux to emit it,
# `terminal-features ,*:clipboard` makes tmux believe the terminal accepts it,
# and the copy-mode bindings copy-and-emit on drag-release. This relies on the
# mngr_ttyd plugin serving an OSC 52-capable web client (the stock ttyd client
# drops these escapes); see libs/mngr_ttyd in the mngr repo.
#
# The final `if-shell ... source-file` line pulls in system/apps/terminal/terminal_tmux.conf
# (committed to /home/user/workspace), which holds the in-memory-persistent-terminals
# settings: a larger history-limit, window-size latest, and the tab-title
# tracking hooks. It lives in its own file so those hook lines stay readable.
extra_provision_command__extend = [
    '''printf '%s\n' 'set -g alternate-screen off' 'set -g mouse on' 'set -g set-clipboard on' 'set -as terminal-features ,*:clipboard' 'bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel' 'bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel' 'if-shell "test -f /home/user/workspace/system/apps/terminal/terminal_tmux.conf" "source-file /home/user/workspace/system/apps/terminal/terminal_tmux.conf"' > "$HOME/.tmux.conf"''',
]

# Shared base template for the local docker provider. Used on its own for the
# default (runc) runtime; stack `--template docker_runsc` on top of it to select
# the gVisor (runsc) runtime instead (see that overlay below and the
# [providers.docker] note above). The container-runtime choice is the only
# difference between the two, so the body lives here once and the overlay reuses
# it -- nothing to keep in sync.
[create_templates.docker]
provider = "docker"
target_path = "/home/user/workspace/"
setting__extend = ["providers.docker.is_enabled=true"]
build_arg__extend = ["--file=system/Dockerfile", "."]
# Security hardening for `docker run`: block privilege escalation via setuid
# binaries. `--cap-add=SYS_PTRACE` was removed deliberately -- gVisor is the
# isolation boundary now, and the extra capability widened the container's
# privileges with no upside for untrusted agents.
#
# `--workdir=/` overrides the image's `WORKDIR /home/user/workspace` for the container's
# idle entrypoint. Under gVisor (runsc), sandbox startup tries to create the
# process working directory and aborts with "file exists" when it already
# exists -- and `/home/user/workspace` exists inside the mounted `/home/user` volume. runc
# tolerates a pre-existing cwd; runsc does not. Pointing the cwd at `/` (always
# present) sidesteps it; nothing depends on the host container's default cwd
# (the entrypoint just sleeps; agents set their own work_dir=/home/user/workspace).
#
# `--restart=unless-stopped` brings the container back after a docker daemon
# restart or host reboot; the container entrypoint then self-heals sshd, so the
# host is reachable again without a manual `mngr start`. The agent itself is
# relaunched by the minds desktop client in this (debugging-oriented) mode.
start_arg__extend = ["--security-opt=no-new-privileges", "--workdir=/", "--restart=unless-stopped"]
# Disable idle detection entirely -- the host should never auto-shutdown.
# This also prevents shutdown when all agent tmux sessions exit.
idle_mode = "disabled"
# Seed /home/user/workspace from /docker_build_code (baked into the image) onto the
# per-host volume. Runs synchronously after the host is online but
# before any agent work_dir setup, so the workspace is in place by the
# time the user's git refs land on top. See system/scripts/default_workspace_template_seed.sh.
post_host_create_command__extend = ["/usr/local/bin/default-workspace-template-seed"]

# gVisor (runsc) runtime overlay for the docker provider. Always stacked on top
# of `docker` (`--template docker --template docker_runsc`): it reuses the entire
# docker template body and only switches the provider's container runtime to
# `runsc`, shrinking the host kernel attack surface for untrusted agents. `runsc`
# must be installed + registered with the local Docker daemon (see CLAUDE.md);
# container creation fails with Docker's native "unknown runtime" error
# otherwise -- which is why this is opt-in rather than the default. The
# template-contributed provider-config setting reaches the provider at create
# time: mngr re-applies template `--setting` entries against the provider config
# after template resolution (imbue-ai/mngr#1914).
[create_templates.docker_runsc]
setting__extend = ["providers.docker.docker_runtime=runsc"]

# template for lima VM provider
[create_templates.lima]
provider = "lima"
target_path = "/home/user/workspace/"
idle_mode = "disabled"
start_arg__extend = ["--cpus=2", "--memory=4", "--disk=20"]
# Mirror the docker template: flip the (default-disabled) lima provider on for
# this create. Redundant in practice -- `@<name>.lima` resolves the provider by
# name regardless of is_enabled -- but kept for parity/intent with docker.
# (Docker-in-Lima mode and its is_host_in_docker provider config are gone; the
# agent now runs directly in the VM as root -- see [providers.lima]. Offline
# reads via `mngr event` / `mngr transcript` against a stopped Lima host do not
# work in the btrfs layout until the host is started.)
#
# The pinned claude binary is installed on the fresh VM during provisioning by
# the claude plugin itself (is_remote_agent_installation_allowed defaults to
# True, so a missing remote claude is auto-installed at the pinned version);
# setup_system.sh below then re-installs it as part of the full toolchain. No
# version-check disable is needed.
setting__extend = ["providers.lima.is_enabled=true"]
# Run the SAME setup as a Dockerfile-built workspace, directly in the VM as root.
# These run after the project is synced to /home/user/workspace (agent-level provisioning,
# post work_dir sync) and reuse the exact scripts the Dockerfile RUNs. There is
# no docker build (so no `--file=system/Dockerfile` build arg) and no /docker_build_code
# relocation (the repo lands straight on the VM's btrfs /home/user disk), so the
# docker template's build_arg + post_host_create_command (default-workspace-template-seed) are
# intentionally absent here. extra_provision_command__extend stacks after the
# main template's entry.
extra_provision_command__extend = [
    # Move root's home to the persistent /home/user tree (the Dockerfile does
    # this for container images; VM/sandbox provisioning does it here) so
    # $HOME, passwd, and sshd agree. /var/cache/user is the off-volume cache
    # target the host env points XDG_CACHE_HOME / npm_config_cache at.
    # (Direct passwd edit rather than `usermod -d`: usermod refuses to modify
    # a user with running processes, and root always has one here.)
    "sed -i 's|^root:\\([^:]*:[^:]*:[^:]*:[^:]*\\):/root:|root:\\1:/home/user:|' /etc/passwd && grep -q '^root:.*:/home/user:' /etc/passwd && mkdir -p /home/user /var/cache/user",
    "bash /home/user/workspace/system/scripts/setup_system.sh",
    "bash /home/user/workspace/system/scripts/install_dependencies.sh",
    "bash /home/user/workspace/system/scripts/build_workspace.sh",
    # Same home-skeleton seeding the docker first-boot seed performs
    # (~/worktrees, ~/.cache symlink, ~/.bashrc, layout-version stamp).
    "sh /home/user/workspace/system/scripts/seed_home_skeleton.sh",
    # Install a systemd unit that relaunches the system-services agent on VM
    # boot, so the workspace recovers from a VM reboot even when the minds
    # desktop app is not running. The agent runs directly in the VM here, so
    # this runs `mngr start system-services` in the VM (mngr is installed by
    # build_workspace.sh above).
    "bash /home/user/workspace/system/scripts/minds_lima_autostart.sh",
]

# template for the Modal sandbox provider (the "modal" compute provider).
# Like Lima, Modal has no Dockerfile build -- the toolchain is provisioned over SSH
# after the sandbox boots, reusing the exact scripts the Dockerfile RUNs. There is
# no autostart unit: Modal sandboxes are ephemeral (~1 day) and do not survive a
# reboot, so the minds desktop app re-creates them rather than relying on systemd
# (the lima-autostart step is intentionally absent). Sizing + timeouts are set in
# this template's setting__extend (below), not in the mngr_modal provider defaults.
[create_templates.modal]
provider = "modal"
target_path = "/home/user/workspace/"
# Disable idle detection entirely -- the host should never auto-shutdown. The
# sandbox instead runs until the 24h max-age timeout set in setting__extend below
# (matching how the vultr/aws/imbue_cloud templates disable idle).
idle_mode = "disabled"
# Enable the (default-disabled) modal provider for this create, and set the
# minds-facing sizing + timeouts HERE rather than in the mngr_modal provider
# defaults: 2 CPU / 4 GB (matching the lima/docker convention) and a ~24h sandbox
# timeout. The sandbox timeout (86310) plus the provider's 90s shutdown buffer
# lands at 86400s (24h), Modal's hard cap. Eval workers instead stack the
# `modal_eval` overlay below for a shorter timeout, leaving this global template
# untouched.
setting__extend = [
    "providers.modal.is_enabled=true",
    "providers.modal.default_cpu=2.0",
    "providers.modal.default_memory=4.0",
    "providers.modal.default_sandbox_timeout=86310",
    "providers.modal.default_idle_timeout=86400",
]
# Modal has no Dockerfile build (like lima): run the same setup a Dockerfile-built
# workspace would, directly in the sandbox over SSH.
extra_provision_command__extend = [
    # Move root's home to the persistent /home/user tree (the Dockerfile does
    # this for container images; VM/sandbox provisioning does it here) so
    # $HOME, passwd, and sshd agree. /var/cache/user is the off-volume cache
    # target the host env points XDG_CACHE_HOME / npm_config_cache at.
    # (Direct passwd edit rather than `usermod -d`: usermod refuses to modify
    # a user with running processes, and root always has one here.)
    "sed -i 's|^root:\\([^:]*:[^:]*:[^:]*:[^:]*\\):/root:|root:\\1:/home/user:|' /etc/passwd && grep -q '^root:.*:/home/user:' /etc/passwd && mkdir -p /home/user /var/cache/user",
    "bash /home/user/workspace/system/scripts/setup_system.sh",
    "bash /home/user/workspace/system/scripts/install_dependencies.sh",
    "bash /home/user/workspace/system/scripts/build_workspace.sh",
    # Same home-skeleton seeding the docker first-boot seed performs
    # (~/worktrees, ~/.cache symlink, ~/.bashrc, layout-version stamp).
    "sh /home/user/workspace/system/scripts/seed_home_skeleton.sh",
]

# Short-timeout overlay for eval-worker Modal sandboxes. Always stacked on top of
# `modal` (`--template modal --template modal_eval`), mirroring how `docker_runsc`
# overlays `docker`: it reuses the entire `modal` body and only shortens the sandbox
# timeout to 3h (10710 + the provider's 90s shutdown buffer = 10800s), since eval runs
# are short-lived and self-terminate at their per-case budget. The eval harness selects
# it via the MINDS_MODAL_EXTRA_TEMPLATE env var on the eval box; normal Modal creates
# use plain `modal` (24h). Keeping it separate leaves the global `modal` template alone.
[create_templates.modal_eval]
setting__extend = ["providers.modal.default_sandbox_timeout=10710"]

# template for vultr VPS provider (cloud mode)
[create_templates.vultr]
provider = "vultr"
target_path = "/home/user/workspace/"
# ``--vps-region=sjc`` (Silicon Valley) instead of the mngr_vultr default
# ``ewr`` (Newark) -- imbue's operators run the bake from west-coast
# machines, and the New Jersey region routinely produced ~1s SSH RTTs
# and ~1.6 MB/s effective rsync throughput, which combined with the
# ~1500-file build context made the cold upload time out at 10 minutes.
# Keeping the default change at the template level so every minds /
# imbue_cloud-pool create lands in the same place; CLI users who want
# a different region can still override per-invocation with
# ``-b --vps-region=<other>``.
build_arg__extend = ["--file=system/Dockerfile", "--vps-plan=vc2-2c-4gb", "--vps-region=sjc", "."]
# Disable idle detection entirely -- the host should never auto-shutdown.
# This also prevents shutdown when all agent tmux sessions exit.
idle_mode = "disabled"
# gVisor runsc hardening for the agent container, matching the docker template.
# runsc itself is installed+selected on the [providers.vultr] block above; these
# `docker run` args go via start_arg (vps_docker forwards start_arg to the inner
# `docker run`): `--workdir=/` (runsc aborts when the image WORKDIR /home/user/workspace,
# inside the mounted /home/user volume, already exists as the process cwd) and
# `--security-opt=no-new-privileges`. `--restart=unless-stopped` brings the
# agent container back after a VPS reboot; the entrypoint then self-heals sshd.
start_arg__extend = ["--security-opt=no-new-privileges", "--workdir=/", "--restart=unless-stopped"]
# Same first-boot seed as the docker template; see comment there.
post_host_create_command__extend = ["/usr/local/bin/default-workspace-template-seed"]
# Install the outer-VM boot unit so the agent recovers after a VPS reboot even
# without the desktop app; same as the pool_host template..
post_host_create_outer_command__extend = [
    """
set -eu
cat > /usr/local/sbin/minds-outer-autostart.sh <<'BOOT'
#!/bin/sh
# On VM boot, start every mngr-managed agent container and relaunch the
# system-services agent inside it (in its full host+agent env, via the shared
# in-container start script). Containers are found by the fixed mngr label, so
# this survives container rebuilds. `docker start` is a no-op if the container's
# --restart policy already brought it back; `mngr start` is idempotent + flock-
# serialized, so racing the desktop client is safe.
set -u
for cid in $(docker ps -aq --filter "label=com.imbue.mngr.host-id"); do
    docker start "$cid" >/dev/null 2>&1 || true
    docker exec --workdir / "$cid" bash -lc 'exec /home/user/workspace/system/scripts/minds_start_services_agent.sh' || true
done
BOOT
chmod +x /usr/local/sbin/minds-outer-autostart.sh
cat > /etc/systemd/system/minds-autostart.service <<'UNIT'
[Unit]
Description=Start the minds system-services agent on boot
After=docker.service
Requires=docker.service

[Service]
Type=oneshot
RemainAfterExit=yes
ExecStart=/usr/local/sbin/minds-outer-autostart.sh

[Install]
WantedBy=multi-user.target
UNIT
systemctl daemon-reload
systemctl enable minds-autostart.service
""",
]

# Provider-agnostic DEFAULT_WORKSPACE_TEMPLATE pool-host build recipe (the imbue-cloud pool bake stacks
# this on top of `main` for BOTH OVH VPSes and lima slices -- they build the same
# container image). No `provider` is declared: the create address selects it
# (`@host.ovh` for OVH, `@host.imbue_cloud_slice` for a slice), mirroring the
# `aws` / `imbue_cloud` templates. Declaring `provider = "ovh"` here used to make
# slice bakes fail ("conflicting providers": the slice address vs this template).
