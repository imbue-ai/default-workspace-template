<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>Workspace on a phone</title>
<style>
  :root {
    --c-bg: #fafaf8;
    --c-surface: #ffffff;
    --c-surface-secondary: #f3f2ef;
    --c-fill-hover: rgb(0 0 0 / 0.07);
    --c-fill-active: rgb(0 0 0 / 0.11);
    --c-text-primary: #202020;
    --c-text-secondary: #666666;
    --c-text-faint: #8c8c8c;
    --c-border: #e4e3df;
    --c-border-strong: #cfcdc7;
    --c-accent: #2f6b4f;
    --c-accent-light: #e9f2ee;
    --c-danger: #d83a2c;
    --c-success: #22a06b;
    --shadow-overlay: 0 0 2px 0 rgba(0,0,0,0.08), 0 3px 8px 2px rgba(0,0,0,0.08);
    --bar-h: 50px;
    --safe-bottom: 12px;
    --status-h: 54px;
    --tile-shadow: 0 2px 6px 0 rgb(0 0 0 / 0.2), 0 1px 2px 0 rgb(0 0 0 / 0.16);
    --label-shadow: drop-shadow(0 2px 4px rgb(0 0 0 / 0.45)) drop-shadow(0 1px 0.5px rgb(0 0 0 / 0.4));
    --dur: 160ms;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 14px; color: var(--c-text-primary); background: #1c1b19;
    -webkit-font-smoothing: antialiased; display: flex; align-items: center; justify-content: center;
    min-height: 100dvh; overflow: hidden;
  }
  .phone { position: relative; width: 393px; height: 852px; overflow: hidden; background: var(--c-bg); border-radius: 44px; box-shadow: 0 20px 60px rgb(0 0 0 / .5); user-select: none; }
  /* On a real phone the page is the phone: fill the viewport, drop the drawn chrome, take the OS insets. */
  @media (max-width: 520px) {
    :root { --status-h: env(safe-area-inset-top, 0px); --safe-bottom: max(env(safe-area-inset-bottom, 0px), 12px); }
    body { background: var(--c-bg); }
    .phone { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
    .status, .home-ind { display: none !important; }
  }

  .status { position: absolute; inset: 0 0 auto 0; height: var(--status-h); display: flex; align-items: flex-end; justify-content: space-between; padding: 0 28px 10px 32px; font-size: 16px; font-weight: 600; z-index: 30; pointer-events: none; }
  .status.on-wallpaper { color: #fff; filter: var(--label-shadow); }
  .status .sys { display: flex; gap: 6px; align-items: center; }
  .home-ind { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; background: #202020; transform: translateX(-50%); z-index: 40; opacity: 0.85; pointer-events: none; }

  /* Home */
  .home { position: absolute; inset: 0; background: #cfc6b4 url(assets/wallpaper-arcs) center / cover no-repeat; }
  .grid { position: absolute; top: calc(var(--status-h) + 20px); left: 0; right: 0; bottom: calc(var(--bar-h) + var(--safe-bottom)); overflow-y: auto; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: max-content; row-gap: 22px; padding: 0 12px 16px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 7px; text-align: center; cursor: pointer; }
  .cell:active .tile { transform: scale(0.94); }
  .cell .tilewrap { position: relative; width: 58px; height: 58px; }
  .cell .tile { width: 58px; height: 58px; border-radius: 32%; box-shadow: var(--tile-shadow); overflow: hidden; transition: transform var(--dur); }
  .cell .tile svg, .cell .tile img { width: 100%; height: 100%; display: block; }
  .cell .badge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--c-accent); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 6px; box-shadow: 0 1px 3px rgb(0 0 0 / .3); }
  .cell .name { font-size: 12px; font-weight: 600; color: #fff; filter: var(--label-shadow); line-height: 1.2; max-width: 84px; overflow-wrap: anywhere; }

  /* Window pages */
  .page { position: absolute; top: var(--status-h); left: 0; right: 0; bottom: calc(var(--bar-h) + var(--safe-bottom)); background: #fff; overflow: hidden; }
  /* Chat app, phone layout. Tokens mirror the chat frontend's: page #fafaf8, transcript on white,
     user bubble #ededed, composer white with the accent as its edge. */
  .page.chatapp { background: var(--c-bg); display: flex; flex-direction: column; }
  .chat-hdr { flex: none; height: 44px; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 6px; border-bottom: 1px solid var(--c-border); background: var(--c-bg); }
  .chat-hdr .hback { display: flex; align-items: center; gap: 2px; height: 36px; padding: 0 8px 0 4px; border-radius: 10px; color: var(--c-accent); font-size: 15px; cursor: pointer; }
  .chat-hdr .hback:active { background: var(--c-fill-hover); }
  .chat-hdr .hback svg { width: 20px; height: 20px; }
  .chat-hdr .hstate { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--c-text-secondary); padding-right: 6px; }
  .chat-hdr .hnew { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--c-text-primary); cursor: pointer; margin-left: auto; }
  .chat-hdr .hnew:active { background: var(--c-fill-hover); }
  .chat-hdr .hnew svg { width: 20px; height: 20px; }
  .chat-hdr h1 { margin: 0 0 0 8px; font-size: 17px; font-weight: 700; }
  /* The list */
  .clist { flex: 1; overflow-y: auto; padding: 4px 0 12px; }
  .crow { display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 12px; cursor: pointer; }
  .crow:active { background: var(--c-fill-hover); }
  .crow .mono { width: 40px; height: 40px; border-radius: 50%; background: var(--c-surface-secondary); border: 1px solid var(--c-border); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: var(--c-text-primary); flex: none; position: relative; }
  .crow.stopped .mono { color: var(--c-text-faint); }
  .crow .mono .mark { position: absolute; right: -2px; bottom: -2px; width: 14px; height: 14px; border-radius: 50%; background: var(--c-bg); display: flex; align-items: center; justify-content: center; }
  .crow .mono .mark i { display: block; width: 9px; height: 9px; border-radius: 50%; }
  .crow .mono .mark i.working { background: var(--c-accent); animation: pulse 1.4s ease-in-out infinite; }
  .crow .mono .mark i.done { background: var(--c-success); }
  .crow .mono .mark i.idle { border: 1.5px solid var(--c-text-faint); width: 8px; height: 8px; }
  .crow .mono .mark i.attention { background: var(--c-warning, #b45309); }
  .crow .mono .mark i.stopped { width: 8px; height: 8px; border-left: 2px solid var(--c-text-faint); border-right: 2px solid var(--c-text-faint); border-radius: 0; height: 9px; width: 6px; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .crow .ctxt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .crow .ctop { display: flex; align-items: baseline; gap: 8px; }
  .crow .ctitle { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crow.stopped .ctitle { color: var(--c-text-secondary); font-weight: 500; }
  .crow .ctime { margin-left: auto; font-size: 12px; color: var(--c-text-faint); flex: none; }
  .crow .csnip { font-size: 13px; color: var(--c-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crow .csnip.working { color: var(--c-accent); }
  .clist .csection { padding: 12px 14px 4px; font-size: 12px; font-weight: 600; color: var(--c-text-faint); text-transform: none; }
  /* The transcript */
  .thread { flex: 1; overflow-y: auto; background: #fff; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: none; }
  .thread::-webkit-scrollbar { display: none; }
  .scroll-ind { position: absolute; right: 3px; width: 3px; border-radius: 2px; background: rgb(0 0 0 / 0.28); opacity: 0; transition: opacity 250ms; pointer-events: none; z-index: 4; }
  .scroll-ind.show { opacity: 1; transition: none; }
  .clist { scrollbar-width: none; }
  .clist::-webkit-scrollbar { display: none; }
  .msg-user { align-self: flex-end; max-width: 82%; background: #ededed; border-radius: 16px 16px 4px 16px; padding: 9px 13px; font-size: 15px; line-height: 1.4; white-space: pre-wrap; }
  .msg-agent { align-self: stretch; padding-right: 24px; font-size: 15px; line-height: 1.5; color: var(--c-text-primary); }
  .msg-agent p { margin: 0 0 10px; }
  .msg-agent p:last-child { margin-bottom: 0; }
  .msg-agent code { font: 13px/1.4 "SF Mono", ui-monospace, monospace; background: #f0f0f0; border: 1px solid #e0e0e0; border-radius: 4px; padding: 0 4px; }
  .msg-agent h3 { margin: 6px 0 8px; font-size: 16px; }
  .msg-agent .tbl { overflow-x: auto; margin: 4px 0 10px; border: 1px solid var(--c-border); border-radius: 8px; }
  .msg-agent table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
  .msg-agent th, .msg-agent td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--c-border); vertical-align: top; white-space: nowrap; }
  .msg-agent th { background: var(--c-surface-secondary); font-weight: 600; }
  .msg-agent tr:last-child td { border-bottom: 0; }
  .msg-agent td.num { text-align: right; }
  /* Tool calls, as ToolChipGroup draws them: a wrapping row of ghost chips in the helper size and
     the faint colour, a 13px tool glyph before the agent's own description of the call, no fill at
     rest. At phone width each chip takes its own line. Tapping one opens its detail panel below. */
  .tool-chip-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 6px 0 20px -4px; }
  .tool-chip { display: inline-flex; align-items: center; gap: 2px; max-width: 20rem; padding: 2px 4px; border-radius: 6px; font-size: 12px; line-height: 1.5; color: var(--c-text-faint); cursor: pointer; }
  .tool-chip.open { background: var(--c-fill-active); color: var(--c-text-primary); }
  .tool-chip.running { color: var(--c-text-secondary); }
  .tool-chip svg { width: 13px; height: 13px; flex: none; }
  .tool-chip .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool-chip .spin { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--c-border-strong); border-top-color: var(--c-accent); animation: spin 0.9s linear infinite; flex: none; margin-right: 2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tool-chip-detail { flex-basis: calc(100% - 4px); margin: 4px 0 2px 4px; border: 1px solid var(--c-border); border-radius: 6px; padding: 6px 12px; font-size: 12px; }
  .tool-chip-detail .dh { display: flex; align-items: flex-start; gap: 6px; margin: -6px -12px 6px; padding: 6px 12px; border-bottom: 1px solid var(--c-border); color: var(--c-text-secondary); }
  .tool-chip-detail .dh svg { width: 13px; height: 13px; flex: none; margin-top: 2px; }
  .tool-chip-detail .dh .x { margin-left: auto; color: var(--c-text-faint); }
  .tool-chip-detail .dh .x svg { width: 14px; height: 14px; }
  .tool-chip-detail pre { margin: 0; font: 12px/1.5 "SF Mono", ui-monospace, monospace; white-space: pre-wrap; word-break: break-all; color: var(--c-text-primary); }
  .tool-chip-detail .verb { color: var(--c-text-secondary); }
  .tool-chip-detail .out { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--c-border); color: var(--c-text-secondary); }
  /* The chat list as a drawer over the chat. */
  .drawer-scrim { position: absolute; inset: 0; background: rgb(0 0 0 / 0.28); z-index: 5; animation: fade var(--dur) ease-out; }
  .drawer { position: absolute; top: 0; bottom: 0; left: 0; width: 86%; max-width: 340px; background: var(--c-bg); z-index: 6; display: flex; flex-direction: column; box-shadow: 8px 0 32px rgb(0 0 0 / 0.18); animation: slidein var(--dur) ease-out; }
  @keyframes slidein { from { transform: translateX(-30px); opacity: 0.6; } }
  .drawer .clist { padding-bottom: calc(var(--safe-bottom) + 12px); }
  .chat-hdr .hlist { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--c-text-primary); cursor: pointer; }
  .chat-hdr .hlist:active { background: var(--c-fill-hover); }
  .chat-hdr .hlist svg { width: 22px; height: 22px; }
  .chat-hdr .htitle { margin-left: 4px; font-size: 15px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The model / provider picker: the real menu's 300px card, anchored above the composer. On a
     phone its submenus replace the card's rows rather than sliding out beside them. */
  .picker-scrim { position: absolute; inset: 0; z-index: 8; }
  .picker-card { position: absolute; left: 12px; bottom: 66px; width: 330px; overflow: hidden; background: var(--c-surface); border: 1px solid var(--c-border); border-radius: 12px; box-shadow: var(--shadow-overlay), 0 8px 24px rgb(0 0 0 / .1); z-index: 9; }
  .picker-card.fresh { animation: rise var(--dur) ease-out; }
  .settings-sheet .sheet-head .hback { display: flex; align-items: center; gap: 2px; margin-left: -8px; color: var(--c-text-secondary); cursor: pointer; }
  .settings-sheet .sheet-head .hback svg { width: 20px; height: 20px; }
  .settings-sheet .sheet-head h2 { font-size: 17px; }
  .settings-sheet .sheet-head .hx { width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: var(--c-text-secondary); background: var(--c-fill-hover); cursor: pointer; }
  .settings-sheet .sheet-head .hx svg { width: 16px; height: 16px; }
  .picker { padding: 6px; font-size: 15px; }
  /* Two panes on one track; a submenu slides in from the right and the card keeps the root pane's height. */
  .picker-track { display: flex; width: 200%; transition: transform 220ms cubic-bezier(0.2, 0, 0, 1); }
  .picker-track.sub { transform: translateX(-50%); }
  .picker-track.nomotion { transition: none; }
  .picker-pane { width: 50%; flex: none; }
  .picker-pane.subpane { position: relative; }
  .picker-pane.rootpane { }
  .picker .prow { display: flex; align-items: center; gap: 8px; height: 42px; margin: 0; padding: 0 12px; border-radius: 10px; cursor: pointer; }
  .picker .prow:not(.effort):not(.static):active { background: var(--c-fill-hover); }
  .picker .seg span:active { background: var(--c-fill-hover); }
  .picker .prow.static { cursor: default; }
  .picker .prow .lab { color: var(--c-text-secondary); }
  .picker .prow .val { margin-left: auto; display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--c-text-primary); }
  .picker .prow .val .dim { font-size: 13px; color: var(--c-text-faint); }
  .picker .prow .val svg { width: 16px; height: 16px; color: var(--c-text-faint); flex: none; }
  .picker .prow .chk { margin-left: auto; color: var(--c-accent); }
  .picker .prow .chk svg { width: 16px; height: 16px; }
  .picker .prow .pback { display: flex; align-items: center; gap: 2px; color: var(--c-text-secondary); }
  .picker .prow .pback svg { width: 16px; height: 16px; }
  .picker .psep { height: 1px; background: var(--c-border); margin: 5px 6px; }
  .picker .prow.effort { height: auto; flex-direction: column; align-items: stretch; gap: 8px; padding: 8px 12px 10px; cursor: default; }
  .picker .seg { display: flex; gap: 4px; background: var(--c-surface-secondary); border: 1px solid var(--c-border); border-radius: 10px; padding: 3px; }
  .picker .seg span { flex: 1; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--c-text-secondary); cursor: pointer; }
  .picker .seg span.on { background: var(--c-surface); color: var(--c-text-primary); font-weight: 600; box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
  .picker .eff { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .picker .eff .ev { font-size: 13px; color: var(--c-text-primary); min-width: 50px; text-align: right; }
  .picker .track { position: relative; width: 128px; height: 20px; display: flex; align-items: center; }
  .picker .track input { position: relative; width: 100%; height: 6px; -webkit-appearance: none; appearance: none; background: transparent; margin: 0; z-index: 2; }
  .picker .track input::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--fill) 0, var(--fill) var(--pct), var(--c-border) var(--pct), var(--c-border) 100%); }
  .picker .track input::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 1px solid var(--c-border-strong); box-shadow: 0 1px 3px rgb(0 0 0 / .2); margin-top: -6px; }
  .picker .track .ticks { position: absolute; left: 9px; right: 9px; top: 50%; z-index: 3; pointer-events: none; }
  .picker .track .ticks i { position: absolute; top: 0; width: 2px; height: 2px; border-radius: 1px; background: rgb(32 32 32 / .7); transform: translate(-50%, -50%); }
  .picker .search { margin: 4px 4px 6px; height: 32px; border-radius: 8px; font-size: 13px; }
  .picker .search svg { width: 14px; height: 14px; }
  .picker .search input { font-size: 13px; }
  .model-trigger { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 8px; border-radius: 8px; font-size: 12px; color: var(--c-text-faint); white-space: nowrap; cursor: pointer; }
  .model-trigger:active, .model-trigger.open { background: var(--c-fill-hover); color: var(--c-text-secondary); }
  .model-trigger .dot { opacity: 0.6; line-height: 1; transform: translateY(-1px); }
  .source-view { display: inline-flex; align-items: center; gap: 8px; color: var(--c-text-faint); cursor: pointer; padding-right: 4px; }
  .picker .toggle { width: 40px; height: 24px; border-radius: 12px; background: var(--c-border); position: relative; transition: background var(--dur); margin-left: auto; }
  .picker .toggle i { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .2); transition: left var(--dur); }
  .picker .toggle.on { background: var(--c-accent); }
  .picker .toggle.on i { left: 18px; }
  .source-view .toggle { width: 28px; height: 16px; border-radius: 8px; background: var(--c-border); position: relative; transition: background var(--dur); }
  .source-view .toggle i { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .2); transition: left var(--dur); }
  .source-view .toggle.on { background: var(--c-accent); }
  .source-view .toggle.on i { left: 14px; }
  .status-pill { align-self: center; font-size: 12px; color: var(--c-text-faint); background: var(--c-surface-secondary); border-radius: 12px; padding: 3px 10px; }
  .working-line { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--c-text-secondary); }
  .working-line .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--c-border-strong); border-top-color: var(--c-accent); animation: spin 0.9s linear infinite; }
  /* The composer */
  .composer { flex: none; background: #fff; padding: 6px 12px 10px; }
  /* The activity strip above the input, as ActivityIndicator draws it: a pulsing accent dot and
     the harness's caption for the running tool, else "Thinking…". Hidden while idle. */
  .activity-strip { display: flex; align-items: center; gap: 8px; padding: 0 6px 8px 6px; font-size: 12px; color: var(--c-text-secondary); }
  .activity-strip .adot { width: 6px; height: 6px; border-radius: 50%; background: var(--c-accent); flex: none; animation: agent-activity-pulse 1.4s ease-in-out infinite; }
  .activity-strip .alabel { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @keyframes agent-activity-pulse { 0%, 100% { opacity: 0.35; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.15); } }
  .compose-row { display: flex; align-items: flex-end; gap: 8px; }
  .compose-row .cfg { width: 40px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--c-text-secondary); flex: none; cursor: pointer; }
  .compose-row .cfg:active, .compose-row .cfg.open { background: var(--c-fill-hover); color: var(--c-text-primary); }
  .compose-row .cfg svg { width: 20px; height: 20px; }
  .compose-box { flex: 1; min-width: 0; display: flex; align-items: flex-end; gap: 6px; border: 1px solid var(--c-border); border-radius: 16px; background: var(--c-surface); padding: 5px 5px 5px 14px; transition: border-color 150ms; }
  .compose-box:focus-within { border-color: var(--c-accent); }
  .compose-box textarea { flex: 1; border: 0; outline: 0; resize: none; font: inherit; font-size: 15px; line-height: 1.35; max-height: 120px; padding: 6px 0; background: transparent; color: var(--c-text-primary); }
  .compose-box textarea::placeholder { color: var(--c-text-faint); }
  .compose-box .cbtn { width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: var(--c-text-secondary); flex: none; cursor: pointer; }
  .compose-box .cbtn svg { width: 18px; height: 18px; }
  .compose-box .cbtn.go { background: var(--c-accent); color: #fff; }
  .compose-box .cbtn.go.off { background: var(--c-border); color: #fff; pointer-events: none; }
  .compose-box .cbtn.stop { background: #64748b; color: #fff; }
  .compose-meta { display: flex; align-items: center; justify-content: space-between; padding: 4px 0 0; font-size: 12px; color: var(--c-text-faint); }
  .page.terminal { background: #101010; color: #d8d8d0; font: 13px/1.5 "SF Mono", ui-monospace, monospace; padding: 14px 12px; white-space: pre-wrap; }
  .page.terminal .cursor { display: inline-block; width: 8px; height: 15px; background: #d8d8d0; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .page.generic { background: var(--c-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--c-text-secondary); text-align: center; padding: 24px; }
  .page.generic .big { width: 72px; height: 72px; border-radius: 32%; overflow: hidden; box-shadow: var(--tile-shadow); }
  .page.generic .big svg, .page.generic .big img { width: 100%; height: 100%; display: block; }
  .page.generic h1 { margin: 0; font-size: 22px; color: var(--c-text-primary); }
  .page.generic p { margin: 0; max-width: 260px; line-height: 1.45; }

  /* Bottom bar */
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--bar-h) + var(--safe-bottom)); padding: 12px 12px var(--safe-bottom); background: rgb(255 255 255 / 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--c-border); display: flex; align-items: center; justify-content: center; gap: 16px; z-index: 20; }
  .bar.on-wallpaper { background: rgb(250 250 248 / 0.88); }
  /* Home and plus take the room the pill gives up: wide, and on the same grey as the pill, so the bar
     reads as three buttons of one family. */
  .ctl { flex: none; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--c-text-primary); position: relative; cursor: pointer; }
  /* Bare glyphs at rest; the grey square only appears under a press. */
  .ctl::before { content: ""; position: absolute; width: 100%; height: 100%; border-radius: 12px; background: var(--c-fill-hover); transition: background var(--dur); opacity: 0; }
  .ctl svg { position: relative; }
  .ctl.disabled { color: var(--c-text-faint); pointer-events: none; }
  .ctl.disabled::before { background: rgb(0 0 0 / 0.04); }
  .ctl svg { width: 28px; height: 28px; }
  .ctl .count { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; padding-top: 1px; }
  .ctl.pressed::before, .ctl:active::before { background: var(--c-fill-active); opacity: 1; }
  /* A button, and visibly one: raised on a white surface with a firm edge, unlike the flat bar around it. */
  .pill { flex: 1 1 0; min-width: 0; max-width: 210px; height: 48px; border-radius: 21px; background: var(--c-fill-hover); border: 0; display: flex; align-items: center; gap: 8px; padding: 0 8px; cursor: pointer; font: inherit; color: inherit; text-align: left; }
  .pill:active, .pill.pressed { background: var(--c-fill-active); }
  .pill-count { flex: none; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 12px; background: var(--c-fill-hover); color: var(--c-text-secondary); display: flex; align-items: center; justify-content: center; font-weight: 700; margin-left: auto; }
  .pill.plain { padding-left: 16px; }
  .pill.plain .title { color: var(--c-text-primary); }
  .pill .ico { width: 32px; height: 32px; border-radius: 32%; overflow: hidden; flex: none; box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
  .pill .ico.round { border-radius: 50%; background: #fff; }
  .pill .ico svg, .pill .ico img { width: 100%; height: 100%; display: block; }
  .pill .ico.round img { transform: scale(1.15); }
  .pill .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; font-weight: 600; }
  .pill .sub { font-size: 12px; color: var(--c-text-secondary); font-weight: 400; margin-left: 4px; }

  /* Sheet */
  .scrim { position: absolute; inset: 0; background: rgb(0 0 0 / 0.28); z-index: 25; animation: fade var(--dur) ease-out; }
  .scrim.light { background: rgb(0 0 0 / 0.12); }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(24px); opacity: 0.6; } }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; top: max(96px, calc(var(--status-h) + 40px)); background: var(--c-bg); border-radius: 18px 18px 0 0; z-index: 26; display: flex; flex-direction: column; box-shadow: 0 -4px 24px rgb(0 0 0 / 0.18); animation: rise var(--dur) ease-out; }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--c-border-strong); margin: 8px auto 4px; flex: none; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 16px 10px; flex: none; }
  .sheet-head h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .sheet-head .close-all { font-size: 14px; color: var(--c-danger); font-weight: 600; cursor: pointer; padding: 6px 0; }
  .sheet-head .close-all.off { color: var(--c-text-faint); pointer-events: none; }
  .search { margin: 0 12px 6px; height: 44px; border-radius: 12px; background: var(--c-surface); border: 1px solid var(--c-border-strong); display: flex; align-items: center; gap: 10px; padding: 0 12px; color: var(--c-text-faint); flex: none; }
  .search svg { width: 18px; height: 18px; flex: none; }
  .search input { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: var(--c-text-primary); min-width: 0; }
  .search input::placeholder { color: var(--c-text-faint); }
  .search .send { width: 32px; height: 32px; border-radius: 16px; background: var(--c-accent); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; cursor: pointer; }
  .search .send svg { width: 16px; height: 16px; }
  .list { flex: 1; overflow-y: auto; padding: 4px 0 calc(var(--safe-bottom) + 8px); }
  .section-title { padding: 14px 16px 6px; font-size: 13px; font-weight: 600; color: var(--c-text-secondary); }
  .empty-note { padding: 10px 16px; color: var(--c-text-faint); font-size: 14px; }
  .row { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 12px 0 16px; cursor: pointer; }
  .row:active { background: var(--c-fill-hover); }
  .row.current { background: var(--c-fill-active); margin: 0 8px; border-radius: 12px; padding-left: 8px; }
  .row .ico { width: 32px; height: 32px; border-radius: 32%; overflow: hidden; flex: none; box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
  .row .ico svg, .row .ico img { width: 100%; height: 100%; display: block; }
  .row .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .row .t { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s { font-size: 12px; color: var(--c-text-secondary); }
  .row .x { width: 36px; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: var(--c-text-faint); flex: none; }
  .row .x:active { background: var(--c-fill-active); }
  .row .x svg { width: 16px; height: 16px; }
  .row .go { color: var(--c-text-faint); width: 32px; display: flex; justify-content: center; }
  .row .go svg { width: 18px; height: 18px; }
  .dot { width: 8px; height: 8px; border-radius: 4px; flex: none; }
  .dot.working { background: var(--c-accent); box-shadow: 0 0 0 3px var(--c-accent-light); }
  .dot.done { background: var(--c-success); }


  /* tk steps: the turn timeline. */
  .progress-block { margin: 12px 0 20px; }
  .tl { position: relative; }
  .tl-thread { position: absolute; top: 8px; bottom: 0; left: 7.5px; width: 1px; background: var(--c-border); }
  .tl-node { position: relative; display: flex; align-items: flex-start; gap: 14px; max-width: calc(100% - 24px); padding-bottom: 18px; }
  .tl-node.last { padding-bottom: 0; }
  .tl-bullet { position: relative; top: 0.1em; z-index: 1; display: flex; align-items: center; height: calc(15px * 1.4); width: 16px; flex: none; background: #fff; color: color-mix(in srgb, var(--c-accent) 55%, var(--c-text-faint)); }
  .tl-bullet .pending { color: #c2bfb6; }
  .tl-spin { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--c-accent-light); border-top-color: var(--c-accent); animation: spin 0.9s linear infinite; margin-left: 1px; }
  .tl-body { min-width: 0; flex: 1; }
  .tl-title { display: flex; width: fit-content; align-items: center; font-size: 15px; line-height: 1.4; font-weight: 500; color: var(--c-text-primary); }
  .tl-title.can { cursor: pointer; }
  .tl-title.done { color: var(--c-text-faint); }
  .tl-title.active { background: linear-gradient(90deg, var(--c-text-primary) 0%, var(--c-text-primary) 40%, var(--c-text-faint) 50%, var(--c-text-primary) 60%, var(--c-text-primary) 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 2.5s ease-in-out infinite; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  .tl-chev { margin-left: 6px; font-size: 18px; line-height: 1; font-weight: 400; color: var(--c-text-secondary); transition: transform 120ms; display: inline-block; -webkit-text-fill-color: var(--c-text-secondary); }
  .tl-chev.open { transform: rotate(90deg); color: var(--c-text-primary); }
  .tl-summary { margin-top: 3px; padding-left: 2px; font-size: 13px; line-height: 1.5; color: var(--c-text-faint); }
  .tl-narration { margin-top: 3px; padding-left: 2px; font-size: 13px; line-height: 1.5; font-style: italic; color: var(--c-text-secondary); }
  .tl-expanded { margin-top: 10px; }
  .tl-expanded .tool-chip-group { margin-bottom: 4px; }
  /* Provider sign-in modal, the workspace's modal card at phone width. */
  .modal-overlay { position: absolute; inset: 0; background: rgb(0 0 0 / 0.35); z-index: 40; animation: fade var(--dur) ease-out; }
  .modal-card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: calc(100% - 28px); max-height: 82%; display: flex; flex-direction: column; background: var(--c-surface); border: 1px solid var(--c-border); border-radius: 8px; box-shadow: var(--shadow-overlay), 0 12px 40px rgb(0 0 0 / .15); z-index: 41; overflow: hidden; }
  .modal-head { display: flex; align-items: center; gap: 6px; padding: 12px 12px 12px 16px; }
  .modal-head h2 { margin: 0; font-size: 18px; font-weight: 700; flex: 1; min-width: 0; }
  .modal-head .modal-back { width: 28px; height: 28px; margin-left: -8px; display: flex; align-items: center; justify-content: center; color: var(--c-text-secondary); cursor: pointer; }
  .modal-head .modal-back svg, .modal-head .modal-x svg { width: 18px; height: 18px; }
  .modal-head .modal-x { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--c-text-secondary); cursor: pointer; }
  .modal-head .modal-x:active { background: var(--c-fill-hover); }
  .modal-body { overflow-y: auto; padding: 4px 16px 12px; }
  .modal-foot { border-top: 1px solid var(--c-border); padding: 12px 16px; display: flex; justify-content: flex-end; }
  .sec-label { font-size: 12px; font-weight: 600; color: var(--c-text-secondary); margin: 8px 0 8px; }
  .row-stack { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
  .lane-row { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--c-border); border-radius: 8px; background: var(--c-surface); box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1), 0 1px 2px -1px rgba(0,0,0,0.1); cursor: pointer; }
  .lane-row:active { border-color: var(--c-accent); }
  .lane-row-mark { width: 44px; display: flex; align-items: center; justify-content: center; flex: none; }
  .lane-mark { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 700; flex: none; }
  .lane-row-text { min-width: 0; flex: 1; display: flex; flex-direction: column; }
  .lane-row-name { font-size: 15px; font-weight: 600; }
  .lane-row-body { margin-top: 2px; font-size: 13px; line-height: 1.35; color: var(--c-text-primary); }
  .lane-chev { color: var(--c-text-faint); display: flex; }
  .lane-chev svg { width: 16px; height: 16px; }
  .acct-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--c-border); border-radius: 8px; background: var(--c-surface); }
  .acct-id { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
  .acct-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acct-act { font-size: 13px; color: var(--c-text-secondary); padding: 6px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .acct-act:active { background: var(--c-fill-hover); }
  .acct-act.icon { display: flex; padding: 6px; }
  .acct-act.icon svg { width: 15px; height: 15px; }
  .lead { margin: 6px 0 14px; font-size: 14px; line-height: 1.45; color: var(--c-text-primary); }
  .step { padding-bottom: 16px; margin-bottom: 14px; border-bottom: 1px solid var(--c-border); transition: opacity var(--dur); }
  .step.last { border-bottom: 0; margin-bottom: 0; padding-bottom: 6px; }
  .step.dim { opacity: 0.45; }
  .step-label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .step-num { width: 20px; height: 20px; border-radius: 50%; background: var(--c-accent-light); color: var(--c-accent); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--c-accent); color: #fff; }
  .btn.primary:active { background: #24573f; }
  .btn.primary.off { background: var(--c-border); pointer-events: none; }
  .btn.block { width: 100%; }
  .btn svg { width: 15px; height: 15px; }
  .hint { margin: 10px 0 0; font-size: 12px; color: var(--c-text-secondary); }
  .hint-act { color: var(--c-accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .field-row { display: flex; gap: 8px; }
  .field-row input { flex: 1; min-width: 0; height: 36px; border: 1px solid var(--c-border-strong); border-radius: 8px; padding: 0 10px; font: 14px "SF Mono", ui-monospace, monospace; color: var(--c-text-primary); outline: 0; background: var(--c-surface); }
  .field-row input:focus { border-color: var(--c-accent); }
  .status-screen { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 20px 8px 8px; gap: 6px; }
  .big-spin { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--c-accent-light); border-top-color: var(--c-accent); animation: spin 0.9s linear infinite; margin-bottom: 8px; }
  .big-check { width: 40px; height: 40px; border-radius: 50%; background: #e0f2ea; color: var(--c-success); display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
  .big-check svg { width: 22px; height: 22px; }
  .status-title { font-size: 17px; font-weight: 700; }
  .status-body { font-size: 14px; color: var(--c-text-secondary); }
  .status-mark { margin-top: 12px; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--c-text-secondary); padding: 6px 10px; border: 1px solid var(--c-border); border-radius: 999px; }

  /* Toast */
  .toast { position: absolute; left: 50%; bottom: calc(var(--bar-h) + var(--safe-bottom) + 16px); transform: translateX(-50%); background: #202020; color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 14px; z-index: 50; animation: rise var(--dur) ease-out; pointer-events: none; white-space: nowrap; }
  /* File viewer, phone layout. Tokens are dufs's own: text #24292e, links #0366d6, meta #5c5c5c,
     octicons in rgba(3,47,98,.5), rows on white. */
  .page.filesapp { background: #fff; display: flex; flex-direction: column; color: #24292e; }
  .files-hdr { flex: none; height: 44px; display: flex; align-items: center; gap: 2px; padding: 0 6px; }
  .files-hdr .fbtn { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--c-text-primary); cursor: pointer; flex: none; }
  .files-hdr .fbtn:active, .files-hdr .fbtn.on { background: var(--c-fill-hover); }

  .files-hdr .fsave:active { background: var(--c-fill-hover); }
  .files-hdr .fsave.off { color: var(--c-text-faint); pointer-events: none; }
  .fcrumb { flex: none; display: flex; align-items: center; padding: 0 14px 8px; font-size: 13px; overflow-x: auto; scrollbar-width: none; white-space: nowrap; border-bottom: 1px solid var(--c-border); }

  .fcrumb b { color: #24292e; font-weight: 600; }
  .fcrumb .sep { color: #586069; padding: 0 4px; }
  .fsearchbar { flex: none; display: flex; align-items: center; margin: 0 12px 8px; height: 36px; border: 1px solid #ddd; border-radius: 18px; background: #fafafa; padding: 0 6px 0 10px; }
  .fsearchbar .icon { display: flex; color: #9a9a9a; }
  .fsearchbar .icon svg { width: 16px; height: 16px; }
  .fsearchbar input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; padding: 0 8px; color: #24292e; }
  .fsearchbar .fx { width: 28px; height: 28px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: var(--c-text-faint); cursor: pointer; }
  .fsearchbar .fx svg { width: 14px; height: 14px; }
  .fsort { flex: none; display: flex; gap: 18px; padding: 8px 16px 2px; font-size: 12px; color: #5c5c5c; }
  .fsort-key { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .fsort-key.on { color: #24292e; }
  .fsort-key svg { fill: currentColor; opacity: .7; }
  .flist { flex: 1; overflow-y: auto; padding-bottom: 12px; scrollbar-width: none; }
  .flist::-webkit-scrollbar { display: none; }
  .frow { display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 4px 0 16px; cursor: pointer; }
  .frow:active { background: #fafafa; }
  .frow .ficon { width: 20px; display: flex; justify-content: center; flex: none; }
  .frow .ficon svg, .fmtitle .ficon svg { height: 18px; width: auto; fill: rgba(3,47,98,0.5); }
  .frow .ftxt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .frow .fname { font-size: 15px; color: #0366d6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frow .fsub { font-size: 12px; color: #5c5c5c; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frow .fsub .mid { padding: 0 5px; }
  .frow .fmore { width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: var(--c-text-faint); flex: none; }
  .frow .fmore:active { background: var(--c-fill-active); }
  .frow .fmore svg { width: 18px; height: 18px; }
  .fempty { padding: 28px 16px; font-style: italic; color: #5c5c5c; text-align: center; }
  .feditor { flex: 1; margin: 8px 12px 12px; border: 1px solid #ced4da; border-radius: 6px; padding: 8px; font: 13px/1.5 "SF Mono", ui-monospace, monospace; color: #24292e; background: #fff; outline: none; resize: none; white-space: pre; overflow: auto; }
  .fnote { padding: 24px 16px; font-style: italic; color: #24292e; }
  .fpreview { flex: 1; overflow: auto; padding: 12px; background: #fafafa; }
  .fpreview img { display: block; max-width: 100%; border: 1px solid var(--c-border); }
  .fmenu-scrim { position: absolute; inset: 0; z-index: 8; }
  .fmenu-scrim.dim { background: rgb(0 0 0 / 0.18); animation: fade var(--dur) ease-out; }
  .fmenu { position: absolute; z-index: 9; background: var(--c-surface); border: 1px solid var(--c-border); border-radius: 12px; box-shadow: var(--shadow-overlay), 0 8px 24px rgb(0 0 0 / .1); padding: 6px; font-size: 15px; }
  .fmenu.top { top: 46px; right: 10px; width: 264px; animation: fade var(--dur) ease-out; }
  .fmenu.bottom { left: 10px; right: 10px; bottom: 10px; animation: rise var(--dur) ease-out; }
  .fmtitle { display: flex; align-items: center; gap: 10px; padding: 8px 10px 10px; font-size: 13px; color: var(--c-text-secondary); border-bottom: 1px solid var(--c-border); margin-bottom: 4px; }

  .fmi { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 10px; border-radius: 8px; cursor: pointer; }
  .fmi:active { background: var(--c-fill-hover); }
  .fmi .g { width: 20px; display: flex; justify-content: center; }

  .fmsep { height: 1px; background: var(--c-border); margin: 4px 6px; }
</style>

<script>
const XMLNS = 'http://www.w3.org/2000/svg';
const ICON = {

  kebab: '<circle cx="12" cy="5" r="2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="2" fill="currentColor" stroke="none"/>',
  windows: '<rect x="3" y="4" width="18" height="16" rx="3"/>',

  return `<div class="page chatapp">${chatThread(w, c)}${S.drawer === w.id ? chatDrawer(w) : ''}${S.picker && S.picker.win === w.id ? pickerView(w, c) : ''}</div>`;
}

function chatDrawer(w) {
  const live = CHATS.filter(c => c.status !== 'stopped');
  const stopped = CHATS.filter(c => c.status === 'stopped');
  const row = (c) => `
    <div class="crow ${c.status === 'stopped' ? 'stopped' : ''}" data-act="chat-open" data-win="${w.id}" data-chat="${c.id}">
      <span class="mono">${provider(c.provider).mono}<span class="mark"><i class="${c.status}"></i></span></span>
      <span class="ctxt">
        <span class="ctop"><span class="ctitle">${c.title}</span><span class="ctime">${c.when}</span></span>
        <span class="csnip ${c.status === 'working' ? 'working' : ''}">${c.status === 'working' ? STATUS_WORD.working : lastLine(c)}</span>
      </span>
    </div>`;
  return `<div class="drawer-scrim" data-act="drawer-close"></div>
  <div class="drawer">
    <div class="chat-hdr"><h1>Chats</h1><span class="hnew" data-act="chat-new" data-win="${w.id}" aria-label="New chat">${ic('plus')}</span></div>
    <div class="clist">
      ${live.map(row).join('')}
      ${stopped.length ? `<div class="csection">Stopped</div>${stopped.map(row).join('')}` : ''}
    </div>
  </div>`;
}

function toolsView(m, ci, mi) {
  const chips = m.calls.map((call, i) => {
    const key = `${ci}:${mi}:${i}`;
    const isOpen = openChips.has(key);
    const glyph = call.done ? ic(TOOL_ICON[call.tool] || 'wrench', 1.75) : '<span class="spin"></span>';
    const chip = `<span class="tool-chip ${isOpen ? 'open' : ''} ${call.done ? '' : 'running'}" data-act="chip" data-key="${key}" title="${call.label}">${glyph}<span class="lbl">${call.label}</span></span>`;
    const detail = isOpen ? `<div class="tool-chip-detail"><div class="dh">${ic(TOOL_ICON[call.tool] || 'wrench', 1.75)}<span>${call.label}</span><span class="x" data-act="chip" data-key="${key}">${ic('close')}</span></div><pre><span class="verb">${call.tool === 'Bash' ? 'ran' : call.tool.toLowerCase()}</span> ${call.cmd}</pre>${call.out ? `<pre class="out">${call.out}</pre>` : ''}</div>` : '';
    return chip + detail;
  }).join('');
  return `<div class="tool-chip-group">${chips}</div>`;
}

function runningCaption(c) {
  for (let i = c.messages.length - 1; i >= 0; i--) {
    const m = c.messages[i];
    const calls = m.k === 'tools' ? m.calls : m.k === 'steps' ? [...(m.before || []), ...m.steps.flatMap(st => st.calls || []), ...(m.after || [])] : [];
    const pending = [...calls].reverse().find(call => !call.done);
    if (pending) return pending.label.replace(/^ran /, 'Running ').replace(/^read /, 'Reading ').replace(/^edited /, 'Editing ') + (pending.label.endsWith('…') ? '' : '…');
  }
  return 'Thinking…';
}

function chatThread(w, c) {
  const ci = CHATS.indexOf(c);
  const body = c.messages.map((m, mi) => {
    if (m.k === 'user') return `<div class="msg-user">${m.t}</div>`;
    if (m.k === 'agent') return `<div class="msg-agent">${m.h}</div>`;
    if (m.k === 'tools') return toolsView(m, ci, mi);
    if (m.k === 'steps') return stepsView(m, ci, mi);
    if (m.k === 'status') return `<div class="status-pill">${m.t}</div>`;
    return '';
  }).join('');
  const working = c.status === 'working';
  const draft = drafts[c.id] || '';
  const empty = c.messages.length === 0 ? `<div class="msg-agent" style="color: var(--c-text-secondary); text-align: center; margin-top: 40%">New chat. Say what you want done.</div>` : '';
  const pickerOpen = S.picker && S.picker.win === w.id;
  return `<div class="chat-hdr">
      <span class="hlist" data-act="drawer-open" data-win="${w.id}" aria-label="Chats">${ic('list')}</span>
      <span class="htitle">${c.title}</span>
    </div>
    <div class="thread" id="thread-${w.id}">${empty}${body}</div>
    <div class="composer">
      ${working ? `<div class="activity-strip" role="status"><span class="adot"></span><span class="alabel">${runningCaption(c)}</span></div>` : ''}
      <div class="compose-row">
        <span class="cfg ${pickerOpen ? 'open' : ''}" data-act="picker-open" data-win="${w.id}" aria-label="Chat settings">${ic('sliders')}</span>
        <div class="compose-box">
          <textarea id="compose-${w.id}" rows="1" placeholder="${working ? 'Type to queue more messages...' : 'Type a message...'}" data-win="${w.id}" data-chat="${c.id}">${draft.replace(/</g, '&lt;')}</textarea>
          <span class="cbtn" aria-label="Attach">${ic('attach')}</span>
          ${working ? `<span class="cbtn stop" data-act="chat-stop" data-chat="${c.id}" aria-label="Stop">${ic('stop')}</span>` : `<span class="cbtn go ${draft.trim() ? '' : 'off'}" data-act="chat-send" data-win="${w.id}" data-chat="${c.id}" aria-label="Send">${ic('send')}</span>`}
        </div>
      </div>
    </div>`;
}

// The picker: a floating card above the settings button. Two panes ride one track; the root
// pane's rows, and a submenu that slides in from the right and back out.
function pickerView(w, c) {
  const p = provider(c.provider);
  const view = S.picker.view;
  const check = `<span class="chk">${ic('check')}</span>`;
  const levels = p.efforts;
  const root = `
      <div class="prow" data-act="picker-view" data-view="provider"><span class="lab">Provider</span><span class="val"><span>${account(c.account || 'acc-anth-1')?.label ?? p.name}</span><span class="dim">(${p.harness})</span>${ic('chevron')}</span></div>
      <div class="psep"></div>
      <div class="prow" data-act="picker-view" data-view="model"><span class="lab">Model</span><span class="val"><span>${c.model}</span>${ic('chevron')}</span></div>
      <div class="prow effort"><span class="lab">Effort</span><span class="seg">${levels.map(l => `<span class="${l === c.effort ? 'on' : ''}" data-act="pick-effort" data-chat="${c.id}" data-id="${l}">${l}</span>`).join('')}</span></div>
      ${p.fast ? `<div class="prow" data-act="picker-view" data-view="fast"><span class="lab">Fast Mode</span><span class="val"><span>${c.fast}</span>${ic('chevron')}</span></div>` : ''}
      <div class="psep"></div>
      <div class="prow" data-act="source-view" data-chat="${c.id}"><span class="lab">Source view</span><span class="toggle ${c.sourceView ? 'on' : ''}"><i></i></span></div>
      <div class="psep"></div>
      <div class="prow" data-act="stop-agent" data-chat="${c.id}"><span>Stop agent</span></div>`;
  const back = (label) => `<div class="prow" data-act="picker-view" data-view="root"><span class="pback">${ic('back')}${label}</span></div><div class="psep"></div>`;
  let sub = '';
  if (view === 'provider') sub = back('Provider') + ACCOUNTS.map(a => `<div class="prow" data-act="pick-account" data-chat="${c.id}" data-id="${a.id}"><span>${a.label}</span><span class="dim" style="font-size:13px;color:var(--c-text-faint)">(${provider(a.provider).harness})</span>${(c.account || 'acc-anth-1') === a.id ? check : ''}</div>`).join('') + `<div class="psep"></div><div class="prow" data-act="signin-open"><span class="lab">Add an account…</span></div>`;
  else if (view === 'model') sub = back('Model') + p.models.map(mname => `<div class="prow" data-act="pick-model" data-chat="${c.id}" data-id="${mname}"><span>${mname}</span>${mname === c.model ? check : ''}</div>`).join('');
  else if (view === 'fast') sub = back('Fast Mode') + ['Off', 'Auto', 'On'].map(f => `<div class="prow" data-act="pick-fast" data-chat="${c.id}" data-id="${f}"><span>${f}</span>${f === c.fast ? check : ''}</div>`).join('') + `<div class="psep"></div><div class="prow static"><span class="lab" style="font-size:13px">Auto runs fast until the turn limit, then slows down.</span></div>`;
  // Start the track where the last render left it, so the move to the new face animates.
  const from = S.picker.from; S.picker.from = null;
  const startSub = from === undefined || from === null ? view !== 'root' : from !== 'root';
  const cls = `picker-track ${startSub ? 'sub' : ''} nomotion`;
  const fresh = S.picker.fresh; S.picker.fresh = false;
  return `<div class="picker-scrim" data-act="picker-close"></div><div class="picker-card ${fresh ? 'fresh' : ''}"><div class="picker"><div class="${cls}" data-target="${view !== 'root' ? 'sub' : 'root'}"><div class="picker-pane rootpane">${root}</div><div class="picker-pane subpane">${sub}</div></div></div></div>`;
}

// ---- tk steps (ProgressBlock) ----
// A turn with steps: a thread down the left, one node per step (done: filled disc with a check
// and a greyed title over its summary; active: spinner and a shimmering narration; pending: a
// dashed ring). Tapping a title reveals the step's own tool calls beneath it.
const openSteps = new Set();
function stepBullet(st) {
  if (st === 'done') return `<svg class="pv-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M4.5 8L7 10.5L11.5 6" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  if (st === 'active') return `<span class="tl-spin"></span>`;
  return `<svg class="pv-icon pending" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2"/></svg>`;
}
function stepsView(m, ci, mi) {
  const nodes = m.steps.map((st, i) => {
    const key = `${ci}:${mi}:${i}`;
    const isOpen = openSteps.has(key);
    const canExpand = st.calls && st.calls.length > 0;
    const caption = st.status === 'done' && st.summary ? `<div class="tl-summary">${st.summary}</div>`
      : st.status === 'active' && st.narration && !isOpen ? `<div class="tl-narration">${st.narration}</div>` : '';
    const body = isOpen && canExpand ? `<div class="tl-expanded">${toolsView({ calls: st.calls }, ci, `${mi}s${i}`)}</div>` : '';
    return `<div class="tl-node ${st.status} ${i === m.steps.length - 1 ? 'last' : ''}">
      <div class="tl-bullet">${stepBullet(st.status)}</div>
      <div class="tl-body">
        <div class="tl-title ${st.status} ${canExpand ? 'can' : ''}" data-act="step" data-key="${key}">${st.title}${canExpand ? `<span class="tl-chev ${isOpen ? 'open' : ''}">›</span>` : ''}</div>
        ${caption}${body}
      </div>
    </div>`;
  }).join('');
  const before = m.before ? toolsView({ calls: m.before }, ci, `${mi}b`) : '';
  const after = m.after ? toolsView({ calls: m.after }, ci, `${mi}a`) : '';
  return `<div class="progress-block">${before}<div class="tl"><div class="tl-thread"></div>${nodes}</div>${after}</div>`;
}

// ---- Provider sign-in ----
// The chooser and its screens, as ProviderChooserModal draws them: the lane rows, then for a
// browser method the two numbered steps, the verifying screen and the All set screen.
const ACCOUNTS = [
  { id: 'acc-anth-1', provider: 'anthropic', label: 'Anthropic' },
  { id: 'acc-oai-1', provider: 'openai', label: 'OpenAI' },
];
const LANES = [
  { id: 'anthropic', name: 'Anthropic', harness: 'Claude Code', body: 'Use your Claude subscription, or an API key.', mark: 'A', markBg: '#f2e8de', markInk: '#b5532c' },
  { id: 'openai', name: 'OpenAI', harness: 'Codex', body: 'Use your ChatGPT subscription, or an API key.', mark: 'O', markBg: '#e6eef2', markInk: '#1f3b4d' },
  { id: 'google', name: 'Google', harness: 'Gemini CLI', body: 'Use your Google account.', mark: 'G', markBg: '#e9f0ea', markInk: '#2f6b4f' },
];
const account = (id) => ACCOUNTS.find(a => a.id === id);
const lane = (id) => LANES.find(l => l.id === id);
function laneMark(l, size = 28) {
  return `<span class="lane-mark" style="width:${size}px;height:${size}px;background:${l.markBg};color:${l.markInk};font-size:${Math.round(size * 0.5)}px">${l.mark}</span>`;
}
function signinView() {
  const si = S.signin;
  const l = si.lane ? lane(si.lane) : null;
  let title, body, footer = '';
  if (si.screen === 'chooser') {
    title = 'Pick your AI provider';
    const signedIn = ACCOUNTS.length ? `<div class="sec-label">Signed in</div><div class="row-stack">${ACCOUNTS.map(a => `
      <div class="acct-row"><span class="acct-id">${laneMark(lane(a.provider), 20)}<span class="acct-name">${a.label}</span></span><span class="acct-act" data-act="signin-reauth" data-lane="${a.provider}">Sign in again</span><span class="acct-act icon" data-act="signin-remove" data-id="${a.id}" aria-label="Remove ${a.label}">${ic('trash')}</span></div>`).join('')}</div>` : '';
    body = `${signedIn}<div class="sec-label">${ACCOUNTS.length ? 'Add another' : 'Providers'}</div><div class="row-stack">${LANES.map(x => `
      <div class="lane-row" data-act="signin-lane" data-lane="${x.id}">
        <span class="lane-row-mark">${laneMark(x)}</span>
        <span class="lane-row-text"><span class="lane-row-name">${x.name}</span><span class="lane-row-body">${x.harness}. ${x.body}</span></span>
        <span class="lane-chev">${ic('chevron')}</span>
      </div>`).join('')}</div>`;
  } else if (si.screen === 'steps') {
    title = `Sign in to ${l.name}`;
    body = `<p class="lead">Use your ${l.name} account. Approve access in your browser, copy the code it gives you, then paste it below.</p>
      <div class="step ${si.activeStep === 1 ? '' : 'dim'}">
        <div class="step-label"><span class="step-num">1</span>Open the sign-in page</div>
        <span class="btn primary block" data-act="signin-openlink"><span>Open ${l.name} sign-in page</span>${ic('external-link')}</span>
        <p class="hint">Didn't open? <span class="hint-act" data-act="signin-copylink">${si.copied ? 'Link copied' : 'Copy the link'}</span>${si.copied ? '' : ' and paste it into your browser.'}</p>
      </div>
      <div class="step last ${si.activeStep === 2 ? '' : 'dim'}">
        <div class="step-label"><span class="step-num">2</span>Approve, then paste the code shown</div>
        <div class="field-row"><input id="signin-code" class="mono" type="text" spellcheck="false" autocomplete="off" value="${(si.code || '').replace(/"/g, '&quot;')}"><span class="btn primary ${si.code && si.code.trim() ? '' : 'off'}" data-act="signin-continue">Continue</span></div>
      </div>`;
  } else if (si.screen === 'verifying') {
    title = `Sign in to ${l.name}`;
    body = `<div class="status-screen"><span class="big-spin"></span><div class="status-title">Checking the code</div><div class="status-body">This can take a few seconds.</div></div>`;
  } else if (si.screen === 'success') {
    title = 'Signed in';
    body = `<div class="status-screen"><span class="big-check">${ic('check')}</span><div class="status-title">All set</div><div class="status-body">Signed in. ${l.name} is ready to use.</div><div class="status-mark">${laneMark(l, 18)}${l.name}</div></div>`;
    footer = `<div class="modal-foot"><span class="btn primary" data-act="signin-done">Done</span></div>`;
  }
  const showBack = si.screen === 'steps';
  return `<div class="modal-overlay" data-act="signin-close"></div>
  <div class="modal-card">
    <div class="modal-head">${showBack ? `<span class="modal-back" data-act="signin-back">${ic('back')}</span>` : ''}<h2>${title}</h2><span class="modal-x" data-act="signin-close">${ic('close')}</span></div>
    <div class="modal-body">${body}</div>
    ${footer}
  </div>`;
}

      item('files-new-folder', DUFS.newFolder, 'New folder'),
      item('files-new-file', DUFS.newFile, 'New file'),
    ];
  } else {
    const n = fsNode([...w.fpath, ...menu.rel.split('/')]);
    if (!n) return '';
    const dir = isDirNode(n);
    const rel = `data-rel="${menu.rel.replace(/"/g, '&quot;')}"`;
    title = `<div class="fmtitle"><span class="ficon">${DUFS[n.type] || DUFS.file}</span><span>${n.name}</span></div>`;
    items = [
      item('files-download', DUFS.download, dir ? 'Download folder as .zip' : 'Download file', rel),
      dir || w.ffile ? '' : item('files-open', n.binary ? DUFS.view : DUFS.edit, n.binary ? 'View file' : 'Edit file', rel),
      item('files-move', DUFS.move, 'Move & Rename', rel),
      item('files-delete', DUFS.delete, 'Delete', rel),
    ];
  }
  return `<div class="fmenu-scrim ${menu.kind === 'more' ? '' : 'dim'}" data-act="files-menu-close"></div>
    <div class="fmenu ${menu.kind === 'more' ? 'top' : 'bottom'}">${title}${items.join('')}</div>`;
}

// One prompt for both toolbox creates, worded as dufs words them.
function filesCreate(w, folder, kind) {
  const name = prompt(kind === 'dir' ? 'Enter name of new folder' : 'Enter name of new file');
  if (!name || !name.trim()) return;
  const now = new Date();
  const stamp = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  folder.children.push(kind === 'dir' ? D(name.trim(), stamp, []) : Fi(name.trim(), stamp, 0, ''));
  folder.mtime = stamp;
  toast(kind === 'dir' ? `Created ${name.trim()}/` : `Created ${name.trim()}`);
}

function statusBar(onWallpaper) {
  return `<div class="status ${onWallpaper ? 'on-wallpaper' : ''}"><span>10:32</span><span class="sys">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="0.8"/><rect x="5" y="5.5" width="3" height="6.5" rx="0.8"/><rect x="10" y="3" width="3" height="9" rx="0.8"/><rect x="15" y="0" width="3" height="12" rx="0.8"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 9.6a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 1 0 0-3.2z"/><path d="M8 6a6 6 0 0 0-4.2 1.7l1.4 1.4A4 4 0 0 1 8 8a4 4 0 0 1 2.8 1.1l1.4-1.4A6 6 0 0 0 8 6z"/><path d="M8 2a10 10 0 0 0-7 2.9l1.4 1.4A8 8 0 0 1 8 4a8 8 0 0 1 5.6 2.3L15 4.9A10 10 0 0 0 8 2z"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13" fill="none" stroke="currentColor" stroke-width="1"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5"/><rect x="2" y="2" width="9" height="9" rx="2" fill="currentColor" stroke="none"/><path d="M25 4.5v4" stroke-linecap="round"/></svg>
  </span></div>`;
}

function homeView() {
  const openByApp = {};
  for (const w of S.windows) openByApp[w.app] = (openByApp[w.app] || 0) + 1;
  return `<div class="home"></div><div class="grid">${APPS.filter(a => !a.hidden).map(a => `
    <div class="cell" data-act="app" data-app="${a.n}">
      <span class="tilewrap"><span class="tile">${a.icon}</span>${openByApp[a.n] ? `<span class="badge">${openByApp[a.n]}</span>` : ''}</span>
      <span class="name">${a.d}</span>
    </div>`).join('')}</div>`;
}

function pageView(w) {
  const a = app(w.app);
  if (a.kind === 'chat') return chatAppView(w);
  if (a.kind === 'files') return filesAppView(w);
  if (a.kind === 'terminal') return `<div class="page terminal">user@geebspace:~/workspace$ git status
On branch main
nothing to commit, working tree clean
user@geebspace:~/workspace$ <span class="cursor"></span></div>`;
  return `<div class="page generic"><span class="big">${a.icon}</span><h1>${w.title}</h1><p>${a.d} would render here, edge to edge, exactly as it does inside a window today.</p></div>`;
}

function barView() {
  const w = currentWin();
  const onWallpaper = w === null;
  // The title the page reported, else the app's display name: the shell's own rule for a title bar.
  // The pill is the windows button: it names the window you are in, counts the rest, and opens the list.
  const n = S.windows.length;
  const badge = `<span class="pill-count">${n}</span>`;
  const pill = w
    ? `<button class="pill ${S.sheet === 'windows' ? 'pressed' : ''}" data-act="windows"><span class="ico">${app(w.app).icon}</span><span class="title">${w.title || app(w.app).d}</span>${badge}</button>`
    : `<button class="pill plain ${S.sheet === 'windows' ? 'pressed' : ''}" data-act="windows"><span class="title">geebspace</span>${n ? badge : ''}</button>`;
  return `<div class="bar ${onWallpaper ? 'on-wallpaper' : ''}">
    <div class="ctl ${w === null ? 'disabled' : ''}" data-act="home" aria-label="Home">${ic('home')}</div>
    ${pill}
    <div class="ctl ${S.sheet === 'start' ? 'pressed' : ''}" data-act="start-sheet" aria-label="Open something new">${ic('plus')}</div>
  </div>`;
}

function matches(text) {
  const q = S.query.trim().toLowerCase();
  return q === '' || text.toLowerCase().includes(q);
}

// The windows sheet: what is open, from the pill.
function windowsSheet() {
  const openRows = S.windows.filter(w => matches(w.title) || matches(app(w.app).d)).map(w => `
    <div class="row ${w.id === S.current ? 'current' : ''}" data-act="show" data-id="${w.id}">
      <span class="ico">${app(w.app).icon}</span>
      <span class="txt"><span class="t">${w.title || app(w.app).d}</span>${w.title && w.title !== app(w.app).d ? `<span class="s">${app(w.app).d}</span>` : ''}</span>
      ${w.status ? `<span class="dot ${w.status}"></span>` : ''}
      <span class="x" data-act="close" data-id="${w.id}">${ic('close')}</span>
    </div>`).join('');
  return `<div class="scrim" data-act="dismiss"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div class="sheet-head"><h2>Windows</h2><span class="close-all ${S.windows.length ? '' : 'off'}" data-act="closeall">Close all ${S.windows.length || ''}</span></div>
    ${S.windows.length > 6 ? `<div class="search">${ic('search')}<input id="q" type="text" placeholder="Find a window" value="${S.query.replace(/"/g, '&quot;')}" autocomplete="off"></div>` : ''}
    <div class="list">
      ${openRows || `<div class="empty-note">${S.windows.length ? 'No window matches.' : 'Nothing open. Tap + to start something.'}</div>`}
    </div>
  </div>`;
}

// The start sheet: everything that can be opened, from the plus. Launch paths first, then every app.
function startSheet() {
  const q = S.query.trim();
  const startRows = APPS.filter(a => a.start && matches(a.start)).map(a => `
    <div class="row" data-act="start" data-app="${a.n}">
      <span class="ico">${a.icon}</span>
      <span class="txt"><span class="t">${a.start}</span></span>
      <span class="go">${ic('chevron')}</span>
    </div>`).join('');
  const appRows = APPS.filter(a => matches(a.d)).map(a => `
    <div class="row" data-act="app" data-app="${a.n}">
      <span class="ico">${a.icon}</span>
      <span class="txt"><span class="t">${a.d}</span></span>
      <span class="go">${ic('chevron')}</span>
    </div>`).join('');
  const sendRow = q === '' ? '' : `
    <div class="section-title">Send</div>
    <div class="row" data-act="send">
      <span class="ico">${app('chat').icon}</span>
      <span class="txt"><span class="t">Send "${q}" to a new chat</span></span>
      <span class="go">${ic('chevron')}</span>
    </div>`;
  return `<div class="scrim" data-act="dismiss"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div class="sheet-head"><h2>Open something</h2></div>
    <div class="search">${ic('search')}<input id="q" type="text" placeholder="Search apps, or type a message" value="${S.query.replace(/"/g, '&quot;')}" autocomplete="off">${q ? `<span class="send" data-act="send">${ic('send')}</span>` : ''}</div>
    <div class="list">
      ${sendRow}
      ${startRows ? `<div class="section-title">Start</div>${startRows}` : ''}
      ${appRows ? `<div class="section-title">Apps</div>${appRows}` : (q && !startRows ? `<div class="empty-note">No app matches.</div>` : '')}
    </div>
  </div>`;
}

function render() {
  const w = currentWin();
  const focusQuery = S.sheet && document.activeElement && document.activeElement.id === 'q';
  const sel = focusQuery ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;
  let html = statusBar(w === null) + (w ? pageView(w) : homeView()) + barView();
  if (S.sheet === 'windows') html += windowsSheet();
  if (S.sheet === 'start') html += startSheet();
  if (S.signin) html += signinView();
  if (S.toast) html += `<div class="toast">${S.toast}</div>`;
  const composing = document.activeElement && document.activeElement.id && (document.activeElement.id.startsWith('compose-') || document.activeElement.id.startsWith('files-q-') || document.activeElement.id === 'signin-code') ? document.activeElement.id : null;
  document.getElementById('root').innerHTML = `<div class="phone">${html}</div>`;
  if (S.sheet && (focusQuery || S.query !== '')) {
    const q = document.getElementById('q');
    if (q) { q.focus(); if (sel) q.setSelectionRange(sel[0], sel[1]); }
  }
  if (composing) { const ta = document.getElementById(composing); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }
  const thread = document.querySelector('.thread');
  if (thread) { thread.scrollTop = thread.scrollHeight; attachScrollIndicator(thread); }
  const track = document.querySelector('.picker-track');
  // Two steps, with a forced style flush between: un-suppressing the transition and moving the
  // track in one frame would let the browser apply both at once and skip the animation.
  if (track) { const target = track.dataset.target; requestAnimationFrame(() => { track.classList.remove('nomotion'); void track.offsetWidth; track.classList.toggle('sub', target === 'sub'); }); }
}

// A scroll indicator that only shows while the thread is moving, since the native bar is hidden.
let scrollHideTimer = null;
function attachScrollIndicator(thread) {
  const page = thread.parentElement;
  const ind = document.createElement('div'); ind.className = 'scroll-ind'; page.appendChild(ind);
  const place = () => {
    const track = thread.clientHeight; const total = thread.scrollHeight;
    if (total <= track + 1) { ind.style.opacity = '0'; return; }
    const h = Math.max(24, track * track / total);
    const y = thread.offsetTop + (thread.scrollTop / (total - track)) * (track - h);
    ind.style.height = h + 'px'; ind.style.top = y + 'px';
  };
  thread.addEventListener('scroll', () => { place(); ind.classList.add('show'); clearTimeout(scrollHideTimer); scrollHideTimer = setTimeout(() => ind.classList.remove('show'), 700); }, { passive: true });
  place();
}

// ---- Events ----
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id ? Number(el.dataset.id) : null;
  switch (act) {
    case 'windows': S.sheet = S.sheet === 'windows' ? false : 'windows'; S.query = ''; break;
    case 'start-sheet': S.sheet = S.sheet === 'start' ? false : 'start'; S.query = ''; break;
    case 'dismiss': S.sheet = false; S.query = ''; break;
    case 'show': show(id); break;
    case 'close': e.stopPropagation(); closeWindow(id); break;
    case 'closeall': closeAll(); break;
    case 'start': startNew(el.dataset.app); break;
    case 'app': focusOrOpen(el.dataset.app); break;
    case 'send': sendMessage(S.query); break;
    case 'home': show(null); break;
    case 'refresh': toast(`Refreshed ${currentWin().title || app(currentWin().app).d}`); break;
    // Chat app: the window's path is the selection, so picking a chat changes this window's title,
    // which the pill and the windows sheet then show.
    case 'drawer-open': S.drawer = Number(el.dataset.win); S.picker = null; break;
    case 'drawer-close': S.drawer = null; break;
    case 'chat-open': { const w = win(Number(el.dataset.win)); const c = chat(el.dataset.chat); w.chatId = c.id; w.title = c.title; if (c.status === 'done') c.status = 'idle'; w.status = c.status === 'working' ? 'working' : undefined; S.drawer = null; break; }
    case 'chat-new': { const w = win(Number(el.dataset.win)); const c = newChat(); w.chatId = c.id; w.title = c.title; w.status = undefined; S.drawer = null; break; }
    case 'chat-send': { const ta = document.getElementById(`compose-${el.dataset.win}`); if (ta && ta.value.trim()) sendToChat(el.dataset.chat, ta.value.trim()); break; }
    case 'chat-stop': case 'stop-agent': { const c = chat(el.dataset.chat); c.status = 'idle'; for (const w of S.windows) if (w.chatId === c.id) w.status = undefined; S.picker = null; break; }
    case 'chip': { const k = el.dataset.key; if (openChips.has(k)) openChips.delete(k); else { openChips.clear(); openChips.add(k); } break; }
    case 'picker-open': S.picker = S.picker && S.picker.win === Number(el.dataset.win) ? null : { win: Number(el.dataset.win), view: 'root', fresh: true }; break;
    case 'picker-close': S.picker = null; break;
    case 'picker-view': if (S.picker) { S.picker.from = S.picker.view; S.picker.view = el.dataset.view; } break;
    case 'pick-effort': { chat(el.dataset.chat).effort = el.dataset.id; break; }
    case 'pick-provider': { const c = chat(el.dataset.chat); const p = provider(el.dataset.id); if (c.provider !== p.id) { c.provider = p.id; c.model = p.models[0]; if (!p.efforts.includes(c.effort)) c.effort = p.efforts[1] || p.efforts[0]; if (!p.fast) c.fast = 'Off'; toast(`Next message runs on ${p.name}`); } S.picker.from = S.picker.view; S.picker.view = 'root'; break; }
    case 'pick-model': { chat(el.dataset.chat).model = el.dataset.id; S.picker.from = S.picker.view; S.picker.view = 'root'; break; }
    case 'pick-fast': { chat(el.dataset.chat).fast = el.dataset.id; S.picker.from = S.picker.view; S.picker.view = 'root'; break; }
    case 'files-up': { const w = win(Number(el.dataset.win)); if (w.ffile) { w.ffile = null; w.fdraft = null; w.fdirty = false; w.title = folderTitle(w.fpath); S.fmenu = null; } else filesGo(w, w.fpath.slice(0, -1)); break; }
    case 'files-go': { const w = win(Number(el.dataset.win)); filesGo(w, w.fpath.slice(0, Number(el.dataset.depth))); break; }
    case 'files-open': { const w = win(Number(el.dataset.win)); const segs = el.dataset.rel.split('/'); const full = [...w.fpath, ...segs]; const n = fsNode(full); if (!n) break; if (isDirNode(n)) filesGo(w, full); else { filesGo(w, full.slice(0, -1)); w.ffile = n.name; w.fdraft = null; w.fdirty = false; w.title = n.name; } break; }
    case 'files-search': { const w = win(Number(el.dataset.win)); w.fq = w.fq === null ? '' : null; S.fmenu = null; break; }
    case 'files-search-close': { win(Number(el.dataset.win)).fq = null; break; }
    case 'files-more': { const id = Number(el.dataset.win); S.fmenu = S.fmenu && S.fmenu.win === id && S.fmenu.kind === 'more' ? null : { win: id, kind: 'more' }; break; }
    case 'files-row-menu': { e.stopPropagation(); S.fmenu = { win: Number(el.dataset.win), kind: 'row', rel: el.dataset.rel }; break; }
    case 'files-menu-close': S.fmenu = null; break;
    case 'files-sort': { const w = win(Number(el.dataset.win)); const by = el.dataset.by; if (w.fsort.by === by) w.fsort.order = w.fsort.order === 'asc' ? 'desc' : 'asc'; else w.fsort = { by, order: by === 'mtime' ? 'desc' : 'asc' }; break; }
    case 'files-toggle-hidden': { const w = win(Number(el.dataset.win)); w.showHidden = !w.showHidden; S.fmenu = null; break; }
    case 'files-download': { const w = win(Number(el.dataset.win)); const rel = el.dataset.rel; const n = rel ? fsNode([...w.fpath, ...rel.split('/')]) : fsNode(w.fpath); S.fmenu = null; toast(isDirNode(n) ? `Downloading ${folderTitle([...w.fpath, ...(rel ? rel.split('/') : [])])}.zip` : `Downloading ${n.name}`); break; }
    case 'files-upload': S.fmenu = null; toast('Upload would open the file picker'); break;
    case 'files-new-folder': { const w = win(Number(el.dataset.win)); S.fmenu = null; filesCreate(w, fsNode(w.fpath), 'dir'); break; }
    case 'files-new-file': { const w = win(Number(el.dataset.win)); S.fmenu = null; filesCreate(w, fsNode(w.fpath), 'file'); break; }
    case 'files-move': { const w = win(Number(el.dataset.win)); const full = [...w.fpath, ...el.dataset.rel.split('/')]; const n = fsNode(full); S.fmenu = null; const np = prompt('Enter new path', '/' + full.join('/')); if (!np || np === '/' + full.join('/')) break; const newName = np.replace(/\/+$/, '').split('/').pop(); if (!newName) break; if (w.ffile === n.name) { w.ffile = newName; w.title = newName; } n.name = newName; toast(`Moved to ${np}`); break; }
    case 'files-delete': { const w = win(Number(el.dataset.win)); const full = [...w.fpath, ...el.dataset.rel.split('/')]; const n = fsNode(full); S.fmenu = null; if (!confirm(`Delete \`${n.name}\`?`)) break; const parent = fsNode(full.slice(0, -1)); parent.children = parent.children.filter(c => c !== n); if (w.ffile === n.name) { w.ffile = null; w.fdraft = null; w.fdirty = false; w.title = folderTitle(w.fpath); } toast(`Deleted ${n.name}`); break; }
    case 'files-save': { const w = win(Number(el.dataset.win)); const n = fsNode([...w.fpath, w.ffile]); const ta = document.getElementById(`feditor-${w.id}`); n.text = ta ? ta.value : (w.fdraft ?? n.text); n.size = new TextEncoder().encode(n.text).length; w.fdraft = null; w.fdirty = false; toast('Saved'); break; }
    case 'noop': break;
    case 'step': { const k = el.dataset.key; if (openSteps.has(k)) openSteps.delete(k); else openSteps.add(k); break; }
    case 'pick-account': { const c = chat(el.dataset.chat); const a = account(el.dataset.id); const p = provider(a.provider); if (c.account !== a.id) { c.account = a.id; if (c.provider !== p.id) { c.provider = p.id; c.model = p.models[0]; if (!p.efforts.includes(c.effort)) c.effort = p.efforts[1] || p.efforts[0]; if (!p.fast) c.fast = 'Off'; } toast(`Next message runs on ${a.label}`); } S.picker.from = S.picker.view; S.picker.view = 'root'; break; }
    case 'signin-open': S.picker = null; S.signin = { screen: 'chooser', lane: null, activeStep: 1, code: '', copied: false }; break;
    case 'signin-close': S.signin = null; break;
    case 'signin-lane': case 'signin-reauth': S.signin = { screen: 'steps', lane: el.dataset.lane, activeStep: 1, code: '', copied: false }; break;
    case 'signin-back': S.signin = { screen: 'chooser', lane: null, activeStep: 1, code: '', copied: false }; break;
    case 'signin-openlink': S.signin.activeStep = 2; toast('Opened the sign-in page (mock)'); break;
    case 'signin-copylink': S.signin.copied = true; S.signin.activeStep = 2; break;
    case 'signin-continue': { const field = document.getElementById('signin-code'); const code = field ? field.value : S.signin.code; if (!code || !code.trim()) break; S.signin.screen = 'verifying'; setTimeout(() => { if (S.signin && S.signin.screen === 'verifying') { S.signin.screen = 'success'; render(); } }, 1600); break; }
    case 'signin-done': { const l = lane(S.signin.lane); const n = ACCOUNTS.filter(a => a.provider === l.id).length; if (!provider(l.id)) PROVIDERS.push({ id: l.id, name: l.name, harness: l.harness, mono: l.mark, models: ['Gemini 3 Pro', 'Gemini 3 Flash'], efforts: ['Low', 'Medium', 'High'], fast: false }); ACCOUNTS.push({ id: `acc-${l.id}-${n + 1}`, provider: l.id, label: n ? `${l.name} (${n + 1})` : l.name }); S.signin = null; toast(`${l.name} added`); break; }
    case 'signin-remove': { const i = ACCOUNTS.map(a => a.id).indexOf(el.dataset.id); if (i >= 0) { toast(`Removed ${ACCOUNTS[i].label}`); ACCOUNTS.splice(i, 1); } break; }
    case 'source-view': { const c = chat(el.dataset.chat); c.sourceView = !c.sourceView; break; }
  }
  render();
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { S.query = e.target.value; render(); }
  if (e.target.id && e.target.id.startsWith('files-q-')) { win(Number(e.target.dataset.win)).fq = e.target.value; render(); }
  if (e.target.id && e.target.id.startsWith('feditor-')) { const w = win(Number(e.target.dataset.win)); const n = fsNode([...w.fpath, w.ffile]); w.fdraft = e.target.value; w.fdirty = e.target.value !== n.text; const b = document.querySelector('.fsave'); if (b) b.classList.toggle('off', !w.fdirty); }
  if (e.target.id === 'signin-code') { S.signin.code = e.target.value; S.signin.activeStep = 2; const b = document.querySelector('[data-act="signin-continue"]'); if (b) b.classList.toggle('off', !e.target.value.trim()); }
  if (e.target.id && e.target.id.startsWith('effort-')) { const c = chat(e.target.dataset.chat); c.effort = provider(c.provider).efforts[Number(e.target.value)]; render(); }
  if (e.target.id && e.target.id.startsWith('compose-')) {
    drafts[e.target.dataset.chat] = e.target.value;
    e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
    const go = e.target.parentElement.querySelector('.cbtn.go'); if (go) go.classList.toggle('off', !e.target.value.trim());
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'q') { sendMessage(S.query); render(); }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id && e.target.id.startsWith('compose-')) { e.preventDefault(); if (e.target.value.trim()) { sendToChat(e.target.dataset.chat, e.target.value.trim()); render(); } }
  if (e.key === 'Enter' && e.target.id === 'signin-code' && e.target.value.trim()) { e.preventDefault(); document.querySelector('[data-act="signin-continue"]')?.click(); }
  if (e.key === 'Escape') { S.sheet = false; S.menu = false; S.drawer = null; S.picker = null; S.signin = null; S.fmenu = null; S.query = ''; render(); }
});

// Land on the most recent window, like a returning client would; ?home starts on the grid.
if (!new URLSearchParams(location.search).has('home')) { S.current = 1; }
render();
</script>
</body>
</html>
